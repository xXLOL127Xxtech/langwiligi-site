<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #07060d; color: #ecebf5; }
  body { position: relative; font-family: "Chakra Petch", sans-serif; --c: #22e4ff; }
  .bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(34px) saturate(1.3) brightness(.55); }
  .tint { position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(7, 6, 13, .96) 0 38%, rgba(7, 6, 13, .55) 62%, rgba(7, 6, 13, .25)),
      radial-gradient(620px 380px at 0% 0%, rgba(255, 46, 136, .35), transparent 62%),
      linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px) 0 0 / 100% 42px,
      linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px) 0 0 / 42px 100%; }
  .scan { position: absolute; inset: 0; background: repeating-linear-gradient(transparent 0 2px, rgba(0, 0, 0, .18) 2px 3px); }

  .shot { position: absolute; right: 56px; top: 92px; width: 600px; height: 375px; transform: rotate(2.5deg);
    border: 3px solid var(--c); box-shadow: 0 0 0 3px rgba(7, 6, 13, .9), 0 0 46px var(--c), 14px 18px 0 rgba(255, 46, 136, .85);
    background-size: cover; background-position: center;
    clip-path: polygon(0 0, calc(100% - 34px) 0, 100% 34px, 100% 100%, 34px 100%, 0 calc(100% - 34px)); }
  .shot::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255, 255, 255, .16), transparent 40%); }

  .text { position: absolute; left: 60px; top: 78px; width: 520px; }
  .kicker { font: 22px/1 "Share Tech Mono", monospace; letter-spacing: .14em; color: #22e4ff; text-transform: uppercase; margin: 0 0 20px; }
  .invite { display: inline-block; margin: 0; padding: 10px 18px 6px; font: 700 40px/1 "Chakra Petch"; text-transform: uppercase; color: #07060d; background: #ffe14d;
    transform: skewX(-8deg); box-shadow: 6px 6px 0 #ff2e88; }
  .invite span { display: inline-block; transform: skewX(8deg); }
  h1 { margin: 34px 0 0; font: 700 92px/.92 "Chakra Petch"; text-transform: uppercase; letter-spacing: -.01em; text-shadow: 5px 5px 0 rgba(255, 46, 136, .55); }
  h1.l { font-size: 74px; } h1.xl { font-size: 58px; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .chips span { padding: 10px 16px; border: 1px solid #3d3660; background: rgba(15, 13, 26, .85); font: 21px/1 "Share Tech Mono", monospace;
    letter-spacing: .08em; text-transform: uppercase; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
  .chips .join { color: #07060d; background: #8cff5a; border-color: #8cff5a; font-weight: 700; }

  .ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: #ffe14d; color: #07060d; overflow: hidden; white-space: nowrap;
    font: 20px/40px "Share Tech Mono", monospace; letter-spacing: .1em; text-transform: uppercase; }
  .ticker span { padding: 0 18px; }
  .ticker span::before { content: "◢ "; }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="tint"></div>
  <div class="shot" id="shot"></div>
  <div class="scan"></div>
  <div class="text">
    <p class="kicker">// langwiligi.site</p>
    <p class="invite"><span>Du wurdest eingeladen!</span></p>
    <h1 id="name"></h1>
    <div class="chips"><span class="join">Jetzt beitreten</span><span>Kein Login</span></div>
  </div>
  <div class="ticker" id="ticker"></div>
</body>
</html>
