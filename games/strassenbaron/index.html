<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Strassenbaron</title>
<meta name="description" content="Kaufen, bauen, abkassieren: der Brettspiel-Klassiker in 3D mit Schweizer Strassen, Bots und Online-Modus.">
<meta name="theme-color" content="#e8402f">
<meta name="spiel-modi" content="Lokal,Online,Bots">
<meta name="spiel-tags" content="Brettspiel,2–6 Spieler,3D">
<meta name="spiel-typ" content="Klassiker,Strategie,3D">
<meta name="spiel-suche" content="Schweizer Strassen-Brettspiel, Immobilien-Brettspiel">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --bg: #0d0f13; --panel: rgba(18, 22, 30, .86); --line: rgba(255, 255, 255, .1);
  --acc: #e8402f; --gold: #ffcf4a; --txt: #eef1f6; --dim: #9aa3b2; --ok: #3ccf6e; --bad: #ef5350;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--txt);
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.hidden { display: none !important; }
#flash { position: fixed; inset: 0; pointer-events: none; z-index: 29; opacity: 0; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
#topbar { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; }
.ibtn { width: 42px; height: 42px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
  font-size: 19px; display: grid; place-items: center; backdrop-filter: blur(6px); transition: transform .15s, background .15s; }
.ibtn:hover { background: rgba(40, 46, 60, .95); transform: translateY(-1px); }
#round { position: absolute; top: 12px; left: 50%; transform: translateX(calc(-50% - 130px)); background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 8px 16px; font-size: 14px; color: var(--dim); white-space: nowrap; }
#round b { color: var(--txt); }

#players { position: absolute; top: 12px; right: 12px; width: 248px; display: flex; flex-direction: column; gap: 7px;
  max-height: calc(100% - 24px); overflow-y: auto; scrollbar-width: none; }
#players::-webkit-scrollbar { display: none; }
.pc { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 9px 11px 8px 14px;
  backdrop-filter: blur(6px); transition: transform .35s cubic-bezier(.2, 1.4, .4, 1), box-shadow .35s, opacity .4s; overflow: hidden; }
.pc::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--pcol); }
.pc.active { transform: translateX(-8px) scale(1.03); box-shadow: 0 0 0 2px var(--pcol), 0 0 26px -2px var(--pcol); }
.pc.active::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.09) 50%, transparent 70%);
  background-size: 250% 100%; animation: shine 2.4s linear infinite; pointer-events: none; }
@keyframes shine { from { background-position: 150% 0; } to { background-position: -100% 0; } }
.pc.out { opacity: .38; filter: grayscale(1); }
.pc .row1 { display: flex; align-items: center; gap: 8px; }
.pc .tok { width: 26px; height: 26px; border-radius: 50%; background: var(--pcol); display: grid; place-items: center; font-size: 14px;
  box-shadow: inset 0 -3px 6px rgba(0,0,0,.35), 0 0 10px -2px var(--pcol); flex: none; }
.pc .nm { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc .nm small { font-weight: 500; color: var(--dim); font-size: 11px; margin-left: 4px; }
.pc .st { font-size: 13px; }
.pc .money { font-size: 21px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; margin: 3px 0 4px; letter-spacing: .01em; transition: color .3s; }
.pc .money.up { color: var(--ok); } .pc .money.down { color: var(--bad); }
.pc .props { display: flex; gap: 3px; flex-wrap: wrap; }
.pc .pg { display: flex; gap: 1px; }
.pc .pp { width: 8px; height: 12px; border-radius: 2px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.08); }
.pc .pp.on { background: var(--c); border-color: rgba(0,0,0,.3); }
.pc .pp.mo { background: repeating-linear-gradient(45deg, var(--c) 0 2px, #222 2px 4px); }
.pc .delta { position: absolute; right: 12px; top: 30px; font-weight: 800; font-size: 17px; pointer-events: none; animation: delta 1.5s ease-out forwards; }
@keyframes delta { 0% { opacity: 0; transform: translateY(8px) scale(.6); } 15% { opacity: 1; transform: translateY(0) scale(1.15); } 30% { transform: scale(1); } 100% { opacity: 0; transform: translateY(-22px); } }

#actions { position: absolute; left: calc(50% - 130px); transform: translateX(-50%); bottom: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  max-width: calc(100vw - 290px); }
#ainfo { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 16px; font-size: 15px; text-align: center; backdrop-filter: blur(6px); max-width: 640px; }
#ainfo:empty { display: none; }
#abtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.btn { padding: 11px 18px; border-radius: 12px; background: rgba(40, 46, 60, .92); border: 1px solid var(--line); font-weight: 650; font-size: 15px;
  transition: transform .12s, filter .15s, background .15s; white-space: nowrap; backdrop-filter: blur(6px); }
.btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.15); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: default; filter: grayscale(.85); }
.btn.main { background: linear-gradient(180deg, #ff5a45, #c92a1b); border-color: rgba(255,255,255,.25); font-size: 17px; padding: 13px 26px;
  box-shadow: 0 6px 22px -6px rgba(232, 64, 47, .9); animation: pulse 1.8s ease-in-out infinite; }
.btn.gold { background: linear-gradient(180deg, #ffd86a, #d99a12); color: #2b1d00; border-color: rgba(255,255,255,.4); }
.btn.green { background: linear-gradient(180deg, #4fdc7f, #1f9a4a); color: #032611; }
@keyframes pulse { 0%, 100% { box-shadow: 0 6px 22px -6px rgba(232,64,47,.9); } 50% { box-shadow: 0 6px 30px 0 rgba(255,110,80,.95); } }
.kbd { display: inline-block; font-size: 11px; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,.14); margin-left: 6px; font-weight: 600; vertical-align: 1px; }
.btn.gold .kbd, .btn.green .kbd { background: rgba(0,0,0,.15); }

#log { position: absolute; left: 12px; bottom: 12px; width: 300px; max-height: 26vh; overflow: hidden; font-size: 12.5px; line-height: 1.4;
  display: flex; flex-direction: column-reverse; mask-image: linear-gradient(to top, #000 65%, transparent); -webkit-mask-image: linear-gradient(to top, #000 65%, transparent); pointer-events: none; }
#log div { background: rgba(10, 12, 18, .6); padding: 3px 9px; border-radius: 7px; margin-top: 3px; color: #c9d0db; animation: logIn .4s ease-out; }
@keyframes logIn { from { opacity: 0; transform: translateX(-20px); } }

#banner { position: fixed; left: calc(50% - 130px); top: 38%; transform: translate(-50%, -50%); z-index: 25; pointer-events: none; text-align: center; white-space: nowrap; }
#banner .b { font-size: 54px; font-weight: 900; letter-spacing: .02em; text-shadow: 0 4px 0 rgba(0,0,0,.45), 0 0 40px var(--bc, #e8402f);
  -webkit-text-stroke: 1.5px rgba(0,0,0,.35); color: #fff; animation: bannerIn 1.6s cubic-bezier(.2, 1.3, .3, 1) forwards; }
#banner .s { font-size: 19px; font-weight: 700; color: #dfe6f0; margin-top: 4px; animation: bannerSub 1.6s ease forwards; text-shadow: 0 2px 6px #000; }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(2.6) rotate(-6deg); filter: blur(10px); } 18% { opacity: 1; transform: scale(.92) rotate(1deg); filter: blur(0); }
  28% { transform: scale(1.04); } 36%, 78% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.85) translateY(-30px); } }
@keyframes bannerSub { 0%, 15% { opacity: 0; transform: translateY(12px); } 30%, 78% { opacity: 1; transform: none; } 100% { opacity: 0; } }

/* ---------- Karten ---------- */
#cardWrap { position: fixed; inset: 0; z-index: 26; pointer-events: none; }
#ecardO { position: absolute; inset: 0; perspective: 1400px; opacity: 0; }
#ecard { position: absolute; width: 380px; height: 230px; left: 0; top: 0; transform-style: preserve-3d; }
#ecard .face { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
#ecard .back { display: grid; place-items: center; font-size: 110px; font-weight: 900; color: #fff; text-shadow: 0 5px 0 rgba(0,0,0,.25); }
#ecard .front { transform: rotateY(180deg); background: #fffaf0; color: #1b1b1b; padding: 20px 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
#ecard .front h3 { margin: 0; font-size: 15px; letter-spacing: .25em; text-transform: uppercase; }
#ecard .front p { margin: 0; font-size: 20px; font-weight: 650; line-height: 1.35; }
#ecard .front .ic { font-size: 40px; line-height: 1; }
#ecard.chance .back { background: radial-gradient(circle at 30% 25%, #ffb347, #f7941d 55%, #c96a00); }
#ecard.chance .front { border: 6px solid #f7941d; } #ecard.chance h3 { color: #d97800; }
#ecard.chest .back { background: radial-gradient(circle at 30% 25%, #9fe0ff, #3aa6dd 55%, #1569a0); font-size: 90px; }
#ecard.chest .front { border: 6px solid #3aa6dd; } #ecard.chest h3 { color: #1b7fb8; }

.deed { width: 250px; background: #fffdf6; color: #1a1a1a; border-radius: 12px; padding: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.5); font-size: 13.5px; flex: none; }
.deed .hd { background: var(--dc, #888); color: var(--dt, #fff); border-radius: 6px; padding: 8px 6px 9px; text-align: center; margin-bottom: 8px; border: 2px solid rgba(0,0,0,.6); }
.deed .hd small { display: block; font-size: 10px; letter-spacing: .2em; font-weight: 700; opacity: .85; }
.deed .hd b { display: block; font-size: 19px; line-height: 1.15; margin-top: 3px; }
.deed .hd i { font-style: normal; font-size: 12px; opacity: .85; }
.deed .ico { font-size: 44px; text-align: center; margin: 4px 0; }
.deed table { width: 100%; border-collapse: collapse; }
.deed td { padding: 2px 4px; } .deed td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.deed tr.cur td { background: #ffe58a; border-radius: 4px; }
.deed .ft { border-top: 1px solid #ccc; margin-top: 6px; padding-top: 5px; font-size: 12.5px; }
.deed .own { margin-top: 7px; text-align: center; font-weight: 700; padding: 4px; border-radius: 6px; color: #fff; }
.deed .mort { color: #b3261e; text-align: center; font-weight: 800; letter-spacing: .1em; margin-top: 4px; }

/* ---------- Fenster ---------- */
.ovl { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(5, 7, 10, .5); backdrop-filter: blur(3px); animation: fadeIn .25s; padding: 14px; }
@keyframes fadeIn { from { opacity: 0; } }
.win { background: rgba(20, 24, 33, .97); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; width: min(860px, 100%); max-height: calc(100vh - 28px);
  overflow-y: auto; box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: popIn .35s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes popIn { from { opacity: 0; transform: scale(.85) translateY(20px); } }
.win h2 { margin: 0 0 12px; font-size: 22px; display: flex; align-items: center; gap: 10px; }
.win h2 .x { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 16px; }
.win .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.mrow { display: grid; grid-template-columns: 14px 1fr 90px auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 10px; }
.mrow:nth-child(odd) { background: rgba(255,255,255,.035); }
.mrow .chip { width: 14px; height: 26px; border-radius: 4px; }
.mrow .n { font-weight: 650; } .mrow .n small { color: var(--dim); font-weight: 500; margin-left: 6px; }
.mrow .lv { font-size: 15px; letter-spacing: 1px; }
.mrow .bs { display: flex; gap: 5px; }
.mrow .bs .btn { padding: 6px 10px; font-size: 13px; }
.mgrp { margin: 10px 0 3px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); }
.tcols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tcol { background: rgba(255,255,255,.035); border-radius: 12px; padding: 10px; }
.tcol h3 { margin: 0 0 8px; font-size: 15px; }
.titem { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border-radius: 8px; cursor: pointer; font-size: 14px; border: 1px solid transparent; }
.titem:hover { background: rgba(255,255,255,.06); }
.titem.sel { background: rgba(255, 207, 74, .15); border-color: rgba(255, 207, 74, .5); }
.titem.dis { opacity: .35; cursor: default; }
.titem .chip { width: 10px; height: 18px; border-radius: 3px; flex: none; }
.mny { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.mny input { width: 90px; }
input[type=text], input[type=number], select { font: inherit; color: var(--txt); background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; outline: none; }
input:focus, select:focus { border-color: var(--gold); }
.ptabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.ptab { padding: 7px 12px; border-radius: 10px; background: rgba(255,255,255,.06); border: 2px solid transparent; font-weight: 650; }
.ptab.sel { border-color: var(--pcol); background: rgba(255,255,255,.12); }
.auc { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; justify-content: center; }
.auc .big { font-size: 46px; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; text-shadow: 0 0 20px rgba(255, 207, 74, .5); }
.auc .big.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.25); color: #fff; } }
.bidders { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.bidder { padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 650; border: 2px solid var(--pcol); }
.bidder.gone { opacity: .3; text-decoration: line-through; }
.bidder.now { background: var(--pcol); color: #000; }

/* ---------- Menü ---------- */
#menu { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(13,15,19,.35), rgba(13,15,19,.88)); padding: 14px; }
.mpanel { width: min(560px, 100%); background: rgba(16, 19, 26, .9); border: 1px solid var(--line); border-radius: 22px; padding: 26px 28px; backdrop-filter: blur(10px);
  box-shadow: 0 40px 100px rgba(0,0,0,.6); max-height: calc(100vh - 28px); overflow-y: auto; animation: popIn .45s cubic-bezier(.2, 1.3, .4, 1); }
.mpanel.wide { width: min(780px, 100%); }
.logo { text-align: center; margin-bottom: 18px; }
.logo .t { display: inline-block; background: linear-gradient(180deg, #ff5a45, #b8200f); color: #fff; font-weight: 900; font-size: 44px; letter-spacing: .06em;
  padding: 6px 26px 8px; border-radius: 6px; border: 3px solid #fff; box-shadow: 0 0 0 3px #b8200f, 0 14px 40px rgba(232, 64, 47, .45); transform: rotate(-3deg);
  text-shadow: 0 3px 0 rgba(0,0,0,.3); animation: logoWob 4s ease-in-out infinite; }
@keyframes logoWob { 0%, 100% { transform: rotate(-3deg) scale(1); } 50% { transform: rotate(-1.5deg) scale(1.03); } }
.logo .sub { color: var(--dim); margin-top: 12px; font-size: 15px; }
.mbtns { display: grid; gap: 10px; }
.mbtns .btn { padding: 15px; font-size: 17px; text-align: left; display: flex; align-items: center; gap: 12px; }
.mbtns .btn span.e { font-size: 24px; } .mbtns .btn small { display: block; font-weight: 500; color: var(--dim); font-size: 13px; }
.mbtns .btn.main small { color: rgba(255,255,255,.8); }
.seat { display: grid; grid-template-columns: 34px 1fr 150px 34px; gap: 8px; align-items: center; margin-bottom: 7px; }
.seat .tok { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; cursor: pointer; box-shadow: inset 0 -3px 6px rgba(0,0,0,.35); }
.seat .rm { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,.07); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.opts label { font-size: 13px; color: var(--dim); display: flex; flex-direction: column; gap: 4px; }
.help { font-size: 14px; line-height: 1.55; color: #cfd6e0; }
.help h3 { margin: 14px 0 4px; font-size: 15px; color: var(--txt); }
.help ul { margin: 4px 0; padding-left: 20px; }
.code { font-size: 38px; font-weight: 900; letter-spacing: .2em; text-align: center; color: var(--gold); margin: 6px 0; }
.err { color: #ff8a80; font-size: 14px; min-height: 18px; margin-top: 6px; }
.rank { display: grid; grid-template-columns: 30px 26px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 16px; }
.rank:first-child { background: rgba(255, 207, 74, .14); font-weight: 800; }
.board-wrap { margin-top: 14px; }
#toast { position: fixed; left: calc(50% - 130px); top: 70px; transform: translateX(-50%); z-index: 60; background: rgba(30, 34, 44, .96); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 18px; font-size: 15px; pointer-events: none; transition: opacity .3s, transform .3s; opacity: 0; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(6px); }
#info { position: fixed; z-index: 35; pointer-events: auto; animation: popIn .25s cubic-bezier(.2, 1.4, .4, 1); }
@media (max-height: 700px) { .pc .money { font-size: 18px; margin: 1px 0 2px; } .pc { padding: 6px 10px 6px 14px; } #log { max-height: 18vh; } }
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<canvas id="fx"></canvas>
<div id="flash"></div>

<div id="hud" class="hidden">
  <div id="topbar">
    <button class="ibtn" id="bMenu" title="Menü (Esc)">☰</button>
    <button class="ibtn" id="bSound" title="Ton an/aus (M)">🔊</button>
    <button class="ibtn" id="bCam" title="Kamera zurücksetzen (C)">🎥</button>
    <button class="ibtn" id="bHelp" title="Anleitung">?</button>
  </div>
  <div id="round"></div>
  <div id="players"></div>
  <div id="actions"><div id="ainfo"></div><div id="abtns"></div></div>
  <div id="log"></div>
</div>
<div id="banner"></div>
<div id="cardWrap"><div id="ecardO"><div id="ecard" class="hidden"><div class="face back">?</div><div class="face front"><h3>Ereignis</h3><div class="ic"></div><p></p></div></div></div></div>
<div id="modal"></div>
<div id="menu"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../_shared/hub.js"></script>
<script>
'use strict';
const GAME_ID = 'strassenbaron';
const HUB = window.GameHub || null;
const TEST = /[?&]test\b/.test(location.search);
const COVER = /[?&]cover\b/.test(location.search);

// ======================================================================
//  Spieldaten
// ======================================================================
const GROUPS = [
  { n: 'Braun', c: '#8b4a2b', h: 50 }, { n: 'Hellblau', c: '#8fd3f4', h: 50 }, { n: 'Pink', c: '#d6399a', h: 100 }, { n: 'Orange', c: '#f39200', h: 100 },
  { n: 'Rot', c: '#e2231a', h: 150 }, { n: 'Gelb', c: '#ffe100', h: 150 }, { n: 'Grün', c: '#1fa955', h: 200 }, { n: 'Dunkelblau', c: '#0a5cb0', h: 200 },
];
const S = (n, c, g, p, r) => ({ t: 'street', n, c, g, p, r });
const F = [
  { t: 'go', n: 'Los' },
  S('Hauptgasse', 'Solothurn', 0, 60, [2, 10, 30, 90, 160, 250]),
  { t: 'chest', n: 'Gemeinschaft' },
  S('Rathausgasse', 'Aarau', 0, 60, [4, 20, 60, 180, 320, 450]),
  { t: 'tax', n: 'Einkommens-steuer', a: 200 },
  { t: 'rail', n: 'Bahnhof Genf', p: 200 },
  S('Marktgasse', 'Biel', 1, 100, [6, 30, 90, 270, 400, 550]),
  { t: 'chance', n: 'Ereignis' },
  S('Bälliz', 'Thun', 1, 100, [6, 30, 90, 270, 400, 550]),
  S('Vordergasse', 'Schaffhausen', 1, 120, [8, 40, 100, 300, 450, 600]),
  { t: 'jail', n: 'Gefängnis' },
  S('Pilatusstrasse', 'Luzern', 2, 140, [10, 50, 150, 450, 625, 750]),
  { t: 'util', n: 'Elektrizitäts-werk', p: 150 },
  S('Schwanenplatz', 'Luzern', 2, 140, [10, 50, 150, 450, 625, 750]),
  S('Kapellplatz', 'Luzern', 2, 160, [12, 60, 180, 500, 700, 900]),
  { t: 'rail', n: 'Bahnhof Bern', p: 200 },
  S('Spalenberg', 'Basel', 3, 180, [14, 70, 200, 550, 750, 950]),
  { t: 'chest', n: 'Gemeinschaft' },
  S('Freie Strasse', 'Basel', 3, 180, [14, 70, 200, 550, 750, 950]),

let G = null;          // massgeblicher Spielzustand
let E = [];            // Ereignisse der aktuellen Aktion (für Animationen)
const rnd = n => Math.floor(Math.random() * n);
const r6 = () => 1 + rnd(6);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clone = o => JSON.parse(JSON.stringify(o));

function newGame(seats, opts) {
  return {
    v: 1,
    players: seats.map((s, i) => ({ name: s.name, col: s.col, tok: s.tok, bot: s.bot || 0, seat: s.seat == null ? -1 : s.seat,
      money: opts.start, pos: 0, jail: false, tries: 0, cards: [], out: false, dbl: 0, lastTrade: -9, idx: i })),
    own: F.map(() => -1), houses: F.map(() => 0), mort: F.map(() => false),
    bankHouses: 32, bankHotels: 12,
    decks: { chance: shuffle([...CHANCE.keys()]), chest: shuffle([...CHEST.keys()]) },
    cur: 0, round: 1, phase: 'roll', dice: [3, 4], lastSum: 7,
    auction: null, debts: [], after: 'post', trade: null, ret: null,
    opts, pot: 0, log: [], winner: -1, seq: 0,
  };
}

function emit(k, d) { G.seq++; E.push(Object.assign({ k }, d || {}, { s: clone(G) })); }
function log(t) { G.log.push(t.replace(/Fr\.\./g, 'Fr.')); if (G.log.length > 40) G.log.shift(); }
const P = i => G.players[i];
const alive = () => G.players.filter(p => !p.out);
const pname = i => (i < 0 ? 'Bank' : P(i).name);

function actorOf(g) {
  switch (g.phase) {
    case 'auction': return g.auction.order[g.auction.i];
    case 'debt': return g.debts[0].p;
    case 'trade': return g.trade.to;
    case 'over': return -1;
    default: return g.cur;
  }
}
function ownsGroup(g, p, gi) { return GROUPS[gi].f.every(f => g.own[f] === p); }
function groupHasBuildings(g, gi) { return GROUPS[gi].f.some(f => g.houses[f] > 0); }
function countOwned(g, p, list) { return list.filter(f => g.own[f] === p).length; }

function rentOf(g, f, sum, mult) {
  const o = g.own[f], fd = F[f];
  if (o < 0 || g.mort[f]) return 0;
  let r = 0;
  if (fd.t === 'street') {
    const lv = g.houses[f];
    r = lv ? fd.r[lv] : fd.r[0] * (ownsGroup(g, o, fd.g) ? 2 : 1);
  } else if (fd.t === 'rail') {
    r = 25 * Math.pow(2, countOwned(g, o, RAILS) - 1);
  } else if (fd.t === 'util') {
    r = sum * (countOwned(g, o, UTILS) === 2 ? 10 : 4);
  }
  return r * (mult || 1);
}
function worth(g, p) {
  let w = g.players[p].money;
  for (const f of BUYABLE) if (g.own[f] === p) {
    w += g.mort[f] ? F[f].p / 2 : F[f].p;
    if (F[f].t === 'street') w += g.houses[f] * GROUPS[F[f].g].h;
  }
  return w;
}
// Geld, das ein Spieler höchstens auftreiben kann (Häuser verkaufen + Hypotheken)
function liquid(g, p) {
  let w = g.players[p].money;
  for (const f of BUYABLE) if (g.own[f] === p) {
    if (F[f].t === 'street') w += g.houses[f] * GROUPS[F[f].g].h / 2;
    if (!g.mort[f]) w += F[f].p / 2;
  }
  return w;
}

// ---------- Geld ----------
function transfer(from, to, amt, why) {
  if (amt <= 0) return;
  if (from >= 0) P(from).money -= amt;
  if (to >= 0) P(to).money += amt;
  else if (to === -2) G.pot += amt;
  emit('money', { from, to, amt, why });
}
// Bank/Topf-Zahlung: Steuern landen bei der Hausregel im Topf
const bankOrPot = () => (G.opts.parking ? -2 : -1);
function charge(p, amt, to, why) {
  if (amt <= 0) return true;
  if (P(p).money >= amt) { transfer(p, to, amt, why); return true; }
  G.debts.push({ p, amt, to, why });
  return false;
}

// ---------- Bewegung ----------
function moveSteps(p, steps) {
  const pl = P(p), path = [];
  let pos = pl.pos, go = false;
  const dir = steps < 0 ? -1 : 1;
  for (let i = 0; i < Math.abs(steps); i++) {
    pos = (pos + dir + 40) % 40;
    path.push(pos);
    if (pos === 0 && dir > 0) go = true;
  }
  pl.pos = pos;
  emit('move', { p, path });
  if (go) { log(pl.name + ' kommt über Los und zieht 200 Fr. ein.'); transfer(-1, p, 200, 'go'); }
}
function moveTo(p, target) {
  const d = (target - P(p).pos + 40) % 40;
  moveSteps(p, d === 0 ? 40 : d);
}
function sendToJail(p) {
  const pl = P(p);
  pl.pos = 10; pl.jail = true; pl.tries = 0; pl.dbl = 0;
  log(pl.name + ' muss ins Gefängnis!');
  emit('jail', { p });
}
function release(p) { P(p).jail = false; P(p).tries = 0; emit('free', { p }); }

// ---------- Landen ----------
function land(p, sum, mult) {
  const pl = P(p), f = pl.pos, fd = F[f];
  G.lastSum = sum;
  switch (fd.t) {
    case 'street': case 'rail': case 'util': {
      const o = G.own[f];
      if (o < 0) { G.phase = 'buy'; emit('offer', { p, f }); return; }
      if (o === p) { log(pl.name + ' ist auf dem eigenen Feld ' + fname(f) + '.'); break; }
      if (G.mort[f]) { log(fname(f) + ' hat eine Hypothek, keine Miete.'); break; }
      let r;
      if (fd.t === 'util' && mult === 10) {
        const d = [r6(), r6()]; G.dice = d; emit('dice', { p, d, extra: true });
        r = (d[0] + d[1]) * 10;
      } else r = rentOf(G, f, sum, fd.t === 'rail' ? mult : 1);
      log(pl.name + ' zahlt ' + fr(r) + ' Miete an ' + P(o).name + '.');
      emit('rent', { p, o, f, amt: r });
      charge(p, r, o, 'rent');
      break;
    }
    case 'tax':
      log(pl.name + ' zahlt ' + fr(fd.a) + ' ' + fd.n.replace('-', '') + '.');
      charge(p, fd.a, bankOrPot(), 'tax');
      break;
    case 'chance': case 'chest':
      drawCard(p, fd.t);
      return;
    case 'gotojail':
      sendToJail(p);
      break;
    case 'parking':
      if (G.opts.parking && G.pot > 0) {
        log(pl.name + ' räumt den Parkplatz-Topf ab: ' + fr(G.pot) + '!');
        const a = G.pot; G.pot = 0; pl.money += a;
        emit('jackpot', { p, amt: a });
      }
      break;
  }
  settle('post');
}

function drawCard(p, deck) {
  const d = G.decks[deck];
  const ci = d.shift();
  const c = DECKS[deck][ci];
  const pl = P(p);
  emit('card', { p, deck, ci });
  log(pl.name + ' zieht eine ' + (deck === 'chance' ? 'Ereigniskarte' : 'Gemeinschaftskarte') + ': ' + c.t);
  if (c.a === 'free') pl.cards.push(deck + ':' + ci); else d.push(ci);
  switch (c.a) {
    case 'goto':
      moveTo(p, c.f); land(p, G.lastSum); return;
    case 'rail': {
      let t = pl.pos; do t = (t + 1) % 40; while (!RAILS.includes(t));
      moveTo(p, t); land(p, G.lastSum, 2); return;
    }
    case 'util': {
      let t = pl.pos; do t = (t + 1) % 40; while (!UTILS.includes(t));
      moveTo(p, t); land(p, G.lastSum, 10); return;
    }
    case 'back':
      moveSteps(p, -c.n); land(p, G.lastSum); return;
    case 'jail': sendToJail(p); break;
    case 'get': transfer(-1, p, c.n, 'card'); break;
    case 'pay': charge(p, c.n, bankOrPot(), 'card'); break;
    case 'repair': {
      let h = 0, H = 0;
      for (const f of BUYABLE) if (G.own[f] === p) { if (G.houses[f] === 5) H++; else h += G.houses[f]; }
      charge(p, h * c.h + H * c.H, bankOrPot(), 'card');
      break;
    }
    case 'payall':
      for (const q of G.players) if (!q.out && q.idx !== p) charge(p, c.n, q.idx, 'card');
      break;
    case 'collect':
      for (const q of G.players) if (!q.out && q.idx !== p) charge(q.idx, c.n, p, 'card');
      break;
  }
  settle('post');
}

// Nach einer Aktion: offene Schulden zuerst, sonst weiter
function settle(after) {
  if (G.phase === 'over') return;
  if (G.debts.length) { G.after = after; G.phase = 'debt'; emit('debt', { d: G.debts[0] }); return; }
  resume(after);
}
function resume(after) {
  if (after === 'jailmove' && !P(G.cur).out) {
    const p = G.cur;
    moveSteps(p, G.dice[0] + G.dice[1]);
    land(p, G.dice[0] + G.dice[1]);
    return;
  }
  post();
}
function post() {
  if (G.phase === 'over') return;
  const pl = P(G.cur);
  if (pl.out) return nextTurn();
  if (pl.dbl > 0 && !pl.jail) { G.phase = 'roll'; emit('again', { p: G.cur }); }
  else { G.phase = 'end'; emit('phase'); }
}
function nextTurn() {
  if (alive().length <= 1) return finish(alive()[0] ? alive()[0].idx : 0);
  let n = G.cur;
  do {
    n = (n + 1) % G.players.length;
    if (n === 0) G.round++;
  } while (P(n).out);
  if (G.opts.rounds && G.round > G.opts.rounds) {
    G.round = G.opts.rounds;
    let best = -1, bw = -1;
    for (const q of alive()) { const w = worth(G, q.idx); if (w > bw) { bw = w; best = q.idx; } }
    log('Die letzte Runde ist gespielt.');
    return finish(best);
  }
  G.cur = n;
  const pl = P(n);
  pl.dbl = 0;
  G.phase = pl.jail ? 'jail' : 'roll';
  emit('turn', { p: n });
}
function finish(w) {
  G.phase = 'over'; G.winner = w;
  log('🏆 ' + P(w).name + ' gewinnt das Spiel!');
  emit('win', { p: w });
}

function doRoll(p) {
  const pl = P(p);
  const d = [r6(), r6()];
  G.dice = d;
  emit('dice', { p, d });
  const dbl = d[0] === d[1];
  pl.dbl = dbl ? pl.dbl + 1 : 0;
  if (pl.dbl >= 3) {
    log(pl.name + ' würfelt zum dritten Mal einen Pasch.');
    sendToJail(p);
    return settle('post');
  }
  if (dbl) log(pl.name + ' würfelt einen Pasch (' + d[0] + '+' + d[1] + ')!');
  moveSteps(p, d[0] + d[1]);
  land(p, d[0] + d[1]);
}

// ---------- Bauen und Hypotheken ----------
function canBuild(g, p, f) {
  const fd = F[f];
  if (fd.t !== 'street' || g.own[f] !== p) return false;
  const lv = g.houses[f];
  if (lv >= 5 || !ownsGroup(g, p, fd.g)) return false;
  const grp = GROUPS[fd.g].f;
  if (grp.some(x => g.mort[x])) return false;
  if (grp.some(x => g.houses[x] < lv)) return false;
  if (g.players[p].money < GROUPS[fd.g].h) return false;
  if (lv === 4 ? g.bankHotels < 1 : g.bankHouses < 1) return false;
  return true;
}
function canSell(g, p, f) {
  const fd = F[f];
  if (fd.t !== 'street' || g.own[f] !== p || g.houses[f] === 0) return false;
  const lv = g.houses[f];
  return !GROUPS[fd.g].f.some(x => g.houses[x] > lv);
}
function canMort(g, p, f) { return g.own[f] === p && !g.mort[f] && (F[f].t !== 'street' || !groupHasBuildings(g, F[f].g)); }
function canUnmort(g, p, f) { return g.own[f] === p && g.mort[f] && g.players[p].money >= unmortCost(f); }

function doBuild(p, f) {
  const cost = GROUPS[F[f].g].h;
  if (G.houses[f] === 4) { G.bankHotels--; G.bankHouses += 4; } else G.bankHouses--;
  G.houses[f]++;
  P(p).money -= cost;
  log(P(p).name + ' baut ' + (G.houses[f] === 5 ? 'ein Hotel' : 'ein Haus') + ' an der ' + fname(f) + '.');
  emit('build', { p, f, lv: G.houses[f], cost });
}
function doSell(p, f) {
  const cost = GROUPS[F[f].g].h;
  let back;
  if (G.houses[f] === 5) {
    G.bankHotels++;
    const keep = Math.min(4, G.bankHouses);
    G.bankHouses -= keep;
    back = (5 - keep) * cost / 2;
    G.houses[f] = keep;
  } else { G.houses[f]--; G.bankHouses++; back = cost / 2; }
  P(p).money += back;
  log(P(p).name + ' verkauft ein Gebäude an der ' + fname(f) + ' für ' + fr(back) + '.');
  emit('sell', { p, f, lv: G.houses[f], amt: back });
}
function doMort(p, f) {
  G.mort[f] = true; P(p).money += mortVal(f);
  log(P(p).name + ' nimmt eine Hypothek auf ' + fname(f) + ' auf (+' + fr(mortVal(f)) + ').');
  emit('mort', { p, f, on: true, amt: mortVal(f) });
}
function doUnmort(p, f) {
  G.mort[f] = false; P(p).money -= unmortCost(f);
  log(P(p).name + ' löst die Hypothek auf ' + fname(f) + ' ab (−' + fr(unmortCost(f)) + ').');
  emit('mort', { p, f, on: false, amt: unmortCost(f) });
}

// ---------- Versteigerung ----------
function startAuction(f) {
  const order = [];
  for (let k = 1; k <= G.players.length; k++) { const q = (G.cur + k) % G.players.length; if (!P(q).out) order.push(q); }
  G.auction = { f, bid: 0, high: -1, order, i: 0 };
  G.phase = 'auction';
  log(fname(f) + ' wird versteigert!');
  emit('auction', { f });
  auctionCheck();
}
function auctionCheck() {
  const a = G.auction;
  if (a.order.length === 0 || (a.order.length === 1 && a.high === a.order[0])) return auctionEnd();
  a.i = a.i % a.order.length;
  if (a.order[a.i] === a.high) a.i = (a.i + 1) % a.order.length;
}
function auctionEnd() {
  const a = G.auction;
  if (a.high >= 0) {
    G.own[a.f] = a.high;
    log(P(a.high).name + ' ersteigert ' + fname(a.f) + ' für ' + fr(a.bid) + '.');
    transfer(a.high, -1, a.bid, 'auction');
    emit('buy', { p: a.high, f: a.f, price: a.bid, auction: true });
  } else { log('Niemand bietet. ' + fname(a.f) + ' bleibt bei der Bank.'); emit('nobid', { f: a.f }); }
  G.auction = null;
  G.phase = 'x';
  post();
}

async function hop(t, to, h, ms) {
  const from = t.m.position.clone();
  await tween(ms, (e, k) => {
    t.m.position.lerpVectors(from, to, e);
    t.m.position.y = from.y + (to.y - from.y) * e + Math.sin(k * Math.PI) * h;
    const sq = k > 0.85 ? Math.sin((k - 0.85) / 0.15 * Math.PI) * 0.18 : 0;

    new THREE.Vector3(0.65 + (Math.random() - 0.5) * 0.6, TOP + DS / 2, 1.9 + (Math.random() - 0.5) * 0.8)];
  const startBase = new THREE.Vector3(Math.sin(camS.theta) * 9, TOP + 4.5, Math.cos(camS.theta) * 9);
  const anims = dice.map((m, k) => {

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  runTweens(now);
  if (menuOpen() && !COVER) camG.theta += dt * 0.06;
  updateCamera(dt);
  updateTokens(dt, now);
  // Funken
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i], u = s.userData;
    u.life += dt;
    if (u.life >= u.max) { scene.remove(s); sparks.splice(i, 1); sparkPool.push(s); continue; }
    u.v.y -= u.g * dt; s.position.addScaledVector(u.v, dt);
    if (s.position.y < TOP + 0.03) { s.position.y = TOP + 0.03; u.v.y *= -0.4; u.v.x *= 0.7; u.v.z *= 0.7; }
    s.material.opacity = 1 - u.life / u.max;
    s.scale.setScalar(u.size * (1 - 0.5 * u.life / u.max));
  }
  // Münzen
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i], u = c.userData;
    u.t += dt;
    if (u.t < 0) continue;
    c.visible = true;
    const k = Math.min(1, u.t / u.dur), e = E_IO(k);
    c.position.lerpVectors(u.a, u.b, e);
    c.position.y += Math.sin(k * Math.PI) * u.h;
    c.rotation.set(u.spin.x * u.t, u.spin.y * u.t, u.spin.z * u.t);
    if (k >= 1) { scene.remove(c); coins.splice(i, 1); coinPool.push(c); if (Math.random() < 0.3) spark(c.position, '#ffcf4a', { speed: 1.5, life: 0.3, size: 0.25 }); }
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const s = floats[i], u = s.userData;
    u.life += dt;
    const k = u.life / u.max;
    s.position.y = u.y0 + E_OUT(Math.min(1, k)) * 1.6;
    s.material.opacity = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    if (k >= 1) { scene.remove(s); s.material.map.dispose(); s.material.dispose(); floats.splice(i, 1); }
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const m = rings[i], u = m.userData; u.life += dt;
    const k = u.life / u.max;
    m.scale.setScalar(0.2 + E_OUT(Math.min(1, k)) * u.r);
    m.material.opacity = 1 - k;
    if (k >= 1) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); rings.splice(i, 1); }
  }
  for (let i = beams.length - 1; i >= 0; i--) {
    const m = beams[i], u = m.userData; u.life += dt;
    const k = u.life / u.max;
    m.scale.y = Math.min(1, k * 5); m.position.y = TOP + 3.5 * m.scale.y;
    m.material.opacity = k < 0.4 ? 1 : 1 - (k - 0.4) / 0.6;
    m.rotation.y += dt * 2;
    if (k >= 1) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); beams.splice(i, 1); }
  }
  for (let i = shards.length - 1; i >= 0; i--) {
    const m = shards[i], u = m.userData; u.life += dt;
    u.v.y -= 18 * dt; m.position.addScaledVector(u.v, dt);
    if (m.position.y < TOP + 0.05) { m.position.y = TOP + 0.05; u.v.y *= -0.35; u.v.x *= 0.6; u.v.z *= 0.6; }
    m.rotation.x += u.w.x * dt; m.rotation.y += u.w.y * dt;
    if (u.life > 2.5) { m.scale.multiplyScalar(0.9); }
    if (u.life > 3.2) { scene.remove(m); m.geometry.dispose(); shards.splice(i, 1); }
  }
  if (sirenT > 0) {
    sirenT -= dt;
    const on = Math.floor(now / 160) % 2;
    sirens[0].intensity = on ? 3.5 : 0; sirens[1].intensity = on ? 0 : 3.5;
    sirens.forEach((l, k) => l.position.set(JAILC.x + (k ? 2 : -2), 4, JAILC.z));
    if (sirenT <= 0) sirens.forEach(l => (l.intensity = 0));
  }
  if (fieldHiT > 0) { fieldHiT -= dt; fieldHi.material.opacity = Math.min(1, fieldHiT) * (0.25 + 0.15 * Math.sin(now * 0.012)); } else fieldHi.material.opacity = 0;
  // Aktiver Spieler: Lichtring
  if (view && view.phase !== 'over' && toks[view.cur] && !toks[view.cur].hide) {
    activeRing.visible = true;
    activeRing.position.copy(toks[view.cur].m.position); activeRing.position.y = TOP + 0.015;
    activeRing.material.color.set(view.players[view.cur].col);
    activeRing.scale.setScalar(1 + Math.sin(now * 0.004) * 0.12);
  } else activeRing.visible = false;
  renderer.render(scene, camera);
  drawFx2D(dt);
  requestAnimationFrame(frame);
}

function deliver(evs) {
  if (!evs.length) return;
  if (isOnline() && isHost && room) {
    // In Paketen schicken, damit keine Nachricht zu gross wird
    for (let i = 0; i < evs.length; i += 12) room.send({ t: 'ev', evs: evs.slice(i, i + 12) });

}
async function playQueue() {

    try { await animate(e); } catch (err) { console.error(err); }
    applyView(e.s);
  }
  playing = false;
  if (!userCam && view && view.phase !== 'over' && !camOrbit) { const ph = view.phase; if (ph !== 'buy') camOverview(true); }
  renderPrompt(view);
  if (isHost) scheduleBot();
}
function applyView(s) {

function actHost(pid, a) {
  if (!G) return false;
  E = [];
  let ok = false;
  try { ok = handle(pid, a); } catch (err) { console.error(err); }
  const evs = E; E = [];

}
// Eigene Eingabe abschicken
function myPid(s) {
  s = s || view;
  if (!s) return -1;
  if (isOnline()) return s.players.findIndex(p => p.seat === room.you && !p.bot);
  return -1;
}
function canAct(s, pid) {

  return isOnline() ? s.players[pid].seat === room.you : true;
}
function send(a, pid) {

  if (pid == null) pid = isOnline() ? myPid() : actorOf(view);
  if (isOnline() && !isHost) { room.send({ t: 'a', a }); renderPrompt(null); return; }

}
function fallbackAction(g, p) {
  switch (g.phase) {
    case 'roll': return { k: 'roll' };
    case 'end': return { k: 'end' };
    case 'jail': return { k: 'jailRoll' };
    case 'buy': return { k: 'decline' };
    case 'auction': return { k: 'pass' };
    case 'trade': return { k: 'reject' };
    case 'debt': return g.players[p].money >= g.debts[0].amt ? { k: 'pay' } : { k: 'bankrupt' };
  }

}
function scheduleBot() {
  clearTimeout(botTimer);
  if (!G || G.phase === 'over' || menuOpen() && !isOnline()) return;
  const pid = actorOf(G);
  if (pid < 0 || !P(pid) || !P(pid).bot) return;
  const manageStep = ['roll', 'end', 'jail'].includes(G.phase);
  botTimer = setTimeout(() => {
    if (playing || Q.length || !G || G.phase === 'over') return;
    if (document.hidden && !isOnline()) { scheduleBot(); return; }
    if (menuOpen() && !isOnline()) return;
    const p = actorOf(G);
    if (p < 0 || !P(p) || !P(p).bot) return;
    let a = null;
    try { a = botDecide(G, p); } catch (err) { console.error(err); }
    if (!a || !actHost(p, a)) {
      const fb = fallbackAction(G, p);
      if (!fb || !actHost(p, fb)) console.warn('Bot steckt fest', G.phase, a);
    }
  }, (manageStep ? 420 : 650) * speedMul);
}

function onNetMsg(d, from) {

      if (pid >= 0) actHost(pid, d.a);

let setupSeats = null, setupOpts = null;

function showSetup(kind) {

addEventListener('keydown', e => {
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') {
    if (e.key === 'Escape') e.target.blur();
    if (e.key === 'Enter' && e.target.id === 'aCustom') $('aGo').click();
    if (e.key === 'Enter' && e.target.id === 'oCode') $('oJoin').click();
    return;
  }
  audio();
  const k = e.key === ' ' ? 'space' : e.key.toLowerCase();
  if (cardSkip && (k === 'space' || k === 'enter')) { e.preventDefault(); cardSkip(); return; }
  if (menuOpen()) return;
  if (k === 'escape') {
    e.preventDefault();
    if (infoOpen) { closeInfo(); return; }
    if (modalKind && modalKind !== 'auction' && modalKind !== 'answer' && modalKind !== 'result') { closeModal(); return; }
    if (!modalKind) openGameMenu();
    return;
  }
  if (k === 'm') { setMuted(!muted); return; }
  if (k === 'c') { userCam = false; camOverview(); return; }
  if (k === 'arrowleft' || k === 'arrowright') { e.preventDefault(); userCam = true; camG.theta += (k === 'arrowleft' ? 1 : -1) * 0.25; return; }
  if (k === 'arrowup' || k === 'arrowdown') { e.preventDefault(); userCam = true; camG.phi = Math.min(1.25, Math.max(0.12, camG.phi + (k === 'arrowup' ? -0.08 : 0.08))); return; }
  if (k === '+' || k === '=') { camG.r = Math.max(8, camG.r * 0.88); return; }
  if (k === '-' || k === '_') { camG.r = Math.min(60, camG.r * 1.12); return; }
  const scope = modalKind ? $('modal') : $('abtns');
  const b = [...scope.querySelectorAll('button[data-key]')].find(x => x.dataset.key === k && !x.disabled);
  if (b) { e.preventDefault(); b.click(); }
  else if (k === 'space') e.preventDefault();
});

      G = newGame(seats, defaultOpts());
      while (G.phase !== 'over' && G.round < rounds) { const pid = actorOf(G); E = []; if (!handle(pid, botDecide(G, pid))) handle(pid, fallbackAction(G, pid)); }
      while (G.phase !== 'over' && !(G.phase === 'roll' && G.cur === 0)) { const pid = actorOf(G); E = []; if (!handle(pid, botDecide(G, pid))) handle(pid, fallbackAction(G, pid)); }
      E = [];
      G.players[0].bot = 0; G.players[0].money += 2000;
      mode = 'local'; isHost = true; startView(clone(G)); renderPrompt(view);
    },
    simulate(n, levels) {
      const out = [];
      for (let k = 0; k < n; k++) {
        const seats = (levels || [1, 2, 3, 3]).map((b, i) => ({ name: 'B' + i, bot: b, tok: i, col: PCOLS[i] }));
        G = newGame(seats, Object.assign(defaultOpts(), { parking: k % 2 === 1 }));
        let steps = 0, err = null;
        while (G.phase !== 'over' && steps < 40000) {
          const pid = actorOf(G);
          let a = botDecide(G, pid);
          E = [];
          let ok = a && handle(pid, a);
          if (!ok) { a = fallbackAction(G, pid); E = []; ok = handle(pid, a); }
          if (!ok) { err = 'stuck ' + G.phase + ' ' + JSON.stringify(a); break; }
          steps++;
          let hs = 0, hh = 0;
          for (let f = 0; f < 40; f++) { if (G.houses[f] === 5) hh++; else hs += G.houses[f]; if (G.own[f] >= 0 && G.players[G.own[f]].out) err = 'owner out'; }
          if (hs + G.bankHouses !== 32 || hh + G.bankHotels !== 12) err = 'houses ' + hs + '/' + G.bankHouses;
          for (const p of G.players) if (!p.out && p.money < 0) err = 'neg money ' + p.name + ' ' + p.money + ' ' + G.phase;
          if (err) break;
        }
        out.push({ steps, round: G.round, winner: G.winner, phase: G.phase, err, alive: G.players.filter(p => !p.out).length });
      }
      E = [];
      return out;
    },
  };
}

// ======================================================================
//  Start
// ======================================================================
setMuted(muted);
onResize();
requestAnimationFrame(frame);
if (COVER) coverScene();
else {
  const code = HUB ? HUB.cleanCode(location.hash) : '';
  if (code.length === 4) showOnline(code); else showMain();
}
</script>
