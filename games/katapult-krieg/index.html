<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catapult</title>
<meta name="description" content="Baut, zielt, zerstört: Schiess die Burg deines Gegners in Trümmer – mit Wind und Spezialmunition.">
<meta name="theme-color" content="#f5c542">
<meta name="spiel-modi" content="Lokal,Online,Bots">
<meta name="spiel-tags" content="1 gegen 1">
<meta name="spiel-typ" content="Physik,Action">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--p1:#3b82f6;--p2:#ef4444;--bg:#151924;--panel:#232938;--panel2:#2d3446;--text:#eef1f7;--muted:#9aa3b5;--gold:#f5c542;--accent:#f5c542}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--panel);gap:10px;min-height:46px;position:relative;z-index:2;flex-wrap:wrap}
.pstat{display:flex;gap:12px;align-items:center;font-weight:600;padding:5px 12px;border-radius:9px;background:var(--panel2);border:2px solid transparent;transition:.2s}
.pstat.active{border-color:var(--gold);box-shadow:0 0 14px #f5c54255}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
#mid{font-weight:700;text-align:center;flex:1}
#mid .wind{font-size:15px;color:#cfe3ff}
.iconbtn{background:var(--panel2);border:none;color:var(--text);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px}
.iconbtn:hover{background:#3a4258}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px;overflow:hidden}
canvas{display:block;border-radius:8px;box-shadow:0 6px 30px #000a;cursor:crosshair;touch-action:none}
#bar{background:var(--panel);padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:112px;border-top:3px solid var(--accent)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{position:relative;background:var(--panel2);border:2px solid #41485a;color:var(--text);border-radius:10px;padding:5px 10px 4px;min-width:82px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit}
.tool:hover:not(:disabled){background:#384057}
.tool .ic{font-size:21px;line-height:1.1}
.tool b{font-size:13px}
.tool small{font-size:11px;color:var(--muted)}
.tool .k{position:absolute;top:2px;left:6px;font-size:10px;color:var(--muted)}
.tool.sel{border-color:var(--accent);background:#3b4359;box-shadow:0 0 10px color-mix(in srgb,var(--accent) 50%,transparent)}
.tool:disabled{opacity:.35;cursor:not-allowed}
.spacer{flex:1}
.pts{font-size:15px;color:var(--muted)}
.pts b{font-size:24px;color:var(--gold)}
.info{flex:1;min-width:220px;font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;max-height:76px}
.muted{color:var(--muted)}
.btn{font:inherit;font-weight:700;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--panel2);color:var(--text)}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn.primary{background:var(--gold);color:#2a2000}
.btn:disabled{opacity:.4;cursor:not-allowed}
.req{font-size:13px;color:var(--muted)}
.req .bad{color:#ff8a80}.req .ok{color:#8bf0a0}
#ov{position:fixed;inset:0;background:rgba(10,12,20,.96);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#ov.show{display:flex}
.card{background:var(--panel);border-radius:18px;padding:26px 30px;max-width:820px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 60px #000c;text-align:center}
.card h1{font-family:Bangers,Impact,sans-serif;font-size:60px;letter-spacing:2px;margin:0 0 4px;color:var(--gold);font-weight:400}
.card h2{font-family:Bangers,Impact,sans-serif;font-size:42px;letter-spacing:1px;margin:0 0 10px;font-weight:400}
.card p{line-height:1.5}
.rules{text-align:left;background:var(--panel2);border-radius:12px;padding:12px 18px;margin:14px 0;line-height:1.6;font-size:14px}
.rules li{margin:2px 0}
.ammo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;text-align:left;margin:10px 0 18px}
.ammo-grid div{background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.35}
.ammo-grid span{font-size:20px;margin-right:6px}
kbd{background:#3a4258;border-radius:4px;padding:1px 6px;font-size:12px;border-bottom:2px solid #1d2230}
.big{font-size:80px;line-height:1;margin:6px 0}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.card.wide{max-width:980px}
.rage{display:inline-block;width:64px;height:10px;background:#11141c;border-radius:6px;overflow:hidden;position:relative;vertical-align:middle;border:1px solid #444b5e;margin-left:3px}
.rage i{display:block;height:100%;background:linear-gradient(90deg,#f5c542,#ff7a3d,#ef4444)}
.rage::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:#ffffff66}
.rage.hot{box-shadow:0 0 8px #ef4444;animation:pulse .7s infinite alternate}
@keyframes pulse{from{border-color:#ef4444}to{border-color:#ffd0d0}}
.cr{color:var(--gold)}
.sec{text-align:left;margin:14px 0}
.sec h3{margin:12px 0 8px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{font:inherit;color:var(--text);background:var(--panel2);border:2px solid #41485a;border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px}
.opt:hover{background:#384057}
.opt.sel{border-color:var(--gold);box-shadow:0 0 12px #f5c54255;background:#3b4359}
.opt .ic{font-size:24px}
.opt small{color:var(--muted);font-size:12px;line-height:1.35}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.mapbtn{font:inherit;color:var(--text);background:var(--panel2);border:2px solid #41485a;border-radius:12px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.mapbtn:hover{background:#384057}
.mapbtn canvas{width:100%;height:auto;border-radius:8px;display:block}
.mapbtn.sel{border-color:var(--gold);box-shadow:0 0 12px #f5c54255}
.mapbtn b{font-size:13px}
details.sec{background:var(--panel2);border-radius:12px;padding:10px 14px}
details.sec summary{cursor:pointer;font-weight:700}
.toggles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;margin-top:10px}
.toggles label{display:flex;gap:8px;align-items:flex-start;background:var(--panel);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px;line-height:1.35}
.toggles label small{color:var(--muted)}
.toggles select{font:inherit;background:var(--panel2);color:var(--text);border:1px solid #555;border-radius:6px;padding:2px 4px}
.shop{display:flex;gap:6px;align-items:center;padding-left:10px;border-left:2px solid #41485a}
.shop .crd{font-weight:700;color:var(--gold);font-size:13px;text-align:center;line-height:1.1;min-width:44px}
.shop .crd b{font-size:22px;display:block}
.tool.troop{border-color:#8a7330;min-width:74px}
.badge{display:inline-block;background:var(--panel2);border-radius:6px;padding:2px 8px;margin:2px;font-size:13px}
.sec.net{background:var(--panel2);border-radius:12px;padding:10px 14px}
.sec.net h3{margin-top:4px}
.netrow{display:flex;gap:8px;margin:6px 0}
.netrow input{flex:1;min-width:0;font:inherit;background:var(--panel);color:var(--text);border:2px solid #41485a;border-radius:10px;padding:9px 12px;outline:none}
.netrow input:focus{border-color:var(--gold)}
.neterr{color:#ff8a80;font-size:13px;min-height:16px;margin:2px 0}
.netnote{background:#3b4a2e;border:1px solid #8bf0a088;border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0}
.netcode{font:800 46px ui-monospace,monospace;letter-spacing:.22em;color:var(--gold);background:var(--panel2);border-radius:12px;padding:8px;margin:8px auto;max-width:300px;user-select:text}
#netBoardOver{max-width:460px;margin:8px auto;text-align:left}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="pstat" id="p1"></div>
    <div id="mid"></div>
    <div class="pstat" id="p2"></div>
    <button class="iconbtn" id="muteBtn" title="Ton an/aus (M)">🔊</button>
    <button class="iconbtn" id="helpBtn" title="Regeln">?</button>
  </div>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div id="bar"></div>
</div>
<div id="ov"></div>

<script>
// Ton anhalten, solange der Tab im Hintergrund ist (spart Akku, keine hängenden Töne)
(function () {
  var A = window.AudioContext || window.webkitAudioContext; if (!A) return;
  var all = [];
  function P(o) { var c = o === undefined ? new A() : new A(o); all.push(c); return c; }
  P.prototype = A.prototype;
  window.AudioContext = P; if (window.webkitAudioContext) window.webkitAudioContext = P;
  document.addEventListener('visibilitychange', function () {
    all.forEach(function (c) { try { var r = document.hidden ? c.suspend() : c.resume(); if (r && r.catch) r.catch(function () {}); } catch (e) {} });
  });
})();

<script src="../_shared/hub.js"></script>
<script>
// ============================================================
//  KONSTANTEN
// ============================================================
const W = 1440, H = 720, CS = 24, COLS = 60, ROWS = 30;
const GROUND = 25;          // Standard-Bodenhöhe (Flachland)
const BUILD_TOP = 6;        // höchste Reihe, in der gebaut werden darf
const ZONES = [{c0: 1, c1: 19}, {c0: 40, c1: 58}];
const G = 0.25, VMAX = 18.5, MAXDRAG = 180, WINDMAX = 0.018;
function budget() { return LENGTHS[CFG.len].budget; }
const TEAM = ['#3b82f6', '#ef4444'];
const TEAM_NAME = ['Spieler 1', 'Spieler 2'];

const MATS = {
  wood:     {name: 'Holz',     cost: 10, hp: 40,  burn: true, icon: '🪵', col: '#b5803f', desc: 'Billig, aber brennt lichterloh'},
  stone:    {name: 'Stein',    cost: 25, hp: 100, icon: '🧱', col: '#9ea4ac', desc: 'Solider Allrounder'},
  metal:    {name: 'Metall',   cost: 50, hp: 220, icon: '🔲', col: '#7a8794', desc: 'Sehr zäh & feuerfest, aber Bohrer mögen es'},
  tnt:      {name: 'Pulverfass', cost: 40, hp: 15, burn: true, icon: '🛢️', col: '#c0392b', max: 5, desc: 'Jedes Fass = +1 Bombe (max. 5). Aber: Wird es getroffen oder brennt, explodiert es in DEINEM Schloss!'},
  catapult: {name: 'Katapult', cost: 0,  hp: 120, burn: true, unit: true, icon: '🏹', col: '#8b5a2b', desc: 'Pflicht (Anzahl je nach Spieldauer). Braucht freie Schussbahn nach oben!'},
  human:    {name: 'Mensch',   cost: 0,  hp: 50,  burn: true, unit: true, icon: '🧍', col: '#f1c27d', desc: 'Pflicht. Gut beschützen!'},
  king:     {name: 'König',    cost: 0,  hp: 70,  burn: true, unit: true, icon: '👑', col: '#8e44ad', desc: 'Pflicht: genau 1. Stirbt der König, ist das Spiel sofort verloren – gut verstecken!'},
  dirt:     {hp: Infinity, col: '#6b4a2b'}
};
const TOOLS = ['wood', 'stone', 'metal', 'tnt', 'catapult', 'human'];
function tools() { return CFG.king ? [...TOOLS, 'king'] : TOOLS; }
function need(t) { const L = LENGTHS[CFG.len]; return t === 'catapult' ? L.cats : t === 'human' ? L.humans - (CFG.king ? 1 : 0) : t === 'king' ? 1 : 0; }

// ---------- Spieldauer ----------
const LENGTHS = {
  short:  {name: 'Kurz',   icon: '⚡', budget: 300,  cats: 2, humans: 2, scale: .42, desc: '300 Punkte · 2 Katapulte · 2 Menschen. Kleine Burgen, schnelle Partie.'},
  medium: {name: 'Mittel', icon: '⏱️', budget: 800,  cats: 2, humans: 2, scale: .7,  desc: '800 Punkte · 2 Katapulte · 2 Menschen.'},
  long:   {name: 'Lang',   icon: '🏰', budget: 1400, cats: 3, humans: 3, scale: .88, desc: '1400 Punkte · 3 Katapulte · 3 Menschen.'},
  epic:   {name: 'Episch', icon: '👑', budget: 2000, cats: 3, humans: 3, scale: 1,   desc: '2000 Punkte · 3 Katapulte · 3 Menschen – riesige Burgen wie im Original.'}
};

// ---------- Computer-Gegner ----------
// angErr/pwErr: Zielfehler · wind: wie gut er den Wind einrechnet · save: wie sparsam mit Spezialmunition · vis: schiesst Besucher · buy: Kauflust
const NPCS = {
  off:    {name: '2 Spieler', icon: '👥', desc: 'Zwei Leute an einem Rechner, abwechselnd.'},
  easy:   {name: 'Computer: Leicht', icon: '🙂', desc: 'Zielt ungenau und vergisst den Wind.', angErr: 7, pwErr: .08, wind: 0, save: .3, noise: 40, vis: false, buy: .3},
  medium: {name: 'Computer: Mittel', icon: '🤖', desc: 'Ordentlicher Schütze, schätzt den Wind.', angErr: 2.6, pwErr: .03, wind: .7, save: .7, noise: 12, vis: true, buy: .55},
  hard:   {name: 'Computer: Schwer', icon: '😈', desc: 'Sehr genau, nutzt Munition & Besucher clever.', angErr: .9, pwErr: .012, wind: 1, save: 1, noise: 3, vis: true, buy: .85}
};
function npcOn() { return CFG.npc && CFG.npc !== 'off'; }
function isNpcTurn() { return npcOn() && S.phase === 'battle' && S.turn === 1; }

const AMMO = {
  stone:   {name: 'Stein',  icon: '🪨', count: Infinity, speed: 1,    desc: 'Unbegrenzt. 60 Schaden auf einen Block, etwas Streuschaden.'},
  bomb:    {name: 'Bombe',  icon: '💣', count: 3,        speed: 0.92, desc: 'Grosse Explosion. Schwer – fliegt etwas kürzer. Metall hält besser stand. +1 pro eigenem Pulverfass.'},
  fire:    {name: 'Feuer',  icon: '🔥', count: 3,        speed: 1,    desc: 'Wenig Sofortschaden, zündet aber Holz, Menschen, Katapulte & TNT an. Feuer breitet sich aus.'},
  cluster: {name: 'Streu',  icon: '🎆', count: 3,        speed: 1,    desc: 'Teilt sich am höchsten Punkt in 5 Splitter (früher: LEERTASTE / Klick).'},
  drill:   {name: 'Bohrer', icon: '🔩', count: 2,        speed: 1.08, desc: 'Durchschlägt bis zu 4 Blöcke. Stark gegen Metall & Stein.'},
  cow:     {name: 'Kuh',    icon: '🐄', count: 2,        speed: 0.88, desc: 'Springt bis zu 4x herum und richtet bei jedem Aufprall Schaden an. MUH.'}
};
const AMMO_KEYS = Object.keys(AMMO);
const SPECIAL = ['bomb', 'fire', 'cluster', 'drill', 'cow'];
const MULT = {
  fire:   {wood: 2, metal: 0.3, stone: 0.6},
  drill:  {metal: 1.4, stone: 1.2},
  bomb:   {metal: 0.7},
  pellet: {metal: 0.6},
  hail:   {wood: 1.3, metal: 0.4},
  arrow:  {human: 1.6, king: 1.6, metal: 0.3, stone: 0.5},
  ram:    {metal: 1.2, stone: 1.1},
  stone: {}, cow: {}, tnt: {}, fall: {}, burn: {}
};
// Schaden von Geschossen an Besuchern (UFO, Drache …) und Truppen
const VDMG = {stone: 60, pellet: 25, cluster: 45, bomb: 120, fire: 40, drill: 90, cow: 80, arrow: 15, cannon: 70, meteor: 90, hail: 15};

// ---------- Karten ----------
const THEMES = {
  green:  {sky: ['#5aa7e8', '#a9d8f5', '#e8f4fa'], far: '#8fb6cf', near: '#7aa58a', grass: ['#4caf50', '#3d8f40', '#6fcf73'], dirt: ['#6b4a2b', '#5a3d23', '#7d5734', '#553820']},
  alpine: {sky: ['#3f83cf', '#94c2ec', '#e3f0fb'], far: '#a7b9cc', near: '#6f9a86', grass: ['#4caf50', '#3d8f40', '#6fcf73'], dirt: ['#6e6258', '#5a5048', '#857a70', '#4a423b'], snow: ['#f4f8fb', '#cfdbe6', '#ffffff']},
  desert: {sky: ['#e98e4f', '#f5c98a', '#fbe9c8'], far: '#d79a70', near: '#c4824f', grass: ['#e2b866', '#c9973f', '#f0d08a'], dirt: ['#b5653a', '#9a5230', '#c87a4c', '#8a4526']},
  tropic: {sky: ['#2fa6e6', '#97ddf5', '#e9fbff'], far: '#7ec4c9', near: '#5fae86', grass: ['#f1d38a', '#d9b56a', '#fae5ae'], dirt: ['#c9a46a', '#b08850', '#d8b77e', '#a07a45']},
  dusk:   {sky: ['#5b6fb5', '#c99ac9', '#f6d2b8'], far: '#8f86b0', near: '#6d8f7a', grass: ['#5bb35f', '#438f47', '#7fd483'], dirt: ['#6b4a2b', '#5a3d23', '#7d5734', '#553820']}
};
// top(m): oberste Erd-Reihe; m = Abstand vom Rand (0..29), Karten sind spiegelsymmetrisch = fair
const MAPS = {
  hills:    {name: 'Hügel', icon: '🌄', theme: 'green', deco: 'tree', desc: 'Der Klassiker: flache Bauzonen, ein Hügel in der Mitte.',
             top: m => { const d = (29.5 - m) / 8.5; return GROUND - Math.max(0, Math.round(7 * (1 - d * d))); }},
  flat:     {name: 'Flachland', icon: '🌾', theme: 'green', deco: 'bush', desc: 'Kein Hindernis – freies Schussfeld, pures Zielen. Truppen sind schnell beim Gegner.',
             top: () => GROUND},
  mountain: {name: 'Gebirge', icon: '🏔️', theme: 'alpine', deco: 'pine', snow: 15, desc: 'Ein riesiger Berg in der Mitte. Nur hohe Bögen kommen rüber – Truppen müssen klettern.',
             top: m => { const h = Math.max(0, 1 - (29.5 - m) / 10.5); return GROUND - Math.round(17 * Math.pow(h, 1.25)); }},
  canyon:   {name: 'Schlucht', icon: '🏜️', theme: 'desert', deco: 'cactus', desc: 'Burgen auf hohen Plateaus, dazwischen eine tiefe Schlucht mit Felssäule.',
             top: m => m <= 19 ? 21 : m === 20 ? 23 : m === 21 ? 26 : m >= 28 ? 17 : 28},
  islands:  {name: 'Inseln', icon: '🏝️', theme: 'tropic', deco: 'palm', water: 26, desc: 'Zwei Inseln, dazwischen Meer. Feuer erlischt im Wasser, Truppen müssen schwimmen.',
             top: m => m <= 19 ? 24 : m === 20 ? 25 : m === 21 ? 27 : m >= 28 ? 25 : 29},
  rolling:  {name: 'Hügelland', icon: '🌳', theme: 'dusk', deco: 'tree', desc: 'Welliger Boden – auch in den Bauzonen. Zwei Hügel, dazwischen ein Tal.',
             top: m => m <= 19 ? 24 + Math.round(Math.sin(m * .55 + .4) * 1.3) : GROUND - Math.round(5 * Math.max(0, 1 - ((m - 24.5) / 3.5) ** 2))},
  random:   {name: 'Zufall', icon: '🎲', desc: 'Lass dich überraschen – eine zufällige Karte.'}
};
const MAP_KEYS = Object.keys(MAPS);

// ---------- Stufen, Modi & Regeln ----------
const LEVELS = {
  basic: {name: 'Basic', icon: '🟢', desc: 'Das Original: bauen, zielen, zerstören. Volle Zielhilfe.', set: {revolt: false, reload: false, combo: false, king: false, aim: 'full', timer: 0}},
  adv:   {name: 'Fortgeschritten', icon: '🟠', desc: 'Wut & Volksaufstand, Nachladen, Volltreffer-Bonus. Kürzere Zielhilfe.', set: {revolt: true, reload: true, combo: true, king: false, aim: 'short', timer: 0}},
  pro:   {name: 'Profi', icon: '🔴', desc: 'Alles an, dazu ein König, keine Flugbahn-Vorschau und 30 s Zugzeit.', set: {revolt: true, reload: true, combo: true, king: true, aim: 'off', timer: 30}}
};
const MODES = {
  classic: {name: 'Klassisch', icon: '🏹', desc: 'Katapulte gegen Burgen – wie gewohnt.'},
  merc:    {name: 'Söldner-Krieg', icon: '💰', desc: 'Zerstörte Blöcke, Menschen & Soldaten bringen Credits. Kaufe Soldaten, die die Burg stürmen. Mit Wut-Leiste.'}
};
const OPTS = [
  {k: 'merc', icon: '💰', name: 'Söldner', desc: 'Credits für Zerstörung, damit Soldaten kaufen.'},
  {k: 'revolt', icon: '😡', name: 'Wut & Volksaufstand', desc: 'Wer Schaden nimmt, wird wütend. Ab 50 % kann ein Aufstand losbrechen: 3 Leute stürmen zum Gegner.'},
  {k: 'reload', icon: '🔄', name: 'Nachladen', desc: 'Ein Katapult muss nach dem Schuss einen Zug lang nachladen – wechsle ab!'},
  {k: 'combo', icon: '🎯', name: 'Volltreffer-Bonus', desc: 'Zerstört ein Schuss viel auf einmal, gibt es +1 Spezialmunition.'},
  {k: 'king', icon: '👑', name: 'König', desc: 'Einer deiner Menschen ist König. Fällt er, ist das Spiel verloren.'}
];
// Wie oft Zufallsereignisse kommen: Chance pro Runde, ab welcher Runde, ruhige Runden dazwischen, max. Besucher gleichzeitig
const EVFREQ = {
  off:    {name: 'Aus',    icon: '🚫', desc: 'Keine Ereignisse – reines Duell.'},
  rare:   {name: 'Selten', icon: '🌤️', desc: 'Ab Runde 4, ca. alle 8–10 Runden.', chance: .15, from: 4, gap: 3, vis: 1},
  normal: {name: 'Normal', icon: '⛅', desc: 'Ab Runde 3, ca. alle 5–6 Runden.', chance: .3, from: 3, gap: 2, vis: 1},
  often:  {name: 'Oft',    icon: '🌦️', desc: 'Ab Runde 2, ca. alle 2–3 Runden.', chance: .5, from: 2, gap: 1, vis: 1},

};

// ============================================================
//  SETUP
// ============================================================
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * DPR; cv.height = H * DPR;
const $ = id => document.getElementById(id);
const bar = $('bar'), ov = $('ov');
// Zufall: Die Spiel-Logik nutzt RNG (online auf beiden PCs gleich gesät -> identischer Ablauf),
// rein Optisches (Wackeln, Wolken, Ton) nutzt vrand / Math.random
let RNG = Math.random;
function seededRng(seed) {
  let a = seed >>> 0;
  return () => { NET.rc++; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rand = (a, b) => a + RNG() * (b - a);
const vrand = (a, b) => a + Math.random() * (b - a);
let uid = 0;

function fit() {
  const r = $('wrap').getBoundingClientRect();
  const s = Math.min((r.width - 12) / W, (r.height - 12) / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
// Leisten oben/unten dürfen wachsen, aber nie wieder schrumpfen -> das Spielfeld "zoomt" nicht ständig
function lockBars() {
  for (const el of [$('top'), bar]) {
    const h = el.offsetHeight, m = parseFloat(el.style.minHeight) || 0;
    if (h > m) el.style.minHeight = h + 'px';
  }
  fit();
}
window.addEventListener('resize', () => { $('top').style.minHeight = ''; bar.style.minHeight = ''; lockBars(); });

//  WELT
// ============================================================
function mapTop(c) { return S.map.top(c <= 29 ? c : COLS - 1 - c); }
function newGrid() {
  const g = [];
  for (let r = 0; r < ROWS; r++) g.push(new Array(COLS).fill(null));
  for (let c = 0; c < COLS; c++) for (let r = S.top[c]; r < ROWS; r++) g[r][c] = {t: 'dirt'};
  return g;
}
function mk(t, o) { const hp = MATS[t].hp; return {t, o, hp, max: hp, burn: 0, fall: 0, hit: 0, anim: 0, cool: 0, id: ++uid}; }
function mkPlayer() {
  const ammo = {}; AMMO_KEYS.forEach(k => ammo[k] = AMMO[k].count);
  return {points: budget(), ammo, cur: 'stone', credits: 0, rage: 0};
}

let S;
function newGame(forceMap) {
  const mapId = forceMap || (CFG.map === 'random' ? pick(MAP_KEYS.filter(k => k !== 'random')) : CFG.map);
  S = {phase: 'menu', mapId, map: MAPS[mapId], top: [], g: null, players: [mkPlayer(), mkPlayer()], builder: 0, turn: 0, tool: 'stone',
       proj: [], parts: [], pops: [], pending: [], wind: 0, bs: 'aim', aim: null, sel: null, shake: 0,
       banner: null, hover: null, shots: [0, 0], time: 0, rs: 0, rt: 0, rounds: 0, after: null,
       mod: {grav: 1, windMul: 1, water: 0, rain: false, dark: false, frenzy: false}, waterY: H + 60,
       ev: null, evq: [], flash: 0, starter: 0, lastEvent: null, vis: [], troops: [], tt: 0,
       shotsLeft: 1, bought: false, score: 0, scoring: false, tLeft: 0, kills: [0, 0], prevOv: null};
  for (let c = 0; c < COLS; c++) S.top[c] = mapTop(c);
  S.g = newGrid();
  S.zg = Math.round(zoneCols(0).reduce((s, c) => s + S.top[c], 0) / zoneCols(0).length);
  S.waterY = waterRow() * CS;
  renderBackground();
}

function each(fn) { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const k = S.g[r][c]; if (k) fn(k, r, c); } }
function countType(p, t) { let n = 0; each(k => { if (k.o === p && k.t === t) n++; }); return n; }
function humans(p) { return countType(p, 'human') + countType(p, 'king'); }
function findCell(obj) { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (S.g[r][c] === obj) return {r, c}; return null; }
function inGrid(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }
function topRow(c) { let r = 0; while (r < ROWS && !S.g[r][c]) r++; return r; }

// Schwerkraft: eine Reihe pro Aufruf. Gibt zurück, ob sich etwas bewegt hat.
function settleStep(damage) {
  let moved = false;
  for (let r = ROWS - 2; r >= 0; r--) for (let c = 0; c < COLS; c++) {
    const k = S.g[r][c];
    if (!k || k.t === 'dirt') continue;
    if (!S.g[r + 1][c]) { S.g[r + 1][c] = k; S.g[r][c] = null; k.fall++; moved = true; }
  }
  for (let r = ROWS - 2; r >= 0; r--) for (let c = 0; c < COLS; c++) {
    const k = S.g[r][c];
    if (!k || k.t === 'dirt' || !k.fall) continue;
    const b = S.g[r + 1][c];
    if (b && (b.t === 'dirt' || !b.fall)) {
      const f = k.fall; k.fall = 0;
      if (damage && f > 3) { damageCell(r, c, (f - 3) * 12, 'fall'); puff(c * CS + 12, r * CS + 22, 3, '#bba98f'); }
    }
  }
  return moved;
}
function settleInstant() { let i = 0; while (settleStep(false) && i++ < 100); }

// ============================================================
//  SCHADEN & EFFEKTE
// ============================================================
function damageCell(r, c, amt, src) {
  if (!inGrid(r, c)) return;
  const k = S.g[r][c];
  if (!k || k.t === 'dirt') return;
  const m = (MULT[src] && MULT[src][k.t]) || 1;
  const d = Math.round(amt * m);
  if (d <= 0) return;
  const real = Math.min(d, Math.max(0, k.hp));
  k.hp -= d; k.hit = 10;
  if (d >= 8 || MATS[k.t].unit) popup(c * CS + 12, r * CS + 4, '-' + d, m > 1 ? '#ffb347' : m < 1 ? '#a8c7ff' : '#fff', 14);
  if (CFG.revolt && S.phase === 'battle') addRage(k.o, real * (MATS[k.t].unit ? .22 : .03));
  if (k.hp <= 0) destroyCell(r, c);
}

function destroyCell(r, c) {
  const k = S.g[r][c];
  if (!k || k.t === 'dirt') return;
  S.g[r][c] = null;
  const x = c * CS + 12, y = r * CS + 12;
  const person = k.t === 'human' || k.t === 'king';
  debris(x, y, person ? TEAM[k.o] : MATS[k.t].col, 10);
  if (k.t === 'tnt') S.pending.push({x, y, t: 7});
  if (k.t === 'catapult') {
    popup(x, y - 20, 'Katapult zerstört!', TEAM[k.o], 18); sfx('death'); S.shake = Math.max(S.shake, 10);
    if (S.sel === k) S.sel = null;
    if (CFG.revolt && S.phase === 'battle') addRage(k.o, 10);
  }
  if (person) {
    popup(x, y - 20, k.t === 'king' ? '👑 ☠' : '☠', '#fff', 26); sfx('scream');
    S.parts.push({type: 'emoji', ch: '👻', x, y, vx: rand(-.3, .3), vy: -1.1, g: 0, life: 80, max: 80, size: 22});
    if (CFG.revolt && S.phase === 'battle') addRage(k.o, k.t === 'king' ? 15 : 8);
  }
  if (S.phase === 'battle') {
    const foe = 1 - k.o;
    if (CFG.merc && CREDIT[k.t]) { S.players[foe].credits += CREDIT[k.t]; popup(x + 12, y - 2, `+${CREDIT[k.t]}💰`, '#f5c542', 12); sfx('coin'); }
    if (S.scoring && foe === S.turn) S.score += MATS[k.t].unit ? 3 : 1;
    if (MATS[k.t].unit) S.kills[foe]++;
  }
  renderTop();
}

function explode(x, y, rad, dmg, src) {
  const cc = x / CS, rc = y / CS;
  for (let r = Math.floor(rc - rad - 1); r <= rc + rad + 1; r++)
    for (let c = Math.floor(cc - rad - 1); c <= cc + rad + 1; c++) {
      if (!inGrid(r, c)) continue;
      const d = Math.hypot(c + .5 - cc, r + .5 - rc);
      if (d <= rad) damageCell(r, c, dmg * (1 - 0.6 * d / rad), src);
    }
  for (const t of S.troops) {
    const d = Math.hypot(t.x - x, t.y - 12 - y) / CS;
    if (d <= rad + .3) hurtTroop(t, dmg * (1 - .6 * Math.min(1, d / rad)));
  }
  boomFx(x, y, rad); S.shake = Math.max(S.shake, 14); sfx('boom');
}

// Wasserlinie (Reihe): Meer der Karte und/oder Sturmflut
function waterRow() {
  const sea = S.map.water || ROWS + 3;
  return S.mod.water ? Math.min(sea, S.zg - S.mod.water) : sea;
}
function ignite(r, c) { if (!inGrid(r, c) || r >= waterRow()) return; const k = S.g[r][c]; if (k && MATS[k.t].burn) k.burn = Math.max(k.burn, 3); }
function igniteArea(r, c, rad) {
  for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) if (Math.hypot(dr, dc) <= rad) ignite(r + dr, c + dc);
}
function fireTick() {
  const list = []; each((k, r, c) => { if (k.burn > 0) list.push({k, r, c}); });
  if (!list.length) return false;
  for (const {k, r, c} of list) {
    if (S.g[r][c] !== k) continue;
    if (r >= waterRow() || S.mod.rain) { k.burn = 0; continue; }
    if (k.t === 'tnt') { destroyCell(r, c); continue; }
    damageCell(r, c, 14, 'burn');
    k.burn--; if (RNG() < 0.2) k.burn = 0;
    for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
      if (!inGrid(r + dr, c + dc)) continue;
      const n = S.g[r + dr][c + dc];
      if (n && MATS[n.t].burn && !n.burn && RNG() < 0.35) n.burn = 2;
    }
  }
  sfx('fire');
  return true;
}

// Partikel
function debris(x, y, col, n) {
  for (let i = 0; i < n; i++) S.parts.push({type: 'sq', x, y, vx: rand(-3, 3), vy: rand(-5, -1), g: .25, life: rand(40, 70), max: 70, col, size: rand(2, 6)});
}
function puff(x, y, n, col = '#ccc') {
  for (let i = 0; i < n; i++) S.parts.push({type: 'smoke', x: x + rand(-6, 6), y: y + rand(-6, 6), vx: rand(-.6, .6), vy: rand(-.9, -.2), g: -.005, life: rand(30, 55), max: 55, col, size: rand(4, 9)});
}
function boomFx(x, y, rad) {
  S.parts.push({type: 'flash', x, y, vx: 0, vy: 0, g: 0, life: 12, max: 12, size: rad * CS * 1.1});
  for (let i = 0; i < 34; i++) { const a = rand(0, 6.28), s = rand(1, 7); S.parts.push({type: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, g: .12, life: rand(20, 45), max: 45, col: RNG() < .5 ? '#ffb02e' : '#ffe066', size: rand(2, 4)}); }
  puff(x, y, 14, '#777');
}
function popup(x, y, text, col, size = 14) { S.pops.push({x, y, text, col, size, life: 60}); }
function bannerMsg(text, col) { S.banner = {text, col, life: 110}; }

// ============================================================
//  PROJEKTILE
// ============================================================
function mkProj(type, x, y, vx, vy, owner, origin = -1) {
  return {type, x, y, vx, vy, owner, origin, left: false, pierced: new Set(), pierce: 0, bounces: 0, trail: [], rot: 0, dead: false, wet: false};
}

function catOrigin(pos) { return {x: pos.c * CS + 12, y: pos.r * CS + 6}; }

function launchVel(dx, dy, ammo) {
  const len = Math.hypot(dx, dy);
  if (len < 1) return {vx: 0, vy: 0, pw: 0};
  const pw = Math.min(len, MAXDRAG) / MAXDRAG;
  const sp = pw * VMAX * AMMO[ammo].speed;
  return {vx: dx / len * sp, vy: dy / len * sp, pw};
}

function stepProjectile(p) {
  p.vy += G * S.mod.grav; if (!p.noWind) p.vx += S.wind;
  const sp = Math.hypot(p.vx, p.vy);
  const n = Math.max(1, Math.ceil(sp / 4));
  for (let i = 0; i < n; i++) {
    const px = p.x, py = p.y;
    p.x += p.vx / n; p.y += p.vy / n;
    if (p.x < -300 || p.x > W + 300 || p.y > H + 40) { p.dead = true; return; }
    // Eintauchen ins Wasser
    if (!p.wet && S.waterY < H && p.y >= S.waterY) {
      p.wet = true;
      for (let j = 0; j < 10; j++) S.parts.push({type: 'sq', x: p.x, y: S.waterY, vx: rand(-2, 2), vy: rand(-4, -1), g: .2, life: 30, max: 30, col: '#bfe6ff', size: rand(2, 4)});
      sfx('plop');
      if (p.type === 'fire') { puff(p.x, p.y, 8, '#eee'); popup(p.x, p.y - 14, 'zisch!', '#cfe6ff', 14); p.dead = true; return; }
    }
    // Besucher (UFO, Drache …) – nur Spieler-Geschosse
    if (p.owner >= 0) for (const v of S.vis) if (!v.leaving && visitorHit(v, p.x, p.y)) { hitVisitor(v, p); return; }
    // Truppen
    for (const t of S.troops) {
      if (t.dead || (p.type === 'arrow' && p.owner === t.o)) continue;
      const big = t.type === 'ram';
      if (Math.abs(p.x - t.x) < (big ? 18 : 9) && p.y > t.y - (big ? 26 : 27) && p.y < t.y + 2) { projHitTroop(p, t); if (p.dead) return; }
    }
    const c = Math.floor(p.x / CS), r = Math.floor(p.y / CS);
    if (!inGrid(r, c)) continue;
    const key = r * COLS + c;
    if (key === p.origin && !p.left) continue;
    if (key !== p.origin) p.left = true;
    if (p.pierced.has(key)) continue;
    if (S.g[r][c]) {
      const before = {vx: p.vx, vy: p.vy};
      impact(p, r, c, px, py);
      if (p.dead) return;
      if (p.vx !== before.vx || p.vy !== before.vy) return; // Abprall/Bremsen: Rest des Frames verwerfen
    }
  }
}

function splash(r, c, amt, src) {
  for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) damageCell(r + dr, c + dc, amt, src);
}

function impact(p, r, c, px, py) {
  const k = S.g[r][c], dirt = k.t === 'dirt';
  switch (p.type) {
    case 'stone':
      if (!dirt) { damageCell(r, c, 60, 'stone'); splash(r, c, 12, 'stone'); }
      puff(p.x, p.y, 5, dirt ? '#a08060' : '#bbb'); sfx('hit'); S.shake = Math.max(S.shake, 5); p.dead = true; break;
    case 'pellet':
      damageCell(r, c, 30, 'pellet'); puff(p.x, p.y, 2); sfx('tick'); p.dead = true; break;
    case 'hail':
      damageCell(r, c, 22, 'hail'); puff(p.x, p.y, 3, '#fff'); sfx('tick'); p.dead = true; break;
    case 'arrow':
      damageCell(r, c, 18, 'arrow'); sfx('tick'); p.dead = true; break;
    case 'cannon':
      if (!dirt) { damageCell(r, c, 70, 'stone'); splash(r, c, 15, 'stone'); }
      puff(p.x, p.y, 6, '#bbb'); sfx('hit'); S.shake = Math.max(S.shake, 6); p.dead = true; break;
    case 'meteor':
      explode(p.x, p.y, 2.2, 65, 'bomb'); igniteArea(r, c, 1.3); p.dead = true; break;
    case 'cluster':
      damageCell(r, c, 45, 'stone'); puff(p.x, p.y, 5); sfx('hit'); p.dead = true; break;
    case 'bomb':
      explode(p.x, p.y, 3.2, 90, 'bomb'); p.dead = true; break;
    case 'fire':
      damageCell(r, c, 30, 'fire'); igniteArea(r, c, 1.5);
      for (let i = 0; i < 20; i++) S.parts.push({type: 'spark', x: p.x, y: p.y, vx: rand(-3, 3), vy: rand(-4, 0), g: .1, life: rand(20, 40), max: 40, col: RNG() < .5 ? '#ff6a00' : '#ffd000', size: rand(2, 5)});
      sfx('fire'); S.shake = Math.max(S.shake, 4); p.dead = true; break;
    case 'drill':
      if (dirt || p.pierce >= 4) { puff(p.x, p.y, 6, '#999'); sfx('hit'); p.dead = true; break; }
      damageCell(r, c, 75, 'drill'); p.pierce++; p.pierced.add(r * COLS + c);
      p.vx *= .82; p.vy *= .82; sfx('drill'); debris(p.x, p.y, '#ccc', 4); break;
    case 'cow': {
      const spd = Math.hypot(p.vx, p.vy);
      const f = Math.min(1.3, Math.max(.4, spd / 12));
      if (!dirt) { damageCell(r, c, 45 * f, 'cow'); splash(r, c, 10 * f, 'cow'); }
      p.x = px; p.y = py;
      const pr = Math.floor(py / CS), pc = Math.floor(px / CS);
      if (pr !== r) p.vy = -p.vy * .6;
      if (pc !== c) p.vx = -p.vx * .6;
      if (pr === r && pc === c) { p.vx = -p.vx * .6; p.vy = -p.vy * .6; }
      p.vx *= .9; p.bounces++;
      if (p.bounces === 1) { sfx('moo'); popup(p.x, p.y - 20, 'MUUUH!', '#fff', 20); } else sfx('hit');
      S.shake = Math.max(S.shake, 6); puff(p.x, p.y, 4, '#eee');
      if (p.bounces >= 4 || spd < 2.5) { p.dead = true; puff(p.x, p.y, 12, '#fff'); popup(p.x, p.y - 10, '*muh*', '#ddd', 14); }
      break;
    }
  }
}

function splitCluster(p) {
  p.dead = true;
  for (let i = -2; i <= 2; i++) S.proj.push(mkProj('pellet', p.x, p.y, p.vx + i * 1.3, p.vy + Math.abs(i) * .3 - .6, p.owner));
  puff(p.x, p.y, 8, '#e0b0ff'); sfx('pop');
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RNG() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    <div class="sec"><h3>4 · Spielmodus</h3><div class="opts">

    <div class="sec"><h3>6 · Zufallsereignisse & Besucher</h3><div class="opts">

      <label><span><b>🎯 Zielhilfe</b> <select data-sel="aim">${[['full', 'Volle Flugbahn'], ['short', 'Kurz'], ['off', 'Aus']].map(([v, n]) => `<option value="${v}" ${CFG.aim === v ? 'selected' : ''}>${n}</option>`).join('')}</select><br><small>Wie viel der Flugbahn beim Zielen angezeigt wird.</small></span></label>
      <label><span><b>⏱️ Zugzeit</b> <select data-sel="timer">${[[0, 'Unbegrenzt'], [45, '45 s'], [30, '30 s'], [20, '20 s']].map(([v, n]) => `<option value="${v}" ${+CFG.timer === v ? 'selected' : ''}>${n}</option>`).join('')}</select><br><small>Läuft die Zeit ab, wird geschossen – oder der Zug verfällt.</small></span></label>
    </div></details>
    <div class="btnrow"><button class="btn primary" data-act="start" style="font-size:20px;padding:12px 34px">Spiel starten ⚔️</button></div>
    <details class="sec" id="dHelp" ${openHelp}><summary>📖 Anleitung, Munition, Ereignisse & Truppen</summary>${helpHtml()}</details>`, true);
  ov.querySelectorAll('canvas[data-prev]').forEach(drawPreview);
  ov.querySelector('.card').scrollTop = scroll;
  netMenuBoard();
}

    <li><b>Bauphase:</b> Erst baut Spieler 1 geheim, dann Spieler 2 (oder der Computer). Jeder hat <b>${budget()} Punkte</b> für Blöcke und muss <b>${LENGTHS[CFG.len].cats} Katapulte</b> und <b>${LENGTHS[CFG.len].humans} Menschen</b> platzieren (gratis${CFG.king ? ', davon 1 König' : ''}).</li>
    <li>Blöcke fallen nach unten – kein Überhang. <b>Katapulte brauchen freie Bahn</b>, sonst trifft man die eigene Mauer!</li>
    <li>🛢️ <b>Pulverfässer</b> geben dir je +1 Bombe – aber wenn der Gegner sie trifft, explodieren sie in deinem Schloss.</li>
    <li><b>Schlacht:</b> Abwechselnd ein Schuss. Mit der Maus <b>ziehen und loslassen</b> wie eine Steinschleuder. Achtung Wind!</li>
    <li><b>Verloren</b> hat, wer alle Katapulte <b>oder</b> alle Menschen verliert${CFG.king ? ' – oder seinen König' : ''}.</li>
    <li>🎲 <b>Ereignisse:</b> Ab Runde 2 kann etwas passieren – es trifft <b>beide Seiten gleich</b>. <b>Besucher</b> (mit Lebensbalken und 🎁-Anzeige) bleiben ein paar Runden: schiess sie ab und kassiere die Belohnung. Das kostet aber deinen Schuss!</li>
    <li>😡 <b>Wut:</b> Jeder Schaden füllt deine Wut-Leiste. Ab 50 % kann zu Beginn deines Zuges ein <b>Volksaufstand</b> losbrechen – je wütender, desto wahrscheinlicher: 3 Leute stürmen aus deiner Burg zum Gegner.</li>
    <li>💰 <b>Söldner:</b> Jeder zerstörte gegnerische Block, Mensch oder Soldat bringt Credits. Pro Zug darfst du einen Soldaten kaufen (max. ${MAX_TROOPS} gleichzeitig). Soldaten handeln zu Beginn deiner Züge und können abgeschossen werden – auch von dir selbst!</li>
    <li>🔄 <b>Nachladen:</b> Ein Katapult, das geschossen hat, lädt im nächsten Zug nach (⏳). 🎯 <b>Volltreffer:</b> Viel Zerstörung mit einem Schuss = +1 Spezialmunition.</li>

  </ul></div>
  <h3>Munition</h3>${grid(AMMO_KEYS.map(a => [AMMO[a].icon, `${AMMO[a].name} (${AMMO[a].count === Infinity ? '∞' : AMMO[a].count}×)`, AMMO[a].desc]))}
  <h3>Besucher – abschiessbar, mit Belohnung</h3>${grid(EVENTS.filter(e => e.visitor).map(e => [e.icon, e.name, e.desc]))}
  <h3>Ereignisse</h3>${grid(EVENTS.filter(e => !e.visitor).map(e => [e.icon, e.name + (e.need ? ' (nur Söldner)' : ''), e.desc]))}
  <h3>Truppen</h3>${grid(Object.values(TROOPS).map(T => [T.icon, T.name + (T.cost ? ` – ${T.cost} 💰` : ''), `${T.desc} (${T.hp} LP)`]))}`;
}

function drawPreview(el) {
  const m = MAPS[el.dataset.prev], g = el.getContext('2d'), w = el.width, h = el.height, sx = w / COLS, sy = h / ROWS;
  if (!m.top) {
    const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#5b6fb5'); gr.addColorStop(.5, '#2fa6e6'); gr.addColorStop(1, '#e98e4f');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.font = '42px "Segoe UI Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('❓', w / 2, h / 2 + 2);
    return;
  }
  const T = THEMES[m.theme], tp = c => m.top(c <= 29 ? c : COLS - 1 - c);
  const sky = g.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, T.sky[0]); sky.addColorStop(1, T.sky[2]);
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  [0, 1].forEach(side => {
    const z = ZONES[side];
    [3, 9, 15].forEach((i, n) => {
      const c = side ? z.c0 + i : z.c1 - i, t = tp(c), hh = [5, 7, 9][n];
      g.fillStyle = '#9ea4ac'; g.fillRect((c - 1) * sx, (t - hh) * sy, sx * 3, hh * sy);
      g.fillStyle = TEAM[side]; g.fillRect(c * sx, (t - hh - 2) * sy, sx, 2 * sy);
    });
  });
  for (let c = 0; c < COLS; c++) {
    const t = tp(c);
    g.fillStyle = T.dirt[0]; g.fillRect(c * sx, t * sy, sx + .6, h);
    g.fillStyle = m.snow && t < m.snow ? T.snow[0] : T.grass[0]; g.fillRect(c * sx, t * sy, sx + .6, sy * .7);
    if (m.water && t > m.water) { g.fillStyle = 'rgba(40,120,200,.65)'; g.fillRect(c * sx, m.water * sy, sx + .6, (t - m.water) * sy); }
  }
}

// ---------- Spielstart ----------
function startGame() {
  TEAM_NAME[0] = npcOn() ? 'Du' : 'Spieler 1';
  TEAM_NAME[1] = npcOn() ? '🤖 Computer' : 'Spieler 2';
  newGame(); startBuild(0);
}

function startBuild(p) {
  hideOverlay();
  S.phase = 'build'; S.builder = p; S.tool = 'stone';
  bar.style.setProperty('--accent', TEAM[p]);
  bannerMsg(`${TEAM_NAME[p]} baut!`, TEAM[p]);
  renderTop(); renderBuildBar();
}

function buildOk(p) { return tools().filter(t => MATS[t].unit).every(t => countType(p, t) === need(t)); }

function finishBuild() {
  if (!buildOk(S.builder)) return;
  sfx('place');
  if (NET.on) { netFinishBuild(); return; }
  if (S.builder === 0 && npcOn()) randomBuild(1, true);   // der Computer baut seine Burg selbst
  if (S.builder === 0 && !npcOn()) {
    S.phase = 'handover'; renderTop(); bar.innerHTML = '';
    overlay(`<div class="big">🙈</div><h2 style="color:${TEAM[1]}">Spieler 2 ist dran!</h2>
      <p><b>Spieler 1: Nicht hinschauen!</b><br>Spieler 2 baut jetzt sein Schloss – das Schloss von Spieler 1 bleibt verdeckt.</p>
      <div class="btnrow"><button class="btn primary" data-act="build2">Ich bin Spieler 2 – los!</button></div>`);
  } else {
    S.phase = 'handover'; renderTop(); bar.innerHTML = '';
    S.turn = RNG() < .5 ? 0 : 1;
    overlay(`<div class="big">🪙</div><h2>Beide Schlösser stehen!</h2>
      <p>Der Münzwurf hat entschieden:<br><b style="color:${TEAM[S.turn]};font-size:22px">${TEAM_NAME[S.turn]} beginnt.</b></p>
      <div class="btnrow"><button class="btn primary" data-act="battle">Zur Schlacht! ⚔️</button></div>`);
  }
}

function startBattle() {
  hideOverlay();
  settleInstant();
  S.phase = 'battle'; S.rounds = 1; S.starter = S.turn;
  newWind();
  beginTurn();
}

function newWind() {
  S.wind = rand(-WINDMAX, WINDMAX);
  if (Math.abs(S.wind) < WINDMAX * .1) S.wind = 0;
  if (S.mod.windMul > 1) S.wind = (S.wind < 0 ? -1 : 1) * Math.max(Math.abs(S.wind), WINDMAX * .5) * S.mod.windMul;
}

function cats(p) {
  const list = [];
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) { const k = S.g[r][c]; if (k && k.o === p && k.t === 'catapult') list.push(k); }
  return list;
}
// Nachladen: Ein Katapult mit cool > 0 darf nicht schiessen – ausser alle anderen laden auch
function catReady(k) { return !CFG.reload || !(k.cool > 0) || cats(k.o).every(c => c.cool > 0); }
function selectFirst() {
  let l = cats(S.turn);
  const ready = l.filter(catReady);
  if (ready.length) l = ready;
  if (!S.sel || S.sel.o !== S.turn || !l.includes(S.sel)) S.sel = (S.turn === 1 ? l[l.length - 1] : l[0]) || null;
}
function cycleCat() {
  const l = cats(S.turn).filter(catReady); if (!l.length) return;
  S.sel = l[(l.indexOf(S.sel) + 1) % l.length]; sfx('tick'); renderBattleBar();
}

function fire() {
  const pos = S.sel && findCell(S.sel);
  if (!pos || !S.aim) { S.aim = null; return false; }
  const P = S.players[S.turn];
  const dx = S.aim.sx - S.aim.cx, dy = S.aim.sy - S.aim.cy;
  if (Math.hypot(dx, dy) < 14) { S.aim = null; return false; }
  if (ammoCount(S.turn, P.cur) <= 0) P.cur = 'stone';
  const v = launchVel(dx, dy, P.cur);
  const o = catOrigin(pos);
  S.proj.push(mkProj(P.cur, o.x, o.y, v.vx, v.vy, S.turn, pos.r * COLS + pos.c));
  if (P.ammo[P.cur] > 0) { if (P.ammo[P.cur] !== Infinity) P.ammo[P.cur]--; }
  else if (P.cur === 'bomb') useBarrel(S.turn);
  if (ammoCount(S.turn, P.cur) <= 0) P.cur = 'stone';
  if (CFG.reload) S.sel.cool = 2;
  S.sel.anim = 20; S.aim = null; S.bs = 'flying'; S.after = 'endTurn'; S.shots[S.turn]++;
  S.shotsLeft--; S.scoring = true; S.score = 0;
  sfx('launch');
  renderBattleBar();
  return true;
}

// Bomben = Grundvorrat + noch stehende Pulverfässer
function ammoCount(p, a) {
  let n = S.players[p].ammo[a];
  if (a === 'bomb') n += countType(p, 'tnt');
  return n;
}
// Ein Pulverfass wird für eine Bombe "verbraucht" (das oberste zuerst)
function useBarrel(p) {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const k = S.g[r][c];
    if (k && k.o === p && k.t === 'tnt') {
      S.g[r][c] = null; puff(c * CS + 12, r * CS + 12, 6, '#ddd');
      popup(c * CS + 12, r * CS, '+💣', '#fff', 16);
      return;
    }
  }
}

// ---------- Zugablauf ----------
// Schuss fertig -> (Bonus) -> evtl. nochmal schiessen -> Gegner -> evtl. neue Runde mit Ereignissen -> beginTurn
function endTurn() {
  renderTop();
  if (checkWin()) return;
  comboBonus();
  if (S.shotsLeft > 0) { startAim(true); return; }
  S.turn = 1 - S.turn;
  if (S.turn === S.starter) { S.rounds++; roundStart(); }
  newWind();
  bar.style.setProperty('--accent', TEAM[S.turn]);
  if (S.bs !== 'event') beginTurn();
  else { renderTop(); renderBattleBar(); }
}

function comboBonus() {
  if (!S.scoring) return;
  S.scoring = false;
  if (!CFG.combo || S.score < 8) return;
  const a = pick(SPECIAL); S.players[S.turn].ammo[a]++;
  popup(W / 2, 210, `🎯 VOLLTREFFER! +1 ${AMMO[a].icon} ${AMMO[a].name}`, '#ffb347', 32); sfx('reward');
}

function beginTurn() {
  if (S.phase !== 'battle') return;
  S.shotsLeft = S.mod.frenzy ? 2 : 1; S.bought = false;
  bar.style.setProperty('--accent', TEAM[S.turn]);
  cats(S.turn).forEach(k => { if (k.cool > 0) k.cool--; });
  for (const t of S.troops) if (t.o === S.turn && t.life-- <= 0) {
    t.dead = true; puff(t.x, t.y - 10, 8, '#ddd');
    popup(t.x, t.y - 34, t.type === 'rebel' ? 'geht heim 🏠' : 'Sold aufgebraucht – zieht ab', '#ddd', 13);
  }
  S.troops = S.troops.filter(t => !t.dead);
  const revolt = CFG.revolt && maybeRevolt(S.turn);
  if (S.troops.some(t => t.o === S.turn)) {
    S.bs = 'troops'; S.tt = 0;
    if (!revolt) bannerMsg(`⚔️ Truppen von ${TEAM_NAME[S.turn]}!`, TEAM[S.turn]);
    renderTop(); renderBattleBar();
    return;
  }
  startAim();
}

function startAim(again) {
  const P = S.players[S.turn];
  if (ammoCount(S.turn, P.cur) <= 0) P.cur = 'stone';
  if (NET.lock) { S.sel = null; NET.pendingFire = false; NET.ra = null; }   // online: auf beiden PCs gleiche Startauswahl
  selectFirst(); S.bs = 'aim'; S.aim = null; S.npc = null;
  S.tLeft = CFG.timer * 60;
  bar.style.setProperty('--accent', TEAM[S.turn]);
  const mine = NET.on && S.turn === NET.side;
  bannerMsg(again ? `⚔️ ${mine ? 'Du' : TEAM_NAME[S.turn]}: Noch ein Schuss!` : mine ? 'Du bist dran!' : `${TEAM_NAME[S.turn]} ist dran!`, TEAM[S.turn]);
  renderTop(); renderBattleBar();
}

function afterTroops() { renderTop(); if (checkWin()) return; startAim(); }

function skipTurn() {
  S.aim = null; S.shotsLeft = 0; S.scoring = false;
  popup(W / 2, 220, '⏱️ Zeit abgelaufen!', '#ff8a80', 32); sfx('error');
  S.bs = 'flying'; S.after = 'endTurn'; renderBattleBar();
}

// ---------- Wut & Volksaufstand ----------
function addRage(p, n) {
  const P = S.players[p]; if (!P || !(n > 0)) return;
  P.rage = Math.min(100, P.rage + n);
}
function maybeRevolt(p) {
  const P = S.players[p];
  if (P.rage < 50 || S.troops.some(t => t.o === p && t.type === 'rebel')) return false; // erst wenn der letzte Aufstand vorbei ist
  if (RNG() > .12 + (P.rage - 50) / 50 * .5) return false;   // 12 % bei 50 Wut … 62 % bei 100 Wut
  P.rage = 15;
  const homes = []; each((k, r, c) => { if (k.o === p && (k.t === 'human' || k.t === 'king')) homes.push(c); });
  for (let i = 0; i < 3; i++) spawnTroop(p, 'rebel', i, homes.length ? homes[i % homes.length] : null);
  bannerMsg(`😡 VOLKSAUFSTAND!`, TEAM[p]); sfx('horn'); S.shake = Math.max(S.shake, 6);
  popup(frontCol(p) * CS + 12, 250, `Das Volk von ${TEAM_NAME[p]} greift an!`, TEAM[p], 22);
  return true;
}

// ---------- Truppen ----------
function frontCol(p) { return p === 0 ? ZONES[0].c1 + 1 : ZONES[1].c0 - 1; }
function ownTroops(p) { return S.troops.filter(t => t.o === p && t.type !== 'rebel').length; }

function spawnTroop(p, type, i = 0, col = null) {
  const T = TROOPS[type], dir = p === 0 ? 1 : -1;
  if (col == null) col = frontCol(p);
  const x = Math.max(4, Math.min(W - 4, col * CS + 12 - dir * i * 9)), c = Math.floor(x / CS), fr = topRow(c);
  const t = {id: ++uid, o: p, type, dir, x, fr, y: fr * CS - 30, hp: T.hp, max: T.hp, cd: 10 + i * 8, life: T.life, anim: rand(0, 50), swing: 0, moving: false, hitT: 0, dead: false};
  S.troops.push(t);
  puff(x, fr * CS - 12, 6, '#ddd');
  return t;
}

// Schwerkraft & Zerquetschen. true = steht fest auf dem Boden
function groundTroop(t) {
  const col = Math.max(0, Math.min(COLS - 1, Math.floor(t.x / CS)));
  if (t.fr > 0 && t.fr <= ROWS && S.g[t.fr - 1][col]) {
    hurtTroop(t, 10); t.fr = topRow(col);
    if (!t.dead) popup(t.x, t.y - 34, 'Aua!', '#fff', 13);
  }
  let r = t.fr; while (r < ROWS && !S.g[r][col]) r++; t.fr = r;
  const gy = t.fr * CS, d = gy - t.y;
  if (Math.abs(d) <= 2) { t.y = gy; return true; }
  t.y += d > 0 ? Math.min(d, 6) : Math.max(d, -2.2);
  return false;
}

function troopTick(t) {
  const T = TROOPS[t.type];
  if (t.swing > 0) t.swing--;
  t.moving = false;
  if (!groundTroop(t) || t.dead) return;
  if (t.cd > 0) t.cd--;
  const col = Math.max(0, Math.min(COLS - 1, Math.floor(t.x / CS)));
  // Feindliche Soldaten direkt vor uns -> Nahkampf
  const foe = S.troops.find(o => !o.dead && o.o !== t.o && (o.x - t.x) * t.dir > -6 && (o.x - t.x) * t.dir < 20 && Math.abs(o.y - t.y) < 24);
  if (foe) {
    if (t.type === 'sapper') { sapperBlow(t); return; }
    if (t.cd <= 0) { hurtTroop(foe, T.dmg); t.cd = T.cd; t.swing = 12; sfx('chop'); }
    return;
  }
  if (t.type === 'archer') { const tg = archerTarget(t); if (tg) { if (t.cd <= 0) shootArrow(t, tg); return; } }
  const nc = Math.floor((t.x + t.dir * 11) / CS), body = t.fr - 1;
  if (nc < 0 || nc >= COLS) return;
  if (nc !== col) {
    // Gegnerischer Block auf Körper- oder Kopfhöhe -> angreifen
    let tr = -1;
    for (const rr of [body, body - 1]) { const k = rr >= 0 && S.g[rr][nc]; if (k && k.t !== 'dirt' && k.o !== t.o) { tr = rr; break; } }
    if (tr >= 0) {
      if (t.type === 'sapper') { sapperBlow(t); return; }
      if (t.cd <= 0) {
        damageCell(tr, nc, T.dmg, t.type === 'ram' ? 'ram' : 'troop');
        if (t.type === 'rebel' && RNG() < .25) ignite(tr, nc);
        t.cd = T.cd; t.swing = 12;
        if (t.type === 'ram') { sfx('hit'); S.shake = Math.max(S.shake, 4); debris(nc * CS + 12, tr * CS + 12, '#bbb', 4); } else sfx('chop');
      }
      return;
    }
    // Erde oder eigene Blöcke im Weg -> hochklettern
    if (body >= 0 && S.g[body][nc]) { t.x = nc * CS + (t.dir > 0 ? 2 : CS - 2); t.fr = topRow(nc); return; }
  }
  const wet = S.waterY < t.y - 8;
  t.x += t.dir * T.speed * (wet ? .55 : 1); t.moving = true; t.anim++;
}

function hurtTroop(t, dmg) {
  if (t.dead) return;
  dmg = Math.round(dmg); if (dmg <= 0) return;
  t.hp -= dmg; t.hitT = 10;
  popup(t.x, t.y - 32, '-' + dmg, '#ffd0d0', 13);
  if (t.hp > 0) return;
  t.dead = true;
  debris(t.x, t.y - 12, t.type === 'ram' ? '#8b5a2b' : TEAM[t.o], 8); sfx('scream');
  popup(t.x, t.y - 44, '☠', '#fff', 22);
  if (CFG.merc && S.phase === 'battle') { S.players[1 - t.o].credits += 12; popup(t.x + 14, t.y - 22, '+12💰', '#f5c542', 12); }
  if (t.type === 'sapper') S.pending.push({x: t.x, y: t.y - 12, t: 5}); // sein Fass geht hoch!
}

function projHitTroop(p, t) {
  p.dead = true;
  if (p.type === 'bomb' || p.type === 'meteor') { explode(p.x, p.y, p.type === 'bomb' ? 3.2 : 2.2, p.type === 'bomb' ? 90 : 65, 'bomb'); return; }
  hurtTroop(t, VDMG[p.type] || 40);
  puff(p.x, p.y, 5, '#ddd'); sfx('hit');
  if (p.type === 'cow') { sfx('moo'); popup(p.x, p.y - 20, 'MUUUH!', '#fff', 20); }
}

function sapperBlow(t) {
  t.dead = true; t.hp = 0;
  popup(t.x, t.y - 40, 'BUMM!', '#ffb347', 24);

function archerTarget(t) {
  const col = Math.floor(t.x / CS);
  let near = null;
  for (let i = 1; i <= TROOPS.archer.range && near == null; i++) {
    const c = col + t.dir * i; if (c < 0 || c >= COLS) break;
    for (let r = 0; r < ROWS; r++) { const k = S.g[r][c]; if (k && k.t !== 'dirt' && k.o !== t.o) { near = c; break; } }
  }
  if (near == null) return null;
  const units = []; each((k, r, c) => { if (k.o === 1 - t.o && MATS[k.t].unit && Math.abs(c - col) <= 16) units.push({r, c}); });
  const tg = units.length && RNG() < .7 ? pick(units) : {r: topRow(near), c: near};
  return {x: tg.c * CS + 12, y: tg.r * CS + 12};
}

function shootArrow(t, tg) {
  const x0 = t.x + t.dir * 6, y0 = t.y - 18;
  const T = Math.max(26, Math.abs(tg.x - x0) / 7);
  const v = aimAt(x0, y0, tg.x + rand(-8, 8), tg.y + rand(-6, 6), T);
  const p = mkProj('arrow', x0, y0, v.vx, v.vy, t.o); p.noWind = true; S.proj.push(p);
  t.cd = TROOPS.archer.cd; t.swing = 12; sfx('arrow');
}

function buyTroop(type) {
  const P = S.players[S.turn], T = TROOPS[type];
  if (S.phase !== 'battle' || S.bs !== 'aim' || S.bought || P.credits < T.cost || ownTroops(S.turn) >= MAX_TROOPS) { sfx('error'); return; }
  P.credits -= T.cost; S.bought = true;
  const t = spawnTroop(S.turn, type);
  popup(t.x, t.y - 20, `${T.icon} ${T.name} angeheuert!`, TEAM[S.turn], 16); sfx('horn');
  renderTop(); renderBattleBar();
}

// ---------- Besucher (abschiessbare Ereignisse) ----------
function spawnVisitor(def) {
  const from = RNG() < .5 ? -1 : 1;
  const v = {def, id: ++uid, hp: def.hp, max: def.hp, rounds: def.rounds, t: 0, from, x: from < 0 ? -160 : W + 160, y: 110,
             px: 0, py: 0, hold: null, holdY: null, hitT: 0, leaving: false, gone: false, face: -from, loot: null};
  def.spawn && def.spawn(v);
  v.px = v.x; v.py = v.y;
  S.vis.push(v);
  return v;
}
function visitorHit(v, x, y) { return v.def.hit ? v.def.hit(v, x, y) : Math.hypot(x - v.px, y - v.py) < v.def.r; }

function updateVisitors() {
  for (const v of S.vis) {
    v.t++; if (v.hitT > 0) v.hitT--;
    const ox = v.px;
    if (v.leaving) {
      const ex = v.from < 0 ? -320 : W + 320;
      v.px += (ex - v.px) * .015 + Math.sign(ex - v.px) * 2.5;
      if (v.def.flood) v.py = S.waterY - 14; else v.py += (-40 - v.py) * .008;
      if (v.px < -280 || v.px > W + 280) v.gone = true;
    } else v.def.idle(v);
    if (Math.abs(v.px - ox) > .3) v.face = v.px > ox ? 1 : -1;
  }
  S.vis = S.vis.filter(v => !v.gone);
}

function hitVisitor(v, p) {
  p.dead = true;
  const imm = v.def.immune && v.def.immune.includes(p.type);
  const dmg = imm ? 0 : (VDMG[p.type] || 40);
  if (p.type === 'bomb') boomFx(p.x, p.y, 2); else puff(p.x, p.y, 7, '#eee');
  sfx(p.type === 'bomb' ? 'boom' : 'hit'); S.shake = Math.max(S.shake, 5);
  if (!dmg) { popup(p.x, p.y - 16, 'immun!', '#a8c7ff', 20); return; }
  v.hp -= dmg; v.hitT = 14;
  popup(p.x, p.y - 16, '-' + dmg, '#ffb347', 20);
  if (v.hp <= 0) killVisitor(v, p.owner);
}

function killVisitor(v, owner) {
  v.gone = true; S.vis = S.vis.filter(x => x !== v);
  boomFx(v.px, v.py, 2.5); debris(v.px, v.py, '#ddd', 16); S.shake = Math.max(S.shake, 12);
  const txt = grantLoot(owner, v);
  popup(v.px, v.py - 44, `${v.def.icon} besiegt!`, TEAM[owner], 26);
  popup(v.px, v.py - 14, txt, '#ffe066', 20);
  bannerMsg(`🏆 ${v.def.lootName}!`, TEAM[owner]);
  sfx('reward');
  if (v.def.onKill) v.def.onKill(v, owner);
  if (v.def.flood) S.mod.water = 0;
}

function lootOf(v) { return v.loot || v.def.loot || {}; }
function grantLoot(owner, v) {
  const P = S.players[owner], L = lootOf(v), parts = [];
  for (const a in L) if (L[a] > 0) { P.ammo[a] += L[a]; parts.push(`+${L[a]}${AMMO[a].icon}`); }
  if (CFG.merc && v.def.bounty) { P.credits += v.def.bounty; parts.push(`+${v.def.bounty}💰`); }
  if (v.def.extra) parts.push(v.def.extra);
  renderTop();
  return parts.join(' ') || 'Ruhm & Ehre';
}
function lootLabel(v) {
  const L = lootOf(v), s = Object.keys(L).filter(a => L[a] > 0).map(a => (L[a] > 1 ? L[a] + '×' : '') + AMMO[a].icon).join(' ');
  return '🎁 ' + (s || (v.def.id === 'magpie' ? 'Diebesgut' : '?')) + (v.def.extra ? ' ' + v.def.extra : '') + (CFG.merc && v.def.bounty ? ` +${v.def.bounty}💰` : '');
}

function repairSide(p, n, heal = 0) {
  const l = []; each((k, r, c) => { if (k.o === p && k.t !== 'dirt' && !MATS[k.t].unit && k.hp < k.max) l.push({k, r, c}); });
  l.sort((a, b) => a.k.hp / a.k.max - b.k.hp / b.k.max).slice(0, n).forEach(({k, r, c}) => { k.hp = k.max; k.hit = 8; popup(c * CS + 12, r * CS, '🔧', '#8bf0a0', 14); });
  if (heal) each((k, r, c) => { if (k.o === p && MATS[k.t].unit && k.hp < k.max) { k.hp = Math.min(k.max, k.hp + heal); popup(c * CS + 12, r * CS - 6, '+' + heal, '#8bf0a0', 13); } });
}

function abduct(c) {
  const t = topOf(c);
  if (!t || t.k.t === 'dirt') return;
  if (MATS[t.k.t].unit) { damageCell(t.r, t.c, 45, 'ufo'); popup(t.c * CS + 12, t.r * CS - 14, 'ZAP!', '#7dff7a', 20); return; }
  S.g[t.r][t.c] = null;
  S.parts.push({type: 'cell', k: t.k, x: t.c * CS + 12, y: t.r * CS + 12, vx: 0, vy: -1, g: -.06, life: 70, max: 70});
  popup(t.c * CS + 12, t.r * CS - 14, '👽 entführt!', '#7dff7a', 16);
  if (CFG.revolt) addRage(t.k.o, 3);
}

// Stelle für das Piratenschiff: möglichst mittig, wo das Wasser tief genug ist
function shipSpot() {
  const wr = waterRow();
  for (let d = 0; d < 10; d++) for (const c of [29 - d, 30 + d]) if (S.top[c] >= wr + 1) return c * CS + 12 + (c < 30 ? 12 : -12);
  return W / 2;
}

// ============================================================
//  ZUFALLSEREIGNISSE  (treffen immer beide Seiten gleich – fair!)
// ============================================================
function zoneCols(side) { const z = ZONES[side], a = []; for (let c = z.c0; c <= z.c1; c++) a.push(c); return a; }
function topOf(c) { for (let r = 0; r < ROWS; r++) { const k = S.g[r][c]; if (k) return {r, c, k}; } return null; }
function randomTop(side) {
  const built = zoneCols(side).map(topOf).filter(t => t && t.k.t !== 'dirt');
  return built.length ? pick(built) : topOf(pick(zoneCols(side)));
}
function tallest(side) {
  let best = null;
  zoneCols(side).forEach(c => { const t = topOf(c); if (t && (!best || t.r < best.r)) best = t; });
  return best;
}
// Startgeschwindigkeit, um in T Frames von (x0,y0) nach (x1,y1) zu fliegen (ohne Wind)
function aimAt(x0, y0, x1, y1, T) {
  const g = G * S.mod.grav;
  return {vx: (x1 - x0) / T, vy: (y1 - y0 - g * T * (T + 1) / 2) / T};
}
function sideOrder(n) { const s = RNG() < .5 ? [0, 1] : [1, 0]; const a = []; for (let i = 0; i < n * 2; i++) a.push(s[i % 2]); return a; }
function eventProj(type, x, y, vx, vy) { const p = mkProj(type, x, y, vx, vy, -1); p.noWind = true; S.proj.push(p); return p; }
function waitThen(e, n) { e.w = (e.w || 0) + 1; if (e.w > n) e.finished = true; }
function emo(ch, x, y, size, flip) {
  ctx.save(); ctx.translate(x, y); if (flip) ctx.scale(-1, 1);
  ctx.font = `${size}px "Segoe UI Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ch, 0, 0); ctx.restore();
}
