//  SOUND (synthetisch, keine Dateien)
// ============================================================
let actx = null, muted = false;
function ac() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
  return actx;
}
function tone(fr, dur, type = 'square', vol = .1, slide = 0, delay = 0) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(fr, t);
  if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, fr + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, ff) {
  const a = ac(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = a.createBufferSource(); s.buffer = b;
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = ff;
  const g = a.createGain(); g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
function moo() {
  const a = ac(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(150, t); o.frequency.linearRampToValueAtTime(175, t + .2); o.frequency.linearRampToValueAtTime(110, t + .8);
  f.type = 'lowpass'; f.frequency.value = 700;
  g.gain.setValueAtTime(.001, t); g.gain.linearRampToValueAtTime(.25, t + .1); g.gain.linearRampToValueAtTime(.001, t + .85);
  o.connect(f).connect(g).connect(a.destination); o.start(t); o.stop(t + .9);
}
let lastSfx = {};
function sfx(n) {
  if (muted) return;
  const now = performance.now();
  if (lastSfx[n] && now - lastSfx[n] < 40) return;
  lastSfx[n] = now;
  try {
    switch (n) {
      case 'place': tone(520, .05, 'square', .05); break;
      case 'remove': tone(240, .07, 'square', .05); break;
      case 'tick': tone(800, .03, 'square', .03); break;
      case 'error': tone(160, .15, 'square', .06); break;
      case 'launch': noise(.3, .3, 1200); tone(220, .2, 'triangle', .08, -120); break;
      case 'hit': noise(.15, .35, 600); break;
      case 'boom': noise(.9, .6, 350); tone(70, .6, 'sine', .4, -40); break;
      case 'fire': noise(.5, .15, 2000); break;
      case 'drill': tone(140, .09, 'sawtooth', .07, 40); break;
      case 'pop': tone(600, .08, 'square', .06, 300); break;
      case 'moo': moo(); break;
      case 'death': tone(330, .5, 'square', .08, -250); break;
      case 'scream': tone(900, .35, 'sawtooth', .05, -550); break;
      case 'ufo': tone(300, 1.2, 'sine', .08, 600); tone(900, 1.2, 'sine', .04, -500); break;
      case 'beam': tone(1200, .6, 'sine', .05, -900); break;
      case 'splash': noise(1.4, .3, 900); break;
      case 'rain': noise(1.6, .18, 3000); break;
      case 'roar': tone(110, .9, 'sawtooth', .12, -50); noise(.9, .2, 400); break;
      case 'thunder': noise(1.4, .6, 250); tone(50, 1, 'sine', .4, -20); break;
      case 'win': [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, 'square', .07, 0, i * .14)); break;
      case 'coin': tone(988, .06, 'square', .035); tone(1319, .12, 'square', .035, 0, .06); break;
      case 'horn': tone(196, .7, 'sawtooth', .08); tone(294, .6, 'sawtooth', .06, 0, .3); break;
      case 'reward': [659, 784, 988, 1319].forEach((f, i) => tone(f, .15, 'triangle', .08, 0, i * .07)); break;
      case 'chop': tone(320, .05, 'square', .05, -160); noise(.06, .2, 1800); break;
      case 'magic': tone(700, .6, 'sine', .06, 800); tone(1100, .6, 'sine', .04, -500, .1); break;
      case 'swoosh': noise(1.1, .22, 700); break;
      case 'squawk': tone(1500, .12, 'sawtooth', .05, -700); tone(1350, .1, 'sawtooth', .04, -600, .16); break;
      case 'arrow': tone(1900, .07, 'triangle', .04, -1300); break;
      case 'rumble': noise(1.6, .5, 160); tone(45, 1.2, 'sine', .3, -10); break;
      case 'plop': tone(500, .08, 'sine', .07, -300); noise(.15, .12, 1200); break;
    }
  } catch (e) {}
}

// ============================================================
//  UPDATE
// ============================================================
const clouds = Array.from({length: 7}, () => ({x: vrand(0, W), y: vrand(30, 220), s: vrand(.6, 1.4)}));

function update() {
  S.time++;
  S.shake = S.shake > .3 ? S.shake * .88 : 0;
  for (const cl of clouds) { cl.x += .15 + S.wind * 40 * cl.s; if (cl.x > W + 120) cl.x = -120; if (cl.x < -120) cl.x = W + 120; }

  for (const p of S.parts) { p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life--; }
  S.parts = S.parts.filter(p => p.life > 0);
  for (const p of S.pops) { p.y -= .6; p.life--; }
  S.pops = S.pops.filter(p => p.life > 0);
  if (S.banner && --S.banner.life <= 0) S.banner = null;

  const smoke = S.time % 6 === 0;
  each((k, r, c) => {
    if (k.hit > 0) k.hit--;
    if (k.anim > 0) k.anim--;
    if (smoke && k.burn > 0 && RNG() < .5) puff(c * CS + 12, r * CS + 2, 1, '#555');
  });

  S.waterY += (waterRow() * CS - S.waterY) * .03;
  if (S.flash > 0) S.flash--;
  if (S.mod.rain) for (let i = 0; i < 4; i++) S.parts.push({type: 'rain', x: rand(-100, W + 100), y: -10, vx: S.wind * 400, vy: 14, g: 0, life: 60, max: 60});

  if (S.phase !== 'battle') return;
  if (S.time % 10 === 0) renderTop();

  updateVisitors();
  for (const t of S.troops) { if (t.hitT > 0) t.hitT--; if (!(S.bs === 'troops' && t.o === S.turn)) groundTroop(t); }

  if (S.bs === 'event' && S.ev) {
    const e = S.ev;
    // Erst kurz das Banner zeigen, dann läuft das Ereignis in halbem Tempo ab
    e.pre = (e.pre || 0) + 1;
    if (e.pre > 70 && S.time % 2 === 0) { e.t++; e.def.tick && e.def.tick(e); }
    if (e.finished || e.t > 1200) { if (!nextRun()) { S.bs = 'flying'; S.after = 'event'; renderBattleBar(); } }
  }
  if (S.bs === 'troops') {
    S.tt++;
    for (const t of S.troops) if (t.o === S.turn && !t.dead) troopTick(t);
    if (S.tt > 200 || !S.troops.some(t => t.o === S.turn && !t.dead)) { S.bs = 'flying'; S.after = 'aim'; renderBattleBar(); }
  }
  S.troops = S.troops.filter(t => !t.dead);
  if (S.bs === 'aim' && isNpcTurn()) { if (!ov.classList.contains('show')) npcTick(); }
  else if (S.bs === 'aim' && CFG.timer && (NET.lock || !ov.classList.contains('show')) && --S.tLeft <= 0) { if (NET.lock) skipTurn(); else if (!(S.aim && fire())) skipTurn(); }

  for (const p of S.proj.slice()) {
    if (p.dead) continue;
    if (p.type === 'cluster' && p.vy > 0) { splitCluster(p); continue; }
    stepProjectile(p);
    p.rot += .15;
    p.trail.push({x: p.x, y: p.y}); if (p.trail.length > 18) p.trail.shift();
    if ((p.type === 'fire' || p.type === 'meteor') && S.time % 2 === 0) S.parts.push({type: 'spark', x: p.x, y: p.y, vx: rand(-.5, .5), vy: rand(-1, 0), g: -.02, life: 22, max: 22, col: RNG() < .5 ? '#ff6a00' : '#ffd000', size: rand(3, 6)});
    if (p.type === 'bomb' && S.time % 3 === 0) S.parts.push({type: 'spark', x: p.x, y: p.y - 8, vx: rand(-.5, .5), vy: rand(-1, 0), g: 0, life: 10, max: 10, col: '#ffd000', size: 2});
  }
  S.proj = S.proj.filter(p => !p.dead);

  for (const ex of S.pending.slice()) if (--ex.t <= 0) { ex.done = true; explode(ex.x, ex.y, 3, 85, 'tnt'); }
  S.pending = S.pending.filter(e => !e.done);

  if (S.bs === 'flying' && !S.proj.length && !S.pending.length) { S.bs = 'resolve'; S.rs = 0; S.rt = 0; renderBattleBar(); }
  if (S.bs === 'resolve') {
    S.rt++;
    if (S.pending.length) return;
    if (S.rs === 0 || S.rs === 2) {
      if (S.rt % 3 === 0 && !settleStep(true)) { S.rs++; S.rt = 0; }
    } else if (S.rs === 1) {
      S.rs = 2; S.rt = 0;
      if (S.after === 'endTurn' && fireTick()) S.rt = -25; // kurz warten, damit man das Feuer sieht
    } else if (S.rs === 3 && S.rt > 30) {
      const a = S.after; S.after = null;
      if (a === 'event') finishEvent(); else if (a === 'aim') afterTroops(); else endTurn();
    }
  }
}

// ============================================================
//  ZEICHNEN
// ============================================================
const bg = document.createElement('canvas');
bg.width = W * DPR; bg.height = H * DPR;
function hash(a, b) { let h = a * 374761393 + b * 668265263; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967295; }

function renderBackground() {
  const b = bg.getContext('2d'), M = S.map, T = THEMES[M.theme];
  b.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sky = b.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, T.sky[0]); sky.addColorStop(.6, T.sky[1]); sky.addColorStop(1, T.sky[2]);
  b.fillStyle = sky; b.fillRect(0, 0, W, H);
  // Sonne
  const sg = b.createRadialGradient(1250, 90, 10, 1250, 90, 90);
  sg.addColorStop(0, '#fff6c0'); sg.addColorStop(.35, '#ffe48a'); sg.addColorStop(1, 'rgba(255,228,138,0)');
  b.fillStyle = sg; b.beginPath(); b.arc(1250, 90, 90, 0, 7); b.fill();
  // Berge im Hintergrund
  b.fillStyle = T.far;
  b.beginPath(); b.moveTo(0, GROUND * CS);
  for (let x = 0; x <= W; x += 40) b.lineTo(x, GROUND * CS - 140 - Math.sin(x / 170) * 70 - Math.sin(x / 63) * 25);
  b.lineTo(W, GROUND * CS); b.fill();
  b.fillStyle = T.near;
  b.beginPath(); b.moveTo(0, GROUND * CS);
  for (let x = 0; x <= W; x += 30) b.lineTo(x, GROUND * CS - 60 - Math.sin(x / 110 + 1) * 30);
  b.lineTo(W, GROUND * CS); b.fill();
  // Erde
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!S.g[r][c] || S.g[r][c].t !== 'dirt') continue;
    const x = c * CS, y = r * CS, top = S.top[c];
    b.fillStyle = r > top + 1 ? T.dirt[1] : T.dirt[0]; b.fillRect(x, y, CS, CS);
    for (let i = 0; i < 4; i++) { b.fillStyle = hash(r * 7 + i, c) > .5 ? T.dirt[2] : T.dirt[3]; b.fillRect(x + hash(r, c * 3 + i) * 20, y + hash(r * 5 + i, c) * 20, 3, 3); }
    if (r === top) {
      const gr = M.snow && r < M.snow ? T.snow : T.grass;
      b.fillStyle = gr[0]; b.fillRect(x, y, CS, 6);
      b.fillStyle = gr[1]; for (let i = 0; i < 4; i++) b.fillRect(x + i * 6 + 2, y + 6, 2, 3);
      b.fillStyle = gr[2]; b.fillRect(x, y, CS, 2);
    }
  }
  // Deko in der Mitte (nicht in den Bauzonen)
  for (const c of [21, 24, 27, 32, 35, 38]) {
    const t = S.top[c];
    if (M.water && t >= M.water) continue;
    drawDeco(b, M.deco, c * CS + 12 + (hash(c, 9) - .5) * 10, t * CS + 2, hash(c, 4), M.snow && t < M.snow);
  }
}

function drawDeco(b, type, x, y, h, snow) {
  const circB = (cx, cy, r) => { b.beginPath(); b.arc(cx, cy, r, 0, Math.PI * 2); b.fill(); };
  switch (type) {
    case 'tree': {
      const s = .8 + h * .5;
      b.fillStyle = '#6e4520'; b.fillRect(x - 2, y - 14 * s, 4, 14 * s);
      b.fillStyle = '#2f7d32'; circB(x, y - 20 * s, 11 * s);
      b.fillStyle = '#43a047'; circB(x - 3 * s, y - 23 * s, 7 * s);
      break;
    }
    case 'pine': {
      const s = .8 + h * .6;
      b.fillStyle = '#5a3d23'; b.fillRect(x - 2, y - 8 * s, 4, 8 * s);
      for (let i = 0; i < 3; i++) {
        const yy = y - 6 * s - i * 8 * s, w = (12 - i * 3) * s;
        b.fillStyle = '#245b3a'; b.beginPath(); b.moveTo(x - w, yy); b.lineTo(x, yy - 14 * s); b.lineTo(x + w, yy); b.closePath(); b.fill();
        if (snow) { b.fillStyle = '#f4f8fb'; b.beginPath(); b.moveTo(x - w * .35, yy - 9 * s); b.lineTo(x, yy - 14 * s); b.lineTo(x + w * .35, yy - 9 * s); b.closePath(); b.fill(); }
      }
      break;
    }
    case 'bush':
      b.fillStyle = '#3d8f40'; [[-7, 0, 7], [0, -3, 8], [7, 0, 7]].forEach(([dx, dy, r]) => circB(x + dx, y - 5 + dy, r));
      b.fillStyle = '#e74c3c'; circB(x - 3, y - 8, 1.6); circB(x + 5, y - 5, 1.6);
      break;
    case 'cactus': {
      const s = .8 + h * .5;
      b.fillStyle = '#4f8a3a';
      b.fillRect(x - 3.5, y - 26 * s, 7, 26 * s); circB(x, y - 26 * s, 3.5);
      b.fillRect(x - 11, y - 14 * s, 8, 4); b.fillRect(x - 11, y - 22 * s, 4, 8 * s); circB(x - 9, y - 22 * s, 2);
      b.fillRect(x + 3, y - 18 * s, 8, 4); b.fillRect(x + 7, y - 25 * s, 4, 7 * s); circB(x + 9, y - 25 * s, 2);
      break;
    }
    case 'palm': {
      const s = .9 + h * .4, tx = x + 2 * s, ty = y - 38 * s;
      b.strokeStyle = '#8b6a3e'; b.lineWidth = 4; b.beginPath(); b.moveTo(x, y); b.quadraticCurveTo(x + 6 * s, y - 20 * s, tx, ty); b.stroke();
      b.strokeStyle = '#2e8b3e'; b.lineWidth = 3;
      for (const a of [-2.8, -2.2, -1.4, -.8, -.2]) { b.beginPath(); b.moveTo(tx, ty); b.quadraticCurveTo(tx + Math.cos(a) * 12 * s, ty + Math.sin(a) * 12 * s - 4, tx + Math.cos(a) * 21 * s, ty + Math.sin(a) * 12 * s + 8); b.stroke(); }
      b.fillStyle = '#6b4a2b'; circB(tx - 2, ty + 3, 2.5); circB(tx + 3, ty + 3, 2.5);
      break;
    }
  }
}

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

function drawCell(k, x, y) {
  const s = CS;
  switch (k.t) {
    case 'wood':
      ctx.fillStyle = '#b5803f'; ctx.fillRect(x, y, s, s);
      ctx.fillStyle = '#9a6a33'; ctx.fillRect(x, y + 7, s, 2); ctx.fillRect(x, y + 15, s, 2);
      ctx.fillStyle = '#c99556'; ctx.fillRect(x, y, s, 2);
      ctx.strokeStyle = '#6e4520'; ctx.lineWidth = 1.5; ctx.strokeRect(x + .75, y + .75, s - 1.5, s - 1.5);
      break;
    case 'stone':
      ctx.fillStyle = '#9ea4ac'; ctx.fillRect(x, y, s, s);
      ctx.fillStyle = '#b4bac1'; ctx.fillRect(x, y, s, 2);
      ctx.strokeStyle = '#737981'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x, y + 12); ctx.lineTo(x + s, y + 12); ctx.moveTo(x + 12, y); ctx.lineTo(x + 12, y + 12);
      ctx.moveTo(x + 5, y + 12); ctx.lineTo(x + 5, y + s); ctx.moveTo(x + 18, y + 12); ctx.lineTo(x + 18, y + s); ctx.stroke();
      ctx.strokeRect(x + .75, y + .75, s - 1.5, s - 1.5);
      break;
    case 'metal':
      ctx.fillStyle = '#6f7d8a'; ctx.fillRect(x, y, s, s);
      ctx.fillStyle = '#8a98a6'; ctx.fillRect(x + 2, y + 2, s - 4, 6);
      ctx.fillStyle = '#56626e'; ctx.fillRect(x + 2, y + s - 6, s - 4, 4);
      ctx.fillStyle = '#cfd8e0'; [[5, 5], [19, 5], [5, 19], [19, 19]].forEach(([a, b]) => circ(x + a, y + b, 1.6));
      ctx.strokeStyle = '#3c4650'; ctx.lineWidth = 1.5; ctx.strokeRect(x + .75, y + .75, s - 1.5, s - 1.5);
      break;
    case 'tnt':
      ctx.fillStyle = '#c0392b'; rr(x + 2, y + 1, s - 4, s - 2, 5); ctx.fill();
      ctx.fillStyle = '#7b241c'; ctx.fillRect(x + 2, y + 5, s - 4, 3); ctx.fillRect(x + 2, y + s - 8, s - 4, 3);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('TNT', x + 12, y + 15.5);
      break;
    case 'catapult': drawCatapult(k, x, y); break;
    case 'human': drawHuman(k, x, y); break;
    case 'king': drawHuman(k, x, y, true); break;
  }
  const ratio = k.hp / k.max;
  if (!MATS[k.t].unit && ratio < .7) {
    ctx.strokeStyle = 'rgba(30,20,10,.65)'; ctx.lineWidth = 1.3;
    const a = hash(k.id, 1) * 10;
    ctx.beginPath(); ctx.moveTo(x + 4 + a, y + 2); ctx.lineTo(x + 10 + a / 2, y + 10); ctx.lineTo(x + 7 + a, y + 17);
    if (ratio < .4) { ctx.moveTo(x + 22, y + 6 + a); ctx.lineTo(x + 14, y + 13); ctx.lineTo(x + 18, y + 22); }
    ctx.stroke();
    if (ratio < .4) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x, y, s, s); }
  }
  if (MATS[k.t].unit && ratio < 1) {
    ctx.fillStyle = '#222'; ctx.fillRect(x + 2, y - 5, 20, 4);
    ctx.fillStyle = ratio > .5 ? '#5ad16b' : ratio > .25 ? '#f5c542' : '#ef4444'; ctx.fillRect(x + 2, y - 5, 20 * Math.max(0, ratio), 4);
  }
  if (k.hit > 0) { ctx.fillStyle = `rgba(255,255,255,${k.hit / 16})`; ctx.fillRect(x, y, s, s); }
  if (k.burn > 0) drawFlames(x, y, k.id);
}

function drawFlames(x, y, id) {
  const t = S.time * .25 + id;
  for (let i = 0; i < 3; i++) {
    const fx = x + 5 + i * 7, h = 10 + Math.sin(t + i * 2) * 4 + hash(id, i) * 4;
    ctx.fillStyle = 'rgba(255,90,0,.85)';
    ctx.beginPath(); ctx.moveTo(fx - 4, y + 16); ctx.quadraticCurveTo(fx, y + 16 - h * 1.4, fx + 4, y + 16); ctx.fill();
    ctx.fillStyle = 'rgba(255,220,60,.9)';
    ctx.beginPath(); ctx.moveTo(fx - 2, y + 16); ctx.quadraticCurveTo(fx, y + 16 - h * .8, fx + 2, y + 16); ctx.fill();
  }
}

function drawCatapult(k, x, y) {
  const f = k.o === 0 ? 1 : -1, cx = x + 12;
  // Rahmen
  ctx.fillStyle = '#7a4b22'; ctx.fillRect(x + 2, y + 14, 20, 5);
  ctx.fillStyle = TEAM[k.o]; ctx.fillRect(x + 2, y + 14, 20, 2);
  ctx.fillStyle = '#5c3a1a'; ctx.fillRect(cx - 2, y + 7, 4, 8);
  ctx.strokeStyle = '#5c3a1a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - 7 * f, y + 14); ctx.lineTo(cx, y + 8); ctx.stroke();
  // Räder
  ctx.fillStyle = '#2d2d2d'; circ(x + 6, y + 20.5, 3.6); circ(x + 18, y + 20.5, 3.6);
  ctx.fillStyle = '#888'; circ(x + 6, y + 20.5, 1.2); circ(x + 18, y + 20.5, 1.2);
  // Wurfarm
  const t = k.anim / 20;
  const rest = f > 0 ? -Math.PI * .82 : -Math.PI * .18;
  const fired = f > 0 ? -Math.PI * .3 : -Math.PI * .7;
  const ang = rest + (fired - rest) * t;
  const ex = cx + Math.cos(ang) * 15, ey = y + 9 + Math.sin(ang) * 15;
  ctx.strokeStyle = '#a06a35'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, y + 9); ctx.lineTo(ex, ey); ctx.stroke(); ctx.lineCap = 'butt';
  ctx.fillStyle = '#4a2e14'; circ(ex, ey, 3.8);
  const cooling = S.phase === 'battle' && CFG.reload && k.cool > 0 && !catReady(k);
  if (t === 0 && !cooling) { ctx.fillStyle = '#888'; circ(ex, ey - 1.5, 2.2); }
  // Nachladen
  if (cooling) {
    ctx.fillStyle = 'rgba(20,20,30,.35)'; ctx.fillRect(x, y, CS, CS);
    ctx.font = '13px "Segoe UI Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.fillText('⏳', cx, y - 3);
  }
  // Auswahl
  if (S.phase === 'battle' && S.sel === k && S.bs === 'aim' && S.turn === k.o) {
    ctx.strokeStyle = `rgba(245,197,66,${.6 + Math.sin(S.time * .15) * .4})`; ctx.lineWidth = 2.5;
    rr(x - 3, y - 9, 30, 34, 6); ctx.stroke();
    ctx.fillStyle = '#f5c542'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('▼', cx, y - 13 + Math.sin(S.time * .15) * 2);
  }
  // Warnung im Baumodus: Schussbahn blockiert
  if (S.phase === 'build' && k.o === S.builder) {
    const pos = findCell(k);
    if (pos && pos.r > 0 && S.g[pos.r - 1][pos.c]) {
      ctx.fillStyle = '#ff5252'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('!', cx, y + 5);
    }
  }
}

function drawHuman(k, x, y, king) {
  const panic = k.burn > 0;
  const bob = Math.sin(S.time * (panic ? .5 : .07) + k.id) * (panic ? 2 : .8);
  ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + 10, y + 17); ctx.lineTo(x + 9, y + 23); ctx.moveTo(x + 14, y + 17); ctx.lineTo(x + 15, y + 23); ctx.stroke();
  ctx.strokeStyle = '#f1c27d';
  ctx.beginPath();
  if (panic) { ctx.moveTo(x + 8, y + 11 + bob); ctx.lineTo(x + 4, y + 4 + bob); ctx.moveTo(x + 16, y + 11 + bob); ctx.lineTo(x + 20, y + 4 + bob); }
  else { ctx.moveTo(x + 8, y + 11 + bob); ctx.lineTo(x + 5, y + 16 + bob); ctx.moveTo(x + 16, y + 11 + bob); ctx.lineTo(x + 19, y + 16 + bob); }
  ctx.stroke(); ctx.lineCap = 'butt';
  if (king) { // Umhang
    ctx.fillStyle = '#7b3fa0'; ctx.beginPath(); ctx.moveTo(x + 7, y + 9 + bob); ctx.lineTo(x + 17, y + 9 + bob); ctx.lineTo(x + 19, y + 20 + bob); ctx.lineTo(x + 5, y + 20 + bob); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = TEAM[k.o]; rr(x + 8, y + 9 + bob, 8, 9, 2); ctx.fill();
  if (king) { ctx.fillStyle = '#f5c542'; ctx.fillRect(x + 8, y + 14 + bob, 8, 1.6); }
  ctx.fillStyle = '#f1c27d'; circ(x + 12, y + 6 + bob, 4);
  if (king) {
    ctx.fillStyle = '#f5c542'; ctx.beginPath();
    ctx.moveTo(x + 7.5, y + 4 + bob); ctx.lineTo(x + 7.5, y - 1 + bob); ctx.lineTo(x + 10, y + 1.5 + bob); ctx.lineTo(x + 12, y - 2.5 + bob);
    ctx.lineTo(x + 14, y + 1.5 + bob); ctx.lineTo(x + 16.5, y - 1 + bob); ctx.lineTo(x + 16.5, y + 4 + bob); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ef4444'; circ(x + 12, y + 2 + bob, 1);
  } else { ctx.fillStyle = '#9aa3ad'; ctx.beginPath(); ctx.arc(x + 12, y + 5 + bob, 4.4, Math.PI, 0); ctx.fill(); }
  ctx.fillStyle = '#222'; circ(x + 10.5, y + 6.5 + bob, .8); circ(x + 13.5, y + 6.5 + bob, .8);
  if (panic) { ctx.beginPath(); ctx.arc(x + 12, y + 8.6 + bob, 1.1, 0, 7); ctx.fill(); }
}

function drawProjectile(p) {
  for (let i = 0; i < p.trail.length; i++) {
    const t = p.trail[i], a = i / p.trail.length;
    ctx.fillStyle = p.type === 'fire' ? `rgba(255,120,0,${a * .4})` : `rgba(255,255,255,${a * .35})`;
    circ(t.x, t.y, 1 + a * 2.5);
  }
  ctx.save(); ctx.translate(p.x, p.y);
  switch (p.type) {
    case 'stone': ctx.fillStyle = '#6e6e6e'; circ(0, 0, 6); ctx.fillStyle = '#9a9a9a'; circ(-2, -2, 2.5); break;
    case 'pellet': ctx.fillStyle = '#c38bff'; circ(0, 0, 3.2); break;
    case 'cannon': ctx.fillStyle = '#1a1a1a'; circ(0, 0, 6.5); ctx.fillStyle = '#555'; circ(-2, -2, 2); break;
    case 'meteor': {
      const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 16);
      g.addColorStop(0, '#fff2a0'); g.addColorStop(.35, '#ff7a00'); g.addColorStop(1, 'rgba(255,40,0,0)');
      ctx.fillStyle = g; circ(0, 0, 16); ctx.fillStyle = '#4a2a1a'; circ(0, 0, 7); break;
    }
    case 'cluster': ctx.fillStyle = '#8e44ad'; circ(0, 0, 7); ctx.fillStyle = '#e0b0ff'; [0, 1.26, 2.5, 3.77, 5].forEach(a => circ(Math.cos(a + p.rot) * 4, Math.sin(a + p.rot) * 4, 1.6)); break;
    case 'bomb': ctx.fillStyle = '#1e1e1e'; circ(0, 0, 7.5); ctx.fillStyle = '#555'; circ(-2.5, -2.5, 2.2); ctx.strokeStyle = '#a07040'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(2, -10); ctx.stroke(); break;
    case 'fire': {
      const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 12);
      g.addColorStop(0, '#fff6b0'); g.addColorStop(.4, '#ffb000'); g.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = g; circ(0, 0, 12); break;
    }
    case 'drill':
      ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.fillStyle = '#b8c2cc'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-6, -5); ctx.lineTo(-6, 5); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#5b6670'; ctx.lineWidth = 1.2;
      for (let i = -3; i < 9; i += 4) { ctx.beginPath(); ctx.moveTo(i, -4 + i * .3); ctx.lineTo(i + 2, 4 - i * .3); ctx.stroke(); }
      ctx.fillStyle = '#7a4b22'; ctx.fillRect(-11, -3, 5, 6);
      break;
    case 'cow':
      ctx.rotate(p.rot); ctx.font = '26px "Segoe UI Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🐄', 0, 0); ctx.textBaseline = 'alphabetic'; break;
    case 'hail': ctx.fillStyle = '#e8f6ff'; circ(0, 0, 4.5); ctx.fillStyle = '#fff'; circ(-1.3, -1.3, 1.6); break;
    case 'arrow':
      ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.strokeStyle = '#6e4520'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(7, 0); ctx.stroke();
      ctx.fillStyle = '#ccc'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(6, -2.5); ctx.lineTo(6, 2.5); ctx.fill();
      ctx.fillStyle = '#eee'; ctx.fillRect(-10, -2, 3, 4);
      break;
  }
  ctx.restore();
  if (p.y < 0) { // Anzeige, wenn über dem Bildschirm
    ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(p.x - 18, 4, 36, 18, 5); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('▲ ' + Math.round(-p.y / CS) + 'm', p.x, 17);
  }
}

function drawAim() {
  const pos = S.sel && findCell(S.sel);
  if (!pos || !S.aim) return;
  const P = S.players[S.turn];
  const dx = S.aim.sx - S.aim.cx, dy = S.aim.sy - S.aim.cy;
  const len = Math.hypot(dx, dy);
  const o = catOrigin(pos);
  if (len < 14) return;
  const v = launchVel(dx, dy, P.cur);
  const k = Math.min(len, MAXDRAG) / len;
  // Gummiband
  ctx.strokeStyle = 'rgba(80,40,10,.8)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.x - dx * k * .35, o.y - dy * k * .35); ctx.stroke();
  // Flugbahn-Vorschau (ohne Wind) – Länge je nach Zielhilfe
  const steps = CFG.aim === 'full' ? 34 : CFG.aim === 'short' ? 12 : 0;
  let x = o.x, y = o.y, vx = v.vx, vy = v.vy;
  for (let i = 0; i < steps; i++) {
    vy += G * S.mod.grav; x += vx; y += vy;
    const r = Math.floor(y / CS), c = Math.floor(x / CS);
    if (inGrid(r, c) && S.g[r][c] && S.g[r][c] !== S.sel) { ctx.fillStyle = '#ff5252'; circ(x, y, 4); break; }
    if (i % 3 === 0) { ctx.fillStyle = `rgba(255,255,255,${1 - i / steps})`; circ(x, y, 3); }
  }
  const deg = Math.round(Math.atan2(-dy, Math.abs(dx)) * 180 / Math.PI);
  ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(o.x - 42, o.y + 30, 84, 22, 6); ctx.fill();
  ctx.fillStyle = v.pw > .95 ? '#ffb347' : '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(`${Math.round(v.pw * 100)}%  ${deg}°`, o.x, o.y + 46);
}

function drawParticles() {
  for (const p of S.parts) {
    const a = Math.max(0, p.life / p.max);
    if (p.type === 'sq') { ctx.globalAlpha = Math.min(1, a * 2); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    else if (p.type === 'spark') { ctx.globalAlpha = a; ctx.fillStyle = p.col; circ(p.x, p.y, p.size * a + .5); }
    else if (p.type === 'smoke') { ctx.globalAlpha = a * .45; ctx.fillStyle = p.col; circ(p.x, p.y, p.size * (1.8 - a)); }
    else if (p.type === 'flash') {
      ctx.globalAlpha = a; const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
      g.addColorStop(0, '#fffbe0'); g.addColorStop(.4, 'rgba(255,190,60,.8)'); g.addColorStop(1, 'rgba(255,100,0,0)');
      ctx.fillStyle = g; circ(p.x, p.y, p.size);
    } else if (p.type === 'rain') {
      ctx.globalAlpha = .45; ctx.strokeStyle = '#cfe6ff'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .8, p.y - 12); ctx.stroke();
    } else if (p.type === 'cell') {
      ctx.globalAlpha = Math.min(1, a * 1.5); drawCell(p.k, p.x - 12, p.y - 12);
    } else if (p.type === 'emoji') { ctx.globalAlpha = a; ctx.font = `${p.size}px "Segoe UI Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.fillText(p.ch, p.x + Math.sin(p.life * .1) * 6, p.y); }
  }
  ctx.globalAlpha = 1;
}

function drawText(text, x, y, size, col, outline = 4) {
  ctx.font = `${size}px Bangers, Impact, sans-serif`; ctx.textAlign = 'center';
  ctx.lineWidth = outline; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineJoin = 'round';
  ctx.strokeText(text, x, y); ctx.fillStyle = col; ctx.fillText(text, x, y);
}

function drawBuildOverlay() {
  const z = ZONES[S.builder], oz = ZONES[1 - S.builder];
  // eigene Zone (folgt dem Gelände)
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  for (let c = z.c0; c <= z.c1; c++) ctx.fillRect(c * CS, BUILD_TOP * CS, CS, (S.top[c] - BUILD_TOP) * CS);
  ctx.setLineDash([6, 6]); ctx.strokeStyle = TEAM[S.builder]; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(z.c0 * CS, S.top[z.c0] * CS); ctx.lineTo(z.c0 * CS, BUILD_TOP * CS); ctx.lineTo((z.c1 + 1) * CS, BUILD_TOP * CS); ctx.lineTo((z.c1 + 1) * CS, S.top[z.c1] * CS); ctx.stroke();
  ctx.setLineDash([]);
  drawText('Baubereich', (z.c0 + z.c1 + 1) / 2 * CS, BUILD_TOP * CS - 8, 22, TEAM[S.builder], 3);
  // gegnerische Zone verdecken
  let deep = 0; for (let c = oz.c0 - 1; c <= oz.c1 + 1; c++) deep = Math.max(deep, S.top[c]);
  const fx = (oz.c0 - 1) * CS, fw = (oz.c1 - oz.c0 + 3) * CS, fh = deep * CS;
  ctx.fillStyle = 'rgba(25,28,40,.97)'; ctx.fillRect(fx, 0, fw, fh);
  ctx.fillStyle = 'rgba(255,255,255,.04)';
  for (let i = 0; i < 20; i++) ctx.fillRect(fx + hash(i, 3) * fw, hash(i, 7) * fh, 60, 2);
  drawText('🙈 GEHEIM 🙈', fx + fw / 2, fh / 2, 44, '#9aa3b5');
  ctx.font = '16px sans-serif'; ctx.fillStyle = '#9aa3b5'; ctx.textAlign = 'center';
  ctx.fillText(`Hier baut ${TEAM_NAME[1 - S.builder]} – nicht spicken!`, fx + fw / 2, fh / 2 + 34);
  // Vorschau
  const h = S.hover;
  if (h && !painting) {
    const tr = buildTarget(h.r, h.c, true);
    if (tr != null) {
      const ok = canAfford(S.tool);
      ctx.globalAlpha = .55;
      drawCell(mk(S.tool, S.builder), h.c * CS, tr * CS);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = ok ? '#fff' : '#ff5252'; ctx.lineWidth = 2; ctx.strokeRect(h.c * CS + 1, tr * CS + 1, CS - 2, CS - 2);
    }
  }
}

function drawWater() {
  const y = S.waterY;
  ctx.fillStyle = 'rgba(40,120,200,.42)';
  for (let c = 0; c < COLS; c++) { const b = S.top[c] * CS; if (b > y) ctx.fillRect(c * CS, y, CS, b - y); }
  ctx.strokeStyle = 'rgba(200,235,255,.8)'; ctx.lineWidth = 3;
  ctx.beginPath();
  let on = false;
  for (let x = 0; x <= W; x += 6) {
    const c = Math.min(COLS - 1, Math.floor(x / CS)), wet = S.top[c] * CS > y + 2;
    const wy = y + Math.sin(x / 40 + S.time * .08) * 3;
    if (wet) { on ? ctx.lineTo(x, wy) : ctx.moveTo(x, wy); on = true; } else on = false;
  }
  ctx.stroke();
}

function drawShip(v) {
  const bob = Math.sin(S.time * .06) * 3, x = v.px, y = S.waterY + bob;
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(S.time * .05) * .04);
  // Rumpf
  ctx.fillStyle = '#5a3416';
  ctx.beginPath(); ctx.moveTo(-90, -28); ctx.lineTo(90, -28); ctx.lineTo(70, 6); ctx.lineTo(-70, 6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#7a4b22'; ctx.fillRect(-88, -28, 176, 6);
  ctx.fillStyle = '#222'; [-50, 0, 50].forEach(cx => circ(cx, -14, 5));
  // Mast & Segel
  ctx.fillStyle = '#4a2e14'; ctx.fillRect(-3, -120, 6, 94);
  ctx.fillStyle = '#1d1d1d';
  ctx.beginPath(); ctx.moveTo(-40, -110); ctx.quadraticCurveTo(0, -95, 40, -110); ctx.lineTo(36, -45); ctx.quadraticCurveTo(0, -35, -36, -45); ctx.closePath(); ctx.fill();
  ctx.font = '26px "Segoe UI Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('☠️', 0, -66);
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(3, -120); ctx.lineTo(28 + Math.sin(S.time * .2) * 3, -113); ctx.lineTo(3, -106); ctx.fill();
  ctx.restore();
}

function drawVisitors() {
  for (const v of S.vis) {
    ctx.save();
    if (v.hitT > 0 && v.hitT % 4 < 2) ctx.globalAlpha = .55;
    v.def.draw(v);
    ctx.restore();
    if (v.leaving) continue;
    const bx = Math.max(60, Math.min(W - 60, v.px)), by = v.def.labelY ? v.def.labelY(v) : v.py - v.def.r - 16;
    if (v.max > 1) {
      const r = Math.max(0, v.hp / v.max);
      ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(bx - 32, by, 64, 7, 3); ctx.fill();
      ctx.fillStyle = r > .5 ? '#5ad16b' : r > .25 ? '#f5c542' : '#ef4444'; rr(bx - 31, by + 1, 62 * r, 5, 2); ctx.fill();
    }
    const lab = lootLabel(v);
    ctx.font = 'bold 12px "Segoe UI","Segoe UI Emoji",sans-serif'; ctx.textAlign = 'center';
    const w = ctx.measureText(lab).width + 12;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(bx - w / 2, by - 20, w, 17, 6); ctx.fill();
    ctx.fillStyle = '#ffe9a8'; ctx.fillText(lab, bx, by - 7);
  }
}

function drawTroop(t) {
  const sw = t.swing / 12, walk = t.moving ? Math.sin(t.anim * .35) : 0;
  ctx.save(); ctx.translate(t.x, t.y); ctx.scale(t.dir, 1);
  if (t.hitT > 0 && t.hitT % 4 < 2) ctx.globalAlpha = .55;
  if (t.type === 'ram') {
    const push = sw * 7;
    ctx.fillStyle = '#2d2d2d'; circ(-12, -4, 4); circ(10, -4, 4);
    ctx.fillStyle = '#888'; circ(-12, -4, 1.4); circ(10, -4, 1.4);
    ctx.fillStyle = '#7a4b22'; ctx.fillRect(-18, -12, 34, 5);
    ctx.fillStyle = '#9a6a33'; ctx.fillRect(-14 + push, -18, 30, 6);
    ctx.fillStyle = '#56626e'; ctx.fillRect(14 + push, -19.5, 7, 9);
    ctx.fillStyle = '#5c3a1a'; ctx.beginPath(); ctx.moveTo(-19, -12); ctx.lineTo(-2, -28); ctx.lineTo(16, -12); ctx.lineTo(12, -12); ctx.lineTo(-2, -24); ctx.lineTo(-15, -12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = TEAM[t.o]; ctx.beginPath(); ctx.moveTo(-15, -12); ctx.lineTo(-2, -24); ctx.lineTo(12, -12); ctx.closePath(); ctx.globalAlpha *= .85; ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = '#3a2410'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-2, -28); ctx.lineTo(-2, -38); ctx.stroke();
    ctx.fillStyle = TEAM[t.o]; ctx.fillRect(-11, -38, 9, 6);
    ctx.restore(); drawTroopBar(t, 42); return;
  }
  // Beine
  ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-1.5, -8); ctx.lineTo(-2 - walk * 3, 0); ctx.moveTo(1.5, -8); ctx.lineTo(2 + walk * 3, 0); ctx.stroke();
  // Körper
  const rebel = t.type === 'rebel';
  if (t.type === 'sword') { ctx.fillStyle = TEAM[t.o]; ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(-5, -12, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
  if (t.type === 'archer') { ctx.fillStyle = '#6e4520'; ctx.save(); ctx.translate(-5, -14); ctx.rotate(-.4); ctx.fillRect(-1.5, -6, 3, 10); ctx.restore(); }
  ctx.fillStyle = rebel ? '#8a6a45' : TEAM[t.o]; rr(-4.5, -18, 9, 11, 2); ctx.fill();
  if (rebel) { ctx.fillStyle = TEAM[t.o]; ctx.fillRect(-4.5, -15, 9, 2.5); }
  if (t.type === 'sword') { ctx.fillStyle = '#c7ced6'; ctx.fillRect(-4.5, -18, 9, 3); }
  // Kopf
  ctx.fillStyle = '#f1c27d'; circ(0, -21.5, 3.8);
  ctx.fillStyle = '#222'; circ(1.6, -22, .8);
  switch (t.type) {
    case 'sword': ctx.fillStyle = '#9aa3ad'; ctx.beginPath(); ctx.arc(0, -22, 4.3, Math.PI, 0); ctx.fill(); ctx.fillStyle = TEAM[t.o]; ctx.fillRect(-1, -29.5, 2, 4); break;
    case 'archer': ctx.fillStyle = '#3f7a3a'; ctx.beginPath(); ctx.arc(0, -22, 4.5, Math.PI * .85, Math.PI * 2.05); ctx.lineTo(-5, -18); ctx.fill(); break;
    case 'sapper': ctx.fillStyle = '#c0392b'; ctx.fillRect(-4, -25.5, 8, 2.5); ctx.fillRect(-6, -25, 2.5, 1.5); break;
    case 'rebel': ctx.fillStyle = '#d9b44a'; ctx.beginPath(); ctx.ellipse(0, -24.5, 6.5, 1.8, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(-3, -28, 6, 3.5); break;
  }
  // Ausrüstung
  if (t.type === 'sword') {
    ctx.save(); ctx.translate(3.5, -14); ctx.rotate(-1.9 + sw * 2.2);
    ctx.strokeStyle = '#f1c27d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(4, 0); ctx.stroke();
    ctx.strokeStyle = '#e6edf5'; ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(17, 0); ctx.stroke();
    ctx.strokeStyle = '#7a4b22'; ctx.beginPath(); ctx.moveTo(4, -3); ctx.lineTo(4, 3); ctx.stroke();
    ctx.restore();
  } else if (t.type === 'archer') {
    ctx.strokeStyle = '#7a4b22'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(4, -14, 7.5, -1.25, 1.25); ctx.stroke();
    const pull = sw > .5 ? 0 : 3;
    ctx.strokeStyle = '#eee'; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(6.4, -21.1); ctx.lineTo(6.8 - pull, -14); ctx.lineTo(6.4, -6.9); ctx.stroke();
  } else if (t.type === 'sapper') {
    ctx.fillStyle = '#c0392b'; rr(3, -17, 8, 10, 2); ctx.fill();
    ctx.fillStyle = '#7b241c'; ctx.fillRect(3, -14, 8, 1.5);
    ctx.fillStyle = S.time % 6 < 3 ? '#ffd000' : '#ff6a00'; circ(8, -19.5, 1.8);
  } else if (rebel) {
    if (t.id % 2) {
      ctx.strokeStyle = '#7a4b22'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(3, -4); ctx.lineTo(6 + sw * 5, -27); ctx.stroke();
      ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1.2; ctx.beginPath();
      for (const o of [-2.5, 0, 2.5]) { ctx.moveTo(6 + sw * 5 + o, -27); ctx.lineTo(6 + sw * 5 + o, -32); }
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#7a4b22'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(3, -8); ctx.lineTo(6, -24); ctx.stroke();
      const fl = 5 + Math.sin(S.time * .5 + t.id) * 1.5;
      ctx.fillStyle = 'rgba(255,110,0,.9)'; ctx.beginPath(); ctx.ellipse(6, -27, 2.8, fl, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,225,80,.95)'; ctx.beginPath(); ctx.ellipse(6, -26, 1.4, fl * .55, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
  drawTroopBar(t, 34);
}
function drawTroopBar(t, h) {
  if (t.hp >= t.max) return;
  const r = Math.max(0, t.hp / t.max);
  ctx.fillStyle = '#222'; ctx.fillRect(t.x - 10, t.y - h - 4, 20, 3.5);
  ctx.fillStyle = r > .5 ? '#5ad16b' : r > .25 ? '#f5c542' : '#ef4444'; ctx.fillRect(t.x - 10, t.y - h - 4, 20 * r, 3.5);
}

// Sonnenfinsternis: Dunkelheit mit Lichtquellen
const dk = document.createElement('canvas');
dk.width = W / 2; dk.height = H / 2;
function drawDark() {
  const d = dk.getContext('2d');
  d.setTransform(.5, 0, 0, .5, 0, 0);
  d.globalCompositeOperation = 'source-over';
  d.clearRect(0, 0, W, H);
  d.fillStyle = 'rgba(3,5,16,.9)'; d.fillRect(0, 0, W, H);
  d.globalCompositeOperation = 'destination-out';
  const light = (x, y, r) => {
    const g = d.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.5, 'rgba(0,0,0,.7)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    d.fillStyle = g; d.beginPath(); d.arc(x, y, r, 0, Math.PI * 2); d.fill();
  };
  for (const p of S.proj) light(p.x, p.y, 120);
  for (const p of S.parts) if (p.type === 'flash') light(p.x, p.y, p.size * 2.2);
  each((k, r, c) => { if (k.burn > 0) light(c * CS + 12, r * CS + 12, 80); });
  for (const k of cats(S.turn)) { const pos = findCell(k); if (pos) light(pos.c * CS + 12, pos.r * CS + 12, 80); }
  for (const v of S.vis) light(v.px, v.py, 70);
  for (const t of S.troops) if (t.type === 'rebel' && t.id % 2 === 0) light(t.x, t.y - 26, 60);
  d.globalCompositeOperation = 'source-over';
  ctx.drawImage(dk, 0, 0, W, H);
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#5aa7e8'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (S.shake) ctx.translate(vrand(-S.shake, S.shake), vrand(-S.shake, S.shake));
  ctx.drawImage(bg, 0, 0, W, H);
  // Wolken
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const cl of clouds) { const s = cl.s; circ(cl.x, cl.y, 22 * s); circ(cl.x + 24 * s, cl.y + 6 * s, 18 * s); circ(cl.x - 24 * s, cl.y + 6 * s, 16 * s); circ(cl.x + 6 * s, cl.y - 12 * s, 16 * s); }
  // Windfahne in der Mitte
  if (S.phase === 'battle') {
    const fx = 30 * CS, fy = S.top[30] * CS;
    ctx.strokeStyle = '#5c3a1a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 50); ctx.stroke();
    const wl = S.wind / WINDMAX * 30, wave = Math.sin(S.time * .2) * 3;
    ctx.fillStyle = '#f5c542'; ctx.beginPath(); ctx.moveTo(fx, fy - 50); ctx.lineTo(fx + wl, fy - 44 + wave); ctx.lineTo(fx, fy - 38); ctx.fill();
  }
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const k = S.g[r][c];
    if (k && k.t !== 'dirt') drawCell(k, c * CS, r * CS);
  }
  if (S.phase === 'build') drawBuildOverlay();
  const covered = S.phase === 'handover' || S.phase === 'menu';
  if (covered) { ctx.fillStyle = 'rgba(20,24,36,.97)'; ctx.fillRect(-20, -20, W + 40, H + 40); }
  else {
    drawVisitors();
    for (const t of S.troops) drawTroop(t);
    if (S.waterY < H) drawWater();
  }
  for (const p of S.proj) drawProjectile(p);
  drawParticles();
  if (S.ev && S.ev.def.draw) S.ev.def.draw(S.ev);
  if (S.mod.dark && S.phase === 'battle') drawDark();
  for (const p of S.pops) { ctx.globalAlpha = Math.min(1, p.life / 20); drawText(p.text, p.x, p.y, p.size, p.col, 3); }
  ctx.globalAlpha = 1;
  if (S.phase === 'battle' && S.bs === 'aim') {
    if (NET.lock && !myTurn() && NET.ra) {
      // Zielvorschau des Gegners nur anzeigen – Spielzustand bleibt unberührt
      const sa = S.aim, ss = S.sel, P = S.players[S.turn], sc = P.cur, k = cats(S.turn).find(x => x.id === NET.ra.id);
      S.aim = NET.ra.a ? {sx: NET.ra.a[0], sy: NET.ra.a[1], cx: NET.ra.a[2], cy: NET.ra.a[3]} : null;
      if (k) S.sel = k;
      if (AMMO[NET.ra.cur]) P.cur = NET.ra.cur;
      drawAim();
      S.aim = sa; S.sel = ss; P.cur = sc;
    } else drawAim();
  }
  ctx.restore();
  if (S.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${S.flash / 14})`; ctx.fillRect(0, 0, W, H); }
  if (S.banner) {
    const b = S.banner, a = Math.min(1, b.life / 25), sc = 1 + Math.max(0, (b.life - 95) / 15) * .4;
    ctx.globalAlpha = a; ctx.save(); ctx.translate(W / 2, 130); ctx.scale(sc, sc);
    drawText(b.text, 0, 0, 58, b.col, 7); ctx.restore(); ctx.globalAlpha = 1;
  }
}

// ============================================================
//  ONLINE  (Raum mit Code über den eigenen Spiel-Server)
//  Jeder baut gleichzeitig seine Burg. In der Schlacht rechnen beide PCs
//  alles selbst – mit demselben Zufall und denselben Eingaben zum selben
//  Zeitpunkt ("Lockstep"). Eingaben werden dafür D Schritte im Voraus geplant.
// ============================================================
const GAME_ID = 'katapult-krieg';
const GAME_URL = GameHub.SEITE + '/katapult-krieg/';
const NET = {
  on: false, hub: null, side: 0, names: ['', ''], status: '', joinCode: '', invited: false, board: null,
  lock: false,                 // Lockstep läuft (Schlacht)
  nt: 0, remoteAt: 0, D: 8,    // eigener Schritt, bestätigter Schritt des anderen, Eingabe-Vorlauf
  seq: 0, cmds: [], sentNt: -1, rc: 0, checks: {}, rchecks: {}, desync: false,
  seed: 0, castles: [null, null], again: [false, false], cfgBackup: null, game: 0,
  pendingFire: false, ra: null, aimKey: '', aimT: 0, tkT: 0,
};
function myTurn() { return !NET.on || S.turn === NET.side; }
function netSend(d) { if (NET.hub) NET.hub.send(d); }
function netEsc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }

// ---------- Menü & Raum ----------
function netMenuHtml() {
  return `<div class="sec net"><h3>🌐 Online gegen Freunde</h3>
    ${NET.invited ? '<div class="netnote">Du wurdest zu einem Spiel eingeladen! Gib deinen Namen ein und klicke auf <b>Beitreten</b>.</div>' : ''}
    <div class="netrow"><input id="netName" maxlength="16" placeholder="Dein Name" value="${netEsc(GameHub.getName())}">
      <button class="btn primary" data-act="netcreate">Raum erstellen</button></div>
    <div class="netrow"><input id="netCode" maxlength="40" placeholder="Code, z. B. K7QD" value="${netEsc(NET.joinCode)}">
      <button class="btn" data-act="netjoin">Beitreten</button></div>
    <div class="neterr" id="netErr">${netEsc(NET.status)}</div>
    <p class="muted" style="font-size:13px;margin:2px 0 8px">Wer den Raum erstellt, bestimmt Karte & Regeln (unten). Beide bauen gleichzeitig ihre Burg, dann wird abwechselnd geschossen.</p>
    <h3>🏆 Rangliste</h3><div id="netBoard"></div></div>`;
}
function netMenuBoard() {
  const el = $('netBoard'); if (!el) return;
  if (NET.board) GameHub.renderBoard(el, NET.board, GameHub.getName());
  else GameHub.loadBoard(GAME_ID, el, GameHub.getName()).then(rows => { NET.board = rows; });
}
function netError(text) { NET.status = text; const el = $('netErr'); if (el) el.textContent = text; else showMenu(); }
function netName() {
  const el = $('netName');
  return GameHub.setName(el ? el.value : GameHub.getName());
}

async function netCreate() {
  const name = netName();
  if (!name) { netError('Bitte zuerst deinen Namen eingeben.'); return; }
  netReset();
  NET.hub = GameHub.connect(GAME_ID); netBind();
  overlay(`<div class="big">🌐</div><h2>Raum wird erstellt …</h2>`);
  try {
    const r = await NET.hub.create(name);
    NET.on = true; NET.side = 0; NET.names = [name, ''];
    overlay(`<div class="big">🌐</div><h2>Dein Online-Raum</h2>
      <p>Sag deinem Freund diesen Code:</p><div class="netcode">${r.code}</div>
      <p class="muted">… oder schick ihm den Link:</p>
      <div class="netrow" style="max-width:520px;margin:0 auto"><input id="netLink" readonly value="${GAME_URL}#${r.code}"><button class="btn" data-act="netcopy">Kopieren</button></div>
      <p>⏳ Warte auf Mitspieler …</p>
      <p class="muted" style="font-size:13px">Karte: ${MAPS[CFG.map].icon} ${MAPS[CFG.map].name} · Dauer: ${LENGTHS[CFG.len].name} · Regeln: ${LEVELS[CFG.level] ? LEVELS[CFG.level].name : 'Eigene'}</p>
      <div class="btnrow"><button class="btn" data-act="netcancel">Abbrechen</button></div>`);
  } catch (e) { netReset(); netError(GameHub.errorText(e)); showMenu(); }
}

async function netJoin() {
  const name = netName();
  const el = $('netCode'), code = GameHub.cleanCode(el ? el.value : NET.joinCode);
  if (!name) { netError('Bitte zuerst deinen Namen eingeben.'); return; }
  if (code.length !== 4) { netError('Bitte den 4-stelligen Code eingeben.'); return; }
  netReset();
  NET.hub = GameHub.connect(GAME_ID); netBind();
  overlay(`<div class="big">🔗</div><h2>Trete bei …</h2><p>Raum <b>${code}</b></p>`);
  try {
    const r = await NET.hub.join(code, name);
    NET.on = true; NET.side = r.you; NET.names = r.players.slice();
    overlay(`<div class="big">🤝</div><h2>Verbunden!</h2><p>Du spielst gegen <b>${netEsc(NET.names[0] || '?')}</b>. Das Spiel startet gleich …</p>
      <div class="btnrow"><button class="btn" data-act="netcancel">Abbrechen</button></div>`);
  } catch (e) { netReset(); netError(GameHub.errorText(e)); showMenu(); }
}

function netBind() {
  const hub = NET.hub;
  hub.on('msg', (m, from) => { if (NET.hub === hub) netMsg(m, from); });
  hub.on('peer-join', m => {
    if (NET.hub !== hub) return;
    NET.names = m.players.slice();
    if (NET.side === 0 && S.phase === 'menu') netHostSetup();
  });
  hub.on('peer-left', () => { if (NET.hub === hub) netLost('Dein Gegner hat das Spiel verlassen.'); });
  hub.on('close', () => { if (NET.hub === hub) netLost('Die Verbindung zum Spiel-Server ist abgebrochen.'); });
  hub.on('leaderboard', rows => { NET.board = rows; const el = $('netBoardOver'); if (el) GameHub.renderBoard(el, rows, GameHub.getName()); });
}

function netReset() {
  if (NET.hub) NET.hub.close();
  NET.hub = null; NET.on = false; NET.lock = false; NET.status = '';
  RNG = Math.random;
}
function netLeave() {
  netReset();
  if (NET.cfgBackup) { CFG = NET.cfgBackup; NET.cfgBackup = null; }
  TEAM_NAME[0] = 'Spieler 1'; TEAM_NAME[1] = 'Spieler 2';
  NET.board = null;
  newGame(); showMenu();
}
function netLost(text) {
  if (!NET.on && !NET.hub) return;
  const wasOver = S.phase === 'over';
  NET.lock = false; NET.on = false;
  if (NET.hub) { NET.hub.close(); NET.hub = null; }
  RNG = Math.random;
  if (wasOver && $('netAgainSt')) {
    $('netAgainSt').textContent = text;
    const b = ov.querySelector('[data-act="netagain"]'); if (b) b.disabled = true;
    return;
  }
  bar.innerHTML = '';
  overlay(`<div class="big">🔌</div><h2>Verbindung getrennt</h2><p>${netEsc(text)}</p>
    <div class="btnrow"><button class="btn primary" data-act="netmenu">Hauptmenü</button></div>`);
}

// ---------- Spielstart: Einstellungen vom Ersteller ----------
function netHostSetup() {
  const mapId = CFG.map === 'random' ? MAP_KEYS.filter(k => k !== 'random')[Math.floor(Math.random() * (MAP_KEYS.length - 1))] : CFG.map;
  const setup = {cfg: Object.assign({}, CFG, {npc: 'off'}), mapId, seed: Math.floor(Math.random() * 4294967296), names: NET.names.slice()};
  netSend({t: 'setup', s: setup});
  netStart(setup);
}
function netStart(setup) {
  if (!NET.cfgBackup) NET.cfgBackup = Object.assign({}, CFG);
  CFG = Object.assign({}, CFG, setup.cfg, {npc: 'off'});
  NET.seed = setup.seed >>> 0; NET.names = setup.names;
  NET.castles = [null, null]; NET.again = [false, false]; NET.lock = false; NET.game++;
  Object.assign(NET, {nt: 0, remoteAt: 0, seq: 0, cmds: [], sentNt: -1, checks: {}, rchecks: {}, desync: false, pendingFire: false, ra: null, aimKey: ''});
  RNG = Math.random;
  TEAM_NAME[0] = NET.names[0] || 'Spieler 1'; TEAM_NAME[1] = NET.names[1] || 'Spieler 2';
  newGame(MAPS[setup.mapId] && setup.mapId !== 'random' ? setup.mapId : 'hills');
  startBuild(NET.side);
  bannerMsg('Baue deine Burg!', TEAM[NET.side]);
}

// ---------- Bauen ----------
function netFinishBuild() {
  const cells = [];
  each((k, r, c) => { if (k.o === NET.side && k.t !== 'dirt') cells.push([r, c, k.t]); });
  NET.castles[NET.side] = cells;
  netSend({t: 'castle', cells});
  S.phase = 'netwait'; renderTop();
  bar.innerHTML = `<div class="info">✅ <b>Deine Burg steht.</b><br><span class="muted">Warte auf ${netEsc(TEAM_NAME[1 - NET.side])} – sobald beide fertig sind, beginnt die Schlacht.</span></div>`;
  netTryBattle();
}
function netTryBattle() {
  if (!NET.castles[0] || !NET.castles[1] || S.phase !== 'netwait') return;
  // Beide Burgen auf beiden PCs in gleicher Reihenfolge neu aufbauen -> identischer Zustand
  S.g = newGrid(); uid = 0;
  [0, 1].forEach(p => NET.castles[p].slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]).forEach(([r, c, t]) => {
    if (MATS[t] && t !== 'dirt' && inZone(p, r, c) && !S.g[r][c]) S.g[r][c] = mk(t, p);
  }));
  settleInstant();
  S.players = [mkPlayer(), mkPlayer()];
  Object.assign(S, {proj: [], parts: [], pops: [], pending: [], troops: [], vis: [], sel: null, aim: null, shake: 0, banner: null});
  S.turn = (NET.seed >>> 9) & 1;
  S.phase = 'handover'; renderTop(); bar.innerHTML = '';
  overlay(`<div class="big">🪙</div><h2>Beide Burgen stehen!</h2>
    <p>Der Münzwurf hat entschieden:<br><b style="color:${TEAM[S.turn]};font-size:22px">${S.turn === NET.side ? 'Du beginnst!' : netEsc(TEAM_NAME[S.turn]) + ' beginnt.'}</b></p>
    <p class="muted">Die Schlacht beginnt gleich …</p>`);
  const game = NET.game;
  setTimeout(() => {
    if (!NET.on || NET.game !== game || S.phase !== 'handover') return;
    S.time = 0; NET.rc = 0;
    RNG = seededRng(NET.seed);
    startBattle();
    NET.lock = true;
    if (NET.side === 0) NET.hub.roundStart();
  }, 2600);
}

// ---------- Lockstep ----------
function netIssue(a, data) {
  if (!NET.lock || !myTurn()) return;
  const c = Object.assign({a, k: NET.nt + NET.D, p: NET.side, s: NET.seq++, g: NET.seed}, data);
  NET.cmds.push(c);
  netSend({t: 'cmd', c});
}
function netFire() {
  if (!S.aim || NET.pendingFire || !S.sel) { S.aim = null; return; }
  const dx = S.aim.sx - S.aim.cx, dy = S.aim.sy - S.aim.cy;
  if (Math.hypot(dx, dy) < 14) { S.aim = null; return; }
  netIssue('fire', {id: S.sel.id, cur: S.players[S.turn].cur, dx: Math.round(dx * 100) / 100, dy: Math.round(dy * 100) / 100});
  NET.pendingFire = true; S.aim = null;
}
function netRunCmds() {
  if (!NET.cmds.length) return;
  const now = NET.cmds.filter(c => c.k <= NET.nt);
  if (!now.length) return;
  NET.cmds = NET.cmds.filter(c => c.k > NET.nt);
  now.sort((a, b) => a.k - b.k || a.p - b.p || a.s - b.s);
  for (const c of now) { if (c.k < NET.nt) console.warn('Online: Befehl zu spät', c); netExec(c); }
}
function netExec(c) {
  if (S.phase !== 'battle' || c.p !== S.turn) return;
  const P = S.players[c.p];
  if (c.a === 'fire') {
    if (S.bs !== 'aim') return;
    const k = cats(c.p).find(x => x.id === c.id);
    if (k && catReady(k)) S.sel = k; else selectFirst();
    if (AMMO[c.cur] && ammoCount(c.p, c.cur) > 0) P.cur = c.cur;
    S.aim = {sx: +c.dx || 0, sy: +c.dy || 0, cx: 0, cy: 0};
    if (!fire()) S.aim = null;
  } else if (c.a === 'buy') {
    if (TROOPS[c.tp] && SHOP.includes(c.tp)) buyTroop(c.tp);
  } else if (c.a === 'split') {
    if (S.bs === 'flying') S.proj.filter(p => p.type === 'cluster' && !p.dead).forEach(splitCluster);
  }
}
function netHash() {
  let h = (NET.rc * 31 + S.turn * 7 + Math.round(S.wind * 1e6)) | 0;
  each((k, r, c) => { if (k.t !== 'dirt') h = (h * 33 + (r * COLS + c) * 7 + Math.round(k.hp) + (k.burn || 0) * 3) | 0; });
  for (const t of S.troops) h = (h * 33 + Math.round(t.x * 10) + t.hp) | 0;
  return h;
}
function netCheck(n) {
  const a = NET.checks[n], b = NET.rchecks[n];
  if (a === undefined || b === undefined) return;
  delete NET.checks[n]; delete NET.rchecks[n];
  if (a !== b && !NET.desync) { NET.desync = true; console.warn('Online: Spielstand weicht ab bei Schritt', n); }
}
function netAfterTick() {
  NET.nt++;
  if (NET.nt % 120 === 0) { const h = netHash(); NET.checks[NET.nt] = h; netSend({t: 'ck', n: NET.nt, h}); netCheck(NET.nt); }
}
// einmal pro Bild: Fortschritt melden, eigenes Zielen zeigen, Zugzeit-Autoschuss
function netFrame() {
  if (!NET.lock) return;
  const t = performance.now();
  if (NET.nt !== NET.sentNt || t - NET.tkT > 500) { netSend({t: 'tk', n: NET.nt, g: NET.seed}); NET.sentNt = NET.nt; NET.tkT = t; }
  if (S.phase === 'battle' && S.bs === 'aim' && myTurn()) {
    if (CFG.timer && S.aim && !NET.pendingFire && S.tLeft <= NET.D + 3) netFire();
    const ra = {a: S.aim ? [Math.round(S.aim.sx), Math.round(S.aim.sy), Math.round(S.aim.cx), Math.round(S.aim.cy)] : null,
      id: S.sel ? S.sel.id : 0, cur: S.players[S.turn].cur};
    const key = JSON.stringify(ra), now = performance.now();
    if (key !== NET.aimKey && now - NET.aimT > 60) { NET.aimKey = key; NET.aimT = now; netSend({t: 'aim', ra}); }
  }
}

function netMsg(m) {
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'setup': if (NET.side !== 0 && m.s) netStart(m.s); break;
    case 'castle':
      if (!Array.isArray(m.cells)) return;
      NET.castles[1 - NET.side] = m.cells.filter(x => Array.isArray(x) && x.length === 3).map(([r, c, t]) => [r | 0, c | 0, String(t)]);
      if (S.phase === 'build') bannerMsg(`${TEAM_NAME[1 - NET.side]} ist fertig!`, TEAM[1 - NET.side]);
      netTryBattle();
      break;
    case 'tk': if (m.g === NET.seed && +m.n > NET.remoteAt) NET.remoteAt = +m.n; break;
    case 'cmd':
      if (m.c && m.c.p === 1 - NET.side && m.c.g === NET.seed) NET.cmds.push(m.c);
      break;
    case 'aim': NET.ra = m.ra && typeof m.ra === 'object' ? m.ra : null; break;
    case 'ck': NET.rchecks[m.n] = m.h; netCheck(m.n); break;
    case 'again': NET.again[1 - NET.side] = true; netAgainStatus(); netMaybeAgain(); break;
  }
}

// ---------- Revanche ----------
function netAgain() {
  if (!NET.on) return;
  NET.again[NET.side] = true;
  netSend({t: 'again'});
  netAgainStatus(); netMaybeAgain();
}
function netAgainStatus() {
  const el = $('netAgainSt'); if (!el) return;
  const other = TEAM_NAME[1 - NET.side];
  el.textContent = NET.again[NET.side] ? `Warte auf ${other} …` : NET.again[1 - NET.side] ? `${other} will eine Revanche!` : '';
  const b = ov.querySelector('[data-act="netagain"]'); if (b) b.disabled = NET.again[NET.side];
}
function netMaybeAgain() {
  if (NET.side === 0 && NET.again[0] && NET.again[1] && S.phase === 'over') {
    if (NET.cfgBackup) CFG = Object.assign({}, NET.cfgBackup);
    netHostSetup();
  }
}

// Einladungslink (…/katapult-krieg/#CODE) erkannt?
if (location.hash.length > 1) {
  const code = GameHub.cleanCode(location.hash);
  if (code.length === 4) { NET.joinCode = code; NET.invited = true; }
}

// ============================================================
//  LOOP
// ============================================================
newGame();
fit();
showMenu();
let last = performance.now(), acc = 0;
function loop(t) {
  acc += Math.min(100, t - last); last = t;
  requestAnimationFrame(loop); // zuerst, damit ein Fehler nie das ganze Spiel einfriert
  try {
    let n = 0;
    while (acc >= 1000 / 60) {
      if (NET.lock) {
        // Lockstep: nicht weiter rechnen als der andere PC bestätigt hat
        if (NET.nt >= NET.remoteAt + NET.D) { acc = Math.min(acc, 1000 / 60); break; }
        netRunCmds();
      }
      update();
      if (NET.lock) netAfterTick();
      acc -= 1000 / 60;
      if (++n >= 20) { acc = 0; break; }
    }
    if (NET.on) netFrame();
    draw();
  } catch (e) { console.error(e); acc = 0; }
}
requestAnimationFrame(loop);
document.fonts && document.fonts.ready.then(() => {});
</script>
</body>
</html>
