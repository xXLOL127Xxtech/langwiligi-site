// Ablauf-Objekte für die Besucher (Ankunft & Aktion)
function visitorRun(d) {
  return {icon: d.icon, name: d.name, desc: d.desc + ' 🎯 Abschiessen = Belohnung!',
    start(e) { e.v = spawnVisitor(d); },
    tick(e) { if (d.arrive) d.arrive(e.v, e); else if (e.t > 110) e.finished = true; }};
}
function actRun(v) {
  const d = v.def;
  return {icon: d.icon, name: d.actName, desc: d.actDesc,
    tick(e) { if (!S.vis.includes(v) || v.leaving) { v.hold = null; e.finished = true; return; } d.act(v, e); if (e.finished) v.hold = null; },
    draw: d.actDraw ? e => { if (S.vis.includes(v)) d.actDraw(v, e); } : null};
}

// Wird zu Beginn jeder neuen Runde (beide haben geschossen) aufgerufen
function roundStart() {
  S.mod.grav = 1; S.mod.windMul = 1; S.mod.rain = false; S.mod.dark = false; S.mod.frenzy = false;
  S.evq = [];
  for (const v of S.vis) {
    if (v.leaving) continue;
    if (--v.rounds <= 0) { v.leaving = true; popup(Math.max(80, Math.min(W - 80, v.px)), Math.max(40, v.py - 40), `${v.def.icon} zieht weiter …`, '#fff', 18); continue; }
    // Besucher handeln nur jede 2. Runde (sonst wird es zu hektisch)
    if (v.def.act && (v.def.rounds - v.rounds) % 2 === 0) S.evq.push({def: actRun(v), t: 0});
  }
  S.mod.water = S.vis.some(v => v.def.flood && !v.leaving) ? 8 : 0;
  // Neue Ereignisse: ab Runde 3, 30 % Chance, danach mind. 1 ruhige Runde, höchstens 1 Besucher gleichzeitig
  const F = EVFREQ[CFG.evFreq] || EVFREQ.normal;
  const quiet = F.chance && S.rounds - (S.lastEventRound || 0) >= F.gap && (F.vis > 1 || !S.evq.length);
  if (quiet && S.rounds >= F.from && RNG() < F.chance) {
    const active = S.vis.filter(v => !v.leaving);
    const pool = EVENTS.filter(d => d.id !== S.lastEvent && (!d.need || CFG[d.need]) && (!d.ok || d.ok()) &&
      (!d.visitor || (active.length < F.vis && !S.vis.some(v => v.def === d))));
    if (pool.length) {
      const d = pick(pool); S.lastEvent = d.id; S.lastEventRound = S.rounds;
      S.evq.push({def: d.visitor ? visitorRun(d) : d, t: 0});
    }
  }
  if (S.evq.length) { S.bs = 'event'; nextRun(); }
}

function nextRun() {
  const e = S.evq.shift();
  if (!e) return false;
  S.ev = e;
  e.def.start && e.def.start(e);
  bannerMsg(`${e.def.icon} ${e.def.name}`, '#f5c542');
  renderTop(); renderBattleBar();
  return true;
}

function finishEvent() {
  S.ev = null;
  renderTop();
  if (checkWin()) return;
  beginTurn();
}

function checkWin() {
  const why = [0, 1].map(p => countType(p, 'catapult') === 0 ? 'cat' : humans(p) === 0 ? 'hum' : CFG.king && countType(p, 'king') === 0 ? 'king' : null);
  if (!why[0] && !why[1]) return false;
  S.phase = 'over'; bar.innerHTML = '';
  sfx('win');
  const reason = p => why[p] === 'cat' ? `Alle Katapulte von ${TEAM_NAME[p]} sind zerstört.` : why[p] === 'king' ? `Der König von ${TEAM_NAME[p]} ist gefallen! 👑` : `Alle Menschen von ${TEAM_NAME[p]} sind gefallen.`;
  let html;
  const winner = why[0] && why[1] ? -1 : why[0] ? 1 : 0;
  if (winner < 0) {
    html = `<div class="big">🤝</div><h2>Unentschieden!</h2><p>Beide Reiche sind gleichzeitig untergegangen.<br>${reason(0)}<br>${reason(1)}</p>`;
  } else {
    const w = winner, l = 1 - w;
    const title = NET.on ? (w === NET.side ? '🏆 Du gewinnst!' : `${TEAM_NAME[w]} gewinnt!`) : `${TEAM_NAME[w]} gewinnt!`;
    html = `<div class="big">${NET.on && w !== NET.side ? '💀' : '🏆'}</div><h2 style="color:${TEAM[w]}">${title}</h2><p>${reason(l)}</p>`;
  }
  html += `<p class="muted">${S.map.icon} ${S.map.name} · Runden: ${S.rounds} · Schüsse: ${S.shots[0]} / ${S.shots[1]} · Einheiten erledigt: ${S.kills[0]} / ${S.kills[1]}</p>`;
  if (NET.on) {
    NET.lock = false;
    if (NET.side === 0) NET.hub.result(winner);       // nur der Ersteller meldet -> jedes Spiel zählt einmal
    html += `<h3 class="muted" style="margin:14px 0 4px">🏆 Rangliste</h3><div id="netBoardOver"></div>
      <p id="netAgainSt" class="muted" style="min-height:20px"></p>
      <div class="btnrow"><button class="btn primary" data-act="netagain">Revanche ⚔️</button><button class="btn" data-act="netmenu">Hauptmenü</button></div>`;
  } else {
    html += `<div class="btnrow"><button class="btn primary" data-act="again">Nochmal spielen</button><button class="btn" data-act="menu">Hauptmenü</button></div>`;
  }
  setTimeout(() => {
    overlay(html);
    if (NET.on) { GameHub.loadBoard(GAME_ID, $('netBoardOver'), GameHub.getName()); netAgainStatus(); }
  }, 1300);
  return true;
}

// ============================================================
//  BAUEN
// ============================================================
function inZone(p, r, c) { const z = ZONES[p]; return c >= z.c0 && c <= z.c1 && r >= BUILD_TOP && r < ROWS; }

function buildTarget(r, c, allowStack) {
  if (!inZone(S.builder, r, c)) return null;
  if (S.g[r][c]) {
    if (!allowStack) return null;
    while (r >= 0 && S.g[r][c]) r--;
    return r >= BUILD_TOP ? r : null;
  }
  while (r + 1 < ROWS && !S.g[r + 1][c]) r++;
  return r;
}

function canAfford(t) {
  const m = MATS[t];
  if (m.unit) return countType(S.builder, t) < need(t);
  if (m.max && countType(S.builder, t) >= m.max) return false;
  return S.players[S.builder].points >= m.cost;
}

function placeAt(r, c, first) {
  const tr = buildTarget(r, c, first);
  if (tr == null) return;
  const t = S.tool, m = MATS[t], P = S.players[S.builder];
  if (!canAfford(t)) {
    const why = m.unit ? (t === 'king' ? 'Nur 1 König!' : `Schon ${need(t)} ${t === 'human' ? 'Menschen' : 'Katapulte'}!`) : m.max && countType(S.builder, t) >= m.max ? `Max. ${m.max} ${m.name}er!` : 'Zu wenig Punkte!';
    if (first) { popup(c * CS + 12, tr * CS, why, '#ff8a80', 15); sfx('error'); }
    return;
  }
  S.g[tr][c] = mk(t, S.builder);
  if (!m.unit) P.points -= m.cost;
  puff(c * CS + 12, tr * CS + 20, 2, '#ddd');
  sfx('place'); renderBuildBar();
}

function removeAt(r, c) {
  if (!inGrid(r, c)) return;
  const k = S.g[r][c];
  if (!k || k.t === 'dirt' || k.o !== S.builder) return;
  S.g[r][c] = null;
  if (!MATS[k.t].unit) S.players[S.builder].points += MATS[k.t].cost;
  settleInstant(); sfx('remove'); renderBuildBar();
}

function clearZone(p) {
  each((k, r, c) => { if (k.o === p) S.g[r][c] = null; });
  S.players[p].points = budget();
}

function topFree(c) { let r = ROWS - 1; while (r >= 0 && S.g[r][c]) r--; return r; }

// ---------- Burg-Generator ----------
// Ein Bauplan ist ein Array von 19 Spalten (Index 0 = Front zum Gegner),
// jede Spalte eine Liste von Blöcken von unten nach oben.
// Regel: Ein Katapult steht nie tiefer als die Spalte direkt vor ihm (freie Schussbahn).
const RI = (a, b) => a + Math.floor(RNG() * (b - a + 1));
const pick = a => a[Math.floor(RNG() * a.length)];
const LEN = 19, MAXH = GROUND - BUILD_TOP;

function emptyPlan() { return Array.from({length: LEN}, () => []); }
function fillCol(P, i, n, mat) { for (let j = 0; j < n; j++) P[i].push(typeof mat === 'function' ? mat(P[i].length, i) : mat); }
const wallMat = (base = 2, top = 'stone', woodTop = 0, h = 99) => j => j < base ? 'metal' : (j >= h - woodTop ? 'wood' : top);
function hideBarrels(P, cols, n) {
  for (let k = 0; k < n; k++) {
    const i = pick(cols);
    if (P[i].length > 3 && !MATS[P[i][1]].unit) P[i][1] = 'tnt';
  }
}

const CASTLES = [
  {name: 'Klassische Burg', plan() {
    const P = emptyPlan();
    const wh = RI(6, 8), kh = RI(10, 12), th = Math.min(16, kh + RI(1, 3)), k0 = RI(9, 10), t0 = RI(14, 15);
    // Frontmauer mit Zinne
    fillCol(P, 0, wh + 1, wallMat(3)); fillCol(P, 1, wh, wallMat(2)); fillCol(P, 2, wh - 1, wallMat(1)); P[2].push('catapult');
    fillCol(P, 3, wh - 3, 'stone');
    // Innenhof mit Bunker
    const hb = RI(5, k0 - 2);
    P[hb].push('human'); fillCol(P, hb, 2, 'metal');
    for (let i = 4; i < k0; i++) if (!P[i].length) fillCol(P, i, RI(1, 2), 'wood');
    // Bergfried
    fillCol(P, k0, kh + 1, wallMat(2, 'stone', 2, kh + 1));
    fillCol(P, k0 + 1, kh, wallMat(2));
    P[k0 + 2].push('human'); fillCol(P, k0 + 2, kh - 2, wallMat(2)); P[k0 + 2].push('catapult');
    fillCol(P, k0 + 3, kh + 1, wallMat(1, 'stone', 2, kh + 1));
    // Verbindungsmauer + hinterer Turm
    for (let i = k0 + 4; i < t0; i++) fillCol(P, i, RI(4, 6), 'stone');
    fillCol(P, t0, th, wallMat(2, 'stone', 2, th));
    P[t0 + 1].push('human'); fillCol(P, t0 + 1, th - 2, wallMat(2)); P[t0 + 1].push('catapult');
    fillCol(P, t0 + 2, th + 1, wallMat(1, 'stone', 3, th + 1));
    hideBarrels(P, [k0 + 1, k0 + 3, t0 + 2], RI(0, 2));
    return P;
  }},
  {name: 'Drei Türme', plan() {
    const P = emptyPlan();
    const pos = [RI(1, 2), RI(7, 8), RI(13, 14)];
    const h1 = RI(7, 8), h2 = h1 + RI(2, 3), h3 = Math.min(16, h2 + RI(2, 3));
    [h1, h2, h3].forEach((h, k) => {
      const t = pos[k];
      fillCol(P, t, h + 1, wallMat(3, 'stone', 2, h + 1));
      fillCol(P, t + 1, h, wallMat(3, 'stone', 1, h));
      fillCol(P, t + 2, h - 1, wallMat(3)); P[t + 2].push('catapult');
    });
    const gaps = [];
    for (let i = 0; i < LEN; i++) if (!P[i].length) gaps.push(i);
    const humanCols = [pick(gaps.filter(i => i > pos[0] + 2 && i < pos[1])), pick(gaps.filter(i => i > pos[1] + 2 && i < pos[2])), LEN - 1];
    gaps.forEach(i => {
      const h = RI(3, 4);
      if (humanCols.includes(i)) { P[i].push('human'); fillCol(P, i, h - 1, i === LEN - 1 ? 'metal' : 'stone'); }
      else fillCol(P, i, h, j => j === 0 ? 'stone' : pick(['stone', 'wood']));
    });
    hideBarrels(P, [pos[1], pos[2]], RI(1, 2));
    return P;
  }},
  {name: 'Stufenfestung', plan() {
    const P = emptyPlan();
    const peak = RI(10, 12), top = RI(12, 14);
    for (let i = 0; i < LEN; i++) {
      const h = i <= peak ? Math.max(2, top - Math.round((peak - i) * 1.3)) : Math.max(1, top - (i - peak) * 2);
      fillCol(P, i, h, j => (i <= 1 || j < 2) ? 'metal' : (j === h - 1 ? 'wood' : 'stone'));
    }
    [peak - 1, peak + 1, peak - 3].forEach(i => { P[i][0] = 'human'; });
    [peak, peak - 4, peak - 8].forEach(i => P[i].push('catapult'));
    hideBarrels(P, [peak + 2, peak + 3, peak - 2], RI(1, 3));
    return P;
  }},
  {name: 'Holzfort', plan() {
    const P = emptyPlan();
    const h = RI(6, 8);
    const pal = (j, i) => (i === 0 && j < 2) ? 'metal' : j === 0 ? 'stone' : 'wood';
    fillCol(P, 0, h + 1, pal); fillCol(P, 1, h, pal); fillCol(P, 2, h - 1, pal); P[2].push('catapult');
    fillCol(P, 3, h - 2, pal);
    const a = RI(6, 8), b = RI(12, 14), ha = RI(9, 11), hb = Math.min(16, ha + RI(1, 3));
    fillCol(P, a, ha, j => j < 2 ? 'stone' : 'wood'); P[a].push('catapult');
    fillCol(P, b, hb, j => j < 2 ? 'stone' : 'wood'); P[b].push('catapult');
    const free = [];
    for (let i = 5; i < 17; i++) if (!P[i].length && Math.abs(i - a) > 1 && Math.abs(i - b) > 1) free.push(i);
    free.sort(() => RNG() - .5);
    free.slice(0, 3).forEach(i => { P[i].push('human'); fillCol(P, i, 2, 'wood'); P[i].push('stone'); });
    for (let i = 4; i < 17; i++) if (!P[i].length) fillCol(P, i, RI(1, 3), 'wood');
    const nb = RI(1, 3);
    for (let k = 0; k < nb; k++) { const i = 17 + (k % 2); P[i].push('tnt'); }
    fillCol(P, 17, 2, 'wood'); fillCol(P, 18, 1, 'wood');
    return P;
  }},
  {name: 'Bunkerlinie', plan() {
    const P = emptyPlan();
    const h = RI(5, 6), slots = [RI(2, 4), RI(8, 10), RI(14, 15)];
    const hum = [Math.floor((slots[0] + slots[1]) / 2), Math.floor((slots[1] + slots[2]) / 2), 17];
    for (let i = 0; i < 18; i++) {
      const n = i === 0 ? h - 1 : h;
      if (slots.includes(i)) { fillCol(P, i, h - 1, wallMat(2)); P[i].push('catapult'); }
      else if (hum.includes(i)) { P[i].push('human'); fillCol(P, i, n - 1, wallMat(2)); }
      else fillCol(P, i, n, (j) => (j < 2 || i < 2) ? 'metal' : 'stone');
    }
    fillCol(P, 18, h + RI(3, 5), wallMat(2, 'stone', 2, h + 4));
    hideBarrels(P, [1, 5, 6, 11, 12, 16].filter(i => !slots.includes(i) && !hum.includes(i)), RI(1, 2));
    return P;
  }}
];

function planCost(P) { return P.flat().reduce((s, t) => s + MATS[t].cost, 0); }
function planCells(P) { const a = []; P.forEach((col, i) => col.forEach((t, j) => a.push({i, j, t, h: col.length}))); return a; }

// Bauplan ans Budget anpassen: erst obere Steine zu Holz, dann Metall zu Stein, notfalls kürzen
function fitBudget(P) {
  let guard = 0;
  while (planCost(P) > budget() && guard++ < 3000) {
    const cells = planCells(P);
    let cand = cells.filter(x => x.t === 'stone' && x.j >= x.h / 2 && x.i > 2);
    if (!cand.length) cand = cells.filter(x => x.t === 'metal' && x.i > 2);
    if (!cand.length) cand = cells.filter(x => x.t === 'metal' || x.t === 'stone');
    if (cand.length) { const x = pick(cand); P[x.i][x.j] = x.t === 'metal' ? 'stone' : 'wood'; continue; }
    const cols = P.map((c, i) => i).filter(i => P[i].length && !MATS[P[i][P[i].length - 1]].unit);
    if (!cols.length) break;
    cols.sort((a, b) => P[b].length - P[a].length);
    P[cols[0]].pop();
  }
  // Restpunkte in die Front investieren
  guard = 0;
  while (guard++ < 500) {
    const left = budget() - planCost(P), cells = planCells(P);
    let c = left >= 25 ? cells.filter(x => x.t === 'stone' && (x.i <= 3 || x.j < 2)) : [];
    if (c.length) { const x = pick(c); P[x.i][x.j] = 'metal'; continue; }
    c = left >= 15 ? cells.filter(x => x.t === 'wood' && x.i <= 8) : [];
    if (c.length) { const x = pick(c); P[x.i][x.j] = 'stone'; continue; }
    break;
  }
}

// ---------- Burgen passend zur Spieldauer (Budget, Anzahl Katapulte & Menschen) ----------
const STYLES = {
  stone: {name: 'Steinwacht', mat: (j, h) => j < h - 1 ? 'stone' : 'wood', roof: 'stone'},
  wood:  {name: 'Holzfort',   mat: (j, h, front) => j === 0 && front ? 'stone' : 'wood', roof: 'wood'},
  metal: {name: 'Eisenbunker', mat: (j, h, front) => j < (front ? 2 : 1) ? 'metal' : 'stone', roof: 'metal'}
};
function sizedCastle(nc, nh, s) {
  const st = pick(Object.keys(STYLES)), S_ = STYLES[st];
  return {name: `${S_.name} (${nc} 🏹 · ${nh} 🧍)`, plan() {
    const P = emptyPlan();
    const h0 = Math.max(2, Math.round(RI(5, 7) * s)), step = Math.max(1, Math.round(2 * s));
    const gap = nc === 3 ? 6 : 8, t0 = RI(0, 2), towers = [];
    // Türme: Front (h+1), Zinne (h), Katapult (h-1 + Katapult) -> freie Schussbahn
    for (let k = 0; k < nc; k++) {
      const t = t0 + k * gap + (k ? RI(0, 1) : 0), h = Math.min(MAXH - 2, h0 + k * step);
      fillCol(P, t, h + 1, j => S_.mat(j, h + 1, true));
      fillCol(P, t + 1, h, j => S_.mat(j, h, true));
      fillCol(P, t + 2, h - 1, j => S_.mat(j, h - 1)); P[t + 2].push('catapult');
      towers.push(t);
    }
    // Menschen in Bunkern: bevorzugt direkt hinter den Türmen, sonst ganz hinten
    const free = i => i >= 0 && i < LEN && !P[i].length;
    const spots = [...towers.map(t => t + 3), LEN - 1, LEN - 2, ...shuffle([...Array(LEN).keys()])].filter((i, n, a) => free(i) && a.indexOf(i) === n);
    const hum = [];
    for (const i of spots) { if (hum.length >= nh) break; if (!hum.some(x => Math.abs(x - i) < 2)) hum.push(i); }
    hum.forEach(i => {
      P[i].push('human'); fillCol(P, i, RI(1, 1 + Math.round(2 * s)), S_.roof);
      if (s >= .6) for (const n of [i - 1, i + 1]) if (free(n) && !hum.includes(n)) fillCol(P, n, P[i].length, S_.roof === 'metal' ? 'stone' : S_.roof);
    });
    // Lücken zwischen den Bauten mit niedrigen Mauern füllen
    const last = Math.max(...P.map((c, i) => c.length ? i : -1));
    for (let i = 0; i < last; i++) if (!P[i].length) fillCol(P, i, RI(0, Math.max(1, Math.round(3 * s))), j => j === 0 ? 'stone' : 'wood');
    if (s >= .6) hideBarrels(P, towers.map(t => t + 1), RI(0, 2));
    return P;
  }};
}

function randomBuild(p, quiet) {
  clearZone(p);
  const z = ZONES[p], P = S.players[p], L = LENGTHS[CFG.len];
  const colOf = i => p === 0 ? z.c1 - i : z.c0 + i;
  let castle, plan;
  for (let tries = 0; tries < 8; tries++) {
    castle = L.cats === 3 && L.humans === 3 && RNG() < .55 ? pick(CASTLES) : sizedCastle(L.cats, L.humans, L.scale);
    plan = castle.plan();
    plan.forEach((col, i) => { const maxh = S.top[colOf(i)] - BUILD_TOP; while (col.length > maxh) col.splice(col.findIndex((t, j) => j > 0 && !MATS[t].unit), 1); });
    const cnt = t => plan.flat().filter(x => x === t).length;
    if (cnt('catapult') === L.cats && cnt('human') === L.humans) break;
  }
  if (CFG.king) {
    const hs = []; plan.forEach((col, i) => col.forEach((t, j) => { if (t === 'human') hs.push([i, j]); }));
    if (hs.length) { const [i, j] = pick(hs); plan[i][j] = 'king'; }
  }
  fitBudget(plan);
  plan.forEach((col, i) => {
    const c = colOf(i);
    col.forEach((t, j) => {
      S.g[S.top[c] - 1 - j][c] = mk(t, p);
      P.points -= MATS[t].cost;
    });
  });
  if (!quiet) { bannerMsg('🎲 ' + castle.name, TEAM[p]); sfx('place'); }
}

// ============================================================
//  COMPUTER-GEGNER (NPC)
//  Probiert viele Winkel/Stärken mit derselben Physik durch, bewertet die Treffer
//  und zielt dann – je nach Stufe – mit absichtlichem Fehler.
// ============================================================
const NPC_VAL = {catapult: 130, human: 150, king: 150, tnt: 70, metal: 3, stone: 5, wood: 6};
const AMMO_SAVE = {stone: 0, bomb: 60, fire: 45, cluster: 35, drill: 40, cow: 35};
const tri = () => RNG() + RNG() - 1;   // -1 … 1, kleine Fehler sind häufiger

function simShot(x, y, vx, vy, origin, wind, maxF = 360) {
  let left = false;
  for (let f = 0; f < maxF; f++) {
    vy += G * S.mod.grav; vx += wind;
    const n = Math.max(1, Math.ceil(Math.hypot(vx, vy) / 4));
    for (let i = 0; i < n; i++) {
      x += vx / n; y += vy / n;
      if (x < -300 || x > W + 300 || y > H + 40) return null;
      for (const v of S.vis) if (!v.leaving && visitorHit(v, x - (v.def.id === 'balloon' ? v.vx * f : 0), y)) return {vis: v, x, y, vx, vy, f};
      const c = Math.floor(x / CS), r = Math.floor(y / CS);
      if (!inGrid(r, c)) continue;
      const key = r * COLS + c;
      if (key === origin && !left) continue;
      if (key !== origin) left = true;
      if (S.g[r][c]) return {r, c, x, y, vx, vy, f};
    }
  }
  return null;
}

function npcPlan(D) {
  const p = S.turn, foe = 1 - p, dir = p === 0 ? 1 : -1;
  const units = []; each((k, r, c) => { if (k.o === foe && MATS[k.t].unit) units.push({r, c}); });
  const prox = (r, c) => { let d = 99; for (const u of units) d = Math.min(d, Math.hypot(u.r - r, u.c - c)); return 45 / (1 + d); };
  const val = (r, c) => {
    if (!inGrid(r, c)) return 0;
    const k = S.g[r][c]; if (!k || k.t === 'dirt') return 0;
    if (k.o === p) return MATS[k.t].unit ? -400 : k.t === 'tnt' ? -250 : -30;   // eigene Burg schonen!
    let v = k.t === 'king' && CFG.king ? 400 : NPC_VAL[k.t] || 4;
    if (MATS[k.t].unit) v *= 1.4 - Math.min(1, k.hp / k.max) * .4;           // angeschlagene Ziele bevorzugen
    else v += prox(r, c);                                                    // Blöcke nahe an Zielen sind mehr wert
    return v;
  };
  const area = (x, y, rad, burnOnly) => {
    let s = 0; const cc = x / CS, rc = y / CS;
    for (let r = Math.floor(rc - rad); r <= rc + rad; r++) for (let c = Math.floor(cc - rad); c <= cc + rad; c++) {
      const d = Math.hypot(c + .5 - cc, r + .5 - rc); if (d > rad) continue;
      const k = inGrid(r, c) && S.g[r][c]; if (burnOnly && !(k && MATS[k.t] && MATS[k.t].burn)) continue;
      s += val(r, c) * (1 - .6 * d / rad);
    }
    return s;
  };
  const visValue = (v, a) => {
    if (!D.vis || (v.def.immune && v.def.immune.includes(a))) return -50;
    const L = lootOf(v), worth = Object.values(L).reduce((s, n) => s + n, 0) * 45 + (CFG.merc ? v.def.bounty || 0 : 0) + (v.def.id === 'magpie' ? 40 : 0);
    const dmg = VDMG[a] || 40;
    return worth * (dmg >= v.hp ? 1.3 : .6 * dmg / v.hp);
  };
  const score = (h, a) => {
    if (h.vis) return visValue(h.vis, a);
    const dirt = S.g[h.r][h.c].t === 'dirt';
    switch (a) {
      case 'bomb': return area(h.x, h.y, 3.2) * .9;
      case 'fire': return area(h.x, h.y, 1.8, true) * 1.1;
      case 'drill': {
        if (dirt) return 0;
        const l = Math.hypot(h.vx, h.vy) || 1; let s = 0;
        for (let i = 0; i < 4; i++) s += val(Math.floor((h.y + h.vy / l * CS * i) / CS), Math.floor((h.x + h.vx / l * CS * i) / CS)) * (1 - i * .15);
        return s;
      }
      default: {
        const s = val(h.r, h.c) + .3 * (val(h.r - 1, h.c) + val(h.r + 1, h.c) + val(h.r, h.c - 1) + val(h.r, h.c + 1));
        return (a === 'cow' || a === 'cluster' ? s * 1.25 : s) + (dirt && units.length ? prox(h.r, h.c) * .3 : 0);
      }
    }
  };
  const ready = cats(p).filter(catReady);
  if (!ready.length) return null;
  const ammo = ['stone', ...SPECIAL.filter(a => ammoCount(p, a) > 0)];
  const wind = S.wind * D.wind;
  let best = null;
  for (const k of ready) {
    const pos = findCell(k); if (!pos) continue;
    const o = catOrigin(pos), origin = pos.r * COLS + pos.c;
    const speeds = [...new Set(ammo.map(a => AMMO[a].speed))];
    for (const spd of speeds) for (let ang = 10; ang <= 85; ang += 2.5) for (let pw = .3; pw <= 1.0001; pw += .035) {
      const sp = pw * VMAX * spd, rad = ang * Math.PI / 180;
      const h = simShot(o.x, o.y, Math.cos(rad) * sp * dir, -Math.sin(rad) * sp, origin, wind);
      if (!h) continue;
      for (const a of ammo) {
        if (AMMO[a].speed !== spd) continue;
        const sc = score(h, a) - AMMO_SAVE[a] * D.save + rand(0, D.noise);
        if (!best || sc > best.sc) best = {sc, k, a, ang, pw, vis: !!h.vis};
      }
    }
  }
  if (!best) return null;
  // absichtlicher Zielfehler je nach Stufe
  best.ang = Math.max(5, Math.min(88, best.ang + tri() * D.angErr));
  best.pw = Math.max(.25, Math.min(1, best.pw * (1 + tri() * D.pwErr)));
  return best;
}

function npcBuy(D) {
  const p = S.turn, P = S.players[p];
  if (S.bought || ownTroops(p) >= MAX_TROOPS || RNG() > D.buy) return;
  const opts = SHOP.filter(t => TROOPS[t].cost <= P.credits);
  if (!opts.length) return;
  buyTroop(CFG.npc === 'hard' ? opts.sort((a, b) => TROOPS[b].cost - TROOPS[a].cost)[0] : pick(opts));
}

// Ablauf im Zug des Computers: nachdenken -> Katapult & Munition wählen -> sichtbar zielen -> schiessen
function npcTick() {
  const D = NPCS[CFG.npc];
  if (!S.npc) { S.npc = {t: 0}; renderBattleBar(); }
  const N = S.npc; N.t++;
  if (N.t === 45) {
    if (CFG.merc) npcBuy(D);
    N.plan = npcPlan(D);
    if (!N.plan) { S.npc = null; skipTurn(); return; }
    S.sel = N.plan.k; S.players[S.turn].cur = N.plan.a; sfx('tick');
    if (N.plan.vis) popup(W / 2, 200, '🤖 Der Computer zielt auf den Besucher!', '#ffe066', 22);
    renderBattleBar();
  }
  if (N.t > 45 && N.plan) {
    const pos = findCell(N.plan.k);
    if (!pos) { S.npc = null; skipTurn(); return; }
    const o = catOrigin(pos), f = Math.min(1, (N.t - 45) / 40), len = N.plan.pw * MAXDRAG * f;
    const a = N.plan.ang * Math.PI / 180, dx = Math.cos(a) * len * (S.turn === 0 ? 1 : -1), dy = -Math.sin(a) * len;
    S.aim = {sx: o.x, sy: o.y, cx: o.x - dx, cy: o.y - dy};
    if (N.t >= 45 + 40 + 20) { S.npc = null; if (!fire()) skipTurn(); }
  }
}

function overlay(html, wide) { ov.innerHTML = `<div class="card${wide ? ' wide' : ''}">${html}</div>`; ov.classList.add('show'); }
function hideOverlay() { ov.classList.remove('show'); }
function setHtml(el, html) { if (el._h !== html) { el.innerHTML = html; el._h = html; } }

function rageBar(p) {
  const r = S.players[p].rage;
  return `<span title="Wut: ${Math.round(r)} % – ab 50 % droht ein Volksaufstand">😡<span class="rage ${r >= 50 ? 'hot' : ''}"><i style="width:${r.toFixed(1)}%"></i></span></span>`;
}

function renderTop() {
  const battle = S.phase === 'battle' || S.phase === 'over';
  [0, 1].forEach(p => {
    const el = $(p ? 'p2' : 'p1'), P = S.players[p];

function renderBattleBar() {

  else if (!myTurn() && S.bs === 'aim') status = `⏳ ${TEAM_NAME[S.turn]} zielt gerade …`;
  else if (isNpcTurn() && S.bs === 'aim') status = `🤖 Der Computer (${NPCS[CFG.npc].name.replace('Computer: ', '')}) denkt nach und zielt …`;
  else if (S.bs === 'troops') status = '⚔️ Die Truppen marschieren und greifen an …';
  else if (busy) status = S.after === 'endTurn' ? 'Schuss fliegt …' + (S.proj.some(p => p.type === 'cluster') ? ' (LEERTASTE = teilen)' : '') : 'Einen Moment …';
  else {
    status = 'Maus ziehen & loslassen = schiessen · Klick auf eigenes Katapult / Tab = wechseln';
    const extra = [];

    if (CFG.reload) { const n = cats(S.turn).filter(k => !catReady(k)).length; if (n) extra.push(`⏳ ${n} Katapult${n > 1 ? 'e laden' : ' lädt'} nach`); }
    if (CFG.merc) extra.push(S.bought ? '✅ Soldat angeheuert – marschiert ab deinem nächsten Zug' : full ? `Max. ${MAX_TROOPS} Soldaten im Feld` : '1 Soldat pro Zug kaufbar');
    if (S.vis.some(v => !v.leaving)) extra.push('🎯 Besucher abschiessen = Belohnung!');
    if (extra.length) status += '<br>' + extra.join(' · ');
  }
  h += `<div class="info"><b style="color:${TEAM[S.turn]}">${TEAM_NAME[S.turn]}</b> – <b>${AMMO[P.cur].icon} ${AMMO[P.cur].name}:</b> ${AMMO[P.cur].desc}<br>
    <span class="muted">${status}</span></div>`;
  bar.innerHTML = h; lockBars();
}

function toWorld(e) {
  const r = cv.getBoundingClientRect();
  return {x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H};
}
let painting = 0, lastCell = null;

cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  ac();
  const {x, y} = toWorld(e);
  const r = Math.floor(y / CS), c = Math.floor(x / CS);
  cv.setPointerCapture(e.pointerId);
  if (S.phase === 'build') {
    painting = e.button === 2 ? 2 : 1; lastCell = r * COLS + c;
    if (painting === 1) placeAt(r, c, true); else removeAt(r, c);
  } else if (S.phase === 'battle' && !isNpcTurn() && myTurn()) {
    if (S.bs === 'flying') { if (NET.lock) netIssue('split'); else S.proj.filter(p => p.type === 'cluster' && !p.dead).forEach(splitCluster); return; }
    if (S.bs !== 'aim' || e.button !== 0 || NET.pendingFire) return;
    const k = inGrid(r, c) && S.g[r][c];
    if (k && k.t === 'catapult' && k.o === S.turn) {
      if (catReady(k)) { S.sel = k; sfx('tick'); renderBattleBar(); }
      else { popup(c * CS + 12, r * CS - 10, '⏳ lädt nach!', '#ffb347', 16); sfx('error'); }
    }
    if (!S.sel) return;
    S.aim = {sx: x, sy: y, cx: x, cy: y};
  }
});
cv.addEventListener('pointermove', e => {
  const {x, y} = toWorld(e);
  const r = Math.floor(y / CS), c = Math.floor(x / CS);
  S.hover = {x, y, r, c};
  if (S.phase === 'build' && painting) {
    const key = r * COLS + c;
    if (key !== lastCell) { lastCell = key; if (painting === 1) placeAt(r, c, false); else removeAt(r, c); }
  }
  if (S.aim && !isNpcTurn() && myTurn()) { S.aim.cx = x; S.aim.cy = y; }
});
cv.addEventListener('pointerup', () => {
  painting = 0;
  if (S.phase === 'battle' && S.aim && !isNpcTurn() && myTurn()) { if (NET.lock) netFire(); else fire(); }
});
cv.addEventListener('pointerleave', () => { S.hover = null; });

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'm' || e.key === 'M') { $('muteBtn').click(); return; }
  if (ov.classList.contains('show')) return;
  const n = parseInt(e.key);
  if (S.phase === 'build' && n >= 1 && n <= tools().length) { S.tool = tools()[n - 1]; sfx('tick'); renderBuildBar(); }
  if (S.phase === 'battle' && !isNpcTurn() && myTurn()) {
    if (n >= 1 && n <= 6 && S.bs === 'aim') {
      const a = AMMO_KEYS[n - 1];
      if (ammoCount(S.turn, a) > 0) { S.players[S.turn].cur = a; sfx('tick'); renderBattleBar(); }
    }
    if (e.key === 'Tab') { e.preventDefault(); if (S.bs === 'aim') cycleCat(); }
    if (e.key === ' ') { e.preventDefault(); if (NET.lock) { if (S.bs === 'flying') netIssue('split'); } else S.proj.filter(p => p.type === 'cluster' && !p.dead).forEach(splitCluster); }
    if (e.key === 'Escape') S.aim = null;
  }
});
