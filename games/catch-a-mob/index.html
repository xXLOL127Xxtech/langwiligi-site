<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catch a Mob</title>
<meta name="description" content="Fang düstere Mobs in einer riesigen Welt, zieh mit Freunden gegen Riesen und fordere andere zum Duell.">
<meta name="theme-color" content="#8a3ffc">
<meta name="spiel-modi" content="Online,Bots">
<meta name="spiel-tags" content="Sammeln,Offene Welt,Koop">
<meta name="spiel-typ" content="Pixel-Art,Strategie,Aufbau">
<meta name="spiel-suche" content="Monster fangen, Monster sammeln online, Mobs fangen, Monsterfänger">
<style>
  :root {
    --bg: #0d0f13; --panel: rgba(18, 14, 28, 0.94); --line: rgba(255, 255, 255, 0.14); --text: #f2efe8; --muted: #a9a59b;
    --accent: #8a3ffc; --accent-2: #c9a6ff; --gold: #ffd54a; --red: #ff6b5e; --green: #5fd38a; --blue: #4f8ff7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; }

  /* HUD */
  #hud { position: absolute; left: 12px; top: 10px; right: 12px; pointer-events: none; display: flex; justify-content: space-between; gap: 12px; }
  .hbox { background: rgba(10, 8, 18, 0.72); border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: 13px; line-height: 1.45; backdrop-filter: blur(2px); }
  .hbox b { color: var(--accent-2); }
  #hudL { min-width: 190px; }
  #hudR { text-align: right; min-width: 170px; }
  .gold { color: var(--gold); font-weight: 700; }
  .party { margin-top: 5px; font-size: 12px; color: var(--muted); }
  .party i { font-style: normal; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  #quick { position: absolute; left: 12px; bottom: 12px; z-index: 5; display: flex; gap: 10px; }
  #quick button { width: 58px; height: 58px; font-size: 30px; line-height: 1; position: relative; cursor: pointer; border: 0; border-radius: 0; background: #2a1f40; color: #fff; box-shadow: 0 0 0 3px #07040e, inset 0 0 0 3px #4a3578; }
  #quick button:hover { background: #6a35c9; }
  #quick kbd { position: absolute; right: 4px; bottom: 2px; font: 700 11px ui-monospace, Consolas, monospace; color: #cfc9e0; }
  #rang { position: absolute; right: 12px; top: 92px; width: 232px; padding: 8px 10px; z-index: 4; pointer-events: none; font-size: 12px; }
  #rang .ti { color: #ffd54a; text-transform: uppercase; letter-spacing: .08em; }
  #rang table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  #rang th { color: #a9a59b; font-weight: 400; text-align: right; } #rang th:nth-child(2) { text-align: left; }
  #rang td { padding: 2px 3px; text-align: right; white-space: nowrap; } #rang td:first-child { color: #a9a59b; }
  #rang td.nm { text-align: left; max-width: 108px; overflow: hidden; text-overflow: ellipsis; } #rang td.pt { text-align: center; color: #a9a59b; }
  #rang tr.ich td { color: #ffd54a; font-weight: 700; }
  #rang i, #mini i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; box-shadow: 0 0 0 1px #07040e; }
  #rang small { color: #a9a59b; } #rang .leg, #mini .leg { color: #a9a59b; font-size: 10px; margin-top: 5px; }
  #rang .px { width: 14px; height: 14px; margin: 0; vertical-align: -2px; }
  #mini { position: absolute; right: 12px; bottom: 12px; padding: 6px; z-index: 4; pointer-events: none; }
  #mini canvas { position: static; display: block; width: 168px; height: 168px; image-rendering: pixelated; }
  #mini .leg i { margin-left: 4px; }
  #hint { position: absolute; left: 50%; bottom: 62px; transform: translateX(-50%); pointer-events: none; }
  #keys { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); pointer-events: none; font-size: 12px; color: #cfc9e0; white-space: nowrap; }
  #keys kbd { background: rgba(255, 255, 255, 0.12); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font: 700 11px ui-monospace, Consolas, monospace; color: #fff; }

  /* Grosse Schrift (Überfall) */
  .banner { position: fixed; left: 0; right: 0; top: 34%; z-index: 40; text-align: center; font: 900 clamp(48px, 11vw, 120px)/1 system-ui, sans-serif; letter-spacing: 0.08em; color: #ff4a3d;
    text-shadow: 0 4px 0 #3a0a08, 0 0 28px rgba(255, 60, 40, 0.65), 4px 4px 0 #000, -4px 4px 0 #000; pointer-events: none; animation: bannerIn 1.4s ease-out forwards; }
  @keyframes bannerIn { 0% { transform: scale(2.6); opacity: 0; } 14% { transform: scale(1); opacity: 1; } 22% { transform: translateX(-10px) scale(1); } 30% { transform: translateX(10px); } 38% { transform: translateX(0); } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(1.06); } }

  /* Fenster */
  #panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5, 4, 10, 0.5); z-index: 10; }
  #panel-box { background: var(--panel); border: 1px solid var(--accent); border-radius: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0,0,0,.5);
    width: min(560px, calc(100vw - 280px)); max-height: calc(100vh - 60px); overflow: auto; padding: 16px 18px 14px; margin-left: 120px; }
  #panel-box.wide { width: min(760px, calc(100vw - 280px)); }
  #panel-box h2 { margin: 0 0 4px; font-size: 19px; letter-spacing: 0.02em; }
  #panel-box .sub { color: var(--muted); font-size: 13px; margin: 0 0 10px; white-space: pre-line; }
  #panel-box p { margin: 6px 0; line-height: 1.45; font-size: 14px; }
  .list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .list.two { display: grid; grid-template-columns: 1fr 1fr; }
  .it { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; cursor: pointer; font-size: 14px; }
  .it .sb { color: var(--muted); font-size: 12px; text-align: right; }
  .it.sel { background: rgba(138, 63, 252, 0.4); border-color: var(--accent-2); }
  .it.dis { opacity: 0.45; cursor: default; }
  .foot { margin-top: 10px; color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .bar { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.12); overflow: hidden; min-width: 90px; }
  .bar > i { display: block; height: 100%; background: var(--green); }
  .px { image-rendering: pixelated; vertical-align: -5px; margin-right: 8px; }
  .tag .px { vertical-align: -2px; margin-right: 3px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; color: #111; font-weight: 700; margin-left: 4px; }
  input[type=text], textarea { font: inherit; width: 100%; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); border-radius: 9px; color: var(--text); padding: 9px 11px; user-select: text; -webkit-user-select: text; }
  textarea { height: 110px; font: 12px ui-monospace, Consolas, monospace; resize: none; }
  .btn { background: var(--accent); border: 0; border-radius: 9px; padding: 9px 16px; font-weight: 700; cursor: pointer; }
  .btn.alt { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--line); }
  .starters { display: flex; gap: 10px; margin-top: 10px; }
  .starters canvas { position: static; width: 96px; height: 96px; }
  .starters .it { flex-direction: column; flex: 1; text-align: center; }
  .cols { display: flex; gap: 14px; }
  .cols > div { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--line); }

  /* Titelbild */
  #start { position: absolute; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, rgba(138, 63, 252, 0.28), rgba(8, 6, 14, 0.96) 70%); }
  #start .box { width: min(520px, calc(100vw - 280px)); margin-left: 120px; text-align: center; }
  #start h1 { font-size: 44px; margin: 0; letter-spacing: 0.03em; text-shadow: 0 0 24px rgba(138, 63, 252, 0.8); }
  #start h1 span { color: var(--accent-2); }
  #start .tl { color: var(--muted); margin: 6px 0 18px; }
  #start .list { margin-top: 14px; text-align: left; }
  #start .fld { text-align: left; font-size: 13px; color: var(--muted); margin-top: 6px; }
  #start .fld input { margin-top: 3px; }
  .farben { display: flex; gap: 8px; margin: 6px 0 2px; }
  .farben button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .farben button.on { border-color: #fff; }

  /* Kampf */
  #bbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; padding: 10px 14px 12px; background: linear-gradient(transparent, rgba(6, 4, 12, 0.92) 26%);
    display: flex; gap: 14px; align-items: flex-end; padding-left: 140px; }
  #blog { flex: 1; min-height: 92px; background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 15px; font-size: 16px; line-height: 1.45; display: flex; flex-direction: column; gap: 6px; }
  #blog .t2 { color: var(--muted); font-size: 12px; }
  #bmenu { width: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; min-height: 92px; }
  #bmenu .list { margin: 0; }
  #bmenu .it { padding: 6px 10px; }
  #timer { color: var(--gold); font-weight: 700; }

  /* Karten oben in der Mitte (Einladungen) */
  #cards { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); z-index: 11; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .card { background: var(--panel); border: 1px solid var(--accent-2); border-radius: 12px; padding: 10px 16px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .card kbd { background: rgba(255,255,255,.14); border-radius: 5px; padding: 1px 7px; font: 700 12px ui-monospace, Consolas, monospace; }
  #toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); z-index: 12; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
  #toast div { background: rgba(10, 8, 18, 0.9); border: 1px solid var(--accent-2); padding: 7px 14px; border-radius: 10px; font-size: 14px; }
  #gesten { position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); font-size: 12px; color: #cfc9e0; pointer-events: none; }
  @media (max-width: 900px) { #panel-box, #start .box { margin-left: 0; width: calc(100vw - 24px); } #bbar { padding-left: 14px; flex-direction: column; align-items: stretch; } #bmenu { width: auto; } }
/* ---- Lobby-Optik (Anfang) ---- */
/* Dunkle Fantasy mit Pixelrahmen: Steinplatten, Fackelschein, Pixelschrift */
#start { background:radial-gradient(ellipse at 50% 22%,rgba(255,170,60,.16),transparent 45%),radial-gradient(ellipse at 50% 30%,rgba(138,63,252,.22),rgba(6,4,12,.97) 72%); }
#start h1 { font-family:"Courier New",Consolas,monospace; font-weight:900; text-transform:uppercase; letter-spacing:.06em; color:#f2e6c8; text-shadow:3px 3px 0 #3b1a72,6px 6px 0 #0a0612; }
#start h1 span { color:#c9a6ff; }
#start .tl { color:#bfae8a; font-style:italic; font-family:Georgia,serif; }
#panel-box, #bmenu, #blog, .card, #start .box > #start-body { font-family:"Courier New",Consolas,monospace; }
#panel-box, #bmenu, #blog { background:#1b1328; border:0; border-radius:0; box-shadow:0 -4px 0 0 #07040e,0 4px 0 0 #07040e,-4px 0 0 0 #07040e,4px 0 0 0 #07040e,inset 0 0 0 3px #4a3578,inset 0 0 0 6px #120b1d,10px 10px 0 0 rgba(0,0,0,.45); }
#panel-box h2 { font-family:"Courier New",monospace; text-transform:uppercase; letter-spacing:.08em; color:#ffd54a; text-shadow:2px 2px 0 #07040e; }
.it { border-radius:0; background:#2a1f40; border:0; box-shadow:0 -3px 0 0 #07040e,0 3px 0 0 #07040e,-3px 0 0 0 #07040e,3px 0 0 0 #07040e,inset 0 -3px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.1); margin:3px 0; }
.it:hover { background:#3b2c5c; }
.it.sel { background:#6a35c9; box-shadow:0 -3px 0 0 #ffd54a,0 3px 0 0 #ffd54a,-3px 0 0 0 #ffd54a,3px 0 0 0 #ffd54a,inset 0 -3px 0 rgba(0,0,0,.35); }
.btn { border-radius:0; background:#6a35c9; color:#fff; box-shadow:0 -3px 0 0 #07040e,0 3px 0 0 #07040e,-3px 0 0 0 #07040e,3px 0 0 0 #07040e,inset 0 -4px 0 rgba(0,0,0,.35),inset 0 4px 0 rgba(255,255,255,.2); text-transform:uppercase; letter-spacing:.06em; font-family:"Courier New",monospace; }
.btn.alt { background:#2a1f40; border:0; }
input[type=text], textarea { border-radius:0; background:#0e0817; border:0; box-shadow:0 0 0 3px #07040e,inset 0 3px 0 rgba(0,0,0,.6); font-family:"Courier New",monospace; }
.farben button { border-radius:0; border:3px solid #07040e; } .farben button.on { box-shadow:0 0 0 3px #fff; }
.card, #toast div { border-radius:0; background:#1b1328; box-shadow:0 0 0 3px #07040e,inset 0 0 0 3px #4a3578; border:0; }
.hbox { border-radius:0; border:0; background:rgba(14,8,23,.82); box-shadow:0 0 0 3px #07040e,inset 0 0 0 2px #4a3578; font-family:"Courier New",monospace; }
/* ---- Lobby-Optik (Ende) ---- */
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="hudL" class="hbox"></div>
  <div id="hudR" class="hbox"></div>
</div>
<div id="quick" class="hidden"><button id="qBeutel" title="Beutel (I)">🎒<kbd>I</kbd></button><button id="qTeam" title="Team (T)">🐉<kbd>T</kbd></button></div>
<div id="hint" class="hidden"></div>
<div id="keys" class="hidden"></div>
<div id="cards"></div>
<div id="toast"></div>

<div id="start">
  <div class="box">
    <h1>Catch a <span>Mob</span></h1>
    <div class="tl">Fang düstere Mobs, zieh mit der Party los und besiege Riesen.</div>
    <div id="start-body"></div>
  </div>
</div>

<div id="panel" class="hidden"><div id="panel-box"></div></div>

<div id="bbar" class="hidden">
  <div id="blog"></div>
  <div id="bmenu"></div>
</div>
