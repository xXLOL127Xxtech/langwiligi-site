<style>

* { box-sizing: border-box; }


:root {
  --sky: #0a140d;
  --glow: #1d3a26;
  --ring: rgba(120, 220, 160, .2);
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background:
    radial-gradient(1100px 560px at 50% -10%, var(--glow) 0%, var(--sky) 60%),
    var(--sky);
  color: #e6f2e6;
  font-family: system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 600ms ease;
}

#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 10px;
}

#stage {
  position: relative;
  width: 720px;
  height: 688px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow:
    0 0 0 1px var(--ring),
    0 24px 60px rgba(0, 0, 0, .65),
    inset 0 0 0 3px rgba(0, 0, 0, .4);
  background: var(--sky);
  transition: box-shadow 600ms ease, background 600ms ease;
}

#game {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: pointer;
}

.hint {
  margin: 0;
  font-size: 12.5px;
  letter-spacing: .3px;
  color: rgba(230, 242, 230, .48);
}

.hint span { opacity: .4; margin: 0 2px; }

kbd {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 1px;
  border-radius: 5px;
  background: rgba(255, 255, 255, .09);
  border: 1px solid rgba(255, 255, 255, .16);
  border-bottom-width: 2px;
  font: inherit;
  font-size: 11.5px;
  color: #ecf6ec;
}

.hidden { display: none !important; }


.footbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 16px; }
/* Knöpfe unter dem Spielfeld, damit sie die Anzeige oben nicht verdecken */
.sysbtns {
  display: flex;
  gap: 6px;
}

.sysbtn {
  padding: 5px 10px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, .16);
  background: rgba(8, 22, 13, .6);
  color: rgba(255, 255, 255, .72);
  font: 600 11.5px/1 inherit;
  cursor: pointer;
  backdrop-filter: blur(3px);
  transition: .15s;
}

.sysbtn:hover {
  background: rgba(18, 46, 28, .85);
  color: #fff;
  border-color: rgba(120, 220, 160, .5);
}


.overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(5, 12, 8, .62);
  backdrop-filter: blur(4px);
  animation: fade .22s ease;
}

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

@keyframes pop {
  from { opacity: 0; transform: translateY(14px) scale(.96); }
  to   { opacity: 1; transform: none; }
}

.modal {
  position: relative;
  width: min(620px, 100%);
  max-height: 100%;
  overflow: auto;
  padding: 30px 30px 26px;
  text-align: center;
  border-radius: 26px;
  
  background:
    radial-gradient(120% 80% at 50% -20%, rgba(150, 245, 190, .16) 0%, rgba(150, 245, 190, 0) 60%),
    linear-gradient(180deg, rgba(30, 56, 39, .97), rgba(11, 24, 16, .98));
  border: 2px solid rgba(150, 240, 180, .4);
  box-shadow:
    0 24px 70px rgba(0, 0, 0, .66),
    0 0 0 4px rgba(6, 16, 10, .55),
    inset 0 2px 0 rgba(255, 255, 255, .18),
    inset 0 -18px 40px rgba(0, 0, 0, .3);
  animation: pop .24s cubic-bezier(.2, .9, .3, 1.1);
}


.modal::before {
  content: "";
  position: absolute;
  left: 12%;
  right: 12%;
  top: 1px;
  height: 1px;
  border-radius: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent);
  pointer-events: none;
}


.logo { line-height: .95; margin-bottom: 6px; }

.logo-main {
  display: block;
  font-size: 58px;
  font-weight: 900;
  letter-spacing: 6px;
  background: linear-gradient(180deg, #d6f6ff 8%, #6cd0f8 40%, #1f97d8 72%, #0f5e9c 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .45));
}

.logo-sub {
  display: block;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 12px;
  color: #d9ecd9;
  text-indent: 12px;
  margin-top: 2px;
}

.tagline {
  margin: 10px 0 18px;
  font-size: 12.5px;
  color: rgba(230, 242, 230, .45);
}

.modal h2 {
  margin: 0 0 6px;
  font-size: 32px;
  letter-spacing: 1.5px;
  
  text-shadow:
    2px 0 0 rgba(8, 18, 11, .9), -2px 0 0 rgba(8, 18, 11, .9),
    0 2px 0 rgba(8, 18, 11, .9), 0 -2px 0 rgba(8, 18, 11, .9),
    0 4px 0 rgba(8, 18, 11, .55),
    0 0 20px rgba(140, 232, 154, .35);
}

.modal h2.ok  { color: #8ce89a; }
.modal h2.bad { color: #ff7a68; }

.modal .sub {
  margin: 0 0 18px;
  font-size: 13.5px;
  color: rgba(230, 242, 230, .6);
}

.gold { color: #ffd75e; }
b.bad { color: #ff7a68; }


.records {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 16px;
}

.rec {
  flex: 0 0 130px;
  padding: 10px 8px;
  border-radius: 12px;
  background: rgba(0, 0, 0, .28);
  border: 1px solid rgba(255, 255, 255, .08);
}

.rec b {
  display: block;
  font-size: 20px;
  color: #ffd75e;
}

.rec span {
  font-size: 11px;
  color: rgba(230, 242, 230, .45);
}


.rules {
  font-size: 12.5px;
  line-height: 2;
  color: rgba(230, 242, 230, .68);
  margin-bottom: 20px;
}

.rules .tip {
  margin-top: 6px;
  font-size: 11.5px;
  color: rgba(230, 242, 230, .4);
  line-height: 1.7;
}


.legend {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px 12px;
  margin: 0 0 18px;
  text-align: left;
}

.lg {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-size: 11.5px;
  line-height: 1.5;
}

.lg i {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .12);
}

.lg b {
  flex: none;
  color: rgba(240, 250, 240, .9);
  font-weight: 700;
}

.lg span {
  color: rgba(230, 242, 230, .42);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}


.carry {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 10px;
  margin: -8px 0 18px;
  padding: 9px 12px;
  border-radius: 12px;
  background: rgba(90, 200, 140, .1);
  border: 1px solid rgba(140, 232, 154, .22);
}

.carry-t {
  font-size: 11px;
  letter-spacing: 1px;
  color: rgba(140, 232, 154, .9);
}

.carry em {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-style: normal;
  font-weight: 700;
  font-size: 12px;
  color: rgba(240, 250, 240, .92);
}

.carry em i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, .12);
}


.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 0 0 20px;
}

.stats > div {
  padding: 12px 6px;
  border-radius: 14px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .09), rgba(0, 0, 0, .32));
  border: 1px solid rgba(255, 255, 255, .14);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 2px 0 rgba(0, 0, 0, .3);
}

.stats span {
  display: block;
  font-size: 11px;
  color: rgba(230, 242, 230, .58);
  margin-bottom: 4px;
}

.stats b {
  font-size: 23px;
  text-shadow: 0 2px 0 rgba(8, 18, 11, .8);
}


.btn {
  display: block;
  width: 100%;
  margin: 8px 0 0;
  padding: 13px 18px;
  border: 0;
  border-radius: 12px;
  font: 800 16px/1 inherit;
  letter-spacing: 1px;
  cursor: pointer;
  transition: .15s;
}

.btn.primary {
  background: linear-gradient(180deg, #6cd0f8, #1f97d8);
  color: #06283c;
  box-shadow: 0 5px 0 #0f5e9c, 0 10px 22px rgba(31, 151, 216, .3);
}

.btn.primary:hover { filter: brightness(1.07); transform: translateY(-1px); }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #0f5e9c; }

.btn.ghost {
  background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .04));
  color: rgba(230, 242, 230, .82);
  border: 1px solid rgba(255, 255, 255, .18);
  
  box-shadow: 0 4px 0 rgba(0, 0, 0, .45);
}

.btn.ghost:hover { background: rgba(255, 255, 255, .17); color: #fff; }
.btn.ghost:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, .45); }


.diffs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.diff {
  flex: 1 1 0;
  padding: 9px 6px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, .1);
  background: rgba(0, 0, 0, .26);
  color: rgba(230, 242, 230, .6);
  font: inherit;
  cursor: pointer;
  transition: .15s;
}

.diff b {
  display: block;
  font-size: 15px;
  margin-bottom: 2px;
}

.diff span { font-size: 10.5px; opacity: .8; }

.diff:hover { background: rgba(255, 255, 255, .07); color: #ecf6ec; }

.diff.on {
  border-color: rgba(120, 220, 160, .7);
  background: rgba(90, 200, 140, .14);
  color: #8ce89a;
  box-shadow: inset 0 0 0 1px rgba(120, 220, 160, .25);
}


/* Mehrspieler-Menüs */
.modes3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 14px; }
.mode3 { padding: 14px 8px 12px; border-radius: 14px; border: 1px solid rgba(150, 240, 180, .35); cursor: pointer; font: inherit; color: #ecf6ec;
  background: linear-gradient(180deg, rgba(108, 208, 248, .22), rgba(31, 151, 216, .12)); transition: .15s; }
.mode3:hover { filter: brightness(1.15); transform: translateY(-1px); }
.mode3:disabled { opacity: .45; cursor: default; filter: none; transform: none; }
.mode3 b { display: block; font-size: 17px; margin-bottom: 4px; }
.mode3 span { font-size: 11.5px; opacity: .85; line-height: 1.3; display: block; }
.sublbl { margin: 10px 0 6px; font-size: 11.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: rgba(190, 235, 200, .7); }
.fld { display: block; text-align: left; font-size: 13px; font-weight: 700; color: rgba(230, 242, 230, .85); margin: 6px 0; }
.fld input, .joinrow input { display: block; width: 100%; box-sizing: border-box; margin-top: 5px; padding: 11px 12px; border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, .2); background: rgba(0, 0, 0, .35); color: #fff; font: 600 16px system-ui, sans-serif; }
.joinrow { display: flex; gap: 8px; margin-top: 10px; }
.joinrow input { margin: 0; text-transform: uppercase; letter-spacing: .3em; text-align: center; }
.joinrow .btn { width: auto; margin: 0; padding: 0 18px; }
.msg { min-height: 1.3em; margin: 8px 0 0; color: #ffb0a0; font-size: 13.5px; }
.btn.small { display: inline-block; width: auto; padding: 8px 14px; font-size: 13px; margin: 2px 0 6px; background: rgba(255, 255, 255, .12); color: #ecf6ec; }
.code { font-family: ui-monospace, monospace; letter-spacing: .25em; color: #ffd75e; }
.plist { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.lp { padding: 6px 12px; border-radius: 999px; background: rgba(0, 0, 0, .3); font-weight: 700; font-size: 14px; }
.lp span { opacity: .65; font-weight: 500; }
.teams { display: flex; gap: 10px; margin: 6px 0 10px; }
.tm { flex: 1; padding: 8px; border-radius: 12px; background: rgba(0, 0, 0, .25); display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
.tm.t0 { border: 1px solid rgba(110, 190, 255, .5); } .tm.t1 { border: 1px solid rgba(255, 140, 120, .5); }
.tm b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.chk { display: block; margin: 4px 0 8px; font-size: 14px; }
.score2 { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 6px 0 12px; font-size: 26px; font-weight: 900; }
.score2 .b { color: #7fc8ff; } .score2 .r { color: #ff9a8a; } .score2 i { font-style: normal; opacity: .6; }
.wait { color: #ffd75e !important; }
.keys2 .p1 { color: #7fc8ff; } .keys2 .p2 { color: #ff9a8a; }
.board { margin: 4px 0 8px; font-size: 13px; }
.board table { width: 100%; border-collapse: collapse; } .board td, .board th { padding: 3px 6px; text-align: left; }
@media (max-width: 560px) { .modes3 { grid-template-columns: 1fr; } }


.stick {
  position: absolute;
  left: calc(18px * var(--ctl, 1));
  bottom: calc(20px * var(--ctl, 1));
  width: calc(124px * var(--ctl, 1));
  height: calc(124px * var(--ctl, 1));
  border-radius: 50%;
  z-index: 6;
  background: rgba(10, 26, 17, .38);
  border: 1.5px solid rgba(200, 240, 220, .34);
  box-shadow: inset 0 1px 10px rgba(255, 255, 255, .1), 0 4px 18px rgba(0, 0, 0, .28);
  touch-action: none;
}

@supports (backdrop-filter: blur(4px)) or (-webkit-backdrop-filter: blur(4px)) {
  .stick {
    background: rgba(10, 26, 17, .2);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }
}

.stick-knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: calc(52px * var(--ctl, 1));
  height: calc(52px * var(--ctl, 1));
  margin: calc(-26px * var(--ctl, 1)) 0 0 calc(-26px * var(--ctl, 1));
  border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, rgba(255, 255, 255, .92),
              rgba(196, 232, 252, .4) 48%, rgba(120, 180, 215, .26) 78%);
  border: 1.5px solid rgba(255, 255, 255, .55);
  box-shadow: 0 3px 12px rgba(0, 0, 0, .32), inset 0 2px 5px rgba(255, 255, 255, .5);
}


.bombbtn,
.needlebtn {
  position: absolute;
  z-index: 6;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(10, 26, 17, .38);
  border: 1.5px solid rgba(200, 240, 220, .36);
  box-shadow: inset 0 1px 10px rgba(255, 255, 255, .1), 0 4px 18px rgba(0, 0, 0, .3);
  padding: 0;
  color: inherit;
  font: inherit;
  touch-action: none;
  cursor: pointer;
}

@supports (backdrop-filter: blur(4px)) or (-webkit-backdrop-filter: blur(4px)) {
  .bombbtn,
  .needlebtn {
    background: rgba(10, 26, 17, .2);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
}

.bombbtn {
  right: calc(20px * var(--ctl, 1));
  bottom: calc(26px * var(--ctl, 1));
  width: calc(86px * var(--ctl, 1));
  height: calc(86px * var(--ctl, 1));
}

.bombbtn .glyph { width: calc(48px * var(--ctl, 1)); height: calc(48px * var(--ctl, 1)); }
.bombbtn:active { transform: scale(.93); border-color: rgba(255, 255, 255, .7); }


.bombbtn.warn {
  border-color: rgba(255, 122, 98, .95);
  box-shadow: 0 0 0 calc(4px * var(--ctl, 1)) rgba(255, 90, 60, .28),
              0 4px 18px rgba(0, 0, 0, .3);
}


.needlebtn {
  right: calc(112px * var(--ctl, 1));
  bottom: calc(52px * var(--ctl, 1));
  width: calc(62px * var(--ctl, 1));
  height: calc(62px * var(--ctl, 1));
}

.needlebtn .glyph { width: calc(36px * var(--ctl, 1)); height: calc(36px * var(--ctl, 1)); }
.needlebtn:active { transform: scale(.93); border-color: rgba(255, 255, 255, .7); }


.bombbtn .badge,
.needlebtn .badge {
  position: absolute;
  left: 50%;
  bottom: 9%;
  transform: translateX(-50%);
  min-width: 26px;
  padding: 1px 6px;
  border-radius: 9px;
  background: rgba(6, 16, 10, .68);
  border: 1px solid rgba(255, 255, 255, .22);
  color: #eafff0;
  font: 800 11px/1.45 "PingFang SC", system-ui, sans-serif;
  text-align: center;
  white-space: nowrap;
  pointer-events: none;
}

.bombbtn .badge { color: #bfe6ff; }
.needlebtn .badge { color: #ffd7ec; }


@media (max-width: 720px) {
  .logo-main { font-size: 44px; }
  .logo-sub { font-size: 20px; letter-spacing: 9px; }
  .modal { padding: 22px 18px 20px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .legend { grid-template-columns: minmax(0, 1fr); }
  .hint { font-size: 11px; }
  .diffs { flex-direction: column; }
  .diff span { display: none; }
  .sysbtns { gap: 5px; }
  
  .sysbtn { padding: 6px 10px; font-size: 12px; }
}


@media (hover: none) and (pointer: coarse) {
  .hint { display: none; }
}
</style>

<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" width="720" height="688"></canvas>


      
      <div id="stick" class="stick hidden">
        <div id="stick-knob" class="stick-knob"></div>
      </div>
      <button id="btn-bomb" class="bombbtn hidden" aria-label="Blase legen">
        <svg class="glyph" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="25" r="14.5" fill="#78c3f5" fill-opacity=".75"/>
          <circle cx="24" cy="25" r="14.5" fill="none" stroke="#e6f6ff" stroke-width="2.4"/>
          <ellipse cx="18.5" cy="19" rx="5" ry="3" fill="#fff" opacity=".92" transform="rotate(-28 18.5 19)"/>
        </svg>
        <span class="badge" id="bomb-badge">1/1</span>
      </button>
      <button id="btn-needle" class="needlebtn hidden" aria-label="Nadel">
        <svg class="glyph" viewBox="0 0 48 48" aria-hidden="true">
          <g transform="rotate(-45 24 24)" stroke-linecap="round">
            <rect x="18.5" y="13" width="11" height="17" rx="2.6" fill="#ffe4f2" fill-opacity=".92" stroke="#e58cc0" stroke-width="1.8"/>
            <rect x="21.5" y="17.5" width="5" height="9" rx="1.4" fill="#ef6bb4"/>
            <path d="M17 30h14M21 34h6" stroke="#e58cc0" stroke-width="2.4"/>
            <path d="M24 34v6" stroke="#e58cc0" stroke-width="2.4"/>
            <path d="M24 13V6" stroke="#dff2ff" stroke-width="2.6"/>
          </g>
        </svg>
        <span class="badge" id="needle-badge">×1</span>
      </button>

      <div id="overlay" class="overlay hidden">
        <div id="modal" class="modal"></div>
      </div>
    </div>

window.PB = window.PB || {};
(function (PB) {
  'use strict';

  
  var TILE = 48;
  var COLS = 15;
  var ROWS = 13;
  var HUD_H = 64;

  var TAU = Math.PI * 2;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function dist(x1, y1, x2, y2) { var dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); }

  
  function makeRng(seed) {
    var a = seed >>> 0;
    function rng() {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    rng.range = function (lo, hi) { return lo + rng() * (hi - lo); };
    rng.int = function (lo, hi) { return Math.floor(lo + rng() * (hi - lo + 1)); };
    rng.pick = function (arr) { return arr[Math.floor(rng() * arr.length)]; };
    rng.chance = function (p) { return rng() < p; };
    return rng;
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  }

    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

      return v === null ? fallback : JSON.parse(v);
    } catch (e) { return fallback; }
  }

  }

  PB.C = {
    TILE: TILE,
    COLS: COLS,
    ROWS: ROWS,
    HUD_H: HUD_H,
    W: COLS * TILE,

      master.connect(ctx.destination);
      musicBus = ctx.createGain();
      musicBus.gain.value = 0.4;

  <script>

window.PB = window.PB || {};
(function (PB) {
  'use strict';

  var C = PB.C;
  var U = PB.Utils;

  
  var FALLBACK = {
    key: 'grass',
    floorA: '#79c14e', floorB: '#70b646', speck: 'rgba(30,80,20,.22)',
    wallTop: '#9aa7b0', wallMid: '#7d8a94', wallLow: '#5f6b74', wallEdge: 'rgba(28,36,42,.75)',
    boxTop: '#c08b48', boxMid: '#a9743a', boxLow: '#8e5c2c', boxEdge: '#6e4419',
    sky: '#0d1f14', accent: '#8ce89a'

  function th(theme) { return theme || FALLBACK; }

  
  var OUTLINE = '#241a14';

  
  function tileHash(x, y, salt) {
    var n = Math.sin(x * 12.9898 + y * 78.233 + (salt || 0) * 37.719) * 43758.5453;

  }

  
  function floor(theme) {

    var cv = document.createElement('canvas');

    var vg = c.createLinearGradient(0, 0, 0, H);
    vg.addColorStop(0, 'rgba(0,0,0,.16)');
    vg.addColorStop(0.12, 'rgba(0,0,0,0)');
    vg.addColorStop(0.88, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.16)');
    c.fillStyle = vg;
    c.fillRect(0, 0, C.W, H);

    return cv;
  }

  
  function decorGrass(c, rng, T, H) {
    
    for (var i = 0; i < 400; i++) {
      var gx = rng.range(0, C.W), gy = rng.range(6, H);
      c.strokeStyle = rng.chance(0.55) ? T.speck : 'rgba(255,255,255,.16)';
      c.lineWidth = 1.2;
      c.lineCap = 'round';
      var lean = rng.range(-0.5, 0.5);
      c.beginPath();
      for (var k = -1; k <= 1; k++) {
        var a = -Math.PI / 2 + lean + k * 0.32;

        c.moveTo(gx, gy);
        c.quadraticCurveTo(
          gx + Math.cos(a) * len * 0.5, gy + Math.sin(a) * len * 0.6,
          gx + Math.cos(a) * len * 0.9 + lean * 2, gy + Math.sin(a) * len);
      }
      c.stroke();
    }
    for (var f = 0; f < 26; f++) {
      var fx = rng.range(8, C.W - 8), fy = rng.range(8, H - 8);
      for (var p = 0; p < 5; p++) {

        c.fillStyle = rng.chance(0.6) ? '#ffffff' : '#ffe9a8';
        c.beginPath();
        c.arc(fx + Math.cos(ang) * 2.6, fy + Math.sin(ang) * 2.6, 1.8, 0, C.TAU);
        c.fill();

      c.fillStyle = '#ffcf45';
      c.beginPath();
      c.arc(fx, fy, 1.5, 0, C.TAU);
      c.fill();
    }
  }

  
  function decorDesert(c, rng, T, H) {
    for (var i = 0; i < 150; i++) {
      var x = rng.range(-20, C.W), y = rng.range(0, H);
      var w = rng.range(18, 52);
      c.strokeStyle = rng.chance(0.5) ? 'rgba(255,244,210,.28)' : T.speck;
      c.lineWidth = rng.range(1, 2.2);
      c.beginPath();
      c.moveTo(x, y);
      c.quadraticCurveTo(x + w / 2, y - rng.range(2, 6), x + w, y);
      c.stroke();
    }
    for (var s = 0; s < 70; s++) {
      c.fillStyle = rng.chance(0.5) ? 'rgba(150,110,60,.35)' : 'rgba(255,240,200,.4)';
      c.beginPath();
      c.arc(rng.range(0, C.W), rng.range(0, H), rng.range(1, 2.4), 0, C.TAU);
      c.fill();
    }
  }

  
  function decorSnow(c, rng, T, H) {
    
    for (var d = 0; d < 26; d++) {
      var dx2 = rng.range(0, C.W), dy2 = rng.range(0, H);
      var dr = rng.range(20, 46);
      var dg = c.createRadialGradient(dx2, dy2, 0, dx2, dy2, dr);
      dg.addColorStop(0, 'rgba(120,170,210,.14)');

      c.fillStyle = dg;
      c.beginPath();
      c.arc(dx2, dy2, dr, 0, C.TAU);
      c.fill();
    }

    
    for (var i = 0; i < 60; i++) {
      var x = rng.range(6, C.W - 6), y = rng.range(6, H - 6), r = rng.range(2.5, 5);
      c.strokeStyle = 'rgba(255,255,255,.6)';
      c.lineWidth = 1.1;
      c.beginPath();
      for (var k = 0; k < 3; k++) {
        var a = (k / 3) * Math.PI;
        c.moveTo(x - Math.cos(a) * r, y - Math.sin(a) * r);
        c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
      }
      c.stroke();
    }

    
    for (var j = 0; j < 10; j++) {
      var sx2 = rng.range(-20, C.W * 0.8), sy2 = rng.range(10, H - 10);
      var ang = rng.range(-0.32, 0.32);
      var len = rng.range(90, 190);
      var ex2 = sx2 + Math.cos(ang) * len, ey2 = sy2 + Math.sin(ang) * len;
      c.strokeStyle = T.speck;
      c.lineWidth = 1.1;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(sx2, sy2);
      c.lineTo(ex2, ey2);
      
      var mx2 = sx2 + (ex2 - sx2) * 0.55, my2 = sy2 + (ey2 - sy2) * 0.55;
      c.moveTo(mx2, my2);
      c.lineTo(mx2 + Math.cos(ang + 0.7) * len * 0.28, my2 + Math.sin(ang + 0.7) * len * 0.28);
      c.stroke();
    }
  }

  
  function decorLava(c, rng, T, H) {
    
    for (var i = 0; i < 9; i++) {
      var px = rng.range(-30, C.W * 0.7);
      var py = rng.range(12, H - 12);
      var pts = [[px, py]];
      var span = 3 + ((rng.range(0, 4)) | 0);
      for (var s = 0; s < span; s++) {
        px += rng.range(26, 52);
        py += rng.range(-14, 14);
        pts.push([px, py]);
      }

      var layers = [
        ['rgba(24,10,6,.75)', 6.5],
        ['rgba(214,74,20,.85)', 3.6],
        ['rgba(255,206,110,.9)', 1.5]
      ];
      for (var li = 0; li < layers.length; li++) {
        c.strokeStyle = layers[li][0];
        c.lineWidth = layers[li][1];
        c.lineCap = 'round';
        c.lineJoin = 'round';
        c.beginPath();
        c.moveTo(pts[0][0], pts[0][1]);
        
        for (var k = 1; k < pts.length; k++) {

  function wall(c, x, y, theme) {

    g.addColorStop(0.5, T.wallMid);

    if (T.key === 'snow') wallIceFacets(c, x, y, t);

  function wallStoneCracks(c, x, y, t) {

    var joints = [                              
      x + t * (0.34 + h1 * 0.2),

    }

    c.lineTo(joints[0], y + rows[0]);
    c.moveTo(joints[1], y + rows[0]);
    c.lineTo(joints[1], y + rows[1]);
    c.moveTo(joints[2], y + rows[1]);
    c.lineTo(joints[2], y + t - 4);
    c.stroke();

    
    c.strokeStyle = 'rgba(255,255,255,.16)';

    c.strokeStyle = 'rgba(255,120,50,.5)';

    c.lineTo(x + t * 0.66, y + t * 0.82);

  function box(c, x, y, theme) {
    var T = th(theme);

  function blockShade(c, bx, by, bs, radius) {

    c.beginPath();
    c.moveTo(bx, by);
    c.lineTo(bx + bs, by);
    c.lineTo(bx + bs - 4, by + bs * 0.22);
    c.lineTo(bx + 4, by + bs * 0.22);
    c.closePath();
    c.fill();
    c.fillStyle = 'rgba(0,0,0,.2)';
    c.fillRect(bx, by + bs * 0.85, bs, bs * 0.15);

  function boxWoodCrate(c, x, y, T) {

    c.moveTo(bx + 5, by + 5);
    c.lineTo(bx + bs - 5, by + bs - 5);

    c.lineTo(bx + 5, by + bs - 5);
    c.stroke();
    c.strokeStyle = 'rgba(255,240,215,.24)';
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(bx + 5, by + 5);
    c.lineTo(bx + bs - 5, by + bs - 5);
    c.moveTo(bx + bs - 5, by + 5);
    c.lineTo(bx + 5, by + bs - 5);
    c.stroke();

    
    c.fillStyle = T.boxEdge;
    [[bx + 5, by + 5], [bx + bs - 5, by + 5], [bx + 5, by + bs - 5], [bx + bs - 5, by + bs - 5]].forEach(function (p) {

    });

    c.strokeStyle = T.boxEdge;
    c.lineWidth = 2.5;
    U.roundRect(c, bx, by, bs, bs, 5);
    c.stroke();
    c.strokeStyle = 'rgba(255,245,220,.3)';
    c.lineWidth = 1.2;
    U.roundRect(c, bx + 1.5, by + 1.5, bs - 3, bs - 3, 4);
    c.stroke();
    
    c.strokeStyle = 'rgba(36,26,20,.45)';
    c.lineWidth = 1;
    U.roundRect(c, bx - 1, by - 1, bs + 2, bs + 2, 6);
    c.stroke();
  }

  
  function boxClayJar(c, x, y, T) {
    var t = C.TILE;
    var cx = x + t / 2;

    c.fillStyle = 'rgba(20,30,20,.22)';
    c.beginPath();
    c.ellipse(cx, y + t * 0.86, t * 0.3, t * 0.09, 0, 0, C.TAU);
    c.fill();

    var g = c.createLinearGradient(x, y, x + t, y + t);
    g.addColorStop(0, T.boxTop);
    g.addColorStop(0.6, T.boxMid);
    g.addColorStop(1, T.boxLow);
    c.fillStyle = g;
    
    c.beginPath();
    c.moveTo(cx - t * 0.16, y + t * 0.16);
    c.bezierCurveTo(cx - t * 0.42, y + t * 0.36, cx - t * 0.4, y + t * 0.8, cx, y + t * 0.84);
    c.bezierCurveTo(cx + t * 0.4, y + t * 0.8, cx + t * 0.42, y + t * 0.36, cx + t * 0.16, y + t * 0.16);
    c.closePath();
    c.fill();
    c.strokeStyle = T.boxEdge;
    c.lineWidth = 2.2;
    c.stroke();

    
    c.fillStyle = T.boxLow;
    c.beginPath();
    c.ellipse(cx, y + t * 0.17, t * 0.17, t * 0.06, 0, 0, C.TAU);
    c.fill();
    c.strokeStyle = T.boxEdge;
    c.lineWidth = 1.6;
    c.stroke();

    
    c.strokeStyle = 'rgba(90,60,26,.5)';
    c.lineWidth = 2.4;
    c.beginPath();
    c.moveTo(cx - t * 0.3, y + t * 0.5);
    c.quadraticCurveTo(cx, y + t * 0.56, cx + t * 0.3, y + t * 0.5);
    c.stroke();
    
    c.fillStyle = 'rgba(255,246,215,.3)';
    c.beginPath();
    c.ellipse(cx - t * 0.14, y + t * 0.4, t * 0.06, t * 0.14, -0.25, 0, C.TAU);
    c.fill();
  }

  
  function boxIceBlock(c, x, y, T) {
    var t = C.TILE;
    var inset = 3;
    var bx = x + inset, by = y + inset, bs = t - inset * 2;

    var g = c.createLinearGradient(bx, by, bx + bs, by + bs);
    g.addColorStop(0, T.boxTop);
    g.addColorStop(0.5, T.boxMid);
    g.addColorStop(1, T.boxLow);
    c.fillStyle = g;
    U.roundRect(c, bx, by, bs, bs, 4);
    c.fill();

    
    c.fillStyle = 'rgba(255,255,255,.42)';
    c.beginPath();
    c.moveTo(bx + bs * 0.16, by + bs * 0.2);
    c.lineTo(bx + bs * 0.6, by + bs * 0.1);
    c.lineTo(bx + bs * 0.38, by + bs * 0.56);
    c.closePath();
    c.fill();
    c.beginPath();
    c.arc(bx + bs * 0.7, by + bs * 0.62, bs * 0.08, 0, C.TAU);
    c.arc(bx + bs * 0.52, by + bs * 0.78, bs * 0.05, 0, C.TAU);
    c.fill();

    
    c.strokeStyle = T.boxEdge;
    c.lineWidth = 2.4;
    U.roundRect(c, bx, by, bs, bs, 4);
    c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.75)';
    c.lineWidth = 1.2;
    U.roundRect(c, bx + 2, by + 2, bs - 4, bs - 4, 3);
    c.stroke();
  }

  
  function boxObsidian(c, x, y, T) {
    var t = C.TILE;
    var cx = x + t / 2, cy = y + t / 2;

    c.fillStyle = 'rgba(255,110,40,.16)';
    c.beginPath();
    c.arc(cx, cy, t * 0.44, 0, C.TAU);
    c.fill();

    var g = c.createLinearGradient(x + 4, y + 4, x + t - 4, y + t - 4);
    g.addColorStop(0, T.boxTop);
    g.addColorStop(0.55, T.boxMid);
    g.addColorStop(1, T.boxLow);
    c.fillStyle = g;
    
    c.beginPath();
    c.moveTo(cx, y + t * 0.1);
    c.lineTo(x + t * 0.88, y + t * 0.34);
    c.lineTo(x + t * 0.8, y + t * 0.82);
    c.lineTo(cx - t * 0.06, y + t * 0.92);
    c.lineTo(x + t * 0.13, y + t * 0.62);
    c.lineTo(x + t * 0.18, y + t * 0.26);
    c.closePath();
    c.fill();
    c.strokeStyle = T.boxEdge;
    c.lineWidth = 2.2;
    c.stroke();

    
    c.strokeStyle = 'rgba(255,255,255,.22)';
    c.lineWidth = 1.4;
    c.beginPath();
    c.moveTo(cx, y + t * 0.1);
    c.lineTo(cx - t * 0.04, y + t * 0.56);
    c.lineTo(x + t * 0.13, y + t * 0.62);
    c.stroke();
    c.strokeStyle = 'rgba(255,140,60,.75)';
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(cx - t * 0.04, y + t * 0.56);
    c.lineTo(x + t * 0.8, y + t * 0.82);
    c.stroke();
  }

  
  function bomb(c, b, time) {
    var t = C.TILE;
    var danger = b.timer < 0.7;                       
    var pulse = danger
      ? 1 + 0.1 * Math.sin(time * (14 + (0.7 - b.timer) * 22))
      : 1 + 0.045 * Math.sin(time * 5);
    var r = t * 0.4 * pulse;

    
    c.fillStyle = 'rgba(20,30,20,.28)';
    c.beginPath();
    c.ellipse(b.x, b.y + t * 0.32, r * 0.85, r * 0.32, 0, 0, C.TAU);
    c.fill();

    
    if (b.sliding && b.sliding()) {
      c.save();
      c.globalAlpha = 0.3;
      c.fillStyle = '#bfe6ff';
      c.beginPath();
      c.ellipse(b.x - b.slideX * r * 0.8, b.y - b.slideY * r * 0.8, r * 0.7, r * 0.7, 0, 0, C.TAU);
      c.fill();
      c.restore();
    }

    
    var g = c.createRadialGradient(b.x - r * 0.3, b.y - r * 0.35, r * 0.1, b.x, b.y, r);
    if (danger) {
      g.addColorStop(0, 'rgba(255,230,225,.92)');
      g.addColorStop(0.42, 'rgba(255,140,125,.82)');
      g.addColorStop(0.85, 'rgba(226,60,48,.9)');
      g.addColorStop(1, 'rgba(160,24,16,.95)');
    } else {
      g.addColorStop(0, 'rgba(225,245,255,.92)');
      g.addColorStop(0.45, 'rgba(140,210,250,.7)');
      g.addColorStop(0.85, 'rgba(70,160,235,.82)');
      g.addColorStop(1, 'rgba(24,100,190,.92)');
    }
    c.fillStyle = g;
    c.beginPath();
    c.arc(b.x, b.y, r, 0, C.TAU);
    c.fill();

    
    c.strokeStyle = danger ? 'rgba(96,14,8,.9)' : 'rgba(14,58,112,.85)';
    c.lineWidth = 2.4;
    c.stroke();
    c.strokeStyle = danger ? 'rgba(255,208,196,.6)' : 'rgba(232,250,255,.62)';
    c.lineWidth = 1.4;
    c.beginPath();
    c.arc(b.x, b.y, r - 2.2, 0, C.TAU);
    c.stroke();

    
    var left = U.clamp(b.timer / b.duration, 0, 1);
    c.save();
    c.strokeStyle = danger ? 'rgba(255,120,100,.9)' : 'rgba(255,255,255,.55)';
    c.lineWidth = 2.4;
    c.beginPath();
    c.arc(b.x, b.y, r + 3, -Math.PI / 2, -Math.PI / 2 + C.TAU * left);
    c.stroke();
    c.restore();

    
    c.fillStyle = 'rgba(255,255,255,.9)';
    c.beginPath();
    c.ellipse(b.x - r * 0.36, b.y - r * 0.42, r * 0.3, r * 0.18, -0.6, 0, C.TAU);
    c.fill();
    c.globalAlpha = 0.75;
    c.beginPath();
    c.ellipse(b.x - r * 0.14, b.y - r * 0.58, r * 0.1, r * 0.07, -0.4, 0, C.TAU);
    c.fill();
    c.globalAlpha = 1;

    
    c.strokeStyle = 'rgba(255,255,255,.4)';
    c.lineWidth = 2.4;
    c.beginPath();
    c.arc(b.x, b.y, r * 0.62, 0.35, 1.2);
    c.stroke();

    
    c.fillStyle = 'rgba(255,255,255,.5)';
    c.beginPath();
    c.arc(b.x + r * 0.4, b.y - r * 0.1, r * 0.09, 0, C.TAU);
    c.arc(b.x + r * 0.2, b.y + r * 0.3, r * 0.06, 0, C.TAU);
    c.fill();
  }

  
  function flame(c, f, time) {
    var t = C.TILE;
    var p = f.life / f.maxLife;                        /* 1 → 0 */
    var grow = Math.sin(Math.min(1, (1 - p) * 4) * Math.PI / 2);  
    var fade = p < 0.3 ? p / 0.3 : 1;
    var s = t * 0.5 * (0.72 + 0.28 * grow) * (0.85 + 0.15 * Math.sin(time * 26 + f.seed));
    var x = C.cellCX(f.col), y = C.cellCY(f.row);
    var alpha = 0.35 + 0.65 * fade;

    c.save();
    c.globalAlpha = alpha;
    c.translate(x, y);

    
    function arm(x1, y1, x2, y2, rr, color) {
      c.fillStyle = color;
      if (x1 === x2) {
        var top = Math.min(y1, y2), bot = Math.max(y1, y2);
        U.roundRect(c, -rr, top, rr * 2, bot - top, rr);
      } else {
        var left = Math.min(x1, x2), right = Math.max(x1, x2);
        U.roundRect(c, left, -rr, right - left, rr * 2, rr);
      }
      c.fill();
    }

    
    function layer(rr, color) {
      if (f.kind === 'center') {
        c.fillStyle = color;
        c.beginPath();
        c.arc(0, 0, rr, 0, C.TAU);
        c.fill();
      } else if (f.kind === 'mid') {
        if (f.axis === 'h') arm(-t / 2 - 2, 0, t / 2 + 2, 0, rr, color);
        else arm(0, -t / 2 - 2, 0, t / 2 + 2, rr, color);
      } else {
        var reach = t / 2 + 2;
        arm(-f.ex * reach - f.ex * rr * 0.4, -f.ey * reach - f.ey * rr * 0.4,
            f.ex * rr * 0.2, f.ey * rr * 0.2, rr, color);
      }
    }

    
    layer(s * 1.0, '#ff5a2a');
    layer(s * 0.72, '#ffa63a');
    layer(s * 0.42, '#fff3c4');

    if (f.kind === 'center') {
      c.globalAlpha = alpha * 0.5;
      c.fillStyle = '#fff8dc';
      c.beginPath();
      c.arc(0, 0, s * 0.28, 0, C.TAU);
      c.fill();
    }
    c.restore();
  }

  
  function item(c, it, time) {
    var t = C.TILE;
    var x = C.cellCX(it.col);
    var baseY = C.cellCY(it.row);
    
    var hop = it.pop > 0 ? Math.sin((1 - it.pop / 0.5) * Math.PI) * 12 : 0;
    var y = baseY + Math.sin(it.t * 3) * 2.2 - hop;
    var info = PB.Entities.ITEMS[it.kind];
    var r = t * 0.36;

    c.fillStyle = 'rgba(20,30,20,.25)';
    c.beginPath();
    c.ellipse(x, baseY + t * 0.3, r * 0.8, r * 0.28, 0, 0, C.TAU);
    c.fill();

    
    var g = c.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.7, '#f4f9ff');
    g.addColorStop(1, '#d9e6f2');
    c.fillStyle = g;
    c.beginPath();
    c.arc(x, y, r, 0, C.TAU);
    c.fill();
    c.strokeStyle = info.color;
    c.lineWidth = 3;
    c.stroke();

    
    c.save();
    c.globalAlpha = 0.25 + 0.15 * Math.sin(time * 4);
    c.strokeStyle = info.color;
    c.lineWidth = 2;
    c.beginPath();
    c.arc(x, y, r + 3.5, 0, C.TAU);
    c.stroke();
    c.restore();

    c.save();
    c.translate(x, y);
    itemIcon(c, it.kind, r * 0.6);
    c.restore();
  }

  
  function itemIcon(c, kind, r) {
    if (kind === 'bomb') iconBubble(c, r * 0.92);
    else if (kind === 'power') iconFlame(c, r);
    else if (kind === 'speed') iconBolt(c, r);
    else if (kind === 'needle') iconNeedle(c, r);
    else if (kind === 'shield') iconShield(c, r);
    else if (kind === 'kick') iconKick(c, r);
    else if (kind === 'mega') iconMega(c, r);
    else if (kind === 'turbo') iconTurbo(c, r);
    else if (kind === 'hop') iconHop(c, r);
    else if (kind === 'freeze') iconFreeze(c, r);
    else if (kind === 'slow') iconSnail(c, r);
    else iconBubble(c, r * 0.92);
  }

  // ---------- Icons der Spezial-Items ----------
  function iconMega(c, r) {
    iconFlame(c, r * 0.9);
    c.fillStyle = '#fff'; c.strokeStyle = '#8a0f2a'; c.lineWidth = Math.max(1, r * 0.12);
    c.font = '900 ' + Math.round(r * 0.95) + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.strokeText('+2', r * 0.55, r * 0.55); c.fillText('+2', r * 0.55, r * 0.55);
  }
  function iconTurbo(c, r) {
    // Flasche mit Blitz
    c.fillStyle = '#e6fffb'; c.strokeStyle = '#137a6a'; c.lineWidth = Math.max(1, r * 0.12);
    c.beginPath(); c.moveTo(-r * 0.25, -r * 0.95); c.lineTo(r * 0.25, -r * 0.95); c.lineTo(r * 0.25, -r * 0.45);
    c.quadraticCurveTo(r * 0.8, -r * 0.25, r * 0.75, r * 0.4); c.quadraticCurveTo(r * 0.7, r * 0.95, 0, r * 0.95);
    c.quadraticCurveTo(-r * 0.7, r * 0.95, -r * 0.75, r * 0.4); c.quadraticCurveTo(-r * 0.8, -r * 0.25, -r * 0.25, -r * 0.45); c.closePath();
    c.fill(); c.stroke();
    c.fillStyle = '#2ee6c8'; c.beginPath(); c.moveTo(r * 0.12, -r * 0.2); c.lineTo(-r * 0.3, r * 0.3); c.lineTo(0, r * 0.3); c.lineTo(-r * 0.12, r * 0.8); c.lineTo(r * 0.35, r * 0.15); c.lineTo(r * 0.05, r * 0.15); c.closePath(); c.fill();
  }
  function iconHop(c, r) {
    // Schuh mit Feder
    c.strokeStyle = '#7a4a12'; c.lineWidth = Math.max(1.2, r * 0.16);
    c.beginPath();
    for (var i = 0; i <= 6; i++) { var x = (i % 2 ? 0.35 : -0.35) * r, y = r * (0.25 + i * 0.12); if (i) c.lineTo(x, y); else c.moveTo(x, y); }
    c.stroke();
    c.fillStyle = '#ffa63a'; c.strokeStyle = '#7a4a12'; c.lineWidth = Math.max(1, r * 0.12);
    c.beginPath(); c.moveTo(-r * 0.8, r * 0.2); c.lineTo(-r * 0.8, -r * 0.55); c.quadraticCurveTo(-r * 0.6, -r * 0.85, -r * 0.2, -r * 0.6);
    c.lineTo(r * 0.3, -r * 0.2); c.quadraticCurveTo(r * 0.95, -r * 0.1, r * 0.9, r * 0.2); c.closePath(); c.fill(); c.stroke();
  }
  function iconFreeze(c, r) {
    c.strokeStyle = '#e8f8ff'; c.lineWidth = Math.max(1.4, r * 0.17); c.lineCap = 'round';
    for (var i = 0; i < 3; i++) {
      var a = i * Math.PI / 3, dx = Math.cos(a) * r * 0.9, dy = Math.sin(a) * r * 0.9;
      c.beginPath(); c.moveTo(-dx, -dy); c.lineTo(dx, dy); c.stroke();
    }
    c.strokeStyle = '#4aa3d8'; c.lineWidth = Math.max(1, r * 0.09);
    for (var k = 0; k < 6; k++) {
      var b = k * Math.PI / 3, x = Math.cos(b) * r * 0.55, y = Math.sin(b) * r * 0.55;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(b + 0.7) * r * 0.25, y + Math.sin(b + 0.7) * r * 0.25);
      c.moveTo(x, y); c.lineTo(x + Math.cos(b - 0.7) * r * 0.25, y + Math.sin(b - 0.7) * r * 0.25); c.stroke();
    }
  }
  function iconSnail(c, r) {
    c.fillStyle = '#c9b48a'; c.strokeStyle = '#4a3a1a'; c.lineWidth = Math.max(1, r * 0.12);
    c.beginPath(); c.moveTo(-r * 0.95, r * 0.6); c.lineTo(r * 0.95, r * 0.6); c.quadraticCurveTo(r * 1.0, r * 0.2, r * 0.6, r * 0.25);
    c.lineTo(-r * 0.95, r * 0.4); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#8a5a2a';
    c.beginPath(); c.arc(-r * 0.05, r * 0.05, r * 0.55, 0, Math.PI * 2); c.fill(); c.stroke();
    c.strokeStyle = '#f2d8a8'; c.beginPath(); c.arc(-r * 0.05, r * 0.05, r * 0.28, 0.3, Math.PI * 1.8); c.stroke();
    c.strokeStyle = '#4a3a1a'; c.beginPath(); c.moveTo(r * 0.7, r * 0.25); c.lineTo(r * 0.85, -r * 0.25); c.moveTo(r * 0.85, r * 0.25); c.lineTo(r * 1.0, -r * 0.15); c.stroke();
  }

  
  function iconBubble(c, r) {
    var g = c.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    g.addColorStop(0, 'rgba(230,248,255,.95)');
    g.addColorStop(0.6, 'rgba(120,195,245,.85)');
    g.addColorStop(1, 'rgba(24,100,190,.95)');
    c.fillStyle = g;
    c.beginPath();
    c.arc(0, 0, r, 0, C.TAU);
    c.fill();
    c.strokeStyle = 'rgba(16,80,160,.8)';
    c.lineWidth = Math.max(1.2, r * 0.16);
    c.stroke();
    c.fillStyle = '#fff';
    c.beginPath();
    c.ellipse(-r * 0.35, -r * 0.4, r * 0.28, r * 0.16, -0.6, 0, C.TAU);
    c.fill();
  }

  
  function iconFlame(c, r) {
    c.fillStyle = '#ff6a2a';
    c.beginPath();
    c.moveTo(0, -r);
    c.bezierCurveTo(r * 0.9, -r * 0.25, r * 0.75, r * 0.45, 0, r);
    c.bezierCurveTo(-r * 0.75, r * 0.45, -r * 0.9, -r * 0.25, 0, -r);
    c.fill();
    c.fillStyle = '#ffc63a';
    c.beginPath();
    c.moveTo(0, -r * 0.25);
    c.bezierCurveTo(r * 0.45, r * 0.1, r * 0.4, r * 0.6, 0, r * 0.8);
    c.bezierCurveTo(-r * 0.4, r * 0.6, -r * 0.45, r * 0.1, 0, -r * 0.25);
    c.fill();
    c.fillStyle = '#fff3c4';
    c.beginPath();
    c.arc(0, r * 0.35, r * 0.2, 0, C.TAU);
    c.fill();
  }

  
  function iconBolt(c, r) {
    c.fillStyle = '#ffd23a';
    c.strokeStyle = '#3d7a2c';
    c.lineWidth = Math.max(1, r * 0.14);
    c.beginPath();
    c.moveTo(-r * 0.15, -r);
    c.lineTo(r * 0.45, -r);
    c.lineTo(r * 0.05, -r * 0.12);
    c.lineTo(r * 0.55, -r * 0.12);
    c.lineTo(-r * 0.25, r);
    c.lineTo(-r * 0.05, r * 0.05);
    c.lineTo(-r * 0.55, r * 0.05);
    c.closePath();
    c.fill();
    c.stroke();
  }

  
  function iconNeedle(c, r) {
    c.save();
    c.rotate(-Math.PI / 4);
    
    c.fillStyle = '#ffe4f2';
    U.roundRect(c, -r * 0.26, -r * 0.5, r * 0.52, r * 0.95, r * 0.16);
    c.fill();
    c.strokeStyle = '#c73f8c';
    c.lineWidth = Math.max(1, r * 0.13);
    U.roundRect(c, -r * 0.26, -r * 0.5, r * 0.52, r * 0.95, r * 0.16);
    c.stroke();
    
    c.fillStyle = '#ef6bb4';
    U.roundRect(c, -r * 0.15, -r * 0.16, r * 0.3, r * 0.5, r * 0.1);
    c.fill();
    
    c.strokeStyle = '#c73f8c';
    c.lineWidth = Math.max(1.2, r * 0.16);
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, -r * 0.5);
    c.lineTo(0, -r * 0.95);
    c.moveTo(-r * 0.3, -r * 0.95);
    c.lineTo(r * 0.3, -r * 0.95);
    
    c.moveTo(0, r * 0.45);
    c.lineTo(0, r * 1.0);
    c.stroke();
    c.restore();
  }

  
  function iconShield(c, r) {
    c.beginPath();
    c.moveTo(0, -r);
    c.lineTo(r * 0.82, -r * 0.6);
    c.lineTo(r * 0.82, r * 0.18);
    c.quadraticCurveTo(r * 0.72, r * 0.82, 0, r);
    c.quadraticCurveTo(-r * 0.72, r * 0.82, -r * 0.82, r * 0.18);
    c.lineTo(-r * 0.82, -r * 0.6);
    c.closePath();
    var g = c.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, '#fff3ad');
    g.addColorStop(1, '#e8b400');
    c.fillStyle = g;
    c.fill();
    c.strokeStyle = '#9a7400';
    c.lineWidth = Math.max(1, r * 0.14);
    c.stroke();
    
    c.strokeStyle = 'rgba(255,255,255,.9)';
    c.lineWidth = Math.max(1.2, r * 0.18);
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, -r * 0.44);
    c.lineTo(0, r * 0.4);
    c.moveTo(-r * 0.38, -r * 0.06);
    c.lineTo(r * 0.38, -r * 0.06);
    c.stroke();
  }

  
  function iconKick(c, r) {
    
    c.fillStyle = '#dff0ff';
    c.beginPath();
    c.arc(r * 0.52, -r * 0.3, r * 0.32, 0, C.TAU);
    c.fill();
    c.strokeStyle = '#6a3aa8';
    c.lineWidth = Math.max(1, r * 0.12);
    c.stroke();
    
    c.fillStyle = '#a86ae0';
    c.beginPath();
    c.moveTo(-r * 0.85, r * 0.1);
    c.lineTo(-r * 0.3, r * 0.1);
    c.quadraticCurveTo(r * 0.15, r * 0.12, r * 0.16, r * 0.6);
    c.lineTo(-r * 0.85, r * 0.6);
    c.closePath();
    c.fill();
    c.strokeStyle = '#6a3aa8';
    c.lineWidth = Math.max(1, r * 0.13);
    c.stroke();
    
    c.strokeStyle = 'rgba(255,255,255,.75)';
    c.lineWidth = Math.max(1, r * 0.11);
    c.beginPath();
    c.moveTo(r * 0.1, -r * 0.78);
    c.lineTo(r * 0.42, -r * 0.9);
    c.moveTo(r * 0.86, -r * 0.66);
    c.lineTo(r * 1.0, -r * 0.9);
    c.stroke();
  }

  
  function player(c, p, time, isHuman) {
    var t = C.TILE;

    
    if (!p.alive) {
      var dp = Math.min(1, p.deathT / 0.9);
      if (dp >= 1) return;
      c.save();
      c.globalAlpha = 1 - dp;
      c.translate(p.x, p.y - dp * 26);
      c.rotate(dp * 2.6);
      c.scale(1 - dp * 0.55, 1 - dp * 0.55);
      drawBody(c, p, 0, 0, true);
      c.restore();
      return;
    }

    
    var groundY = p.y + t * 0.4;
    c.fillStyle = 'rgba(20,30,20,.3)';
    c.beginPath();
    c.ellipse(p.x, groundY, t * 0.29, t * 0.1, 0, 0, C.TAU);
    c.fill();

    c.strokeStyle = p.team === 0 ? 'rgba(130,225,255,.7)' : 'rgba(255,150,125,.7)';
    c.lineWidth = 2;
    c.beginPath();
    c.ellipse(p.x, groundY, t * 0.29, t * 0.1, 0, 0, C.TAU);
    c.stroke();

    if (p.trapped) {
      drawTrapped(c, p, time);
    } else {
      var bounce = p.moving ? Math.abs(Math.sin(p.walkPhase)) * 3.2 : Math.sin(time * 2.4 + p.id) * 1.1;
      
      var flick = p.graceT > 0 && Math.sin(time * 12.5) < -0.25;
      c.save();
      if (flick) c.globalAlpha = 0.5;
      drawBody(c, p, p.x, p.y - bounce, false);
      c.restore();
      if (p.shieldT > 0) drawShieldAura(c, p, time);
      if (p.freezeT > 0 || p.slowT > 0 || p.hopT > 0) {
        c.save();
        c.translate(p.x + t * 0.32, p.y - t * 0.5);
        c.globalAlpha = 0.9;
        itemIcon(c, p.freezeT > 0 ? 'freeze' : p.slowT > 0 ? 'slow' : 'hop', t * 0.13);
        c.restore();
        if (p.freezeT > 0) {
          c.save(); c.globalAlpha = 0.28; c.fillStyle = '#bfe8ff';
          c.beginPath(); c.ellipse(p.x, p.y - t * 0.15, t * 0.38, t * 0.52, 0, 0, C.TAU); c.fill(); c.restore();
        }
      }
    }

    if (isHuman) drawHumanMarker(c, p, time, isHuman);
  }

  
  function drawTrapped(c, p, time) {
    var t = C.TILE;
    var TRAP = (PB.Entities && PB.Entities.TRAP_TIME) || 4.5;
    var left = U.clamp(p.trapT / TRAP, 0, 1);
    var urgent = left < 0.35;
    var wob = 1 + 0.05 * Math.sin(time * (urgent ? 16 : 7) + p.id);
    
    var r = t * 0.5 * wob;
    var ry = r * 1.16;
    
    var born = Math.min(1, p.popT / 0.22);
    var grow = 0.55 + 0.45 * born;
    r *= grow;
    ry *= grow;

    
    var shake = p.shake || 0;
    var sx = 1 + shake * 0.18 * Math.sin(time * 42);
    var sy = 1 - shake * 0.14 * Math.sin(time * 42);

    c.save();
    c.translate(p.x + shake * 3 * Math.sin(time * 55), p.y);
    c.scale(sx, sy);

    
    c.save();
    c.scale(0.72, 0.72);
    drawBody(c, p, 0, 6, false, true);
    c.restore();

    
    var g = c.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
    g.addColorStop(0, 'rgba(255,255,255,.12)');
    g.addColorStop(0.6, 'rgba(190,232,255,.08)');
    g.addColorStop(1, urgent ? 'rgba(255,120,110,.55)' : 'rgba(90,180,245,.5)');
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(0, 0, r, ry, 0, 0, C.TAU);
    c.fill();
    c.strokeStyle = urgent ? 'rgba(255,110,95,.95)' : 'rgba(150,220,255,.95)';
    c.lineWidth = 2.2 + shake * 1.2;
    c.stroke();

    
    c.fillStyle = 'rgba(255,255,255,.7)';
    c.beginPath();
    c.ellipse(-r * 0.52, -ry * 0.58, r * 0.2, r * 0.1, -0.6, 0, C.TAU);
    c.fill();

    c.restore();

    
    c.save();
    c.translate(p.x, p.y);
    c.strokeStyle = urgent ? '#ff6a58' : '#ffd75e';
    c.lineWidth = 3;
    c.lineCap = 'round';
    c.beginPath();
    c.ellipse(0, 0, r + 3, ry + 3, 0, -Math.PI / 2, -Math.PI / 2 + C.TAU * left);
    c.stroke();

    
    var sLeft = p.struggleLeft ? p.struggleLeft() : 0;
    if (sLeft > 0.01) {
      c.strokeStyle = 'rgba(140,232,154,.8)';
      c.lineWidth = 2;
      c.beginPath();
      c.ellipse(0, 0, r + 7.5, ry + 7.5, 0, -Math.PI / 2, -Math.PI / 2 + C.TAU * sLeft);
      c.stroke();
    }
    c.restore();
  }

  
  function drawShieldAura(c, p, time) {
    var t = C.TILE;
    
    var cy = p.y - t * 0.2;
    var rx = t * 0.46, ry = t * 0.62;
    var blink = p.shieldT < 2 && Math.sin(time * 16) < 0;

    c.save();
    c.translate(p.x, cy);
    c.globalAlpha = blink ? 0.3 : 1;

    
    c.globalCompositeOperation = 'lighter';
    var g = c.createRadialGradient(0, 0, rx * 0.72, 0, 0, rx);
    g.addColorStop(0, 'rgba(255,246,214,0)');
    g.addColorStop(0.86, 'rgba(255,246,214,.1)');
    g.addColorStop(1, 'rgba(255,246,214,.3)');
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(0, 0, rx, ry, 0, 0, C.TAU);
    c.fill();

    
    c.fillStyle = 'rgba(255,250,225,.95)';
    for (var i = 0; i < 4; i++) {
      var a = time * 2.2 + (i / 4) * C.TAU;
      var sx = Math.cos(a) * rx, sy = Math.sin(a) * ry;
      var s = 2.4 + 1.6 * Math.sin(time * 6 + i * 2);
      c.beginPath();
      c.moveTo(sx, sy - s);
      c.quadraticCurveTo(sx + s * 0.22, sy - s * 0.22, sx + s, sy);
      c.quadraticCurveTo(sx + s * 0.22, sy + s * 0.22, sx, sy + s);
      c.quadraticCurveTo(sx - s * 0.22, sy + s * 0.22, sx - s, sy);
      c.quadraticCurveTo(sx - s * 0.22, sy - s * 0.22, sx, sy - s);
      c.closePath();
      c.fill();
    }
    c.restore();
  }

  
  // label: true = einfacher Pfeil, Text = Name/Spielernummer darüber (Mehrspieler)
  function drawHumanMarker(c, p, time, label) {
    var t = C.TILE;
    var bob = Math.sin(time * 4) * 2.2;
    var y = p.y - t * 0.98 + bob;
    c.save();
    if (typeof label === 'string' && label) {
      c.font = '800 11px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'bottom';
      c.lineWidth = 3; c.strokeStyle = 'rgba(8,16,10,.85)';
      c.strokeText(label, p.x, y - 3);
      c.fillStyle = p.team === 0 ? '#bfe9ff' : '#ffc4b8';
      c.fillText(label, p.x, y - 3);
    }
    c.fillStyle = p.team === 0 ? '#8ce89a' : '#ffb08a';
    c.strokeStyle = 'rgba(10,30,16,.75)';
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(p.x, y + 7);
    c.lineTo(p.x - 5.5, y - 2);
    c.lineTo(p.x + 5.5, y - 2);
    c.closePath();
    c.fill();
    c.stroke();
    c.restore();
  }

  
  function drawBody(c, p, cx, cy, dying, trapped) {
    var cast = p.cast;
    var t = C.TILE;
    
    var r = t * 0.4;

    
    var back = p.dirY < 0 && p.dirX === 0;
    var side = p.dirX !== 0 ? (p.dirX > 0 ? 1 : -1) : 0;

    
    var moving = p.moving && !trapped && !dying;
    var ph = p.walkPhase || 0;
    var squash = moving ? 1 + Math.sin(ph * 2) * 0.05 : 1;
    var earSwing = moving ? Math.sin(ph - 0.7) * 0.34 : Math.sin((p.id || 0) + (p.walkPhase || 0) * 0.2) * 0.05;

    c.save();
    c.translate(cx, cy);

    
    var headR = r * 0.72;
    var headY = -r * 0.76;

    
    var bodyTop = headY + headR * 0.70;
    var bodyBot = r * 0.80;
    var narrow = side !== 0 ? 0.88 : 1;              
    var topW = headR * 0.80 * narrow / squash;
    var botW = headR * 1.02 * narrow / squash;

    
    drawEars(c, cast, headR, headY, earSwing, side, back);

    
    drawArms(c, cast, r, bodyTop, bodyBot, botW, ph, moving, side);

    drawSuit(c, cast, bodyTop, bodyBot, topW, botW, side, back);

    
    drawFeet(c, cast, r, bodyBot, ph, moving);

    
    var headX = side * headR * 0.12;

    
    var hg = c.createRadialGradient(headX - headR * 0.34, headY - headR * 0.42, headR * 0.12,
                                    headX, headY, headR * 1.18);
    hg.addColorStop(0, lighten(cast.body));
    hg.addColorStop(0.6, cast.body);
    hg.addColorStop(1, cast.dark);
    c.fillStyle = hg;
    c.strokeStyle = OUTLINE;
    c.lineWidth = 2.4;
    c.beginPath();
    c.ellipse(headX, headY, headR / squash, headR * 0.96 * squash, 0, 0, C.TAU);
    c.fill();
    c.stroke();

    
    c.fillStyle = 'rgba(255,255,255,.34)';
    c.beginPath();
    c.ellipse(headX - headR * 0.34, headY - headR * 0.44, headR * 0.26, headR * 0.13, -0.5, 0, C.TAU);
    c.fill();

    if (back) drawBackHead(c, cast, headR, headY);
    else drawFaceOn(c, p, cast, headR, headY, side, dying, trapped, headX);

    c.restore();
  }

  
  function drawEars(c, cast, headR, headY, swing, side, back) {
    var earL = headR * 1.3, earW = headR * 0.33;
    var baseY = headY - headR * 0.6;

    for (var i = 0; i < 2; i++) {
      var dir = i === 0 ? -1 : 1;
      var baseX = dir * headR * 0.38;
      
      var far = side !== 0 && dir !== side;
      var len = earL * (far ? 0.74 : 1);
      var lean = swing * dir * (far ? 0.6 : 1) + side * 0.26;

      c.save();
      c.translate(baseX + (far ? -side * headR * 0.12 : 0), baseY);
      c.rotate(dir * 0.2 + lean);

      c.fillStyle = far ? cast.dark : cast.body;
      c.strokeStyle = OUTLINE;
      c.lineWidth = 2.1;
      c.beginPath();
      c.ellipse(0, -len * 0.42, earW, len * 0.5, 0, 0, C.TAU);
      c.fill();
      c.stroke();

      if (!far && !back) {
        
        c.fillStyle = 'rgba(255,166,182,.9)';
        c.beginPath();
        c.ellipse(0, -len * 0.44, earW * 0.46, len * 0.34, 0, 0, C.TAU);
        c.fill();
      } else if (back) {
        
        c.strokeStyle = 'rgba(255,255,255,.3)';
        c.lineWidth = 1.4;
        c.lineCap = 'round';
        c.beginPath();
        c.moveTo(0, -len * 0.76);
        c.lineTo(0, -len * 0.14);
        c.stroke();
      }
      c.restore();
    }
  }

  
  function drawSuit(c, cast, top, bot, topW, botW, side, back) {
    var h = bot - top;
    var rc = Math.min(topW, botW) * 0.42;             

    c.beginPath();
    c.moveTo(-topW + rc, top);
    c.lineTo(topW - rc, top);
    c.quadraticCurveTo(topW, top, topW + (botW - topW) * 0.35, top + h * 0.42);
    c.quadraticCurveTo(botW, bot - rc * 1.2, botW - rc, bot);
    c.lineTo(-botW + rc, bot);
    c.quadraticCurveTo(-botW, bot - rc * 1.2, -topW - (botW - topW) * 0.35, top + h * 0.42);
    c.quadraticCurveTo(-topW, top, -topW + rc, top);
    c.closePath();

    var g = c.createLinearGradient(0, top, 0, bot);
    g.addColorStop(0, lighten(cast.body));
    g.addColorStop(0.45, cast.body);
    g.addColorStop(1, cast.dark);
    c.fillStyle = g;
    c.fill();
    c.strokeStyle = OUTLINE;
    c.lineWidth = 2.2;
    c.stroke();

    if (back) {
      
      c.strokeStyle = 'rgba(36,26,20,.28)';
      c.lineWidth = 1.4;
      c.beginPath();
      c.moveTo(0, top + h * 0.18);
      c.lineTo(0, bot - h * 0.14);
      c.stroke();
      return;
    }

    
    var bibX = side * botW * 0.16, bibY = top + h * 0.64;
    var bibRX = botW * 0.47, bibRY = h * 0.26;
    c.fillStyle = cast.belly;
    c.beginPath();
    c.ellipse(bibX, bibY, bibRX, bibRY, 0, 0, C.TAU);
    c.fill();
    
    var bg = c.createLinearGradient(0, bibY - bibRY, 0, bibY + bibRY);
    bg.addColorStop(0, 'rgba(255,255,255,0)');
    bg.addColorStop(1, 'rgba(36,26,20,.16)');
    c.fillStyle = bg;
    c.fill();
    
    c.strokeStyle = 'rgba(36,26,20,.5)';
    c.lineWidth = 1.3;
    c.stroke();

    
    c.fillStyle = 'rgba(36,26,20,.22)';
    c.beginPath();
    c.ellipse(0, top + h * 0.06, topW * 0.9, h * 0.11, 0, 0, C.TAU);
    c.fill();
  }

  
  function drawFeet(c, cast, r, bodyBot, ph, moving) {
    var step = moving ? Math.sin(ph) : 0;
    var fy = bodyBot + r * 0.04;
    var feet = [[-r * 0.34, fy + step * 2.4], [r * 0.34, fy - step * 2.4]];
    for (var i = 0; i < 2; i++) {
      c.fillStyle = cast.dark;
      c.strokeStyle = OUTLINE;
      c.lineWidth = 1.9;
      c.beginPath();
      c.ellipse(feet[i][0], feet[i][1], r * 0.27, r * 0.16, 0, 0, C.TAU);
      c.fill();
      c.stroke();
      c.fillStyle = 'rgba(255,255,255,.3)';
      c.beginPath();
      c.ellipse(feet[i][0] - r * 0.06, feet[i][1] - r * 0.05, r * 0.12, r * 0.05, -0.2, 0, C.TAU);
      c.fill();
    }
  }

  
  function drawArms(c, cast, r, top, bot, botW, ph, moving, side) {
    var h = bot - top;
    var swing = moving ? Math.sin(ph) : 0;
    var sy = top + h * 0.34;
    var list = side === 0
      ? [[-1, sy - swing * 2.2], [1, sy + swing * 2.2]]
      : [[side, sy + swing * 2.4]];

    for (var i = 0; i < list.length; i++) {
      var dir = list[i][0];
      c.save();
      
      c.translate(dir * botW * 1.04, list[i][1]);
      c.rotate(dir * (0.42 + swing * dir * 0.25));
      c.fillStyle = cast.body;
      c.strokeStyle = OUTLINE;
      c.lineWidth = 1.9;
      c.beginPath();
      c.ellipse(0, r * 0.18, r * 0.17, r * 0.28, 0, 0, C.TAU);
      c.fill();
      c.stroke();
      c.restore();
    }
  }

  
  function drawBackHead(c, cast, headR, headY) {
    c.fillStyle = 'rgba(36,26,20,.16)';
    c.beginPath();
    c.ellipse(0, headY + headR * 0.62, headR * 0.56, headR * 0.22, 0, 0, C.TAU);
    c.fill();
  }

  
  function drawFaceOn(c, p, cast, headR, headY, side, dying, trapped, headX) {
    
    var faceShift = (headX || 0) + side * headR * 0.2;
    var eyeGap = headR * (side !== 0 ? 0.28 : 0.36);
    var eyeY = headY + headR * 0.1;
    var eyes = [[faceShift - eyeGap, eyeY], [faceShift + eyeGap, eyeY]];
    
    var farEye = side === 0 ? -1 : (side > 0 ? 0 : 1);

    
    if (!dying) {
      c.fillStyle = 'rgba(255,150,168,.62)';
      for (var k = 0; k < 2; k++) {
        if (k === farEye) continue;
        c.beginPath();
        c.ellipse(eyes[k][0] + (k ? 1 : -1) * headR * 0.16, eyeY + headR * 0.32,
                  headR * 0.17, headR * 0.1, 0, 0, C.TAU);
        c.fill();
      }
    }

    if (dying) {
      c.strokeStyle = OUTLINE;
      c.lineWidth = 2.4;
      c.lineCap = 'round';
      for (var i = 0; i < 2; i++) {
        var e = eyes[i], s = headR * 0.2;
        c.beginPath();
        c.moveTo(e[0] - s, e[1] - s); c.lineTo(e[0] + s, e[1] + s);
        c.moveTo(e[0] + s, e[1] - s); c.lineTo(e[0] - s, e[1] + s);
        c.stroke();
      }
      return;
    }

    if (trapped) {
      
      c.strokeStyle = OUTLINE;
      c.lineWidth = 2.2;
      c.lineCap = 'round';
      for (var j = 0; j < 2; j++) {
        c.beginPath();
        c.arc(eyes[j][0], eyes[j][1], headR * 0.19, Math.PI + 0.3, C.TAU - 0.3);
        c.stroke();
      }
      c.lineWidth = 1.9;
      c.beginPath();
      c.arc(faceShift, headY + headR * 0.52, headR * 0.15, Math.PI + 0.35, C.TAU - 0.35);
      c.stroke();
      c.fillStyle = 'rgba(150,215,255,.95)';
      c.strokeStyle = 'rgba(40,90,130,.7)';
      c.lineWidth = 1;
      c.beginPath();
      c.ellipse(headR * 0.62, headY - headR * 0.1, headR * 0.11, headR * 0.16, 0, 0, C.TAU);
      c.fill();
      c.stroke();
      return;
    }

    
    var lookX = p.dirX * headR * 0.1;
    var lookY = p.dirY > 0 ? headR * 0.07 : 0;
    for (var m = 0; m < 2; m++) {
      var ex = eyes[m][0], ey = eyes[m][1];
      
      var shrink = m === farEye ? 0.64 : 1;
      c.fillStyle = '#fff';
      c.strokeStyle = OUTLINE;
      c.lineWidth = 1.7;
      c.beginPath();
      c.ellipse(ex, ey, headR * 0.23 * shrink, headR * 0.28 * shrink, 0, 0, C.TAU);
      c.fill();
      c.stroke();

      var pupil = shrink * (m === farEye ? 0.86 : 1);
      c.fillStyle = '#1b1410';
      c.beginPath();
      c.ellipse(ex + lookX, ey + lookY, headR * 0.115 * pupil, headR * 0.145 * pupil, 0, 0, C.TAU);
      c.fill();

      c.fillStyle = 'rgba(255,255,255,.95)';
      c.beginPath();
      c.arc(ex + lookX - headR * 0.05 * pupil, ey + lookY - headR * 0.06 * pupil,
            headR * 0.05 * pupil, 0, C.TAU);
      c.fill();
      c.globalAlpha = 0.6;
      c.beginPath();
      c.arc(ex + lookX + headR * 0.04 * pupil, ey + lookY + headR * 0.06 * pupil,
            headR * 0.026 * pupil, 0, C.TAU);
      c.fill();
      c.globalAlpha = 1;
    }

    
    c.strokeStyle = OUTLINE;
    c.lineWidth = 1.9;
    c.lineCap = 'round';
    c.beginPath();
    c.arc(faceShift + lookX * 0.5, headY + headR * 0.48, headR * 0.14, 0.35, Math.PI - 0.35);
    c.stroke();
  }

  
  
  function face(c, x, y, p, r) {
    var cast = p.cast;
    c.save();
    c.translate(x, y);

    
    var earW = r * 0.3, earL = r * 0.95;
    for (var i = 0; i < 2; i++) {
      var dir = i === 0 ? -1 : 1;
      c.save();
      c.translate(dir * r * 0.4, -r * 0.66);
      c.rotate(dir * 0.22);
      c.fillStyle = p.alive ? cast.body : '#5a6560';
      c.strokeStyle = OUTLINE;
      c.lineWidth = 1.6;
      c.beginPath();
      c.ellipse(0, -earL * 0.4, earW, earL * 0.5, 0, 0, C.TAU);
      c.fill();
      c.stroke();
      if (p.alive) {
        c.fillStyle = 'rgba(255,166,182,.9)';
        c.beginPath();
        c.ellipse(0, -earL * 0.42, earW * 0.44, earL * 0.32, 0, 0, C.TAU);
        c.fill();
      }
      c.restore();
    }

    var g = c.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.12, 0, 0, r);
    g.addColorStop(0, lighten(cast.body));
    g.addColorStop(0.68, cast.body);
