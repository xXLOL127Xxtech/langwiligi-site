          if (!this.circleBlocked(p.x, ny, p)) p.y = ny;
        }
      }
    }

    if (iy) {
      var ny2 = p.y + iy * step;
      if (!this.circleBlocked(p.x, ny2, p)) {
        p.y = ny2;
      } else {
        this.tryKick(p, 0, iy);
        var cx = C.cellCX(C.colOf(p.x));
        var off2 = p.x - cx;
        if (Math.abs(off2) > 1) {
          var sgn2 = off2 > 0 ? -1 : 1;
          var nx2 = p.x + sgn2 * Math.min(Math.abs(off2), step * 1.1);
          if (!this.circleBlocked(nx2, p.y, p)) p.x = nx2;
        }
      }
    }

    // Wer mit Hüpfschuhen auf einer Blase steht, darf sie danach noch verlassen
    if (p.hopT > 0) {
      for (var hb = 0; hb < this.bombs.length; hb++) {
        var bb = this.bombs[hb];
        if (this.circleHitsCell(p, bb.col, bb.row)) p.ghost[bb.col + ',' + bb.row] = 1;
      }
    }
    for (var g in p.ghost) {
      var parts = g.split(',');
      var gc = +parts[0], gr = +parts[1];
      var qx = U.clamp(p.x, gc * C.TILE, (gc + 1) * C.TILE);
      var qy = U.clamp(p.y, C.HUD_H + gr * C.TILE, C.HUD_H + (gr + 1) * C.TILE);
      var gx = p.x - qx, gy = p.y - qy;
      if (gx * gx + gy * gy >= p.radius * p.radius) delete p.ghost[g];
    }
  };

  
  Game.prototype.tryKick = function (p, dx, dy) {
    if (!p.canKick) return;
    var col = C.colOf(p.x) + dx, row = C.rowOf(p.y) + dy;
    var bomb = this.bombAt(col, row);
    if (!bomb || bomb.sliding()) return;
    if (this.tileAt(col + dx, row + dy) !== L.FLOOR) return;
    if (this.bombAt(col + dx, row + dy)) return;
    bomb.slideX = dx;
    bomb.slideY = dy;
    PB.Audio.play('kick');
  };

  
  Game.prototype.slideBombs = function (dt) {
    for (var i = 0; i < this.bombs.length; i++) {
      var b = this.bombs[i];
      if (!b.sliding()) continue;
      var step = E.KICK_SPEED * C.TILE * dt;
      var nx = b.x + b.slideX * step, ny = b.y + b.slideY * step;
      var ncol = C.colOf(nx), nrow = C.rowOf(ny);

      
      if (ncol !== b.col || nrow !== b.row) {
        var blocked = this.tileAt(ncol, nrow) !== L.FLOOR || this.bombAt(ncol, nrow);
        if (!blocked) {
          
          for (var pi = 0; pi < this.players.length && !blocked; pi++) {
            var q = this.players[pi];
            if (q.alive && this.circleHitsCell(q, ncol, nrow)) blocked = true;
          }
        }
        if (blocked) {
          b.x = C.cellCX(b.col);
          b.y = C.cellCY(b.row);
          b.slideX = 0;
          b.slideY = 0;
          continue;
        }
        delete this.bombGrid[b.col + ',' + b.row];
        b.col = ncol;
        b.row = nrow;
        this.bombGrid[ncol + ',' + nrow] = b;
      }
      b.x = nx;
      b.y = ny;
    }
  };

  
  
  Game.prototype.requestBomb = function (p) {
    if (this.placeBomb(p)) return true;
    
    if (p && p.slot && p.slot.kind !== 'bot' && p.active() && this.intro <= 0 && !this.pendingEnd) {
      p.bombBuffer = BOMB_BUFFER;
      
      if (this.activeBombCount(p) >= p.bombCap) p.capWarnT = 0.4;
    }
    return false;
  };

  Game.prototype.placeBomb = function (p) {
    if (!p || !p.active() || this.intro > 0 || this.pendingEnd) return false;
    var col = C.colOf(p.x), row = C.rowOf(p.y);
    if (this.bombAt(col, row)) return false;
    if (this.activeBombCount(p) >= p.bombCap) return false;

    var bomb = new E.Bomb(col, row, p);
    this.bombs.push(bomb);
    this.bombGrid[col + ',' + row] = bomb;
    p.ghost[col + ',' + row] = 1;
    
    for (var i = 0; i < this.players.length; i++) {
      var q = this.players[i];
      if (q !== p && q.alive && this.circleHitsCell(q, col, row)) {
        q.ghost[col + ',' + row] = 1;
      }
    }
    p.bombBuffer = 0;
    PB.Audio.play('place');
    if (p.brain) p.brain.onBombPlaced();
    return true;
  };

  
  Game.prototype.useNeedle = function (p) {
    if (!p || !p.alive || !p.trapped || p.needles <= 0) return false;
    p.needles--;
    if (p.loot.needle) p.loot.needle--;
    p.free();
    PB.Audio.play('rescue');
    this.popBubbleFx(p.x, p.y, p.cast.body);
    this.toast(p.x, p.y, 'Selbst befreit!', '#ef6bb4');
    return true;
  };

  
  Game.prototype.struggle = function (p) {
    if (!p || !p.struggle()) return false;
    PB.Audio.play('struggle');
    
    for (var i = 0; i < 3; i++) {
      var a = Math.random() * C.TAU;
      this.spawn(p.x, p.y, Math.cos(a) * 70, Math.sin(a) * 70 - 20,
        0.3, 1.6 + Math.random() * 1.4, '#dff4ff', 160);
    }
    return true;
  };

  
  Game.prototype.explode = function (bomb, toBlow) {
    bomb.dead = true;
    if (this.bombGrid[bomb.col + ',' + bomb.row] === bomb) {
      delete this.bombGrid[bomb.col + ',' + bomb.row];
    }

    var cells = [{ col: bomb.col, row: bomb.row, kind: 'center', axis: null, ex: 0, ey: 0 }];
    var DIRS = [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }];
    var fresh = {};   

    for (var d = 0; d < 4; d++) {
      var dx = DIRS[d].dx, dy = DIRS[d].dy;
      for (var step = 1; step <= bomb.power; step++) {
        var col = bomb.col + dx * step, row = bomb.row + dy * step;
        var tile = this.tileAt(col, row);
        if (tile === L.WALL) break;

        var isLast = step === bomb.power;
        var kind = isLast ? 'end' : 'mid';
        var axis = dx !== 0 ? 'h' : 'v';

        if (tile === L.BOX) {
          
          this.tiles[row * C.COLS + col] = L.FLOOR;
          this.boxesBroken++;
          if (bomb.owner && bomb.owner.team === 0) this.score += SC_BOX;
          this.spawnCrateBurst(col, row);
          PB.Audio.play('crate');
          var hidden = this.hidden[col + ',' + row];
          if (hidden && !this.itemAt(col, row)) {
            this.dropItem(col, row, hidden);
            fresh[col + ',' + row] = 1;
          }
          delete this.hidden[col + ',' + row];
          cells.push({ col: col, row: row, kind: kind, axis: axis, ex: dx, ey: dy });
          break;
        }

        var other = this.bombAt(col, row);
        if (other && !other.dead) {
          
          other.chain = true;
          other.slideX = 0;
          other.slideY = 0;
          toBlow.push(other);
          break;
        }

        cells.push({ col: col, row: row, kind: kind, axis: axis, ex: dx, ey: dy });
      }
    }

    
    for (var i = 0; i < cells.length; i++) {
      var cl = cells[i];
      var fl = new E.Flame(cl.col, cl.row, cl.kind, cl.axis, cl.ex, cl.ey);
      fl.owner = bomb.owner;
      this.flames.push(fl);
      this.flameGrid[cl.col + ',' + cl.row] = fl;

      
      var itemHere = this.itemAt(cl.col, cl.row);
      if (itemHere && !itemHere.dead && !fresh[cl.col + ',' + cl.row]) {
        itemHere.dead = true;
        this.spawnPickupBurst(C.cellCX(cl.col), C.cellCY(cl.row), '#d9e6f2');
      }
    }

    this.spawnExplosionBurst(C.cellCX(bomb.col), C.cellCY(bomb.row));
    this.shake = Math.max(this.shake, 7);
    PB.Audio.play('boom');
  };

  
  Game.prototype.dropItem = function (col, row, kind) {
    var item = new E.Item(col, row, kind);
    item.pop = 0.35;
    this.items.push(item);
    this.itemGrid[col + ',' + row] = item;
    return item;
  };

  
  Game.prototype.scatterLoot = function (p) {
    var pool = [];
    for (var k in p.loot) {
      for (var n = 0; n < p.loot[k]; n++) pool.push(k);
    }
    if (!pool.length) return;

    
    var drops = Math.min(3, Math.max(1, Math.round(pool.length / 2)));
    var col0 = C.colOf(p.x), row0 = C.rowOf(p.y);
    var spots = this.freeSpotsNear(col0, row0, drops);

    for (var i = 0; i < spots.length; i++) {
      var pick = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
      if (!pick) break;
      var it = this.dropItem(spots[i].col, spots[i].row, pick);
      it.pop = 0.5;
      this.spawnPickupBurst(C.cellCX(spots[i].col), C.cellCY(spots[i].row), E.ITEMS[pick].color);
    }
  };

  
  Game.prototype.freeSpotsNear = function (col, row, want) {
    var out = [];
    var seen = {};
    var queue = [{ col: col, row: row }];
    var DIRS = [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }];
    seen[col + ',' + row] = 1;
    var guard = 0;

    while (queue.length && out.length < want && guard++ < 80) {
      var cur = queue.shift();
      if (this.tileAt(cur.col, cur.row) === L.FLOOR &&
          !this.itemAt(cur.col, cur.row) && !this.bombAt(cur.col, cur.row)) {
        out.push(cur);
      }
      for (var d = 0; d < 4; d++) {
        var nc = cur.col + DIRS[d].dx, nr = cur.row + DIRS[d].dy;
        var key = nc + ',' + nr;
        if (seen[key]) continue;
        seen[key] = 1;
        if (this.tileAt(nc, nr) === L.WALL) continue;
        queue.push({ col: nc, row: nr });
      }
    }
    return out;
  };

  
  Game.prototype.trapPlayer = function (p, by) {
    if (!p.alive || p.trapped || p.immune()) return;
    p.trap(by);
    PB.Audio.play('trap');
    this.spawnDeathBurst(p.x, p.y, '#bfe6ff');

    if (by && by.team !== p.team) {
      if (by.team === 0) {
        this.traps++;
        this.score += SC_TRAP;
        this.frameTrapped++;      
      }
      if (this.isHumanPlayer(p)) this.toast(p.x, p.y, (this.localHumans().length > 1 || this.isVersus() ? p.name + ' gefangen!' : 'Gefangen!'), '#ffd75e');
      else this.toast(p.x, p.y, 'Gefangen: ' + p.name, '#bfe6ff');
    }
  };

  
  Game.prototype.rescuePlayer = function (p, by) {
    if (!p.alive || !p.trapped) return;
    p.free();
    by.rescues++;
    PB.Audio.play('rescue');
    this.popBubbleFx(p.x, p.y, p.cast.body);
    if (by.team === 0) {
      this.rescues++;
      this.score += SC_RESCUE;
    }
    this.toast(p.x, p.y, this.isHumanPlayer(by) ? 'Gerettet!' : 'Befreit!', '#8ce89a');
  };

  
  Game.prototype.popPlayer = function (p, by) {
    if (!p.alive) return;
    var killer = by || p.trapBy;
    p.alive = false;
    p.clearTrap();              
    p.deathT = 0;
    p.inputX = 0;
    p.inputY = 0;
    PB.Audio.play('death');
    this.spawnDeathBurst(p.x, p.y, p.cast.body);
    this.scatterLoot(p);

    if (killer && killer !== p && killer.team !== p.team) {
      killer.kills++;
      if (killer.team === 0 || this.isVersus()) {
        this.kills++;
        this.score += SC_KILL;
        PB.Audio.play('kill');
        this.toast(p.x, p.y, p.name + ' ist raus!', '#ffd75e');
      }
    }

    if (this.isVersus()) {
      // Runde vorbei, sobald ein Team keinen mehr im Spiel hat
      var a0 = this.aliveCount(0), a1 = this.aliveCount(1);
      if (!a0 || !a1) this.scheduleEnd('round', a0 && !a1 ? 0 : a1 && !a0 ? 1 : -1);
      return;
    }
    // Kampagne: verloren, wenn kein Mensch mehr im Spiel ist (zu zweit spielt der andere weiter)
    var self = this;
    var humansLeft = this.players.some(function (q) { return q.alive && self.isHumanPlayer(q); });
    if (this.isHumanPlayer(p) && !humansLeft) this.scheduleEnd('lose');
    else if (this.aliveEnemies() === 0) this.scheduleEnd('win');
  };

  Game.prototype.scheduleEnd = function (result, winner) {
    if (this.pendingEnd) return;
    this.pendingEnd = { result: result, t: END_DELAY, winner: winner === undefined ? -1 : winner };
  };

  Game.prototype.finishMatch = function (result, winner) {
    if (result === 'round') {
      // Mehrspieler: Rundensieg zählen, bei genug Siegen ist das Spiel vorbei
      this.roundWinner = winner;
      if (winner >= 0) this.wins[winner]++;
      var over = this.wins[0] >= this.setup.winRounds || this.wins[1] >= this.setup.winRounds;
      PB.Audio.play(over ? 'win' : 'levelup');
      this.setState(over ? 'matchend' : 'roundend');
      return;
    }
    if (result === 'win') {
      var bonus = 600 + Math.floor(this.timeLeft) * 4;
      this.score += bonus;
      this.runScore += this.score;
      if (this.level > this.bestLevel) {
        this.bestLevel = this.level;
        U.save('blasen-arena-bestlv_' + this.diff, this.bestLevel);
      }
      this.snapshotCarry();
      var done = this.level >= L.MAX_LEVEL;
      PB.Audio.play(done ? 'win' : 'levelup');
      this.saveBest();
      this.setState(done ? 'allclear' : 'levelclear');
    } else {
      this.runScore += this.score;
      this.carry = null;
      this.carryInfo = null;
      PB.Audio.play('lose');
      this.saveBest();
      this.setState('lose');
    }
  };

  
  Game.prototype.snapshotCarry = function () {
    var me = this.human;
    this.carry = this.players.filter(function (q) { return q.team === 0; }).map(function (q) { return q.carrySnapshot(); });
    
    var next = L.config(Math.min(L.MAX_LEVEL, this.level + 1), this.diff);
    var probe = new E.Player(0, E.CASTS[0], 1, 1, false);
    this.applyStart(probe, next, me.carrySnapshot());
    this.carryInfo = {
      power: probe.bombPower,
      cap: probe.bombCap,
      speed: Math.round((probe.speed - E.BASE_SPEED) / E.SPEED_STEP),
      needles: probe.needles,
      kick: probe.canKick
    };
  };

  Game.prototype.saveBest = function () {
    if (this.runScore > this.best) {
      this.best = this.runScore;
      U.save('blasen-arena-best_' + this.diff, this.best);
    }
  };

  
  
  Game.prototype.stepParticles = function (dt) {
    for (var i = 0; i < this.particles.length; i++) {
      var pt = this.particles[i];
      pt.life -= dt;
      pt.vy += pt.grav * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
    }
    this.particles = this.particles.filter(function (p2) { return p2.life > 0; });
  };

  Game.prototype.spawn = function (x, y, vx, vy, life, size, color, grav) {
    this.particles.push({
      x: x, y: y, vx: vx, vy: vy,
      life: life, maxLife: life,
      size: size, color: color, grav: grav || 0
    });
  };

  Game.prototype.toast = function (x, y, text, color) {
    this.toasts.push({ x: x, y: y, text: text, color: color || '#fff', life: 1.1, maxLife: 1.1 });
  };

  
  Game.prototype.showBanner = function (text, sub, color) {
    this.banner = { text: text, sub: sub || '', color: color || '#ffd75e', life: 1.5, maxLife: 1.5 };
  };

  Game.prototype.spawnExplosionBurst = function (x, y) {
    for (var i = 0; i < 22; i++) {
      var a = Math.random() * C.TAU, sp = 40 + Math.random() * 170;
      this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp,
        0.3 + Math.random() * 0.4, 2 + Math.random() * 4,
        Math.random() < 0.5 ? '#ffb63a' : '#ff6a2a', 60);
    }
  };

  Game.prototype.spawnCrateBurst = function (col, row) {
    var x = C.cellCX(col), y = C.cellCY(row);
    var th = this.theme;
    for (var i = 0; i < 14; i++) {
      var a = Math.random() * C.TAU, sp = 30 + Math.random() * 120;
      this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 40,
        0.4 + Math.random() * 0.4, 2 + Math.random() * 3.5,
        Math.random() < 0.6 ? th.boxMid : th.boxEdge, 340);
    }
  };

  Game.prototype.spawnDeathBurst = function (x, y, color) {
    for (var i = 0; i < 18; i++) {
      var a = Math.random() * C.TAU, sp = 30 + Math.random() * 130;
      this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 60,
        0.5 + Math.random() * 0.5, 2 + Math.random() * 3,
        Math.random() < 0.5 ? color : '#ffffff', 190);
    }
  };

  
  Game.prototype.popBubbleFx = function (x, y, color) {
    for (var i = 0; i < 16; i++) {
      var a = (i / 16) * C.TAU, sp = 90 + Math.random() * 60;
      this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp,
        0.35 + Math.random() * 0.25, 2 + Math.random() * 2.4,
        Math.random() < 0.5 ? '#dff4ff' : color, 120);
    }
  };

  Game.prototype.spawnPickupBurst = function (x, y, color) {
    for (var i = 0; i < 10; i++) {
      var a = Math.random() * C.TAU, sp = 25 + Math.random() * 70;
      this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp - 50,
        0.35 + Math.random() * 0.3, 1.6 + Math.random() * 2.2, color, 150);
    }
  };

  
  Game.prototype.update = function (dt) {
    this.t += dt;
    if (this.state !== 'playing') return;

    
    if (this.intro > 0) {
      this.intro -= dt;
      if (this.intro < INTRO_TIME * 0.5 && !this.introPlayed.ready) {
        this.introPlayed.ready = true;
        PB.Audio.play('ready');
      }
      if (this.intro <= 0 && !this.introPlayed.go) {
        this.introPlayed.go = true;
        PB.Audio.play('go');
      }
    } else if (!this.pendingEnd) {
      this.timeLeft -= dt;
      var sec = Math.ceil(this.timeLeft);
      if (sec <= 10 && sec !== this.lastTickSec && sec > 0) {
        this.lastTickSec = sec;
        PB.Audio.play('tick');
      }
      if (this.timeLeft <= 0) this.scheduleEnd(this.isVersus() ? 'round' : 'lose', -1);
    }

    var i, p;

    
    if (this.intro <= 0) {
      for (i = 0; i < this.players.length; i++) {
        p = this.players[i];
        if (!p.brain || !p.alive) continue;
        p.brain.update(dt);
        if (p.brain.wantBomb) this.placeBomb(p);
        if (p.brain.wantNeedle) this.useNeedle(p);
      }
    }

    
    for (i = 0; i < this.players.length; i++) {
      p = this.players[i];
      p.tickTimers(dt);
      if (p.active()) this.movePlayer(p, dt);
      else if (!p.alive) p.deathT += dt;

      
      if (p.bombBuffer > 0 && p.active()) this.placeBomb(p);

      p.animate(dt);
    }

    
    for (i = 0; i < this.players.length; i++) {
      p = this.players[i];
      if (!p.alive || !p.trapped) continue;
      p.trapT -= dt;
      if (p.trapT <= 0) this.popPlayer(p, p.trapBy);
    }

    
    this.resolveContacts();

    
    this.slideBombs(dt);
    var toBlow = [];
    for (i = 0; i < this.bombs.length; i++) {
      if (this.bombs[i].tick(dt)) toBlow.push(this.bombs[i]);
    }
    var guard = 0;
    while (toBlow.length && guard++ < 300) {
      var bomb = toBlow.shift();
      if (bomb.dead) continue;
      this.explode(bomb, toBlow);
    }
    this.bombs = this.bombs.filter(function (b2) { return !b2.dead; });

    
    for (i = 0; i < this.flames.length; i++) {
      if (this.flames[i].tick(dt)) {
        var key = this.flames[i].col + ',' + this.flames[i].row;
        if (this.flameGrid[key] === this.flames[i]) delete this.flameGrid[key];
        this.flames[i].dead = true;
      }
    }
    this.flames = this.flames.filter(function (f2) { return !f2.dead; });

    
    for (i = 0; i < this.items.length; i++) {
      var item = this.items[i];
      if (item.dead) continue;
      item.t += dt;
      if (item.pop > 0) item.pop = Math.max(0, item.pop - dt);
      for (var pli = 0; pli < this.players.length; pli++) {
        var picker = this.players[pli];
        if (!picker.active()) continue;
        if (C.colOf(picker.x) === item.col && C.rowOf(picker.y) === item.row) {
          var label = item.applyTo(picker);
          if (item.kind === 'freeze') {
            for (var fz = 0; fz < this.players.length; fz++) {
              var victimF = this.players[fz];
              if (victimF.alive && victimF.team !== picker.team) victimF.freezeT = E.FREEZE_TIME;
            }
            this.showBanner('EISZEIT!', picker.name + ' friert die Gegner ein', '#9fdcff');
          }
          if (picker.team === 0) {
            this.score += SC_ITEM;
            this.pickedUp++;
          }
          PB.Audio.play('pickup');
          this.spawnPickupBurst(C.cellCX(item.col), C.cellCY(item.row), E.ITEMS[item.kind].color);
          if (this.isHumanPlayer(picker)) {
            this.toast(picker.x, picker.y, label, E.ITEMS[item.kind].color);
          }
          break;
        }
      }
    }
    var self = this;
    this.items = this.items.filter(function (it2) {
      if (it2.dead) delete self.itemGrid[it2.col + ',' + it2.row];
      return !it2.dead;
    });

    
    this.frameTrapped = 0;
    for (i = 0; i < this.players.length; i++) {
      var victim = this.players[i];
      if (!victim.alive) continue;
      var fl = this.flameGrid[C.colOf(victim.x) + ',' + C.rowOf(victim.y)];
      if (!fl) continue;
      if (victim.trapped) {
        if (victim.flameGuard <= 0) this.popPlayer(victim, fl.owner || victim.trapBy);
      } else {
        this.trapPlayer(victim, fl.owner);
      }
    }

    
    if (this.frameTrapped >= 2) {
      var n = Math.min(this.frameTrapped, COMBO_WORDS.length - 1);
      this.score += SC_COMBO * (this.frameTrapped - 1);
      this.showBanner(COMBO_WORDS[n],
        'Eine Blase: ' + this.frameTrapped + ' gefangen +' + SC_COMBO * (this.frameTrapped - 1),
        '#ffb63a');
      PB.Audio.play('combo');
      this.shake = Math.max(this.shake, 11);
    }

    
    this.stepParticles(dt);

    for (i = 0; i < this.toasts.length; i++) {
      this.toasts[i].life -= dt;
      this.toasts[i].y -= dt * 26;
    }
    this.toasts = this.toasts.filter(function (t2) { return t2.life > 0; });

    if (this.banner) {
      this.banner.life -= dt;
      if (this.banner.life <= 0) this.banner = null;
    }

    
    this.shake = Math.max(0, this.shake - dt * 26);

    
    if (this.pendingEnd) {
      this.pendingEnd.t -= dt;
      if (this.pendingEnd.t <= 0) {
        var result = this.pendingEnd.result, winner = this.pendingEnd.winner;
        this.pendingEnd = null;
        this.finishMatch(result, winner);
      }
    }
  };

  
  Game.prototype.resolveContacts = function () {
    for (var i = 0; i < this.players.length; i++) {
      var victim = this.players[i];
      if (!victim.alive || !victim.trapped) continue;
      for (var j = 0; j < this.players.length; j++) {
        var other = this.players[j];
        if (other === victim || !other.active()) continue;
        var dx = other.x - victim.x, dy = other.y - victim.y;
        var rr = (other.radius + victim.radius) * 0.92;
        if (dx * dx + dy * dy > rr * rr) continue;
        if (other.team === victim.team) this.rescuePlayer(victim, other);
        else this.popPlayer(victim, other);
        break;
      }
    }
  };

  
  // Pfeil (und bei mehreren Menschen der Name) über den Figuren der Menschen an diesem Rechner
  Game.prototype.markerFor = function (p) {
    if (!p.slot || p.slot.kind === 'bot') return false;
    if (p.slot.kind === 'remote') return p.name;
    var loc = this.localHumans().length;
    return loc > 1 || this.isVersus() || this.net ? (p.name || true) : true;
  };

  Game.prototype.render = function () {
    var c = this.ctx;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    c.clearRect(0, 0, this.W, this.H);

    this.drawHudBar(c);

    c.save();
    if (this.shake > 0.2) {
      c.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    }

    c.drawImage(this.floorCanvas, 0, C.HUD_H);

    var i;

    for (var row = 0; row < C.ROWS; row++) {
      for (var col = 0; col < C.COLS; col++) {
        var tile = this.tiles[row * C.COLS + col];
        if (tile === L.WALL) S.wall(c, col * C.TILE, C.HUD_H + row * C.TILE, this.theme);
        else if (tile === L.BOX) S.box(c, col * C.TILE, C.HUD_H + row * C.TILE, this.theme);
      }
    }

    
    this.drawDangerZones(c);
    for (i = 0; i < this.items.length; i++) S.item(c, this.items[i], this.t);
    this.drawKickPreview(c);

    for (i = 0; i < this.bombs.length; i++) S.bomb(c, this.bombs[i], this.t);
    for (i = 0; i < this.flames.length; i++) S.flame(c, this.flames[i], this.t);
    for (i = 0; i < this.players.length; i++) {
      S.player(c, this.players[i], this.t, this.markerFor(this.players[i]));
    }
    this.drawRescueHint(c);

    for (i = 0; i < this.particles.length; i++) {
      var pt = this.particles[i];
      var alpha = pt.life / pt.maxLife;
      c.globalAlpha = alpha;
      c.fillStyle = pt.color;
      c.beginPath();
      c.arc(pt.x, pt.y, pt.size * (0.4 + 0.6 * alpha), 0, C.TAU);
      c.fill();
    }
    c.globalAlpha = 1;

    
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    for (i = 0; i < this.toasts.length; i++) {
      var ts = this.toasts[i];
      var ta = Math.min(1, ts.life / (ts.maxLife * 0.5));
      c.globalAlpha = ta;
      c.font = '800 15px ' + FONT;
      c.lineWidth = 3.5;
      c.strokeStyle = 'rgba(8,16,10,.85)';
      c.strokeText(ts.text, ts.x, ts.y - 30);
      c.fillStyle = ts.color;
      c.fillText(ts.text, ts.x, ts.y - 30);
    }
    c.globalAlpha = 1;

    c.restore();

    this.drawHud(c);
    if (this.banner) this.drawBanner(c);
    if (this.state === 'playing' && this.intro > 0) this.drawIntro(c);
  };

  
  Game.prototype.drawDangerZones = function (c) {
    var DIRS = [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }, { dx: 0, dy: 1 }, { dx: 0, dy: -1 }];
    var marked = {};
    var any = false;

    for (var i = 0; i < this.bombs.length; i++) {
      var b = this.bombs[i];
      if (b.timer > 0.75) continue;
      any = true;
      marked[b.col + ',' + b.row] = 1;
      for (var d = 0; d < 4; d++) {
        for (var s = 1; s <= b.power; s++) {
          var col = b.col + DIRS[d].dx * s, row = b.row + DIRS[d].dy * s;
          var tile = this.tileAt(col, row);
          if (tile === L.WALL) break;
          marked[col + ',' + row] = 1;
          if (tile === L.BOX) break;
        }
      }
    }
    if (!any) return;

    var pulse = 0.5 + 0.5 * Math.sin(this.t * 14);
    c.save();

    
    c.globalAlpha = 0.1 + 0.08 * pulse;
    c.fillStyle = '#e01805';
    for (var key in marked) {
      var p = key.split(',');
      var px = +p[0] * C.TILE, py = C.HUD_H + (+p[1]) * C.TILE;
      c.fillRect(px + 1.5, py + 1.5, C.TILE - 3, C.TILE - 3);
    }

    
    c.globalAlpha = 0.55 + 0.45 * pulse;
    c.strokeStyle = '#ff3b26';
    c.lineWidth = 2.4;
    c.lineCap = 'round';
    c.beginPath();
    for (key in marked) {
      p = key.split(',');
      var cc = +p[0], rr = +p[1];
      var x = cc * C.TILE, y = C.HUD_H + rr * C.TILE;
      var i1 = C.TILE - 2, o2 = 2;
      if (!marked[cc + ',' + (rr - 1)]) { c.moveTo(x + o2, y + o2); c.lineTo(x + i1, y + o2); }
      if (!marked[cc + ',' + (rr + 1)]) { c.moveTo(x + o2, y + i1); c.lineTo(x + i1, y + i1); }
      if (!marked[(cc - 1) + ',' + rr]) { c.moveTo(x + o2, y + o2); c.lineTo(x + o2, y + i1); }
      if (!marked[(cc + 1) + ',' + rr]) { c.moveTo(x + i1, y + o2); c.lineTo(x + i1, y + i1); }
    }
    c.stroke();
    c.restore();
  };

  
  Game.prototype.drawRescueHint = function (c) {
    var me = this.human;
    if (!me.alive) return;

    var mate = null;
    for (var i = 0; i < this.players.length; i++) {
      var q = this.players[i];
      if (q !== me && q.alive && q.trapped && q.team === me.team) { mate = q; break; }
    }
    if (!mate) return;

    
    var gridDist = Math.abs(C.colOf(mate.x) - C.colOf(me.x)) +
                   Math.abs(C.rowOf(mate.y) - C.rowOf(me.y));
    
    var needT = gridDist * 1.35 / Math.max(0.1, me.speed);
    var tooLate = !me.trapped && needT > mate.trapT;

    c.save();
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    var urgent = mate.trapT < 1.6;
    
    var baseY = mate.y - C.TILE * 0.95;
    c.font = '800 15px ' + FONT;
    c.lineWidth = 3.5;
    c.strokeStyle = 'rgba(8,16,10,.85)';
    var label = mate.trapT.toFixed(1) + 's';
    c.strokeText(label, mate.x, baseY);
    c.fillStyle = urgent ? '#ff8a72' : '#ffd75e';
    c.fillText(label, mate.x, baseY);

    if (tooLate) {
      c.font = '800 12px ' + FONT;
      c.strokeText('Zu spät', mate.x, baseY - 18);
      c.fillStyle = '#ff6a58';
      c.fillText('Zu spät', mate.x, baseY - 18);
    }
    c.restore();

    
    if (me.trapped) return;
    var dx = mate.x - me.x, dy = mate.y - me.y;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < C.TILE * 1.2) return;

    var ang = Math.atan2(dy, dx);
    var dist = C.TILE * 0.62 + Math.sin(this.t * 6) * 2.5;
    c.save();
    c.translate(me.x + Math.cos(ang) * dist, me.y + Math.sin(ang) * dist);
    c.rotate(ang);
    c.globalAlpha = 0.85;
    
    c.fillStyle = '#ffd75e';
    c.strokeStyle = 'rgba(10,30,16,.7)';
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(7, 0);
    c.lineTo(-4, -5.5);
    c.lineTo(-4, 5.5);
    c.closePath();
    c.fill();
    c.stroke();
    c.restore();
  };

  
  Game.prototype.drawBanner = function (c) {
    var b = this.banner;
    var p = 1 - b.life / b.maxLife;
    var pop = p < 0.18 ? p / 0.18 : 1;
    var fade = b.life < 0.4 ? b.life / 0.4 : 1;

    c.save();
    c.globalAlpha = fade;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.translate(this.W / 2, C.HUD_H + 88);
    c.scale(0.7 + 0.3 * pop, 0.7 + 0.3 * pop);
    c.font = '900 40px ' + FONT;
    c.lineWidth = 6;
    c.strokeStyle = 'rgba(8,16,10,.8)';
    c.strokeText(b.text, 0, 0);
    c.fillStyle = b.color;
    c.fillText(b.text, 0, 0);
    if (b.sub) {
      c.font = '700 14px ' + FONT;
      c.lineWidth = 4;
      c.strokeText(b.sub, 0, 30);
      c.fillStyle = 'rgba(255,250,235,.92)';
      c.fillText(b.sub, 0, 30);
    }
    c.restore();
  };

  /* ---------- HUD ---------- */
  Game.prototype.drawHudBar = function (c) {
    var g = c.createLinearGradient(0, 0, 0, C.HUD_H);
    g.addColorStop(0, '#173a26');
    g.addColorStop(1, '#0e2718');
    c.fillStyle = g;
    c.fillRect(0, 0, this.W, C.HUD_H);
    c.fillStyle = 'rgba(120,220,160,.25)';
    c.fillRect(0, C.HUD_H - 2, this.W, 2);
  };

  // Werte eines Spielers als Reihe kleiner Kästchen (Blasen, Kraft, Tempo, Nadeln, Spezial)
  Game.prototype.drawStatRow = function (c, sx, y, me, slot) {
    this.drawStat(c, sx + slot * 0, y, 'bomb', (me.bombCap - this.activeBombCount(me)) + '/' + me.bombCap, false, me);
    this.drawStat(c, sx + slot * 1, y, 'power', String(me.bombPower), false, me);
    this.drawStat(c, sx + slot * 2, y, 'speed', '+' + Math.round((me.speed - E.BASE_SPEED) / E.SPEED_STEP), false, me);
    this.drawStat(c, sx + slot * 3, y, 'needle', me.needles > 0 ? String(me.needles) : '—', me.needles <= 0, me);
    var sp = me.shieldT > 0 ? ['shield', me.shieldT] : me.hopT > 0 ? ['hop', me.hopT] : me.freezeT > 0 ? ['freeze', me.freezeT] : me.slowT > 0 ? ['slow', me.slowT] : null;
    if (sp) this.drawStat(c, sx + slot * 4, y, sp[0], Math.ceil(sp[1]) + 's', false, me);
    else this.drawStat(c, sx + slot * 4, y, 'kick', me.canKick ? 'ON' : '—', !me.canKick, me);
  };

  // Anzeige im Mehrspieler: Teams links/rechts, Runde, Zeit und Spielstand in der Mitte
  Game.prototype.drawHudVersus = function (c) {
    var self = this;
    c.textBaseline = 'middle';
    var teams = [0, 1].map(function (t) { return self.players.filter(function (q) { return q.team === t; }); });
    teams.forEach(function (list, t) {
      list.forEach(function (q, k) {
        var x = t === 0 ? 24 + k * 108 : self.W - 24 - k * 108;
        c.globalAlpha = q.alive ? 1 : 0.35;
        S.face(c, x, 18, q, 12);
        c.font = '700 12px ' + FONT;
        c.textAlign = t === 0 ? 'left' : 'right';
        c.fillStyle = q.trapped ? (Math.sin(self.t * 12) > 0 ? '#ffd75e' : '#ff9a72') : (t === 0 ? '#cfe9ff' : '#ffd0c8');
        var nm = (q.name || '').slice(0, 10) + (q.slot && q.slot.kind === 'bot' ? ' 🤖' : '');
        c.fillText(nm, t === 0 ? x + 16 : x - 16, 18);
        c.globalAlpha = 1;
      });
    });
    // Werte der Menschen an diesem Rechner (pro Team eine Reihe)
    var loc = this.localHumans();
    [0, 1].forEach(function (t) {
      var me = loc.filter(function (q) { return q.team === t; })[0];
      if (!me) return;
      self.drawStatRow(c, t === 0 ? 12 : self.W - 12 - 46 * 5, 46, me, 46);
    });
    c.textAlign = 'center';
    c.font = '700 12px ' + FONT;
    c.fillStyle = this.theme.accent;
    c.fillText('Runde ' + this.round + ' · ' + this.theme.name, this.W / 2, 11);
    var danger = this.timeLeft < 20 && this.intro <= 0;
    c.font = '800 22px ' + FONT;
    c.fillStyle = danger && Math.sin(this.t * 8) > 0 ? '#ff7a68' : '#f2fff0';
    c.fillText(U.timeText(this.timeLeft), this.W / 2, 31);
    c.font = '900 17px ' + FONT;
    c.fillStyle = '#7fc8ff'; c.textAlign = 'right'; c.fillText(String(this.wins[0]), this.W / 2 - 9, 52);
    c.fillStyle = '#dff0e0'; c.textAlign = 'center'; c.fillText(':', this.W / 2, 51);
    c.fillStyle = '#ff9a8a'; c.textAlign = 'left'; c.fillText(String(this.wins[1]), this.W / 2 + 9, 52);
  };

  Game.prototype.drawHud = function (c) {
    if (this.isVersus()) return this.drawHudVersus(c);
    var me = this.human, self = this;
    c.textBaseline = 'middle';
    var team0 = this.players.filter(function (q) { return q.team === 0; });
    var loc = this.localHumans();

    // Team (bis zu 4): Gesicht, Name, Status
    team0.forEach(function (q, k) {
      var x = 24 + k * (team0.length > 2 ? 62 : 84);
      c.globalAlpha = q.alive ? 1 : 0.35;
      S.face(c, x, 20, q, k ? 11 : 13);
      c.font = (k ? '600 11.5px ' : '700 12.5px ') + FONT;
      c.textAlign = 'left';
      var txt = q.name, col = 'rgba(223,240,224,.85)';
      if (!q.alive) { txt = q.name + ' raus'; col = 'rgba(255,140,130,.8)'; }
      else if (q.trapped && q !== me) { txt = 'Rette ' + q.name + ' ' + q.trapT.toFixed(1) + 's'; col = Math.sin(self.t * 12) > 0 ? '#ffd75e' : '#ff9a72'; }
      c.fillStyle = col;
      if (team0.length <= 2 || k === 0 || !q.alive || q.trapped) c.fillText(txt, x + 16, 20);
      c.globalAlpha = 1;
    });

    var y = 46;
    this.drawStatRow(c, 16, y, me, 50);
    // zweiter Mensch an diesem Rechner: eigene Werte rechts
    var p2 = loc[1];
    if (p2) this.drawStatRow(c, this.W - 16 - 50 * 5, y, p2, 50);

    c.textAlign = 'center';
    c.font = '700 12px ' + FONT;
    c.fillStyle = this.theme.accent;
    c.fillText('Level ' + this.level + ' · ' + this.theme.name, this.W / 2, 13);

    var danger = this.timeLeft < 30 && this.intro <= 0;
    var blink = danger && Math.sin(this.t * 8) > 0;
    c.font = '800 26px ' + FONT;
    c.fillStyle = blink ? '#ff7a68' : (danger ? '#ffb0a0' : '#f2fff0');
    c.fillText(U.timeText(this.timeLeft), this.W / 2, 36);

    this.drawLevelDots(c, this.W / 2, 55);

    // Gegner (bei zwei Menschen oben rechts, sonst wie gewohnt in der zweiten Zeile)
    var foes = this.players.filter(function (q) { return q.team !== 0; });
    var ry = p2 ? 20 : 48;
    var ex = this.W - 16;
    for (var i = foes.length - 1; i >= 0; i--) {
      var foe = foes[i];
      c.globalAlpha = foe.alive ? 1 : 0.28;
      S.face(c, ex - 11, ry, foe, 11);
      if (foe.alive && foe.trapped) {
        c.globalAlpha = 1;
        c.strokeStyle = '#bfe6ff';
        c.lineWidth = 2;
        c.beginPath();
        c.arc(ex - 11, ry, 14, 0, C.TAU);
        c.stroke();
      }
      c.globalAlpha = 1;
      ex -= 27;
    }
    c.font = '600 11px ' + FONT;
    c.fillStyle = 'rgba(255,185,176,.9)';
    c.textAlign = 'right';
    c.fillText('Gegner', ex - 2, ry);

    c.font = '700 12.5px ' + FONT;
    c.fillStyle = '#ffd75e';
    c.fillText('Punkte ' + (this.runScore + this.score), ex - 52, ry);
  };

  
  Game.prototype.drawLevelDots = function (c, cx, cy) {
    var total = L.MAX_LEVEL;
    var gap = 11;
    var startX = cx - (total - 1) * gap / 2;
    for (var i = 1; i <= total; i++) {
      var x = startX + (i - 1) * gap;
      var done = i < this.level;
      var cur = i === this.level;
      var r = cur ? 3.6 + Math.sin(this.t * 5) * 0.7 : 2.6;
      c.beginPath();
      c.arc(x, cy, r, 0, C.TAU);
      c.fillStyle = cur ? this.theme.accent : (done ? 'rgba(160,235,180,.7)' : 'rgba(210,235,215,.2)');
      c.fill();
      if (cur) {
        c.strokeStyle = 'rgba(255,255,255,.55)';
        c.lineWidth = 1.2;
        c.stroke();
      }
    }
  };

  
  Game.prototype.drawStat = function (c, x, y, kind, text, dim, who) {
    
    var me = who || this.human;
    var flash = 0;
    if (me && me.pickFlash === kind && me.pickFlashT > 0) {
      flash = me.pickFlashT / 0.6;
    }
    var color = E.ITEMS[kind].color;
    
    var warn = 0;
    if (kind === 'bomb' && me && me.capWarnT > 0 && flash <= 0) {
      warn = me.capWarnT / 0.4;
    }

    
    c.save();
    if (dim) c.globalAlpha = 0.4;
    U.roundRect(c, x, y - 11, 44, 22, 7);
    c.fillStyle = flash > 0 ? 'rgba(255,255,255,' + (0.1 + 0.22 * flash).toFixed(3) + ')'
                : warn > 0 ? 'rgba(224,24,5,' + (0.18 + 0.4 * warn).toFixed(3) + ')'
                : 'rgba(4,14,8,.34)';
    c.fill();
    c.strokeStyle = flash > 0 ? color : (warn > 0 ? '#ffb0a0' : 'rgba(220,245,225,.16)');
    c.lineWidth = (flash > 0 || warn > 0) ? 1.6 : 1;
    c.stroke();
    c.restore();

    c.save();
    if (dim) c.globalAlpha = 0.4;
    c.translate(x + 13, y);
    if (flash > 0) {
      var s = 1 + 0.4 * flash;
      c.shadowColor = color;
      c.shadowBlur = 12 * flash;
      c.scale(s, s);
    }
    S.itemIcon(c, kind, 7.5);
    c.restore();

    c.save();
    if (dim) c.globalAlpha = 0.4;
    c.font = (flash > 0 ? '800 ' + (13 + 2 * flash).toFixed(1) + 'px ' : '800 13px ') + FONT;
    c.fillStyle = flash > 0 ? '#ffffff' : color;
    c.textAlign = 'left';
    c.fillText(text, x + 24, y + 0.5);
    c.restore();
  };

  
  Game.prototype.drawKickPreview = function (c) {
    var me = this.human;
    if (!me || !me.alive || me.trapped || !me.canKick) return;
    if (!me.dirX && !me.dirY) return;

    var col = C.colOf(me.x) + me.dirX;
    var row = C.rowOf(me.y) + me.dirY;
    var bomb = this.bombAt(col, row);
    
    if (!bomb || me.ghost[col + ',' + row]) return;

    
    var tc = col, tr = row, steps = 0;
    while (steps < C.COLS + C.ROWS) {
      var nc = tc + me.dirX, nr = tr + me.dirY;
      if (this.tileAt(nc, nr) !== L.FLOOR || this.bombAt(nc, nr)) break;
      var occupied = false;
      for (var i = 0; i < this.players.length; i++) {
        var q = this.players[i];
        if (q.alive && C.colOf(q.x) === nc && C.rowOf(q.y) === nr) { occupied = true; break; }
      }
      if (occupied) break;
      tc = nc; tr = nr; steps++;
    }
    if (steps === 0) return;

    c.save();
    var pulse = 0.5 + 0.3 * Math.sin(this.t * 9);
    c.globalAlpha = pulse;
    c.strokeStyle = '#c9a6ff';
    c.lineWidth = 2;
    c.setLineDash([5, 4]);
    c.beginPath();
    c.moveTo(C.cellCX(col), C.cellCY(row));
    c.lineTo(C.cellCX(tc), C.cellCY(tr));
    c.stroke();
    c.setLineDash([]);

    
    c.globalAlpha = Math.min(1, pulse + 0.25);
    c.strokeStyle = '#e2ccff';
    c.lineWidth = 2.2;
    var bx = tc * C.TILE, by = C.HUD_H + tr * C.TILE;
    c.strokeRect(bx + 6, by + 6, C.TILE - 12, C.TILE - 12);
    c.restore();
  };

  
  Game.prototype.drawIntro = function (c) {
    var half = INTRO_TIME * 0.5;
    var isGo = this.intro < half;
    var p = isGo ? 1 - this.intro / half : 1 - (this.intro - half) / half;

    c.save();

  var lokal = { format: '1v1' };                   // Auswahl „Lokal zu zweit“
  var autoNext = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var ORDER = ['bomb', 'power', 'speed', 'needle', 'shield', 'kick', 'mega', 'turbo', 'hop', 'freeze', 'slow'];

  function itemLegend() {
    var E = PB.Entities;
    return '<div class="legend">' + ORDER.map(function (k) {
      var it = E.ITEMS[k];
      return '<div class="lg"><i style="background:' + it.color + '"></i>' +
        '<b>' + it.name + '</b><span>' + it.desc + '</span></div>';
    }).join('') + '</div>';
  }
  function diffButtons() {
    return '<div class="diffs">' + ['easy', 'normal', 'hard'].map(function (k) {
      var d = PB.Level.DIFFS[k];
      return '<button class="diff' + (game.diff === k ? ' on' : '') + '" data-act="diff:' + k + '">' +
        '<b>' + d.name + '</b><span>' + d.desc + '</span></button>';
    }).join('') + '</div>';
  }

  function tplMenu() {
    return (
      '<div class="logo"><span class="logo-main">Bubble-Rivals</span><span class="logo-sub">BLASEN-DUELL</span></div>' +
      '<p class="tagline">Fang die Gegner in Blasen und rette dein Team – allein in ' + PB.Level.MAX_LEVEL + ' Leveln, zu zweit an einem Laptop oder online.</p>' +
      '<div class="modes3">' +
      '<button class="mode3" data-act="start"><b>Kampagne</b><span>Du + Computer-Kollege gegen Bots, ' + PB.Level.MAX_LEVEL + ' Level</span></button>' +
      '<button class="mode3" data-act="lokal"><b>Lokal zu zweit</b><span>1 gegen 1, 2 gegen 2 oder zusammen die Kampagne</span></button>' +
      '<button class="mode3" data-act="online"' + (HUB ? '' : ' disabled') + '><b>Online</b><span>' + (HUB ? 'Bis zu 4 Spieler, freie Plätze spielt der Computer' : 'nur auf langwiligi.site') + '</span></button>' +
      '</div>' +
      '<div class="sublbl">Stärke der Computer</div>' + diffButtons() +
      '<div class="records">' +
      '<div class="rec"><b>' + game.best + '</b><span>Rekord-Punkte</span></div>' +
      '<div class="rec"><b>' + (game.bestLevel || '—') + '</b><span>Weitestes Level</span></div>' +
      '</div>' +
      '<div class="rules">' +
      '<div><kbd>Pfeile</kbd>/<kbd>WASD</kbd> laufen · <kbd>Leertaste</kbd> Blase legen · <kbd>Shift</kbd> Nadel · <kbd>P</kbd> Pause</div>' +
      '<div class="tip">Trifft dich eine Flamme, steckst du in einer Blase fest: Berührt dich dein Teamkollege, bist du frei – berührt dich ein Gegner, bist du raus. Wild auf die Richtungstasten hämmern verschafft dir Zeit, mit einer Nadel befreist du dich selbst. Ausgeschiedene Gegner lassen Items fallen; mehrere Gegner mit einer Blase geben einen Kombo-Bonus.</div>' +
      '</div>' +
      itemLegend()
    );
  }

  function tplLokal() {
    var f = lokal.format;
    var opt = function (k, t, d) { return '<button class="diff' + (f === k ? ' on' : '') + '" data-act="lf:' + k + '"><b>' + t + '</b><span>' + d + '</span></button>'; };
    return (
      '<h2>Lokal zu zweit</h2>' +
      '<p class="sub">Zwei Spieler an einer Tastatur. Bei 1 gegen 1 und 2 gegen 2 gibt es jede Runde eine neue Zufallskarte – wer zuerst 3 Runden gewinnt, gewinnt das Spiel.</p>' +
      '<div class="diffs">' + opt('1v1', '1 gegen 1', 'Spieler 1 gegen Spieler 2') + opt('2v2', '2 gegen 2', 'jeder mit einem Computer im Team') + opt('koop', 'Zusammen', 'Kampagne zu zweit gegen Bots') + '</div>' +
      '<div class="sublbl">Stärke der Computer</div>' + diffButtons() +
      '<div class="rules keys2">' +
      '<div><b class="p1">Spieler 1</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> laufen · <kbd>Leertaste</kbd> Blase · <kbd>Shift</kbd> links Nadel</div>' +
      '<div><b class="p2">Spieler 2</b> <kbd>Pfeile</kbd> laufen · <kbd>Enter</kbd> Blase · <kbd>Shift</kbd> rechts Nadel</div>' +
      '</div>' +
      '<button class="btn primary" data-act="lokal-go">Los geht’s</button>' +
      '<button class="btn ghost" data-act="menu">Zurück</button>'
    );
  }

  function tplOnline() {
    var name = HUB ? HUB.getName() : '';
    var code = HUB ? HUB.cleanCode(location.hash) : '';
    return (
      '<h2>Online spielen</h2>' +
      '<p class="sub">Erstelle einen Raum und schick den Link an bis zu drei Freunde. Im Raum wählt der Host 1 gegen 1 / 2 gegen 2 auf Zufallskarten oder die Kampagne zusammen.</p>' +
      '<label class="fld">Dein Name<input id="ba-name" maxlength="16" placeholder="Name" autocomplete="off" value="' + esc(name) + '"></label>' +
      '<button class="btn primary" data-act="create">Raum erstellen</button>' +
      '<div class="joinrow"><input id="ba-code" maxlength="4" placeholder="CODE" autocomplete="off" value="' + esc(code.length === 4 ? code : '') + '"><button class="btn" data-act="join">Beitreten</button></div>' +
      '<p class="msg" id="ba-msg">' + esc(net && net.err || '') + '</p>' +
      '<div class="sublbl">Online-Rangliste (1 gegen 1 / 2 gegen 2)</div><div id="ba-board" class="board"></div>' +
      '<button class="btn ghost" data-act="menu">Zurück</button>'
    );
  }

  function tplLobby() {
    if (!net) return tplOnline();
    var L2 = net.lobby, host = net.host;
    var hum = net.humans();
    var list = hum.map(function (h) { return '<div class="lp">' + esc(h.name) + (h.seat === 0 ? ' <span>(Host)</span>' : '') + (h.seat === net.you ? ' <span>(du)</span>' : '') + '</div>'; }).join('');
    var opt = function (k, t, d) { return '<button class="diff' + (L2.mode === k ? ' on' : '') + '" data-act="lm:' + k + '"' + (host ? '' : ' disabled') + '><b>' + t + '</b><span>' + d + '</span></button>'; };
    var preview = '';
    if (host) {
      var sl = net.slots();
      preview = '<div class="teams">' + [0, 1].map(function (t) {
        var mem = sl.filter(function (s) { return s.team === t; });
        if (!mem.length) return '';
        return '<div class="tm t' + t + '"><b>' + (t === 0 ? 'Team Blau' : L2.mode === 'kampagne' ? '' : 'Team Rot') + '</b>' + mem.map(function (m) { return '<span>' + esc(m.name) + (m.kind === 'bot' ? ' 🤖' : '') + '</span>'; }).join('') + '</div>';
      }).join('') + (L2.mode === 'kampagne' ? '<div class="tm t1"><b>Gegner</b><span>Computer (je nach Level)</span></div>' : '') + '</div>';
    }
    return (
      '<h2>Raum <span class="code">' + esc(net.code) + '</span></h2>' +
      '<button class="btn small" data-act="copy">Link kopieren</button>' +
      '<div class="sublbl">Spieler (' + hum.length + ' von 4)</div><div class="plist">' + list + '</div>' +
      '<div class="sublbl">Spielart</div>' +
      '<div class="diffs">' + opt('versus', 'Teams', '1 gegen 1 oder 2 gegen 2, Zufallskarten') + opt('kampagne', 'Kampagne', 'alle zusammen gegen Bots') + '</div>' +
      (L2.mode === 'versus' && hum.length === 2 ? '<label class="chk"><input type="checkbox" id="ba-bots"' + (L2.bots ? ' checked' : '') + (host ? '' : ' disabled') + '> Mit Computern auf 2 gegen 2 auffüllen</label>' : '') +
      (host ? '<div class="sublbl">Stärke der Computer</div>' + diffButtons() + preview : '<p class="sub">Computer: ' + esc(PB.Level.DIFFS[L2.bot] ? PB.Level.DIFFS[L2.bot].name : '') + '</p>') +
      (host ? '<button class="btn primary" data-act="online-go"' + (L2.mode === 'versus' && hum.length < 2 && !L2.bots ? ' disabled' : '') + '>Spiel starten</button>' : '<p class="sub wait">Warte, bis der Host startet …</p>') +
      '<button class="btn ghost" data-act="leave">Raum verlassen</button>'
    );
  }

  function tplPause() {
    return (
      '<h2>Pause</h2>' +
      '<p class="sub">' + (game.isVersus() ? 'Runde ' + game.round : 'Level ' + game.level) + ' · ' + game.theme.name + '</p>' +
      '<button class="btn primary" data-act="resume">Weiter</button>' +
      '<button class="btn ghost" data-act="menu">Zum Menü</button>'
    );
  }

  function statBlock() {
    return '<div class="stats">' +
      '<div><span>Punkte</span><b class="gold">' + game.score + '</b></div>' +
      '<div><span>Gegner raus</span><b>' + game.kills + '</b></div>' +
      '<div><span>Gegner gefangen</span><b>' + game.traps + '</b></div>' +
      '<div><span>Gerettet</span><b>' + game.rescues + '</b></div>' +
      '<div><span>Kisten gesprengt</span><b>' + game.boxesBroken + '</b></div>' +
      '<div><span>Items</span><b>' + game.pickedUp + '</b></div>' +
      '</div>';
  }
  function carryStrip() {
    var ci = game.carryInfo;
    if (!ci) return '';
    var E = PB.Entities;
    var bits = [{ k: 'power', v: ci.power }, { k: 'bomb', v: ci.cap }, { k: 'speed', v: '+' + ci.speed }];
    if (ci.needles > 0) bits.push({ k: 'needle', v: ci.needles });
    if (ci.kick) bits.push({ k: 'kick', v: 'ON' });
    return '<div class="carry"><span class="carry-t">Ins nächste Level</span>' +
      bits.map(function (b) { return '<em><i style="background:' + E.ITEMS[b.k].color + '"></i>' + E.ITEMS[b.k].short + ' ' + b.v + '</em>'; }).join('') + '</div>';
  }
  function isGuest() { return !!(game.net && !game.net.host); }
  function waitOrButton(btn) { return isGuest() ? '<p class="sub wait">Warte auf den Host …</p>' : btn; }

  function tplLevelClear() {
    var next = PB.Level.config(game.level + 1, game.diff);
    return (
      '<h2 class="ok">Level ' + game.level + ' geschafft!</h2>' +
      '<p class="sub">Alle Gegner sind raus – ' + next.theme.name + ' wartet schon</p>' +
      statBlock() + carryStrip() +
      '<p class="sub">Gesamtpunkte <b class="gold">' + game.runScore + '</b></p>' +
      waitOrButton('<button class="btn primary" data-act="next">Weiter zu Level ' + (game.level + 1) + '</button>') +
      '<button class="btn ghost" data-act="menu">Zum Menü</button>'
    );
  }
  function tplAllClear() {
    return (
      '<h2 class="ok">Alles geschafft!</h2>' +
      '<p class="sub">' + PB.Level.MAX_LEVEL + ' Level gemeistert – ihr seid die Könige der Blasen!</p>' +
      statBlock() +
      '<p class="sub">Endpunktzahl <b class="gold">' + game.runScore + '</b> · Rekord: <b class="gold">' + game.best + '</b></p>' +
      waitOrButton('<button class="btn primary" data-act="restart">Nochmal</button>') +
      '<button class="btn ghost" data-act="menu">Zum Menü</button>'
    );
  }
  function tplLose() {
    var why = game.timeLeft <= 0 ? 'Zeit abgelaufen – die Gegner haben durchgehalten' : 'Eure Blasen sind geplatzt – die Gegner haben euch erwischt';
    return (
      '<h2 class="bad">Level ' + game.level + ' verloren</h2>' +
      '<p class="sub">' + why + '</p>' +
      statBlock() +
      '<p class="sub">Gesamtpunkte <b class="gold">' + game.runScore + '</b> · weitestes Level: <b class="gold">' + Math.max(game.bestLevel, 0) + '</b></p>' +
      waitOrButton('<button class="btn primary" data-act="restart">Nochmal von vorne</button>') +
      '<button class="btn ghost" data-act="menu">Zum Menü</button>'
    );
  }

  // Team-Namen: bei 1 gegen 1 die Spielernamen, sonst Blau/Rot
  function teamName(t) {
    var mem = game.players.filter(function (p) { return p.team === t; });
    if (mem.length === 1) return mem[0].name;
    return t === 0 ? 'Team Blau' : 'Team Rot';
  }
  function scoreLine() {
    return '<div class="score2"><span class="b">' + esc(teamName(0)) + ' ' + game.wins[0] + '</span><i>:</i><span class="r">' + game.wins[1] + ' ' + esc(teamName(1)) + '</span></div>';
  }
  function tplRoundEnd() {
    var w = game.roundWinner;
    var t = w < 0 ? 'Unentschieden!' : esc(teamName(w)) + (teamName(w).indexOf('Team') === 0 ? ' gewinnt' : ' gewinnt') + ' die Runde!';
    return (
      '<h2 class="' + (w === 0 ? 'ok' : w === 1 ? 'bad' : '') + '">' + t + '</h2>' +
      scoreLine() +
      '<p class="sub">Wer zuerst ' + game.setup.winRounds + ' Runden gewinnt, gewinnt das Spiel. Nächste Runde auf einer neuen Zufallskarte.</p>' +
      waitOrButton('<button class="btn primary" data-act="nextround">Nächste Runde</button>') +
      '<button class="btn ghost" data-act="menu">Zum Menü</button>'
    );
  }
  function tplMatchEnd() {
    var w = game.roundWinner;
    return (
      '<h2 class="ok">' + esc(teamName(w)) + ' gewinnt das Spiel!</h2>' +
      scoreLine() +
      '<div id="ba-board" class="board"></div>' +
      waitOrButton('<button class="btn primary" data-act="again">Nochmal</button>') +
      (game.net && game.net.host ? '<button class="btn" data-act="tolobby">Zur Lobby</button>' : '') +
      '<button class="btn ghost" data-act="menu">Zum Menü</button>'
    );
  }

  var TPL = {
    menu: tplMenu, lokal: tplLokal, online: tplOnline, lobby: tplLobby,
    paused: tplPause, levelclear: tplLevelClear, allclear: tplAllClear, lose: tplLose,
    roundend: tplRoundEnd, matchend: tplMatchEnd
  };

  function render() {
    clearTimeout(autoNext);
    var t = TPL[game.state];
    if (!t) {
      elOverlay.classList.add('hidden');
      elModal.innerHTML = '';
      return;
    }
    elModal.className = 'modal modal-' + game.state;
    elModal.innerHTML = t();
    elOverlay.classList.remove('hidden');
    if (game.state === 'online' && HUB) HUB.loadBoard('blasen-arena', document.getElementById('ba-board'), HUB.getName());
    if ((game.state === 'matchend' || game.state === 'lose' || game.state === 'allclear') && window.LW) window.LW.rundeFertig();
    // Nächste Runde startet nach ein paar Sekunden von selbst (Host bzw. lokal)
    if (game.state === 'roundend' && !isGuest()) autoNext = setTimeout(function () { if (game.state === 'roundend') handle('nextround'); }, 5000);
    var bx = document.getElementById('ba-bots');
    if (bx) bx.addEventListener('change', function () { net.lobby.bots = bx.checked; net.sendLobby(); render(); });
  }

  function syncMute() {
    if (elMute) elMute.textContent = PB.Audio.isMuted() ? 'Ton aus' : 'Ton an';
    if (elMusic) elMusic.textContent = PB.Audio.isMusicOn() ? 'Musik an' : 'Musik aus';
  }
  function setMsg(t) { var el = document.getElementById('ba-msg'); if (el) el.textContent = t; }
  function soloSetup() { return { mode: 'kampagne', slots: [{ kind: 'local', keys: 'all', team: 0 }], bot: game.diff, winRounds: 3 }; }

  function lokalSetup() {
    var P1 = { kind: 'local', keys: 'p1', name: 'Spieler 1', team: 0 }, P2 = { kind: 'local', keys: 'p2', name: 'Spieler 2', team: 1 };
    if (lokal.format === '1v1') return { mode: 'versus', slots: [P1, P2], bot: game.diff, winRounds: 3 };
    if (lokal.format === '2v2') return { mode: 'versus', slots: [P1, { kind: 'bot', team: 0, name: 'Mint' }, P2, { kind: 'bot', team: 1, name: 'Sunny' }], bot: game.diff, winRounds: 3 };
    return { mode: 'kampagne', slots: [P1, Object.assign({}, P2, { team: 0 })], bot: game.diff, winRounds: 3 };
  }

  function toMenu() {
    if (net) { net.leave(); net = null; }
    game.net = null;
    game.setup = soloSetup();
    game.runScore = 0;
    game.newMatch(1);
    game.setState('menu');
  }

  function handle(act) {
    if (act.indexOf('diff:') === 0) {
      PB.Audio.play('click');
      game.setDiff(act.slice(5));
      if (net && net.host) { net.lobby.bot = game.diff; net.sendLobby(); }
      if (game.state === 'menu') game.newMatch(1);
      render();
      return;
    }
    if (act.indexOf('lf:') === 0) { PB.Audio.play('click'); lokal.format = act.slice(3); render(); return; }
    if (act.indexOf('lm:') === 0) { if (!net || !net.host) return; PB.Audio.play('click'); net.lobby.mode = act.slice(3); net.sendLobby(); render(); return; }
    switch (act) {
      case 'start':
        PB.Audio.unlock(); PB.Audio.play('click');
        game.setup = soloSetup();
        game.startRun();
        break;
      case 'restart':
        PB.Audio.unlock(); PB.Audio.play('click');
        if (game.setup.slots.length > 1 || game.net) game.startSetup(game.setup); else game.startRun();
        break;
      case 'again':
        PB.Audio.play('click');
        game.startSetup(game.setup);
        break;
      case 'nextround':
        PB.Audio.play('click');
        game.nextRound();
        break;
      case 'next':
        PB.Audio.unlock(); PB.Audio.play('click');
        game.nextLevel();
        break;
      case 'lokal':
        PB.Audio.unlock(); PB.Audio.play('click');
        game.setState('lokal');
        break;
      case 'lokal-go':
        PB.Audio.unlock(); PB.Audio.play('click');
        game.startSetup(lokalSetup());
        break;
      case 'online':
        PB.Audio.unlock(); PB.Audio.play('click');
        game.setState('online');
        break;
      case 'create':
      case 'join': {
        if (!HUB) return;
        var nm = (document.getElementById('ba-name') || {}).value || '';
        nm = HUB.setName(nm) || 'Gast';
        var code = act === 'join' ? HUB.cleanCode((document.getElementById('ba-code') || {}).value || '') : '';
        if (act === 'join' && code.length !== 4) { setMsg('Bitte den 4-stelligen Code eingeben.'); return; }
        setMsg(act === 'join' ? 'Trete bei …' : 'Raum wird erstellt …');
        if (net) net.leave();
        net = new PB.Net(game);
        net.lobby.bot = game.diff;
        (act === 'join' ? net.join(code, nm) : net.create(nm)).then(function () {
          try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* egal */ }
          game.setState('lobby');
          render();
          if (net.host) net.sendLobby();
        }, function (e) { setMsg(HUB.errorText(e)); net = null; game.net = null; });
        break;
      }
      case 'copy': {
        var url = 'https://langwiligi.site/blasen-arena/#' + net.code;
        (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () {
          var b = elModal.querySelector('[data-act="copy"]'); if (b) b.textContent = 'Kopiert ✓';
        }, function () { var b = elModal.querySelector('[data-act="copy"]'); if (b) b.textContent = url; });
        break;
      }
      case 'online-go':
        PB.Audio.unlock(); PB.Audio.play('click');
        if (net && net.host) net.start();
        break;
      case 'tolobby':
        game.setState('lobby');
        break;
      case 'leave':
        toMenu();
        break;
      case 'resume':
        PB.Audio.play('click');
        game.togglePause();
        break;
      case 'menu':
        PB.Audio.play('click');
        toMenu();
        break;
      case 'pause':
        game.togglePause();
        break;
      case 'mute':
        PB.Audio.toggle();
        syncMute();
        break;
      case 'music':
        PB.Audio.unlock();
        PB.Audio.toggleMusic();
        syncMute();
        break;
    }
  }

  PB.UI = {
    init: function (g) {
      game = g;
      elOverlay = document.getElementById('overlay');
      elModal = document.getElementById('modal');
      elMute = document.querySelector('[data-act="mute"]');
      elMusic = document.querySelector('[data-act="music"]');

      document.addEventListener('click', function (e) {
        var el = e.target.closest ? e.target.closest('[data-act]') : null;
        if (!el || el.disabled) return;
        e.preventDefault();
        handle(el.getAttribute('data-act'));
      });
      elModal.addEventListener('keydown', function (e) {
        if (e.target && e.target.id === 'ba-code' && e.key === 'Enter') { e.preventDefault(); handle('join'); }
      });

      game.onStateChange = render;
      syncMute();
      // Einladungslink: direkt ins Online-Menü
      if (HUB && HUB.cleanCode(location.hash).length === 4) game.setState('online');
      render();
    },
    primary: function () {
      var b = elModal.querySelector('.btn.primary');
      if (b && !b.disabled) b.click();
    },
    toggleMute: function () { PB.Audio.toggle(); syncMute(); },
    syncAudioButtons: syncMute,
    refresh: render
  };
})(window.PB);
  </script>
  <script>

(function () {
  'use strict';

  var C = PB.C;
  var canvas = document.getElementById('game');
  var stage = document.getElementById('stage');
  var game = new PB.Game(canvas);

  PB.UI.init(game);

  
  function resize() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    if (canvas.width !== C.W * dpr) {
      canvas.width = C.W * dpr;
      canvas.height = C.H * dpr;
    }
    game.dpr = dpr;

    var availW = window.innerWidth - 28;
    var availH = window.innerHeight - 60;
    var scale = Math.min(availW / C.W, availH / C.H);
    scale = Math.max(0.3, Math.min(scale, 1.4));
    stage.style.width = Math.round(C.W * scale) + 'px';
    stage.style.height = Math.round(C.H * scale) + 'px';
    
    var ctl = Math.max(0.72, Math.min(1, scale));
    stage.style.setProperty('--ctl', ctl.toFixed(3));
    stickR = Math.round(62 * ctl);   
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  
  var KEY_DIR = {
    ArrowUp: { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 }
  };
  // Zu zweit an einer Tastatur: WASD/Leertaste/Shift links = Spieler 1, Pfeile/Enter/Shift rechts = Spieler 2
  var stacks = { p1: [], p2: [], all: [] };
  function twoLocal() { return game.localHumans().length > 1; }
  function ownerOf(code) { return !twoLocal() ? 'all' : /^Key[WASD]$/.test(code) ? 'p1' : 'p2'; }
  function playerOf(owner) {
    var loc = game.localHumans();
    if (owner === 'all') return game.human;
    return loc.filter(function (p) { return p.slot.keys === owner; })[0] || null;
  }
  function applyDir(owner) {
    var p = playerOf(owner);
    if (!p) return;
    var st = stacks[owner];
    var top = st.length ? KEY_DIR[st[st.length - 1]] : null;
    p.inputX = top ? top.x : 0;
    p.inputY = top ? top.y : 0;
  }
  function clearDirs() { stacks = { p1: [], p2: [], all: [] }; game.players.forEach(function (p) { if (p.slot && p.slot.kind === 'local') { p.inputX = 0; p.inputY = 0; } }); }

  
  function tryStruggle(p) {
    p = p || game.human;
    if (game.state !== 'playing' || !p || !p.trapped) return false;
    game.struggle(p);
    return true;
  }
  function bombFor(p) {
    if (!p) return;
    if (tryStruggle(p)) return;
    game.requestBomb(p);
  }

  window.addEventListener('keydown', function (e) {
    var code = e.code;
    // In Textfeldern (Name, Code) normal tippen
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (KEY_DIR[code]) {
      e.preventDefault();
      PB.Audio.unlock();
      var owner = ownerOf(code);
      if (stacks[owner].indexOf(code) < 0) stacks[owner].push(code);
      applyDir(owner);
      if (!e.repeat) tryStruggle(playerOf(owner));
    } else if (code === 'Space') {
      e.preventDefault();
      PB.Audio.unlock();
      if (game.state !== 'playing') { PB.UI.primary(); return; }
      if (e.repeat) return;
      bombFor(playerOf(twoLocal() ? 'p1' : 'all'));
    } else if (code === 'Enter' || code === 'NumpadEnter') {
      e.preventDefault();
      if (game.state !== 'playing') { PB.UI.primary(); return; }
      if (e.repeat) return;
      bombFor(playerOf(twoLocal() ? 'p2' : 'all'));
    } else if (code === 'ShiftLeft' || code === 'ShiftRight') {
      e.preventDefault();
      PB.Audio.unlock();
      if (game.state !== 'playing') return;
      game.useNeedle(playerOf(!twoLocal() ? 'all' : code === 'ShiftLeft' ? 'p1' : 'p2'));
    } else if (code === 'KeyP' || code === 'Escape') {
      e.preventDefault();
      game.togglePause();
    } else if (code === 'KeyM') {
      PB.UI.toggleMute();
    } else if (code === 'KeyN') {
      PB.Audio.unlock();
      PB.Audio.toggleMusic();
      PB.UI.syncAudioButtons();
    }
  });

  window.addEventListener('keyup', function (e) {
    var code = e.code;
    if (KEY_DIR[code]) {
      ['p1', 'p2', 'all'].forEach(function (o) {
        var i = stacks[o].indexOf(code);
        if (i >= 0) { stacks[o].splice(i, 1); applyDir(o); }
      });
    }
  });

  
  window.addEventListener('blur', function () {
    clearDirs();
    game.pause();
    PB.Audio.suspendMusic();
  });

  window.addEventListener('focus', function () {
    PB.Audio.resumeMusic();
    last = 0;
  });

  
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    PB.Audio.unlock();
    if (game.state !== 'playing') return;
    if (tryStruggle()) return;
    
    if (e.pointerType === 'touch') return;
    game.requestBomb(game.human);
  });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  
  var elStick = document.getElementById('stick');
  var elKnob = document.getElementById('stick-knob');
  var elBombBtn = document.getElementById('btn-bomb');
  var elNeedleBtn = document.getElementById('btn-needle');
  
  var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0 ||
                /[?&]touch=1/.test(location.search);
  
  var stickId = null, stickCX = 0, stickCY = 0, stickR;

  function stickToDir(dx, dy) {
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 12) { game.human.inputX = 0; game.human.inputY = 0; return; }
    if (Math.abs(dx) > Math.abs(dy)) {
      game.human.inputX = dx > 0 ? 1 : -1;
      game.human.inputY = 0;
    } else {
      game.human.inputX = 0;
      game.human.inputY = dy > 0 ? 1 : -1;
    }
  }

  function knobMove(dx, dy) {
    var len = Math.sqrt(dx * dx + dy * dy);
    var max = stickR - 18;
    if (len > max) { dx = dx / len * max; dy = dy / len * max; }
    elKnob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  }

  elStick.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    PB.Audio.unlock();
    if (tryStruggle()) return;
    stickId = e.pointerId;
    var r = elStick.getBoundingClientRect();
    stickCX = r.left + r.width / 2;
    stickCY = r.top + r.height / 2;
    elStick.setPointerCapture(e.pointerId);
  });

  elStick.addEventListener('pointermove', function (e) {
    if (e.pointerId !== stickId) return;
    e.preventDefault();
    var dx = e.clientX - stickCX, dy = e.clientY - stickCY;
    knobMove(dx, dy);
    stickToDir(dx, dy);
  });

  function stickEnd(e) {
    if (e.pointerId !== stickId) return;
    stickId = null;
    knobMove(0, 0);
    if (game.human) { game.human.inputX = 0; game.human.inputY = 0; }
  }
  elStick.addEventListener('pointerup', stickEnd);
  elStick.addEventListener('pointercancel', stickEnd);

  elBombBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    PB.Audio.unlock();
    if (game.state !== 'playing') return;
    if (tryStruggle()) return;
    game.requestBomb(game.human);
  });

  elNeedleBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    PB.Audio.unlock();
    if (game.state === 'playing') game.useNeedle(game.human);
  });

  
  var elBombBadge = document.getElementById('bomb-badge');
  var elNeedleBadge = document.getElementById('needle-badge');
  var ctlKey = '';
  window.setInterval(function () {
    var show = isTouch && game.state === 'playing';
    var me = game.human;
    var needle = show && me.needles > 0;
    var key = (show ? '1' : '0') + (needle ? '1' : '0');
    if (key !== ctlKey) {
      ctlKey = key;
      elStick.classList.toggle('hidden', !show);
      elBombBtn.classList.toggle('hidden', !show);
      elNeedleBtn.classList.toggle('hidden', !needle);
    }
    if (!show) { elBombBtn.classList.remove('warn'); return; }

    var left = Math.max(0, me.bombCap - game.activeBombCount(me));
    var btxt = left + '/' + me.bombCap;
    if (elBombBadge.textContent !== btxt) elBombBadge.textContent = btxt;
    var ntxt = '×' + me.needles;
    if (elNeedleBadge.textContent !== ntxt) elNeedleBadge.textContent = ntxt;
    
    var warn = me.capWarnT > 0;
    if (elBombBtn.classList.contains('warn') !== warn) elBombBtn.classList.toggle('warn', warn);
  }, 150);

  
  if (/[?&]autostart=1/.test(location.search)) {
    game.startRun();
    game.intro = 0;   
  }

  
  
  var themeKey = '';
  function syncThemeSkin() {
    var theme = game.theme;
    if (!theme || theme.key === themeKey) return;
    themeKey = theme.key;
    var st = document.documentElement && document.documentElement.style;
    if (!st || !st.setProperty) return;
    st.setProperty('--sky', theme.sky);
    st.setProperty('--glow', theme.glow || theme.sky);
    st.setProperty('--ring', theme.ring || 'rgba(120,220,160,.2)');
  }

  var last = 0;
  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    game.update(dt);
    game.render();
    syncThemeSkin();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      game.pause();
      PB.Audio.suspendMusic();
    } else {
      PB.Audio.resumeMusic();
    }
    last = 0;
  });

  window.PopoArcade = game;
})();
  </script>
</body>
</html>
