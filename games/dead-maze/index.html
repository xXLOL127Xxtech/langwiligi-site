<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dead Maze</title>
<meta name="description" content="Tower-Defense gegen Zombie-Horden: Bau Türme ins Labyrinth und halte deine Basis Welle um Welle.">
<meta name="theme-color" content="#8ad845">
<meta name="spiel-modi" content="Solo">
<meta name="spiel-tags" content="Strategie">
<meta name="spiel-typ" content="Strategie">
<meta name="spiel-suche" content="Tower Defense, Zombie-Spiel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: status strip across the top, the maze board as the centrepiece, a field-kit sidebar on the right that stacks under the board on phones */
:root{
  --bg:#0e110c; --panel:#161b13; --panel-2:#1e2519; --line:#2d3626; --fg:#e2e5d4; --muted:#939c84; --ink:#11130e;
  --hazard:#e9a72a; --toxic:#8ad845; --blood:#e5493b; --ice:#6fd3f3;
  --f-display:"Black Ops One","Impact","Arial Black",sans-serif;
  --f-ui:"Barlow Semi Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --tape:repeating-linear-gradient(-45deg,var(--hazard) 0 12px,var(--ink) 12px 24px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.app{box-sizing:border-box;max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:12px 20px;display:flex;flex-direction:column;gap:12px}

.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.brand{font-family:var(--f-display);font-size:24px;letter-spacing:.04em;line-height:1;white-space:nowrap}
.brand span{color:var(--toxic)}
.chips{display:flex;flex-wrap:wrap;gap:6px 22px;flex:1;min-width:0}
.chip{display:flex;flex-direction:column;gap:1px;min-width:50px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.val{font-family:var(--f-mono);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.1}
.val.amber{color:var(--hazard)} .val.toxic{color:var(--toxic)}
.lifebar{display:block;height:3px;background:var(--line);width:64px;margin-top:3px}
.lifebar i{display:block;height:100%;width:100%;background:var(--toxic);transition:width .25s}
.lifebar.low i{background:var(--blood)}
.controls{display:flex;flex-wrap:wrap;gap:6px}

.btn{font:600 13px/1 var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:9px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-go{background:var(--hazard);color:var(--ink);border-color:var(--hazard);font-weight:700}
.btn-go:hover:not(:disabled){filter:brightness(1.12);border-color:var(--hazard)}
.btn-danger{color:var(--blood)}
.btn:focus-visible,.bbtn:focus-visible,.abtn:focus-visible,.dbtn:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
kbd{font:600 10px/1 var(--f-mono);padding:2px 4px;border:1px solid currentColor;border-radius:2px;opacity:.65}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:12px;align-items:start}
.board-wrap{min-width:0;display:flex;flex-direction:column;gap:6px}
.board{position:relative;width:min(100%,calc((100vh - 190px) * 31 / 19));margin-inline:auto;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--ink)}
#game{display:block;width:100%;height:auto;aspect-ratio:31/19;touch-action:none;cursor:crosshair}
.hint{margin:0;font-size:13.5px;color:var(--muted);text-align:center;min-height:1.4em}
.hint b{color:var(--fg);font-weight:600}

.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel h2{margin:0;font:400 14px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.build-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bbtn{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:8px;align-items:center;text-align:left;padding:6px 8px 6px 6px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;color:var(--fg);cursor:pointer;font-family:var(--f-ui)}
.bbtn:hover{border-color:var(--muted)}
.bbtn canvas{grid-row:span 2;width:36px;height:36px}
.bbtn .nm{font-weight:600;font-size:13.5px;line-height:1.15;overflow-wrap:break-word;padding-right:16px}
.bbtn .ct{font-family:var(--f-mono);font-size:12px;color:var(--hazard)}
.bbtn kbd{position:absolute;top:5px;right:5px}
.bbtn:last-child:nth-child(odd){grid-column:1/-1}
.bbtn.on,.abtn.on{border-color:var(--hazard);box-shadow:inset 0 0 0 1px var(--hazard)}
.bbtn.poor .ct{color:var(--blood)}
.bbtn.poor canvas{opacity:.45}
.abil-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.abtn{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 8px 7px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;color:var(--fg);cursor:pointer;font-family:var(--f-ui);text-align:left}
.abtn b{font-weight:600;font-size:13.5px}
.abtn span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.abtn kbd{position:absolute;top:5px;right:5px}
.abtn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--cd,0) * 100%);background:rgba(0,0,0,.55);pointer-events:none}
.abtn.poor span{color:var(--blood)}

.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font:600 11px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;padding:3px 6px;border-radius:2px;border:1px solid currentColor}
.t-red{color:var(--blood)} .t-amber{color:var(--hazard)} .t-green{color:var(--toxic)}
.comp{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.route{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.route + .route{border-top:0;padding-top:0}

.info p{margin:0;color:var(--muted);font-size:14px}
.sel-head{display:flex;gap:10px;align-items:center}
.sel-head canvas{width:44px;height:44px;flex:none}
.sel-name{font:400 18px/1.1 var(--f-display);letter-spacing:.02em}
.sel-sub{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0}
.stats dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;align-self:center}
.stats dd{margin:0;font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.stats .nx{color:var(--toxic)}
.sel-actions{display:flex;flex-wrap:wrap;gap:6px}
.specs{display:grid;gap:6px}
.spec{display:flex;flex-direction:column;gap:3px;text-align:left;padding:8px 10px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;color:var(--muted);cursor:pointer;font:500 13px/1.3 var(--f-ui)}
.spec:hover:not(:disabled){border-color:var(--toxic)}
.spec:disabled{opacity:.5;cursor:not-allowed}
.spec:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
.spec-top{display:flex;justify-content:space-between;gap:8px}
.spec b{color:var(--fg);font-weight:700;font-size:14px}
.spec .sc{font-family:var(--f-mono);color:var(--hazard)}
.tips{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:13.5px;color:var(--muted)}
.tips b{color:var(--fg);font-weight:600}

.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(5,7,4,.72);backdrop-filter:blur(2px);overflow:auto}
.card{width:100%;max-width:620px;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.tape{height:10px;background:var(--tape)}
.tape.red{background:repeating-linear-gradient(-45deg,var(--blood) 0 12px,var(--ink) 12px 24px)}
.card-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px}
.title{margin:0;font:400 clamp(40px,9vw,66px)/.95 var(--f-display);letter-spacing:.02em;text-wrap:balance}
.title span{color:var(--toxic)}
.title.red{color:var(--blood)}
.lede{margin:0;font-size:16px;max-width:60ch}
.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dbtn{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;color:var(--fg);cursor:pointer;font-family:var(--f-ui)}
.dbtn b{font:400 16px/1.1 var(--f-display);letter-spacing:.04em}
.dbtn small{color:var(--muted);font-size:12.5px}
.dbtn[aria-pressed="true"]{border-color:var(--hazard);box-shadow:inset 0 0 0 1px var(--hazard)}
.seed{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.seed b{color:var(--fg)}
.howto{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:0;padding:0;list-style:none;font-size:13.5px;color:var(--muted)}
.howto b{color:var(--fg);font-weight:600}
.big{font-size:16px;padding:14px 18px;justify-content:center}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row .btn{flex:1;justify-content:center}
.best{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin:0}
.ostats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ostats div{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}

@media (max-width:960px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .side{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
}
@media (max-width:520px){
  .diffs,.howto{grid-template-columns:minmax(0,1fr)}
  .ostats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand{font-size:20px}
  .val{font-size:17px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="brand">DEAD<span>MAZE</span></div>
    <div class="chips">
      <div class="chip"><span class="lbl">Base</span><span class="val" id="hLives">20</span><span class="lifebar" id="hLifeWrap"><i id="hLifeBar"></i></span></div>
      <div class="chip"><span class="lbl">Points</span><span class="val amber" id="hPoints">200</span></div>
      <div class="chip"><span class="lbl">Wave</span><span class="val" id="hWave">0</span></div>
      <div class="chip"><span class="lbl">Kills</span><span class="val" id="hKills">0</span></div>
      <div class="chip"><span class="lbl">Combo</span><span class="val toxic" id="hCombo">–</span></div>
    </div>
    <div class="controls">
      <button class="btn btn-go" id="btnWave" type="button"><span id="waveLbl">Start wave 1</span><kbd>Space</kbd></button>
      <button class="btn" id="btnSpeed" type="button" title="Game speed (C)">1×</button>
      <button class="btn" id="btnPause" type="button" title="Pause (P)">Pause</button>
      <button class="btn" id="btnMute" type="button">Sound on</button>
      <button class="btn" id="btnMenu" type="button">Menu</button>
    </div>
  </header>
  <main class="stage">
    <div class="board-wrap">
      <div class="board"><canvas id="game" aria-label="Game board: a maze the zombie horde walks through"></canvas></div>
      <p class="hint" id="hint"></p>
    </div>
    <aside class="side">
      <section class="panel"><h2>Defenses</h2><div class="build-grid" id="buildGrid"></div></section>
      <section class="panel"><h2>Support</h2>
        <div class="abil-row">
          <button class="abtn" id="abAir" type="button"><b>Airstrike</b><span id="abAirS">Ready</span><kbd>Z</kbd></button>
          <button class="abtn" id="abFrz" type="button"><b>Cryo bomb</b><span id="abFrzS">Ready</span><kbd>X</kbd></button>
          <button class="abtn" id="abFix" type="button"><b>Reinforce</b><span id="abFixS">+3 · 120</span><kbd>R</kbd></button>
        </div>
      </section>
      <section class="panel" id="incoming"></section>
      <section class="panel info" id="info"></section>
    </aside>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="card" id="card"></div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const TS = 32, COLS = 31, ROWS = 19, W = COLS * TS, H = ROWS * TS;
const idx = (x, y) => y * COLS + x;
const inB = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const DIRS = [[1,0],[0,1],[-1,0],[0,-1]];
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return `${n >> 16 & 255},${n >> 8 & 255},${n & 255}`; };

/* ---------------- Data ---------------- */
const TOWERS = {
  mg:     { name:'Machine Gun',  key:'1', cost:50,  up:[60,130],  color:'#d9a63b', desc:'Cheap and fast. Shreds walkers and runners, struggles against armor.', range:[2.6,2.9,3.3], dmg:[7,12,20], rate:[5,6,8],
    spec:[{ name:'Minigun', cost:220, desc:'Spins up to 14 shots per second.', set:{ dmg:20, rate:14, range:3.4 } },
          { name:'AP Rounds', cost:220, desc:'Heavy bullets that ignore armor completely.', set:{ dmg:38, rate:7, range:3.4, pierce:true } }] },
  sniper: { name:'Sniper',       key:'2', cost:110, up:[110,220], color:'#5c9ee0', desc:'Huge range, ignores armor and lands a double-damage headshot 15% of the time.', range:[5.5,6.5,8], dmg:[55,110,220], rate:[0.7,0.8,1], pierce:true,
    spec:[{ name:'Deadeye', cost:360, desc:'40% headshot chance for triple damage.', set:{ dmg:240, rate:1.1, range:9, crit:0.4, critX:3 } },
          { name:'Railgun', cost:360, desc:'Each slug punches through every zombie in a line.', set:{ dmg:300, rate:0.8, range:9, rail:true } }] },
  flame:  { name:'Flamethrower', key:'3', cost:100, up:[90,190],  color:'#ef6a2a', desc:'Short cone that hits everything in front of it and sets it on fire. Ignores armor.', range:[1.9,2.1,2.4], dmg:[24,40,70], burn:[6,11,20],
    spec:[{ name:'Napalm', cost:300, desc:'Sticky fire that burns for 5 seconds and much hotter.', set:{ dmg:80, burn:50, burnT:5, range:2.4 } },
          { name:'Inferno', cost:300, desc:'A wide, long cone of fire.', set:{ dmg:130, burn:22, range:3.2, cone:0.8 } }] },
  mortar: { name:'Mortar',       key:'4', cost:140, up:[130,270], color:'#b3b071', desc:'Lobs shells with splash damage over long range. Cannot hit zombies right next to it.', range:[4.5,5.2,6], dmg:[45,85,160], rate:[0.45,0.55,0.7], splash:[1,1.2,1.5],
    spec:[{ name:'Cluster', cost:420, desc:'Each shell bursts into five extra bomblets.', set:{ dmg:150, rate:0.7, range:6.5, splash:1.4, cluster:5 } },
          { name:'Heavy Shell', cost:420, desc:'A huge blast that stuns everything it does not kill.', set:{ dmg:340, rate:0.55, range:6.5, splash:1.9, stun:0.7 } }] },
  tesla:  { name:'Tesla Coil',   key:'5', cost:170, up:[150,310], color:'#a873ff', desc:'Lightning jumps from zombie to zombie and can stun them.', range:[2.6,2.9,3.3], dmg:[28,48,85], rate:[0.9,1.1,1.4], chain:[3,4,6],
    spec:[{ name:'Storm', cost:480, desc:'Lightning jumps between up to 10 zombies.', set:{ dmg:95, rate:1.5, range:3.5, chain:10 } },
          { name:'Overload', cost:480, desc:'Bolts stun their targets for almost a second.', set:{ dmg:120, rate:1.3, range:3.5, chain:5, stunP:0.75, stunT:0.9 } }] },
  cryo:   { name:'Cryo Tower',   key:'6', cost:90,  up:[80,170],  color:'#66d1f2', desc:'A freezing pulse slows every zombie in range.', range:[2.2,2.5,2.9], dmg:[3,6,12], rate:[1,1,1.2], slow:[0.4,0.5,0.6],
    spec:[{ name:'Deep Freeze', cost:260, desc:'Slows zombies by 75% across a wider area.', set:{ dmg:16, rate:1.3, range:3.4, slow:0.75 } },
          { name:'Shatter', cost:260, desc:'Chilled zombies take 35% more damage from every source.', set:{ dmg:20, rate:1.3, range:3, slow:0.55, shatter:0.35 } }] },
  depot:  { name:'Supply Depot', key:'7', cost:120, up:[120,250], color:'#7fc65c', desc:'Does not shoot. Earns points at the start of every wave.', income:[25,55,100],
    spec:[{ name:'Bank', cost:380, desc:'Earns 190 points every wave.', set:{ income:190 } },
          { name:'Field Workshop', cost:380, desc:'Earns 80 per wave, slowly repairs walls and towers within 3 tiles and adds 1 base health every wave.', set:{ income:80, workshop:true } }] },
};
const ITEMS = {
  barricade: { name:'Barricade', key:'B', cost:10, up:[30,80], hp:[150,450,1200], levels:['Wooden barricade','Steel barricade','Concrete wall'], desc:'Blocks a corridor. Zombies walk around it if the detour is short enough, otherwise they smash through. Upgrade it to steel or concrete.' },
  mine:      { name:'Landmine',  key:'M', cost:30, desc:'Buried in the road. Explodes when a zombie steps on it. Does not block.' },
};
const BUILD_ORDER = ['mg','sniper','flame','mortar','tesla','cryo','depot','barricade','mine'];
const costOf = t => (TOWERS[t] || ITEMS[t]).cost;

const ZOMBIES = {
  walker:   { name:'Walker',      hp:30,   speed:0.9,  armor:0, reward:3,   r:7,   color:'#6dbb39', dark:'#2d5716', eye:'#ffd75a', dmg:1, atk:8 },
  runner:   { name:'Runner',      hp:18,   speed:1.9,  armor:0, reward:3,   r:6,   color:'#a8e34f', dark:'#4b7a1b', eye:'#fff07a', dmg:1, atk:5 },
  armored:  { name:'Riot',        hp:55,   speed:0.8,  armor:5, reward:6,   r:8,   color:'#7d9f5c', dark:'#36472a', eye:'#ffd75a', dmg:1, atk:10 },
  brute:    { name:'Brute',       hp:170,  speed:0.55, armor:2, reward:11,  r:11,  color:'#3f8829', dark:'#1a3c10', eye:'#ff5a3a', dmg:3, atk:35 },
  bloater:  { name:'Bloater',     hp:70,   speed:0.65, armor:0, reward:7,   r:10,  color:'#b8cf3b', dark:'#5d6a16', eye:'#ffb13a', dmg:2, split:3, atk:12 },
  crawler:  { name:'Crawler',     hp:12,   speed:1.6,  armor:0, reward:1,   r:4.5, color:'#cbe56c', dark:'#5d6a16', eye:'#ffd75a', dmg:1, atk:4 },
  screamer: { name:'Screamer',    hp:45,   speed:1.0,  armor:0, reward:9,   r:8,   color:'#a1d46b', dark:'#4c2c5c', eye:'#ff6ad5', dmg:1, aura:true, atk:6 },
  boss:     { name:'Abomination', hp:1350, speed:0.4,  armor:7, reward:150, r:17,  color:'#2e6a1e', dark:'#0e2808', eye:'#ff3b2a', dmg:7, regen:0.004, atk:150 },
};
for (const k in ZOMBIES) ZOMBIES[k].eyeRgb = hexRgb(ZOMBIES[k].eye);

const DIFFS = {
  easy:   { name:'Recruit',   hp:0.75, points:260, lives:30 },
  normal: { name:'Survivor',  hp:1,    points:200, lives:20 },
  hard:   { name:'Nightmare', hp:1.35, points:160, lives:10 },
};
const MODES = ['first','last','strong','close'];
const MODE_NAMES = { first:'First', last:'Last', strong:'Strongest', close:'Closest' };
const ABIL = {
  air: { name:'Airstrike', cd:45, radius:1.3, desc:'Five bombs carpet the target area a moment after you click.' },

// Cost-to-base for every road tile. Walls and towers on the road are passable,
// but entering one costs 1 + its penalty, so zombies only smash through when going around is longer.
function bfs(grid, occ, base){
  const N = COLS * ROWS, d = new Int32Array(N).fill(-1), best = new Int32Array(N).fill(0x7fffffff);

    const i = hi[0], lc = hc.pop(), li = hi.pop();

        if (l < hc.length && hc[l] < hc[m]) m = l;
        if (r < hc.length && hc[r] < hc[m]) m = r;
        if (m === k) break;
        let t = hc[m]; hc[m] = hc[k]; hc[k] = t; t = hi[m]; hi[m] = hi[k]; hi[k] = t; k = m;

    return i;

    if (d[i] !== -1) continue;
    d[i] = c;

      const j = idx(nx, ny);
      if (!grid[j] || d[j] !== -1) continue;
      const o = occ && occ[j];

      if (nc < best[j]) { best[j] = nc; push(nc, j); }
    }

}
function genMap(seed){
  const R = mulberry32(seed);

  for (let attempt = 0; attempt < 40; attempt++) {

    const sx = R() * cw | 0, sy = R() * ch | 0, st = [[sx, sy]];
    vis[sy * cw + sx] = 1; grid[idx(2 * sx + 1, 2 * sy + 1)] = 1;
    while (st.length) {
      const [cx, cy] = st[st.length - 1], nb = [];
      for (const [dx, dy] of DIRS) { const nx = cx + dx, ny = cy + dy; if (nx >= 0 && ny >= 0 && nx < cw && ny < ch && !vis[ny * cw + nx]) nb.push([nx, ny, dx, dy]); }
      if (!nb.length) { st.pop(); continue; }
      const [nx, ny, dx, dy] = nb[R() * nb.length | 0];
      vis[ny * cw + nx] = 1; grid[idx(2 * cx + 1 + dx, 2 * cy + 1 + dy)] = 1; grid[idx(2 * nx + 1, 2 * ny + 1)] = 1; st.push([nx, ny]);
    }

    for (let y = 1; y < ROWS - 1; y++) for (let x = 1; x < COLS - 1; x++) {
      if (grid[idx(x, y)]) continue;
      if (((x % 2 === 0 && y % 2 === 1) || (x % 2 === 1 && y % 2 === 0)) && R() < 0.09) grid[idx(x, y)] = 1;
    }
    const ay = 2 * (R() * ch | 0) + 1, by = 2 * (R() * ch | 0) + 1, top = R() < 0.5;
    const bx = 2 * (3 + (R() * (cw - 8) | 0)) + 1;
    const spawns = [{ x:0, y:ay, dx:-1, dy:0 }, { x:bx, y:top ? 0 : ROWS - 1, dx:0, dy:top ? -1 : 1 }];
    const base = { x:COLS - 1, y:by };
    for (const s of spawns) grid[idx(s.x, s.y)] = 1;
    grid[idx(base.x, base.y)] = 1;
    const d = bfs(grid, null, base);
    const d0 = d[idx(spawns[0].x, spawns[0].y)], d1 = d[idx(spawns[1].x, spawns[1].y)];
    const cand = { grid, spawns, base };
    if (Math.min(d0, d1 + 10) > bestLen) { bestLen = Math.min(d0, d1 + 10); best = cand; }
    if (d0 >= 46 && d1 >= 34) { best = cand; break; }
  }
  const decor = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (best.grid[idx(x, y)] || R() >= 0.085) continue;
    const r = R();
    const type = r < .25 ? 'tree' : r < .5 ? 'rubble' : r < .62 ? 'car' : r < .77 ? 'barrel' : r < .92 ? 'crate' : 'bones';
    decor.push({ x, y, type, rot:R() * TAU, ox:(R() - .5) * 8, oy:(R() - .5) * 8 });
  }
  best.decor = decor;
  return best;
}

function buildWave(w){
  const boss = w % 10 === 0, rush = !boss && w % 5 === 0, blood = w % 7 === 0;
  // calm waves give room to build, heavy waves test the defense
  let mood = 'normal';
  if (!boss && !rush) {
    if (w % 10 === 1 && w > 1) mood = 'calm';
    else if (w > 2) { const r = Math.random(); mood = r < 0.22 ? 'calm' : r > 0.78 ? 'heavy' : 'normal'; }
  }
  const list = [], n = Math.round((7 + w * 1.7) * (mood === 'calm' ? 0.7 : mood === 'heavy' ? 1.35 : 1));
  if (rush) {
    for (let i = 0; i < Math.round(n * 1.5); i++) list.push(i % 6 === 5 && w >= 10 ? 'armored' : 'runner');
  } else {
    const pool = [['walker', 10]];
    if (w >= 3) pool.push(['runner', 3 + w * 0.3]);
    if (w >= 4) pool.push(['armored', 1.5 + w * 0.25]);
    if (w >= 6) pool.push(['brute', 1 + w * 0.14]);
    if (w >= 8) pool.push(['bloater', 1.2 + w * 0.12]);
    if (w >= 11) pool.push(['screamer', 0.8 + w * 0.07]);
    const tot = pool.reduce((a, p) => a + p[1], 0);
    for (let i = 0; i < n; i++) {
      let r = Math.random() * tot, pick = 'walker';
      for (const [k, wt] of pool) { r -= wt; if (r <= 0) { pick = k; break; } }
      list.push(pick);
    }
    if (boss) { const nb = 1 + Math.floor(w / 30); for (let i = 0; i < nb; i++) list.splice(Math.floor(list.length * (0.55 + 0.15 * i)), 0, 'boss'); }
  }
  return { list, rush, boss, blood, mood };
}

function spawnActive(i){ if (i === 0) return true; return (S.phase === 'build' ? S.wave + 1 : S.wave) >= 8; }
function routeFrom(dist, sp){
  if (dist[idx(sp.x, sp.y)] < 0) return null;
  const pts = [[(sp.x + .5 + sp.dx) * TS, (sp.y + .5 + sp.dy) * TS], [(sp.x + .5) * TS, (sp.y + .5) * TS]];
  let x = sp.x, y = sp.y, guard = 0;
  while (dist[idx(x, y)] > 0 && guard++ < COLS * ROWS) {
    let bx = -1, by = -1, bv = 1e9;
    for (const [dx, dy] of DIRS) { const nx = x + dx, ny = y + dy; if (!inB(nx, ny)) continue; const v = dist[idx(nx, ny)]; if (v >= 0 && v < bv) { bv = v; bx = nx; by = ny; } }
    if (bx < 0) break; x = bx; y = by; pts.push([(x + .5) * TS, (y + .5) * TS]);
  }
  return pts;
}
// walls and towers a route goes through (the horde will smash these)
function routeBlockers(r, extra){
  const out = [];
  if (r) for (const [x, y] of r) {
    const tx = Math.floor(x / TS), ty = Math.floor(y / TS); if (!inB(tx, ty)) continue;
    const i = idx(tx, ty), o = S.occ[i];
    if ((o && o.blocks) || i === extra) out.push(o || i);
  }
  return out;
}
function computeRoutes(){
  S.routes = S.spawns.map((sp, i) => spawnActive(i) ? routeFrom(S.dist, sp) : null);
  S.breakSet = new Set();
  for (const r of S.routes) for (const o of routeBlockers(r)) S.breakSet.add(o);
}
function computeField(){
  S.dist = bfs(S.grid, S.occ, S.base);
  for (const z of S.zombies) {
    // a zombie heading into a wall reconsiders: if a detour is now cheaper it steps back and goes around
    if (z.nx !== z.tx || z.ny !== z.ty) {
      const o = S.occ[idx(z.nx, z.ny)];
      if (o && o.blocks) { const px = z.nx, py = z.ny; pickNext(z); if (z.nx !== px || z.ny !== py) { z.nx = z.tx; z.ny = z.ty; } }
    }
    z.nd = S.dist[idx(z.nx, z.ny)];
  }

}
function routeInfo(dist, extra){
  let len = 0, hitsExtra = false;
  S.spawns.forEach((sp, i) => {
    if (!spawnActive(i)) return;
    const r = routeFrom(dist, sp); if (!r) return;
    len = Math.max(len, r.length - 2);
    if (extra != null && routeBlockers(r, extra).includes(extra)) hitsExtra = true;
  });
  return { len, hitsExtra };
}

/* ---------------- Waves ---------------- */
function startWave(){
  if (S.over) return;
  S.wave++;
  const WV = S.nextList, w = S.wave;
  S.bloodMoon = WV.blood;
  let t = 0.6;
  const gapBase = Math.max(0.2, 0.95 - w * 0.018) * (WV.rush ? 0.45 : 1);
  for (const type of WV.list) {
    S.spawnQ.push({ type, t:S.t + t, sp:(w >= 8 && Math.random() < 0.42) ? 1 : 0 });
    t += gapBase * (type === 'brute' ? 1.5 : type === 'boss' ? 3 : 1) * rand(0.6, 1.4);
  }
  S.spawnQ.sort((a, b) => a.t - b.t);
  S.phase = 'wave'; S.countdown = -1;
  let inc = 0;
  for (const tw of S.towers) if (tw.type === 'depot') {
    const v = st(tw, 'income'); inc += v; addText(tw.cx, tw.cy - 14, '+' + v, '#9be06a', 13);
    if (st(tw, 'workshop') && S.lives < S.maxLives + 10) { S.lives++; addText((S.base.x + .5) * TS - 10, (S.base.y + .5) * TS - 22, '+1', '#8ad845', 13); }
  }
  S.curMood = WV.mood;
  if (inc) { S.points += inc; S.earned += inc; }
  S.nextList = buildWave(w + 1);
  const subs = [];
  if (WV.boss) subs.push('The Abomination is coming');
  if (WV.rush) subs.push('Rush wave · runners only');
  if (WV.blood) subs.push('Blood moon · faster zombies, double points');
  if (w === 8) subs.push('A second breach has opened');
  if (WV.mood === 'calm') subs.push('Calm wave · time to build');
  if (WV.mood === 'heavy') subs.push('Heavy wave · brace yourself');
  banner('WAVE ' + w, subs.join('  ·  ') || `${WV.list.length} zombies`, WV.boss || WV.blood ? '#ff6b5a' : '#e9a72a');
  computeRoutes();
  Sound.play('horn');
}
function waveCleared(){
  const bonus = Math.round((20 + 3 * S.wave) * (S.curMood === 'heavy' ? 1.5 : 1));
  S.points += bonus; S.earned += bonus;
  S.phase = 'build'; S.countdown = 25; S.bloodMoon = false;
  banner(`WAVE ${S.wave} CLEARED`, `+${bonus} points · next wave in 25s`, '#8ad845');
  computeRoutes();
  Sound.play('coin');
}
function callWave(){
  if (!running || S.over) return;
  Sound.init();
  if (S.phase === 'build') {
    const bonus = S.countdown > 0 ? Math.ceil(S.countdown) : 0;
    startWave();
    if (bonus) { S.points += bonus; S.earned += bonus; addText(W / 2, H * .44, `Early call +${bonus}`, '#e9a72a', 14); }
  } else if (!S.spawnQ.length) {
    const bonus = 10 + S.wave * 2;
    S.points += bonus; S.earned += bonus;
    startWave();
    addText(W / 2, H * .44, `Brave call +${bonus}`, '#e9a72a', 14);
  } else Sound.play('err');
}
function banner(title, sub, color){ S.banner = { title, sub, color, life:3.2, max:3.2 }; }

/* ---------------- Zombies ---------------- */
function makeZombie(type, x, y, tx, ty){
  const D = ZOMBIES[type], w = Math.max(1, S.wave);
  const hp = D.hp * hpMul(w) * S.diff.hp, jm = Math.max(0, TS / 2 - D.r - 3);
  return {
    id:S.uid++, type, D, x, y, tx, ty, nx:tx, ny:ty, nd:S.dist[idx(tx, ty)], prog:999,
    hp, maxHp:hp, armor:D.armor ? D.armor + Math.floor(w / 6) : 0,
    speed:D.speed * (1 + Math.min(0.3, w * 0.006)) * (S.bloodMoon ? 1.2 : 1) * rand(0.92, 1.08),
    reward:Math.max(1, Math.round(D.reward * (1 + w * 0.02))) * (S.bloodMoon ? 2 : 1),
    r:D.r, jx:rand(-jm, jm), jy:rand(-jm, jm), atk:(D.atk || 5) * (1 + (w - 1) * 0.08), biting:0, shatterUntil:0, shatterF:0,
    slowUntil:0, slowF:0, stunUntil:0, frozenUntil:0, burnUntil:0, burnDps:0, burnSrc:null,
    flash:0, wob:Math.random() * TAU, vx:0, vy:0, ang:0, buff:false, dead:false

}
function spawnZombie(type, si){
  const sp = S.spawns[si];
  const z = makeZombie(type, (sp.x + .5 + sp.dx) * TS, (sp.y + .5 + sp.dy) * TS, sp.x, sp.y);
  z.ang = Math.atan2(-sp.dy, -sp.dx);
  S.zombies.push(z);
}
function pickNext(z){
  const d = S.dist; let best = -1, bx = z.tx, by = z.ty;
  for (const [dx, dy] of DIRS) {
    const nx = z.tx + dx, ny = z.ty + dy; if (!inB(nx, ny)) continue;
    const v = d[idx(nx, ny)]; if (v < 0) continue;
    if (best < 0 || v < best || (v === best && ((z.id + nx + ny) & 1))) { best = v; bx = nx; by = ny; }
  }
  z.nx = bx; z.ny = by; z.nd = best < 0 ? d[idx(z.tx, z.ty)] : best;
}
function applySlow(z, f, dur){
  if (S.t > z.slowUntil) z.slowF = f; else z.slowF = Math.max(z.slowF, f);
  z.slowUntil = Math.max(z.slowUntil, S.t + dur);
}
function updZombie(z, dt){
  if (z.flash > 0) z.flash -= dt;
  z.wob += dt * (4 + z.speed * 3);
  if (z.burnUntil > S.t) {
    hurt(z, z.burnDps * dt, { pierce:true, src:z.burnSrc }); if (z.dead) return;
    if (Math.random() < dt * 12) addPart({ kind:'fire', x:z.x + rand(-z.r, z.r) * .6, y:z.y + rand(-z.r, z.r) * .6, vx:rand(-10, 10), vy:rand(-25, -8), life:.35, max:.35, size:rand(2, 3.5), grow:6, drag:1 });
  } else z.burnDps = 0;
  if (z.D.regen) z.hp = Math.min(z.maxHp, z.hp + z.maxHp * z.D.regen * dt);
  let sp = z.speed * TS;
  if (z.slowUntil > S.t) sp *= 1 - z.slowF;
  if (z.buff) sp *= 1.35;
  if (z.stunUntil > S.t) sp = 0;
  if (z.biting > 0) z.biting -= dt;
  // next tile is blocked by a wall or tower: walk up to it and smash it
  const blk = (z.nx !== z.tx || z.ny !== z.ty) ? S.occ[idx(z.nx, z.ny)] : null;
  if (blk && blk.blocks) {
    const dx = z.nx - z.tx, dy = z.ny - z.ty, reach = TS / 2 - z.r * 0.6;
    const ax = (z.tx + .5) * TS + dx * reach + (dy ? z.jx : 0), ay = (z.ty + .5) * TS + dy * reach + (dx ? z.jy : 0);
    const mx = ax - z.x, my = ay - z.y, md = Math.hypot(mx, my), mstep = sp * dt, px = z.x, py = z.y;
    if (md > mstep) { z.x += mx / md * mstep; z.y += my / md * mstep; }
    else {
      z.x = ax; z.y = ay;
      if (z.stunUntil <= S.t && blk.atkN < ATK_CAP) {
        blk.atkN++; blk.hp -= z.atk * dt; blk.hit = 0.1; z.biting = 0.15;
        if (Math.random() < dt * 6) addPart({ kind:'debris', x:blk.cx - dx * 12 + rand(-6, 6), y:blk.cy - dy * 12 + rand(-6, 6), vx:rand(-40, 40) - dx * 40, vy:rand(-40, 40) - dy * 40, life:.4, max:.4, size:rand(1, 2), grow:0, drag:4, c:blk.kind === 'barricade' && blk.lvl === 0 ? '122,85,50' : '130,134,128' });
        Sound.play('thud');
        if (blk.hp <= 0) destroyObj(blk);

    }
    z.vx = (z.x - px) / dt; z.vy = (z.y - py) / dt; z.ang = Math.atan2(dy, dx);

    const dx = gx - z.x, dy = gy - z.y, d = Math.hypot(dx, dy);
    if (d <= step) {

      if (z.tx === S.base.x && z.ty === S.base.y) { reachBase(z); return; }
      pickNext(z);
      if (z.nx === z.tx && z.ny === z.ty) break;
      const nb = S.occ[idx(z.nx, z.ny)]; if (nb && nb.blocks) break;
    } else { z.x += dx / d * step; z.y += dy / d * step; step = 0; }
  }
  if (dt > 0) { z.vx = (z.x - ox) / dt; z.vy = (z.y - oy) / dt; if (Math.abs(z.vx) + Math.abs(z.vy) > 1) z.ang = Math.atan2(z.vy, z.vx); }

  const cx = Math.floor(z.x / TS), cy = Math.floor(z.y / TS);
  if (inB(cx, cy)) { const m = S.occ[idx(cx, cy)]; if (m && m.kind === 'mine' && Math.hypot(m.cx - z.x, m.cy - z.y) < 12) detonateMine(m); }
}
function reachBase(z){
  z.dead = true;
  if (S.over) return;
  const bx = (S.base.x + .5) * TS, by = (S.base.y + .5) * TS;
  S.lives = Math.max(0, S.lives - z.D.dmg);
  S.baseFlash = 0.45; S.shake = Math.min(14, S.shake + 4 + z.D.dmg);
  addText(bx - 10, by - 20, '-' + z.D.dmg, '#ff5a4a', 15);
  bloodFx(bx - 8, by, z.r);
  Sound.play('hit');
  if (S.lives <= 0) gameOver();
}
function hurt(z, amt, o){
  if (z.dead) return;

  if (!o.pierce) { const arm = o.halfArmor ? z.armor * 0.5 : z.armor; a = Math.max(amt * 0.2, amt - arm); }
  if (z.shatterUntil > S.t) a *= 1 + z.shatterF;

function kill(z, src){

  S.points += gain; S.earned += gain; S.kills++;

      c.nx = z.nx; c.ny = z.ny; c.nd = z.nd; c.ang = z.ang; S.newZ.push(c);
    }
    for (let i = 0; i < 10; i++) addPart({ kind:'gas', x:z.x, y:z.y, vx:rand(-30, 30), vy:rand(-30, 30), life:rand(.6, 1), max:1, size:rand(4, 7), grow:10, drag:2 });

function bloodFx(x, y, r){

/* ---------------- Towers ---------------- */
function findTarget(tw, range, minR){
  let best = null, bv = -Infinity;
  for (const z of S.zombies) {
    if (z.dead || z.x < 0 || z.y < 0 || z.x > W || z.y > H) continue;
    const dx = z.x - tw.cx, dy = z.y - tw.cy, d2 = dx * dx + dy * dy, rr2 = range + z.r * .6;
    if (d2 > rr2 * rr2 || d2 < minR * minR) continue;
    const v = tw.mode === 'first' ? -z.prog : tw.mode === 'last' ? z.prog : tw.mode === 'strong' ? z.hp : -d2;
    if (v > bv) { bv = v; best = z; }
  }
  return best;
}
function updTower(tw, dt){
  if (tw.type === 'depot') {
    // Field Workshop: repairs walls and towers on the road within 3 tiles
    if (st(tw, 'workshop')) {
      for (const o of [...S.barricades, ...S.towers]) {
        if (!o.road || o.hp >= o.maxHp || Math.hypot(o.cx - tw.cx, o.cy - tw.cy) > 3 * TS) continue;
        o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.04 * dt);
        if (Math.random() < dt * 3) addPart({ kind:'spark', x:o.cx + rand(-8, 8), y:o.cy + rand(-8, 8), vx:0, vy:-20, life:.4, max:.4, size:1.3, grow:0, drag:1 });
      }
    }
    return;
  }
  tw.cd -= dt; if (tw.fire > 0) tw.fire -= dt;
  const range = st(tw, 'range') * TS, dmg = st(tw, 'dmg');
  if (tw.type === 'cryo') {
    if (tw.cd > 0) return;
    let hit = 0;
    const slow = st(tw, 'slow'), shatter = st(tw, 'shatter');
    for (const z of S.zombies) {
      if (z.dead) continue;
      const dx = z.x - tw.cx, dy = z.y - tw.cy;
      if (dx * dx + dy * dy <= (range + z.r) * (range + z.r)) {
        hit++; applySlow(z, slow, 1.6);
        if (shatter) { z.shatterUntil = S.t + 1.6; z.shatterF = shatter; }
        hurt(z, dmg, { src:tw, pierce:true });
      }
    }
    if (hit) {
      tw.cd = 1 / st(tw, 'rate');
      S.rings.push({ x:tw.cx, y:tw.cy, r0:6, r1:range, life:.45, max:.45, rgb:'110,215,245', w:2 });
      for (let k = 0; k < 10; k++) { const a = Math.random() * TAU, s = rand(30, range * 1.6); addPart({ kind:'frost', x:tw.cx, y:tw.cy, vx:Math.cos(a) * s, vy:Math.sin(a) * s, life:.5, max:.5, size:rand(1, 2), grow:0, drag:2 }); }
      Sound.play('cryo');
    }
    return;
  }
  const tg = findTarget(tw, range, tw.type === 'mortar' ? 1.2 * TS : 0);
  if (!tg) return;
  let da = Math.atan2(tg.y - tw.cy, tg.x - tw.cx) - tw.ang; da = Math.atan2(Math.sin(da), Math.cos(da));
  tw.ang += da * Math.min(1, dt * 16);
  if (tw.cd > 0) return;
  const ca = Math.cos(tw.ang), sa = Math.sin(tw.ang);
  switch (tw.type) {
    case 'mg': {
      tw.cd = 1 / st(tw, 'rate');
      hurt(tg, dmg, { src:tw, pierce:!!st(tw, 'pierce') });

/* ---------------- Building ---------------- */
function canPlace(type, x, y){

  const i = idx(x, y);
  if (S.occ[i]) return 'Tile taken';
  if (S.spawns.some(s => s.x === x && s.y === y) || (S.base.x === x && S.base.y === y)) return 'Keep the breach and base clear';
  const road = !!S.grid[i];
  if ((type === 'barricade' || type === 'mine') && !road) return 'Roads only';
  if (S.points < costOf(type)) return 'Not enough points';
  if (road && type !== 'mine') {
    for (const z of S.zombies) {
      if (z.dead) continue;
      if ((z.tx === x && z.ty === y) || (Math.floor(z.x / TS) === x && Math.floor(z.y / TS) === y)) return 'Zombies in the way';

    S.occ[i] = { blocks:true, pen:penOf(mh) }; testDist = bfs(S.grid, S.occ, S.base); S.occ[i] = null;

}

/* ---------------- Effects ---------------- */
function addPart(p){ if (S.parts.length < 1400) S.parts.push(p); }

function updateFx(dt){
  for (const p of S.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; p.size += p.grow * dt * 0.5; }

  for (const t of S.texts) t.y -= dt * 22;

/* ---------------- Update ---------------- */
function update(dt){
  S.t += dt;
  if (S.over) {
    S.overT += dt;
    const bx = (S.base.x + .5) * TS, by = (S.base.y + .5) * TS;
    for (const b of S.booms) if (!b.done && S.overT >= b.t) { b.done = true; boomFx(bx + rand(-14, 6), by + rand(-14, 14), TS * 1.4); }
    if (S.overT > 1.4 && !S.overShown) { S.overShown = true; showModal('over'); }
  }
  while (S.spawnQ.length && S.spawnQ[0].t <= S.t) { const q = S.spawnQ.shift(); spawnZombie(q.type, q.sp); }
  for (const o of S.barricades) { o.atkN = 0; if (o.hit > 0) o.hit -= dt; }
  for (const o of S.towers) { o.atkN = 0; if (o.hit > 0) o.hit -= dt; }
  for (const z of S.zombies) z.buff = false;
  for (const s of S.zombies) if (s.D.aura && !s.dead) for (const z of S.zombies) if (z !== s && Math.abs(z.x - s.x) < 64 && Math.abs(z.y - s.y) < 64) z.buff = true;
  for (const z of S.zombies) if (!z.dead) updZombie(z, dt);
  if (!S.over) for (const tw of S.towers) updTower(tw, dt);
  const bomblets = [];
  for (const s of S.shells) {
    s.t += dt;
    if (s.t < s.T) continue;
    s.done = true; explode(s.x1, s.y1, s.rad, s.dmg, s.src, s.stun);
    for (let k = 0; k < s.cluster; k++) { const a = Math.random() * TAU, r = rand(0.6, 1.6) * TS; bomblets.push({ x0:s.x1, y0:s.y1, x1:s.x1 + Math.cos(a) * r, y1:s.y1 + Math.sin(a) * r, t:0, T:rand(.3, .5), dmg:s.dmg * 0.45, rad:TS * 0.8, src:s.src, cluster:0, stun:0, mini:true }); }
  }
  S.shells = S.shells.filter(s => !s.done).concat(bomblets);
  for (const st of S.strikes) {
    st.t += dt;
    for (const b of st.bombs) if (!b.done && st.t >= b.at) { b.done = true; explode(b.x, b.y, ABIL.air.radius * TS, st.dmg, null); }
    if (st.t > 2.2) st.done = true;
  }
  S.strikes = S.strikes.filter(s => !s.done);
  if (S.newZ.length) { S.zombies.push(...S.newZ); S.newZ = []; }
  S.zombies = S.zombies.filter(z => !z.dead);
  if (S.comboT > 0) { S.comboT -= dt; if (S.comboT <= 0) S.combo = 0; }
  S.cdAir = Math.max(0, S.cdAir - dt); S.cdFrz = Math.max(0, S.cdFrz - dt);
  if (!S.over) {
    if (S.phase === 'wave' && !S.spawnQ.length && !S.zombies.length) waveCleared();
    else if (S.phase === 'build' && S.countdown > 0) { S.countdown -= dt; if (S.countdown <= 0) startWave(); }
    if (S.zombies.length && Math.random() < dt * 0.4 * Math.min(1, S.zombies.length / 10)) Sound.play('groan');
  }
  updateFx(dt);
  S.decalT += dt; if (S.decalT > 4) { S.decalT = 0; fadeDecals(); }
}
function gameOver(){
  S.over = true; S.overT = 0;
  S.booms = [0, .25, .5, .8, 1.1].map(t => ({ t, done:false }));
  ui.build = ui.abil = ui.sel = null; renderInfo(); updateHint();
  const best = store.get('deadmaze.best', {}), prev = best[S.diffKey];
  S.record = !prev || S.wave > prev.wave || (S.wave === prev.wave && S.kills > prev.kills);
  S.prevBest = prev;
  if (S.record) { best[S.diffKey] = { wave:S.wave, kills:S.kills }; store.set('deadmaze.best', best); }
  Sound.play('over');
}

  setText(hud.speed, speed + '×'); setText(hud.pause, paused ? 'Resume' : 'Pause'); setText(hud.mute, Sound.muted ? 'Sound off' : 'Sound on');
  for (const k in buildBtns) buildBtns[k].classList.toggle('poor', S.points < costOf(k));
  hud.air.style.setProperty('--cd', S.cdAir / ABIL.air.cd); setText(hud.airS, S.cdAir > 0 ? Math.ceil(S.cdAir) + 's' : 'Ready'); hud.air.classList.toggle('on', ui.abil === 'air');
  hud.frz.style.setProperty('--cd', S.cdFrz / ABIL.frz.cd); setText(hud.frzS, S.cdFrz > 0 ? Math.ceil(S.cdFrz) + 's' : 'Ready'); hud.frz.classList.toggle('on', ui.abil === 'frz');
  setText(hud.fixS, S.lives >= S.maxLives + 10 ? 'Base full' : `+3 · ${S.repairCost}`); hud.fix.classList.toggle('poor', S.points < S.repairCost);
  if (infoRefs.kills && ui.sel) setText(infoRefs.kills, ui.sel.kills);
  if (infoRefs.up) { const d = S.points < infoRefs.upCost; if (infoRefs.up.disabled !== d) infoRefs.up.disabled = d; }
  const o = ui.sel;
  if (o && infoRefs.hp) setText(infoRefs.hp, Math.ceil(o.hp));
  if (o && infoRefs.fix) { const dmg = o.hp < o.maxHp, c = dmg ? repairCost(o) : 0; setText(infoRefs.fixC, dmg ? c : 'full'); const d = !dmg || S.points < c; if (infoRefs.fix.disabled !== d) infoRefs.fix.disabled = d; }
  if (o && infoRefs.sellV) setText(infoRefs.sellV, sellValue(o));
  if (infoRefs.specs) for (const [b, c] of infoRefs.specs) { const d = S.points < c; if (b.disabled !== d) b.disabled = d; }
  renderIncoming();
}
const isTouch = matchMedia('(hover: none)').matches;
function updateHint(){
  const el = $('#hint');
  let h;
  if (!S) return;
  if (ui.build) { const D = TOWERS[ui.build] || ITEMS[ui.build]; h = `<b>${D.name}</b> · ${D.cost} points. ${isTouch ? 'Tap a tile to aim, tap again to build.' : 'Click a tile to build. Right-click or Esc to stop.'}`; }
  else if (ui.abil) h = `<b>${ABIL[ui.abil].name}</b> armed. ${isTouch ? 'Tap' : 'Click'} the map to aim. Esc cancels.`;
  else if (ui.sel) {
    const o = ui.sel;
    if (o.kind === 'tower') h = (o.lvl === 2 && o.spec == null ? 'Level 3 reached: <b>pick a specialization</b> in the panel.' : 'U upgrades, T changes the target, S sells.') + (o.road ? ' F repairs.' : '');
    else if (o.kind === 'barricade') h = 'U upgrades the wall, F repairs it, S removes it.';
    else h = 'S removes it for 75% of the cost.';
  }
  else if (S.wave === 0) h = 'Place a few <b>Machine Guns</b> along the red route, then start wave 1.';
  else h = 'Arrows mark what you can upgrade. Walls stretch the route, but weak ones get smashed.';
  if (el._h !== h) { el._h = h; el.innerHTML = h; }
}

/* ---------------- Controls ---------------- */
function selectBuild(k){
  if (!running || S.over) return;
  Sound.init();
  ui.build = ui.build === k ? null : k; ui.abil = null; ui.sel = null; ui.touchGhost = null;
  renderInfo(); updateHint();
}
function cancel(){ ui.build = null; ui.abil = null; ui.sel = null; ui.touchGhost = null; renderInfo(); updateHint(); }
function togglePause(){ if (!running || S.over) return; paused = !paused; refreshHUD(); }
function cycleSpeed(){ speed = speed === 3 ? 1 : speed + 1; refreshHUD(); }
function toWorld(e){ const r = canvas.getBoundingClientRect(); return { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H }; }
canvas.addEventListener('pointermove', e => {
  const p = toWorld(e); ui.mouse.x = p.x; ui.mouse.y = p.y; ui.mouse.in = e.pointerType !== 'touch';
  if (e.pointerType !== 'touch') ui.hover = { x:Math.floor(p.x / TS), y:Math.floor(p.y / TS) };
});
canvas.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') { ui.mouse.in = false; ui.hover = null; } });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if (!running || S.over || modalOpen) return;
  Sound.init();
  if (e.button === 2) { cancel(); return; }
  if (paused) { paused = false; return; }
  const p = toWorld(e), tx = Math.floor(p.x / TS), ty = Math.floor(p.y / TS);
  if (ui.abil) { useAbility(ui.abil, p.x, p.y); return; }
  if (ui.build) {
    if (e.pointerType === 'touch' && (!ui.touchGhost || ui.touchGhost.x !== tx || ui.touchGhost.y !== ty)) { ui.touchGhost = { x:tx, y:ty }; ui.hover = { x:tx, y:ty }; return; }
    place(ui.build, tx, ty); ui.touchGhost = null;
    if (S.points < costOf(ui.build)) { ui.build = null; renderInfo(); updateHint(); }
    return;
  }
  if (!inB(tx, ty)) return;
  ui.sel = S.occ[idx(tx, ty)] || null; ui.hover = { x:tx, y:ty };
  renderInfo(); updateHint();
});
addEventListener('keydown', e => {
  if (modalOpen) { if (e.key === 'Escape' && S && running && !S.over) closeMenu(); return; }
  if (e.target && e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k.length === 1 && k >= '1' && k <= '7') selectBuild(BUILD_ORDER[+k - 1]);
  else if (k === 'b') selectBuild('barricade');
  else if (k === 'm') selectBuild('mine');
  else if (k === ' ') { e.preventDefault(); callWave(); }
  else if (k === 'escape') cancel();
  else if (k === 'p') togglePause();
  else if (k === 'c') cycleSpeed();
  else if (k === 'z') armAbility('air');
  else if (k === 'x') armAbility('frz');
  else if (k === 'r') reinforce();
  else if (k === 'u' && ui.sel) upgrade(ui.sel);
  else if (k === 'f' && ui.sel) repair(ui.sel);
  else if (k === 't' && ui.sel) cycleMode(ui.sel);
  else if (k === 's' && ui.sel) sell(ui.sel);
});
const blurAfter = fn => e => { fn(); if (e.detail) e.currentTarget.blur(); };
$('#btnWave').addEventListener('click', blurAfter(callWave));
$('#btnSpeed').addEventListener('click', blurAfter(cycleSpeed));
$('#btnPause').addEventListener('click', blurAfter(togglePause));
$('#btnMute').addEventListener('click', blurAfter(() => { Sound.init(); Sound.toggle(); refreshHUD(); }));
$('#btnMenu').addEventListener('click', blurAfter(() => showModal(running && !S.over ? 'menu' : 'start')));
$('#abAir').addEventListener('click', blurAfter(() => armAbility('air')));
$('#abFrz').addEventListener('click', blurAfter(() => armAbility('frz')));
$('#abFix').addEventListener('click', blurAfter(reinforce));
document.addEventListener('visibilitychange', () => { if (document.hidden && running && S && !S.over && !modalOpen) { paused = true; refreshHUD(); } });

/* ---------------- Menus ---------------- */
const modal = $('#modal'), card = $('#card');
const newSeed = () => (Math.random() * 90000 | 0) + 10000;
let menuSeed = newSeed();
function bestLine(dk){ const b = store.get('deadmaze.best', {})[dk]; return b ? `Best on ${DIFFS[dk].name}: wave ${b.wave} · ${b.kills} kills` : `No record on ${DIFFS[dk].name} yet`; }
function showModal(kind){
  modalOpen = true; modal.hidden = false;
  if (kind === 'start' || kind === 'menu') {
    const inGame = kind === 'menu';
    card.innerHTML = `<div class="tape"></div><div class="card-body">
      <h1 class="title">DEAD <span>MAZE</span></h1>
      <p class="lede">The horde is coming through the maze. Build turrets on the rubble, block corridors to force a longer route, and spend every kill on a stronger defense.</p>
      ${inGame ? `<button class="btn btn-go big" id="mResume" type="button">Resume wave ${S.wave}</button>` : ''}
      <div class="diffs" role="group" aria-label="Difficulty">
        ${Object.entries(DIFFS).map(([k, d]) => `<button class="dbtn" type="button" data-d="${k}" aria-pressed="${k === menuDiff}"><b>${d.name}</b><small>${d.lives} base · ${d.points} points${d.hp !== 1 ? ` · ${d.hp > 1 ? '+' : ''}${Math.round((d.hp - 1) * 100)}% HP` : ''}</small></button>`).join('')}
      </div>
      <div class="seed"><span>Map <b id="mSeed">#${inGame ? S.seed : menuSeed}</b> · every map is a new random maze</span><button class="btn" id="mReroll" type="button">New map</button></div>
      <button class="btn ${inGame ? '' : 'btn-go'} big" id="mStart" type="button">${inGame ? 'Restart on this map' : 'Start defense'}</button>
      <ul class="howto">
        <li><b>Zombies</b> follow the shortest way to your base.</li>
        <li><b>Barricades</b> reroute them, until they smash through.</li>
        <li><b>Kills</b> pay points. Spend them on towers and upgrades.</li>
        <li><b>Airstrike</b> and <b>cryo bomb</b> save you in a pinch.</li>
      </ul>
      <p class="best" id="mBest">${bestLine(menuDiff)}</p>
    </div>`;
    card.querySelectorAll('.dbtn').forEach(b => b.addEventListener('click', () => {
      menuDiff = b.dataset.d; store.set('deadmaze.diff', menuDiff);
      card.querySelectorAll('.dbtn').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      $('#mBest').textContent = bestLine(menuDiff);
    }));
    let seed = inGame ? S.seed : menuSeed;
    $('#mReroll').addEventListener('click', () => {
      seed = menuSeed = newSeed(); $('#mSeed').textContent = '#' + seed;
      running = false; newGame(seed, menuDiff);
      const st = $('#mStart'); st.textContent = 'Start defense'; st.classList.add('btn-go');
      const r = $('#mResume'); if (r) r.remove();
    });
    $('#mStart').addEventListener('click', () => startGame(seed));
    const r = $('#mResume'); if (r) r.addEventListener('click', closeMenu);
    ($('#mResume') || $('#mStart')).focus({ preventScroll:true });
  } else if (kind === 'over') {
    const prev = S.prevBest;
    card.innerHTML = `<div class="tape red"></div><div class="card-body">
      <h1 class="title red">BASE OVERRUN</h1>
      <p class="lede">The horde broke through on wave ${S.wave}, map #${S.seed}, ${S.diff.name}.</p>
      <div class="ostats">
        <div><span class="lbl">Wave</span><span class="val">${S.wave}</span></div>
        <div><span class="lbl">Kills</span><span class="val">${S.kills}</span></div>
        <div><span class="lbl">Best combo</span><span class="val">x${S.maxCombo}</span></div>
        <div><span class="lbl">Points earned</span><span class="val amber">${S.earned}</span></div>
      </div>
      <p class="best">${S.record ? (prev ? `New record. Previous best: wave ${prev.wave}.` : 'First record on this difficulty.') : `Best on ${S.diff.name}: wave ${prev.wave} · ${prev.kills} kills`}</p>
      <div class="row"><button class="btn btn-go big" id="mRetry" type="button">Retry this map</button><button class="btn big" id="mNew" type="button">New map</button></div>
    </div>`;
    $('#mRetry').addEventListener('click', () => startGame(S.seed));
    $('#mNew').addEventListener('click', () => { menuSeed = newSeed(); running = false; newGame(menuSeed, menuDiff); showModal('start'); });
    $('#mRetry').focus({ preventScroll:true });
  }
}
function closeMenu(){ modalOpen = false; modal.hidden = true; }
function startGame(seed){
  Sound.init();
  newGame(seed, menuDiff);
  running = true; paused = false; closeMenu();
  banner('HOLD THE LINE', 'Build your defense, then start wave 1', '#e9a72a');
  refreshHUD();
}

/* ---------------- Loop ---------------- */
let last = performance.now(), acc = 0, hudT = 0;
const STEP = 1 / 60;
function frame(now){
  const rdt = Math.min(0.1, (now - last) / 1000); last = now;
  if (running && !paused && !modalOpen) {
    acc += (Math.abs(rdt - STEP) < 0.0015 ? STEP : rdt) * (S.over ? 0.5 : speed);   // Messrauschen glätten
    let n = 0;
    while (acc >= STEP && n < 12) { update(STEP); acc -= STEP; n++; }
    if (n >= 12) acc = 0;
  }
  render();
  hudT += rdt; if (hudT > 0.1) { hudT = 0; refreshHUD(); updateHint(); }
  requestAnimationFrame(frame);
}
newGame(menuSeed, menuDiff);
showModal('start');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
