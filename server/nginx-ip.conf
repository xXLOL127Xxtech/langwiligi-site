# Webseite direkt über die IP des Servers (http://46.224.94.231/), solange langwiligi.site gesperrt ist.
# Wird von server-aktualisieren.sh nach /etc/nginx/conf.d/langwiligi-ip.conf kopiert.
# Ohne HTTPS: Let's Encrypt stellt für die IP kein normales Zertifikat aus.
server {
    listen 80;
    server_name 46.224.94.231;

    root /var/www/games;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # Ranglisten, Bewertungen, Aufrufe (server/game-hub.js)
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Online-Modus (WebSocket)
    location = /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
